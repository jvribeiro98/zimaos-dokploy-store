name: openclaw
services:
  openclaw:
    image: coollabsio/openclaw:2026.2.6
    environment:
    - AUTH_USERNAME=dokploy
    - AUTH_PASSWORD=VGwoh4rBZa3f2Qd2239KK4LRlPwPW12N
    - OPENCLAW_GATEWAY_TOKEN=NJ32fybThr6OC9rS2LIkcqAPKw7phL4N
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - OPENROUTER_API_KEY=YOUR-API-KEY
    - GEMINI_API_KEY=${GEMINI_API_KEY}
    - XAI_API_KEY=${XAI_API_KEY}
    - GROQ_API_KEY=${GROQ_API_KEY}
    - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    - VENICE_API_KEY=${VENICE_API_KEY}
    - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
    - KIMI_API_KEY=${KIMI_API_KEY}
    - MINIMAX_API_KEY=${MINIMAX_API_KEY}
    - ZAI_API_KEY=${ZAI_API_KEY}
    - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
    - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    - SYNTHETIC_API_KEY=${SYNTHETIC_API_KEY}
    - COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN}
    - XIAOMI_API_KEY=${XIAOMI_API_KEY}
    - OPENCLAW_PRIMARY_MODEL=${OPENCLAW_PRIMARY_MODEL}
    - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    - AWS_REGION=${AWS_REGION:-us-east-1}
    - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    - BEDROCK_PROVIDER_FILTER=${BEDROCK_PROVIDER_FILTER:-anthropic}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    - PORT=8080
    - OPENCLAW_GATEWAY_PORT=18789
    - OPENCLAW_GATEWAY_BIND=lan
    - OPENCLAW_STATE_DIR=/data/.openclaw
    - OPENCLAW_WORKSPACE_DIR=/data/workspace
    - BROWSER_CDP_URL=http://browser:9223
    - BROWSER_DEFAULT_PROFILE=${BROWSER_DEFAULT_PROFILE:-openclaw}
    - BROWSER_EVALUATE_ENABLED=${BROWSER_EVALUATE_ENABLED:-true}
    - BROWSER_SNAPSHOT_MODE=${BROWSER_SNAPSHOT_MODE:-efficient}
    - BROWSER_REMOTE_TIMEOUT_MS=${BROWSER_REMOTE_TIMEOUT_MS:-1500}
    - BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS=${BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS:-3000}
    - HOOKS_ENABLED=${HOOKS_ENABLED:-false}
    - HOOKS_PATH=${HOOKS_PATH:-/hooks}
    - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}
    - KIMI_BASE_URL=${KIMI_BASE_URL:-https://api.moonshot.ai/anthropic}
    - TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
    - DISCORD_BOT_TOKEN=$DISCORD_BOT_TOKEN
    - SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN
    - SLACK_APP_TOKEN=$SLACK_APP_TOKEN
    - WHATSAPP_ENABLED=$WHATSAPP_ENABLED
    - OPENCLAW_DOCKER_APT_PACKAGES=$OPENCLAW_DOCKER_APT_PACKAGES
    volumes:
    - openclaw-data:/data
    depends_on:
      browser:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  browser:
    image: coollabsio/openclaw-browser:latest
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - CHROME_CLI=--remote-debugging-port=9222
    volumes:
    - browser-data:/config
    shm_size: 2g
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/9222' || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  openclaw-data: null
  browser-data: null
x-casaos:
  id: com.dokploy.openclaw
  main: openclaw
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openclaw/icon.svg
  title:
    en_US: Openclaw
  tagline:
    en_US: WhatsApp gateway CLI with Pi RPC agent - self-hosted AI-powered messaging platform
  description:
    en_US: WhatsApp gateway CLI with Pi RPC agent - self-hosted AI-powered messaging platform
  author: Dokploy Community
  developer: Openclaw
  category: AI
  architectures:
  - amd64
  - arm64
  version: "2026.1.29"
  update_at: "2026-11-24"
  website: https://openclaw.ai/
  repo: https://github.com/openclaw/openclaw
  docs: https://docs.openclaw.ai/
