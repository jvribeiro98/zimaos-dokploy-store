name: almog-evolution-api
services:
  almog-evolution-api:
    build:
      context: https://github.com/AlmogCohen/evolution-api.git#316448a3c23f9361e0ac82efadb6113651ea2521
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: '8080'
      SERVER_URL: https://localhost
      SERVER_DISABLE_DOCS: 'false'
      SERVER_DISABLE_MANAGER: 'false'
      CORS_ORIGIN: '*'
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:WWjZUrNzoqrsrqvQz0Xv9KFcpp3UWiZl@postgres:5432/evolution_api?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: almog-evolution-api
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_HISTORIC: 'true'
      DATABASE_SAVE_DATA_LABELS: 'true'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'true'
      DATABASE_SAVE_IS_ON_WHATSAPP_DAYS: '7'
      DATABASE_DELETE_MESSAGE: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: almog-evolution
      CACHE_REDIS_TTL: '604800'
      CACHE_REDIS_SAVE_INSTANCES: 'true'
      CACHE_LOCAL_ENABLED: 'true'
      CACHE_LOCAL_TTL: '86400'
      AUTHENTICATION_API_KEY: EhhTgfhSFWARKQfFJslClUoXfEbTFXfEHyDzZ6qJYrfWdBew
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO,LOG
      LOG_BAILEYS: error
      DEL_INSTANCE: 'false'
      WEBSOCKET_ENABLED: 'true'
      WEBSOCKET_GLOBAL_EVENTS: 'true'
      TYPEBOT_ENABLED: 'false'
      CHATWOOT_ENABLED: 'false'
      OPENAI_ENABLED: 'false'
      DIFY_ENABLED: 'false'
      N8N_ENABLED: 'false'
      EVOAI_ENABLED: 'false'
      FLOWISE_ENABLED: 'false'
    volumes:
    - instances:/evolution/instances
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: WWjZUrNzoqrsrqvQz0Xv9KFcpp3UWiZl
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${postgres_user} -d ${postgres_db}
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  instances: null
  postgres_data: null
  redis_data: null
x-casaos:
  id: com.dokploy.almog-evolution-api
  main: almog-evolution-api
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/almog-evolution-api/icon.svg
  title:
    en_US: Evolution API (Almog Cohen fork)
  tagline:
    en_US: Unofficial Evolution API 2
  description:
    en_US: Unofficial Evolution API 2.3.7 fork by Almog Cohen, built from a pinned source commit and including WhatsApp integration
      improvements. Not endorsed by Evolution Foundation.
  author: Dokploy Community
  developer: Evolution API (Almog Cohen fork)
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "2.3.7-fork.316448a"
  update_at: "2026-11-28"
  website: https://evolutionfoundation.com.br/
  repo: https://github.com/AlmogCohen/evolution-api
  docs: https://docs.evolutionfoundation.com.br/en
