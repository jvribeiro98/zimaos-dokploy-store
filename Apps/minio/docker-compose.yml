name: minio
services:
  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    restart: unless-stopped
    volumes:
    - minio-data:/data
    environment:
    - MINIO_ROOT_USER=minioadmin
    - MINIO_ROOT_PASSWORD=UWrUWTj0tg8gcbTf
    - MINIO_BROWSER_REDIRECT_URL=http://localhost
    command: server /data --console-address ":9001"
    expose:
    - 9000
    - 9001
    ports:
    - target: 9001
      published: "9001"
      protocol: tcp
volumes:
  minio-data: null
x-casaos:
  id: com.dokploy.minio
  main: minio
  index: /
  port_map: "9001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/minio/icon.png
  title:
    en_US: Minio
  tagline:
    en_US: MinIO is an open-source, S3-compatible object storage server
  description:
    en_US: MinIO is an open-source, S3-compatible object storage server. Self-host it on your own server with Dokploy, which
      deploys MinIO as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Minio
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "RELEASE.2026-06-18T00-00-00Z"
  update_at: "2026-11-25"
  website: https://silo.pigsty.io/
  repo: https://github.com/pgsty/minio
  docs: https://silo.pigsty.io/docs/
