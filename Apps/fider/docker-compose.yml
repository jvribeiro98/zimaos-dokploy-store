name: fider
services:
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
    - fiderPostgresData:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: fider
      POSTGRES_PASSWORD: NcQ12bjwcXjNdtauakPdjwhmgVfdLXqB
      POSTGRES_DB: fider
  fider:
    image: getfider/fider:0.21.1
    restart: unless-stopped
    depends_on:
    - db
    - mailhog
    environment:
      BASE_URL: https://localhost
      DATABASE_URL: postgres://fider:NcQ12bjwcXjNdtauakPdjwhmgVfdLXqB@db:5432/fider?sslmode=disable
      JWT_SECRET: JIZbaFUq4tTSL08Z3tHBm1gzho8sk3UxkLEGi42fl8vtaNRHRezZtPwJ8UHVmsgm
      EMAIL: smtp
      EMAIL_NOREPLY: noreply@localhost
      EMAIL_SMTP_HOST: mailhog
      EMAIL_SMTP_PORT: '1025'
      EMAIL_SMTP_USERNAME: ''
      EMAIL_SMTP_PASSWORD: ''
      EMAIL_SMTP_ENABLE_STARTTLS: 'true'
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
volumes:
  fiderPostgresData: null
x-casaos:
  id: com.dokploy.fider
  main: fider
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/fider/icon.svg
  title:
    en_US: Fider
  tagline:
    en_US: Fider is an open-source feedback portal for collecting, discussing, and prioritizing fe...
  description:
    en_US: Fider is an open-source feedback portal for collecting, discussing, and prioritizing feature requests.
  author: Dokploy Community
  developer: Fider
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.21.1"
  update_at: "2026-11-26"
  website: https://fider.io/
  repo: https://github.com/getfider/fider
  docs: https://docs.fider.io/hosting-instance/
