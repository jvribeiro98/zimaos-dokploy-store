name: tuwunel
services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.5.0
    restart: always
    environment:
    - TUWUNEL_SERVER_NAME=localhost
    - TUWUNEL_ALLOW_REGISTRATION=${TUWUNEL_ALLOW_REGISTRATION:-false}
    - TUWUNEL_REGISTRATION_TOKEN=GXZWjTqhC7bj2u5bCfGFnXbngcErDrIa
    - TUWUNEL_ADDRESS=${TUWUNEL_ADDRESS:-0.0.0.0}
    - TUWUNEL_PORT=${TUWUNEL_PORT:-6167}
    volumes:
    - tuwunel-data:/var/lib/tuwunel/
    expose:
    - 6167
    ports:
    - target: 6167
      published: "6167"
      protocol: tcp
volumes:
  tuwunel-data: null
x-casaos:
  id: com.dokploy.tuwunel
  main: tuwunel
  index: /
  port_map: "6167"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/tuwunel/icon.svg
  title:
    en_US: Tuwunel
  tagline:
    en_US: High performance Matrix homeserver written in Rust
  description:
    en_US: High performance Matrix homeserver written in Rust. Official successor to conduwuit - a scalable, low-cost, enterprise-ready
      alternative to Synapse.
  author: Dokploy Community
  developer: Tuwunel
  category: Social
  architectures:
  - amd64
  - arm64
  version: "1.5.0"
  update_at: "2026-11-23"
  website: https://tuwunel.chat
  repo: https://github.com/matrix-construct/tuwunel
  docs: https://matrix-construct.github.io/tuwunel/
