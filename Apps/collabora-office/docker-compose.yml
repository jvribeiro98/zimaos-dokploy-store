  title:
    en_US: Collabora Office
  tagline:
    en_US: Collabora Online is a powerful, flexible, and secure online office suite designed to br...
  description:
    en_US: Collabora Online is a powerful, flexible, and secure online office suite designed to break free from vendor lock-in
      and put you in full control of your documents.
  author: Dokploy Community
  developer: Collabora Office
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://collaboraonline.com
