name: collabora-office
services:
  collabora:
    image: collabora/code:latest
    expose:
    - '9980'
    environment:
    - domain=localhost
    - username=user
    - password=xGjHSIZgO0XgnoT3
    - extra_params=--o:ssl.enable=false
    restart: unless-stopped
    ports:
    - target: 9980
      published: "9980"
      protocol: tcp
x-casaos:
  id: com.dokploy.collabora-office
