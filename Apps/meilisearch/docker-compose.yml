name: meilisearch
services:
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    volumes:
    - meili_data:/meili_data
    environment:
      MEILI_MASTER_KEY: OSIpS+m2vyutjEaujF+gZj37c8aSvP3dV3/TVf69xxU=
    restart: unless-stopped
    ports:
    - target: 7700
      published: "7700"
      protocol: tcp
volumes:
  meili_data:
    driver: local
