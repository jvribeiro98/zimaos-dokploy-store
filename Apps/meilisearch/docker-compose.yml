  title:
    en_US: Meilisearch
  tagline:
    en_US: Meilisearch is a free and open-source search engine that allows you to easily add searc...
  description:
    en_US: Meilisearch is a free and open-source search engine that allows you to easily add search functionality to your
      web applications.
  author: Dokploy Community
  developer: Meilisearch
  category: Developer
  architectures:
  - amd64
  - arm64
