name: cachkey
services:
  cachkey:
    image: ghcr.io/joyboy-dy/cachkey-web:0.2.0
    restart: unless-stopped
    expose:
    - 3000
    environment:
      APP_URL: http://localhost
      API_INTERNAL_URL: http://cachkey-api:3001
    depends_on:
      cachkey-api:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  cachkey-api:
    image: ghcr.io/joyboy-dy/cachkey-api:0.2.0
    restart: unless-stopped
    expose:
    - 3001
    environment:
      APP_URL: http://localhost
      DATABASE_URL: postgresql://cachkey:cac86426108dd814c3c7efabc4f10fb0f47bda9d84344cfc7c5c369bef2d6a11@postgres:5432/cachkey
      BETTER_AUTH_SECRET: msZL9S/RQuaFD3/4Aax+XDZuP6L8jgyJaeORseV/UpzanRQ5ykC1elgKdc0BwPjC
      ENCRYPTION_KEY: /oJqQ8BCFPD9e9ZvD/5PLqMGT9Wxq3iwuA+b5cQABcU=
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: Cachkey <no-reply@example.com>
      SMTP_HOST: ''
      SMTP_PORT: '587'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      RESEND_API_KEY: ''
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cachkey
      POSTGRES_PASSWORD: cac86426108dd814c3c7efabc4f10fb0f47bda9d84344cfc7c5c369bef2d6a11
      POSTGRES_DB: cachkey
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cachkey -d cachkey
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data: {}
x-casaos:
  id: com.dokploy.cachkey
  main: cachkey
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/cachkey/icon.svg
  title:
    en_US: Cachkey
  tagline:
    en_US: 'Cachkey is an open-source, self-hosted manager for secrets and environment variables: e...'
  description:
    en_US: 'Cachkey is an open-source, self-hosted manager for secrets and environment variables: encrypted values, per-environment
      access for your team, a CLI and a read-only API for servers and CI.'
  author: Dokploy Community
  developer: Cachkey
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.2.0"
  update_at: "2026-11-22"
  website: https://github.com/Joyboy-dy/cachkey
  repo: https://github.com/Joyboy-dy/cachkey
  docs: https://github.com/Joyboy-dy/cachkey/tree/main/docs
