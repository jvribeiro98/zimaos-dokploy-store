name: open-design
services:
  open-design:
    image: ghcr.io/nexu-io/od:0.16.1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: '7456'
      OD_API_TOKEN: CAUsmIdGmypKyCSOdyuXo3o7L0r2OhZG
      OD_ALLOWED_ORIGINS: https://localhost,http://localhost
      OD_DISABLE_API_AUTH: '1'
    volumes:
    - open_design_data:/app/.od
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
    - target: 7456
      published: "7456"
      protocol: tcp
volumes:
  open_design_data: {}
x-casaos:
  id: com.dokploy.open-design
  main: open-design
  index: /
  port_map: "7456"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/open-design/icon.svg
  title:
    en_US: Open Design
  tagline:
    en_US: Open Design is a local-first, open-source design tool with native desktop apps, a large...
  description:
    en_US: Open Design is a local-first, open-source design tool with native desktop apps, a large library of design systems,
      and an extensible plugin ecosystem that runs across many coding agents.
  author: Dokploy Community
  developer: Open Design
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.16.1"
  update_at: "2026-11-23"
  website: https://open-design.ai
  repo: https://github.com/nexu-io/open-design
  docs: https://open-design.ai
