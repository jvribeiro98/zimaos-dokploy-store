name: reloop
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  links:
    image: reloopsh/fe-links@sha256:8a22fde21a656c25163e2b856a856053c5de91cbc4953cc23ed034c081eedfa5
    restart: unless-stopped
    environment:
    - HOSTNAME=0.0.0.0
    - PORT=3005
    - INTERNAL_API_URL=http://contacts:8014/api/contacts
    - INTERNAL_MAIL_API_URL=http://mail:8015/api/mail
  dashboard:
    image: reloopsh/fe-dashboard@sha256:dd2369d2f0d7fe836664ae49b2b4492f90ee654dd8af7c819e7ca07e469b58dc
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      SMTP_HOSTNAME: localhost
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reloop
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: lyBp2vGlK4Qc6no9wlFvGJZR1AmgWCRe
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    - --dir
    - /data
    environment:
      REDIS_PASSWORD: jHwXQ6bbqsMccJwnvzjdZMld8CP6kPuC
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:8222/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  migrate:
    image: reloopsh/be-auth@sha256:741ef934ec59aa173f8dcfa980c163c107e6e5693786777326eaf90e49cb47c5
    restart: 'no'
    working_dir: /app/packages/db
    entrypoint:
    - /app/node_modules/.bin/drizzle-kit
    command:
    - push
    - --force
    environment:
      PG_URL: postgresql://reloop:lyBp2vGlK4Qc6no9wlFvGJZR1AmgWCRe@postgres:5432/reloop
    depends_on:
      postgres:
        condition: service_healthy
  auth:
    image: reloopsh/be-auth@sha256:741ef934ec59aa173f8dcfa980c163c107e6e5693786777326eaf90e49cb47c5
