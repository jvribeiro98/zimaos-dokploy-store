name: tolgee
services:
  app:
    image: tolgee/tolgee:latest
    volumes:
    - /DATA/AppData/$AppID/data:/data
    - /DATA/AppData/$AppID/config.yaml:/config.yaml
    expose:
    - '8080'
    environment:
      TOLGEE_FRONT_END_URL: ${TOLGEE_HOST}
      TOLGEE_AUTHENTICATION_ENABLED: 'true'
      TOLGEE_AUTHENTICATION_INITIAL_PASSWORD: admin
      TOLGEE_AUTHENTICATION_INITIAL_USERNAME: admin
      TOLGEE_AUTHENTICATION_JWT_SECRET: LSJRo8H6peDzxLROL6Lq2+HeSPeG0IWkR/lSUIVK1uQ=
      TOLGEE_MACHINE_TRANSLATION_GOOGLE_API_KEY: my_google_api_key
      TOLGEE_SMTP_AUTH: 'true'
      TOLGEE_SMTP_FROM: Tolgee <no-reply@mydomain.com>
      TOLGEE_SMTP_HOST: email-smtp.regional-region.amazonaws.com
      TOLGEE_SMTP_PASSWORD: omg/my/password
      TOLGEE_SMTP_PORT: '465'
      TOLGEE_SMTP_SSL_ENABLED: 'true'
      TOLGEE_SMTP_USERNAME: user@company.com
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.tolgee
  main: app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/tolgee/icon.svg
  title:
    en_US: Tolgee
  tagline:
    en_US: Developer & translator friendly web-based localization platform
  description:
    en_US: Developer & translator friendly web-based localization platform
  author: Dokploy Community
  developer: Tolgee
  category: Others
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://tolgee.io
  repo: https://github.com/tolgee/tolgee-platform
  docs: https://tolgee.io/platform
