name: emdash
services:
  emdash:
    build:
      context: https://github.com/emdash-cms/emdash.git#10beb8c5a99e41c3a8554b09ac5123c4dddc8d11
    restart: unless-stopped
    environment:
      EMDASH_SITE_URL: ${EMDASH_SITE_URL:?Set the public HTTPS origin}
      EMDASH_ENCRYPTION_KEY: ''
      EMDASH_TRUSTED_PROXY_HEADERS: x-forwarded-for
      HOST: 0.0.0.0
      PORT: '4321'
    expose:
    - '4321'
    volumes:
    - emdash-data:/app/data
    - emdash-uploads:/app/uploads
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:4321/_emdash/api/setup/status'').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - target: 4321
      published: "4321"
      protocol: tcp
volumes:
  emdash-data: null
  emdash-uploads: null
x-casaos:
  id: com.dokploy.emdash
  main: emdash
  index: /
  port_map: "4321"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/emdash/icon.svg
  title:
    en_US: EmDash
  tagline:
    en_US: EmDash is an Astro-native CMS with a visual editor, structured content, media library,...
  description:
    en_US: EmDash is an Astro-native CMS with a visual editor, structured content, media library, and passkey authentication.
      This template builds the official blog site with persistent SQLite and local media storage.
  author: Dokploy Community
  developer: EmDash
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.4.0"
  update_at: "2026-11-26"
  website: https://emdashcms.com/
  repo: https://github.com/emdash-cms/emdash
  docs: https://docs.emdashcms.com/
