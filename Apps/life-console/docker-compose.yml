name: life-console
services:
  app:
    image: ghcr.io/tj-coding/life-console:0.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lifeconsole:ZYWUL48pN1oY6aJFuHCiovuAKFqDdG5r@db:5432/lifeconsole
      APP_URL: http://localhost
      TRUST_PROXY: '1'
      SIGNUPS: open
      AUTH_PASSWORD: 'on'
      UPDATE_CHECK: 'off'
      BACKUP_DIR: /backups
    expose:
    - 8080
    volumes:
    - backups:/backups
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeconsole
      POSTGRES_PASSWORD: ZYWUL48pN1oY6aJFuHCiovuAKFqDdG5r
      POSTGRES_DB: lifeconsole
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
    - db:/var/lib/postgresql/data
volumes:
  db: null
  backups: null
x-casaos:
  id: com.dokploy.life-console
  main: app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/life-console/icon.png
  title:
    en_US: Life Console
  tagline:
    en_US: 'Life Console is a keyboard-first planner that shows what to do right now: time-block yo...'
  description:
    en_US: 'Life Console is a keyboard-first planner that shows what to do right now: time-block your week from a backlog,
      count down deadlines and link each task to the goal it serves. Multi-user, works offline and installs on phones.'
  author: Dokploy Community
  developer: Life Console
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.2.0"
  update_at: "2026-11-25"
  website: https://life-console.dev
  repo: https://github.com/TJ-coding/life-console
  docs: https://life-console.dev/docs/self-hosting
