name: oneuptime
services:
  oneuptime:
    image: oneuptime/app:11.5.6
    restart: unless-stopped
    environment:
    - PORT=3002
    - NODE_ENV=production
    - BILLING_ENABLED=false
    - IS_ENTERPRISE_EDITION=false
    - LOG_LEVEL=ERROR
    - DISABLE_TELEMETRY=true
    - HOST=localhost
    - HTTP_PROTOCOL=http
    - ONEUPTIME_SECRET=UUErLzkyg95IWCBYu9W4g8jvalKUOVQY0C1JwSIfMNV4CjPwGRzkliqGp4QGKLh7
    - ENCRYPTION_SECRET=7Bd8NxwluUlcZPM1LbAkWXhFYKATjq4o4KnFSKKY2bSKu8yAQxNc1sEn02dQ2KvE
    - REGISTER_PROBE_KEY=pANiWIrP8UG7e3HprNDz9jgXm2tJN90R
    - DATABASE_HOST=postgres
    - DATABASE_PORT=5432
    - DATABASE_USERNAME=postgres
    - DATABASE_PASSWORD=oDcpuOT2jtckE98VPSi5BrVo25YXrVH5
    - DATABASE_NAME=oneuptimedb
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_USERNAME=default
    - REDIS_PASSWORD=wmZgxQ7EoG70tC4ohknZ9WpGxo7PIwRH
    - REDIS_DB=0
    - CLICKHOUSE_HOST=clickhouse
    - CLICKHOUSE_PORT=8123
    - CLICKHOUSE_USER=default
    - CLICKHOUSE_PASSWORD=3pZYSQgwQwsFgN1zD3OIKj02kqCuK1vn
    - CLICKHOUSE_DATABASE=oneuptime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
  ingress:
    image: oneuptime/nginx:11.5.6
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - BILLING_ENABLED=false
    - LOG_LEVEL=ERROR
    - DISABLE_TELEMETRY=true
    - HOST=localhost
    - NGINX_LISTEN_ADDRESS=
    - NGINX_LISTEN_OPTIONS=
    - PROVISION_SSL=
    - SERVER_NAMES_HASH_BUCKET_SIZE=128
    - SERVER_APP_HOSTNAME=oneuptime
    - APP_PORT=3002
    - SERVER_HOME_HOSTNAME=home
    - HOME_PORT=1444
    - ONEUPTIME_SECRET=UUErLzkyg95IWCBYu9W4g8jvalKUOVQY0C1JwSIfMNV4CjPwGRzkliqGp4QGKLh7
    - ENCRYPTION_SECRET=7Bd8NxwluUlcZPM1LbAkWXhFYKATjq4o4KnFSKKY2bSKu8yAQxNc1sEn02dQ2KvE
    - DATABASE_HOST=postgres
    - DATABASE_PORT=5432
    - DATABASE_USERNAME=postgres
    - DATABASE_PASSWORD=oDcpuOT2jtckE98VPSi5BrVo25YXrVH5
    - DATABASE_NAME=oneuptimedb
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_USERNAME=default
    - REDIS_PASSWORD=wmZgxQ7EoG70tC4ohknZ9WpGxo7PIwRH
    - REDIS_DB=0
    depends_on:
      postgres:
        condition: service_healthy
      oneuptime:
        condition: service_started
    ports:
    - target: 7849
      published: "7849"
      protocol: tcp
  probe:
    image: oneuptime/probe:11.5.6
    restart: unless-stopped
    environment:
    - PORT=3874
    - NODE_ENV=production
    - LOG_LEVEL=ERROR
    - DISABLE_TELEMETRY=true
    - ONEUPTIME_URL=http://ingress:7849
    - PROBE_NAME=Probe-1
    - PROBE_DESCRIPTION=Default probe for monitors
    - PROBE_MONITORING_WORKERS=3
    - PROBE_MONITOR_FETCH_LIMIT=10
    - PROBE_KEY=nLq2DOSkEa88ugBYIP3zR0P6cn06I0kv
    - REGISTER_PROBE_KEY=pANiWIrP8UG7e3HprNDz9jgXm2tJN90R
    depends_on:
      ingress:
        condition: service_started
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=oDcpuOT2jtckE98VPSi5BrVo25YXrVH5
    - POSTGRES_DB=oneuptimedb
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d oneuptimedb
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  redis:
    image: redis:7.0.12
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}" --save "" --appendonly no
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
    - REDIS_PASSWORD=wmZgxQ7EoG70tC4ohknZ9WpGxo7PIwRH
  clickhouse:
    image: clickhouse/clickhouse-server:25.7
    restart: unless-stopped
    environment:
    - CLICKHOUSE_USER=default
    - CLICKHOUSE_PASSWORD=3pZYSQgwQwsFgN1zD3OIKj02kqCuK1vn
    - CLICKHOUSE_DB=oneuptime
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
    - clickhouse-data:/var/lib/clickhouse
    - /DATA/AppData/$AppID/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
    - /DATA/AppData/$AppID/clickhouse/distributed-insert-tuning.xml:/etc/clickhouse-server/users.d/distributed-insert-tuning.xml
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
volumes:
  postgres-data: null
  clickhouse-data: null
x-casaos:
  id: com.dokploy.oneuptime
  main: ingress
  index: /
  port_map: "7849"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/oneuptime/icon.svg
  title:
    en_US: OneUptime
  tagline:
    en_US: 'OneUptime is an open-source observability platform: uptime monitoring, status pages, in...'
  description:
    en_US: 'OneUptime is an open-source observability platform: uptime monitoring, status pages, incident management, on-call
      rotations, logs, traces and metrics in one place.'
  author: Dokploy Community
  developer: OneUptime
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "11.5.6"
  update_at: "2026-11-27"
  website: https://oneuptime.com/
  repo: https://github.com/OneUptime/oneuptime
  docs: https://oneuptime.com/docs
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (clickhouse/cluster.xml,
        clickhouse/distributed-insert-tuning.xml). Review environment variables before starting.
