name: spacedrive
services:
  server:
    image: ghcr.io/spacedriveapp/spacedrive/server:latest
    expose:
    - 8080
    environment:
    - SD_AUTH=admin:0Y9yZ1WHe5bheFxNzSYAr5pkaS7Af9bl
    volumes:
    - /var/spacedrive:/var/spacedrive
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.spacedrive
  main: server
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/spacedrive/icon.png
  title:
    en_US: Spacedrive
  tagline:
    en_US: Spacedrive is a cross-platform file manager
  description:
    en_US: Spacedrive is a cross-platform file manager. It connects your devices together to help you organize files from
      anywhere. powered by a virtual distributed filesystem (VDFS) written in Rust. Organize files across many devices in
      one place.
  author: Dokploy Community
  developer: Spacedrive
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://spacedrive.com/
  repo: https://github.com/spacedriveapp/spacedrive
  docs: https://www.spacedrive.com/docs/product/getting-started/introduction
