name: bookstack
services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:24.12.1
    restart: unless-stopped
    expose:
    - 80
    environment:
    - PUID=1000
    - PGID=1000
    - APP_URL=http://localhost
    - DB_HOST=bookstack-db
    - DB_USERNAME=mariadb
    - DB_PASSWORD=ufmQwkszmSOWl74C
    - DB_DATABASE=bookstack
    - APP_KEY=zcLPgeXPJX4KdYukZjZxdlXRcd7WaXHH
    volumes:
    - config:/config
    depends_on:
    - bookstack-db
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  bookstack-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=ufmQwkszmSOWl74C
    - MYSQL_DATABASE=bookstack
    - MYSQL_USER=mariadb
    - MYSQL_PASSWORD=ufmQwkszmSOWl74C
    volumes:
    - db_data:/var/lib/mysql
volumes:
  config: {}
  db_data: {}
x-casaos:
  id: com.dokploy.bookstack
  main: bookstack
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/bookstack/icon.svg
  title:
    en_US: BookStack
  tagline:
    en_US: BookStack is a wiki platform for organizing documentation
  description:
    en_US: BookStack is a wiki platform for organizing documentation. Self-host it on your own server with Dokploy, which
      deploys BookStack as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: BookStack
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "24.12.1"
  update_at: "2026-11-26"
  website: https://www.bookstackapp.com
  repo: https://github.com/BookStackApp/BookStack
  docs: https://www.bookstackapp.com/docs
