name: openhabittracker
services:
  openhabittracker:
    image: jinjinov/openhabittracker:latest
    expose:
    - '8080'
    environment:
      AppSettings__UserName: admin
      AppSettings__Email: admin@example.com
      AppSettings__Password: hiFJsEQYDJedD7HoAYPGdVw7
      AppSettings__JwtSecret: HeNMwpSJ4E2dlDmywSy56U4Vfp5p7JimqjGurgKV0EBUf7AJo7o0N8I93OwlcY2W
    volumes:
    - openhabittracker-data:/app/.OpenHabitTracker
    restart: unless-stopped
