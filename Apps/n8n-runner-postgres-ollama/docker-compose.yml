name: n8n-runner-postgres-ollama
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - N8N_HOST=localhost
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=admin
    - DB_POSTGRESDB_PASSWORD=didr3Io7Jj0ITHnYGLKf8hxI
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=true
    - N8N_ENCRYPTION_KEY=IXKTGjxNkKCscK2Zyuu7p/U26Pea80uDd8IgGPHq7zzFH1EgjdzmORwfYJ1V0ELACG1V1TRDn9IXw0PkQA57RQ==
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - N8N_SECURE_COOKIE=true
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
    - N8N_PROXY_HOPS=0
    - WEBHOOK_URL=https://localhost/
    - GENERIC_TIMEZONE=Europe/Berlin
    - N8N_TEMPLATES_ENABLED=true
    - N8N_HIRING_BANNER_ENABLED=false
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    - OLLAMA_HOST=http://ollama:11434
    - N8N_RUNNERS_ENABLED=true
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_RUNNERS_AUTH_TOKEN=d4DphXXOpdVLhcyf1TWTU/SnWtomnT5LrxMGzPeTjkizy5lOLFM+P0VjAWQ0vOR2dedhkjimKPtSg1eairPtOw==
    - N8N_NATIVE_PYTHON_RUNNER=true
    - N8N_RUNNERS_MAX_CONCURRENCY=50
    - EXECUTIONS_DATA_PRUNE=true
    - EXECUTIONS_DATA_MAX_AGE=7
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    volumes:
    - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 5678
      published: "5678"
      protocol: tcp
  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    command: worker
    environment:
    - NODE_ENV=production
    - N8N_HOST=localhost
    - N8N_PORT=5678
    - N8N_PROTOCOL=https
    - EXECUTIONS_MODE=queue
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=admin
    - DB_POSTGRESDB_PASSWORD=didr3Io7Jj0ITHnYGLKf8hxI
    - N8N_ENCRYPTION_KEY=IXKTGjxNkKCscK2Zyuu7p/U26Pea80uDd8IgGPHq7zzFH1EgjdzmORwfYJ1V0ELACG1V1TRDn9IXw0PkQA57RQ==
    - N8N_SECURE_COOKIE=true
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
    - N8N_PROXY_HOPS=0
    - WEBHOOK_URL=https://localhost/
    - GENERIC_TIMEZONE=Europe/Berlin
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    depends_on:
    - n8n
    - redis
  n8n-runner:
    image: n8nio/runners:nightly
    restart: always
    environment:
    - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    - N8N_RUNNERS_AUTH_TOKEN=d4DphXXOpdVLhcyf1TWTU/SnWtomnT5LrxMGzPeTjkizy5lOLFM+P0VjAWQ0vOR2dedhkjimKPtSg1eairPtOw==
    - N8N_ENCRYPTION_KEY=IXKTGjxNkKCscK2Zyuu7p/U26Pea80uDd8IgGPHq7zzFH1EgjdzmORwfYJ1V0ELACG1V1TRDn9IXw0PkQA57RQ==
    - GENERIC_TIMEZONE=Europe/Berlin
    - N8N_RUNNERS_MAX_CONCURRENCY=50
    depends_on:
    - n8n
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
    - ollama_storage:/home/node/.ollama
  init-ollama:
    image: ollama/ollama:latest
    volumes:
    - ollama_storage:/home/node/.ollama
    entrypoint: /bin/sh
    environment:
    - OLLAMA_HOST=ollama:11434
    command:
    - -c
    - sleep 3; ollama pull llama3.2:latest; ollama pull gemma3:latest
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
    - redis_storage:/data
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
    - POSTGRES_USER=admin
    - POSTGRES_PASSWORD=didr3Io7Jj0ITHnYGLKf8hxI
    - POSTGRES_DB=n8n
    volumes:
    - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  n8n_data: null
  postgres_storage: null
  ollama_storage: null
  redis_storage: null
x-casaos:
  id: com.dokploy.n8n-runner-postgres-ollama
  main: n8n
  index: /
  port_map: "5678"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/n8n-runner-postgres-ollama/icon.png
  title:
    en_US: n8n + Worker + Runner with Redis/Postgres and Ollama
  tagline:
    en_US: n8n is an open source low-code platform for automating workflows and integrations with...
  description:
    en_US: n8n is an open source low-code platform for automating workflows and integrations with PostgreSQL database and
      Ollama AI model.
  author: Dokploy Community
  developer: n8n + Worker + Runner with Redis/Postgres and Ollama
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://n8n.io/
  repo: https://github.com/n8n-io/n8n
  docs: https://docs.n8n.io/
