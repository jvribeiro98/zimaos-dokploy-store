name: wallabag
services:
  wallabag:
    image: wallabag/wallabag:2.6.14
    restart: unless-stopped
    expose:
    - '80'
    depends_on:
      wallabag-db:
        condition: service_healthy
      wallabag-redis:
        condition: service_healthy
    environment:
    - MYSQL_ROOT_PASSWORD=4LSdPukaTLI52vUmNLaR0i1keA54IKwu
    - SYMFONY__ENV__DATABASE_DRIVER=pdo_mysql
    - SYMFONY__ENV__DATABASE_HOST=wallabag-db
    - SYMFONY__ENV__DATABASE_PORT=3306
    - SYMFONY__ENV__DATABASE_NAME=wallabag
    - SYMFONY__ENV__DATABASE_USER=wallabag
    - SYMFONY__ENV__DATABASE_PASSWORD=ctYFEDHOM8lcFDdRoShjw5V9UqR0IEFO
    - SYMFONY__ENV__DATABASE_CHARSET=utf8mb4
    - SYMFONY__ENV__DATABASE_TABLE_PREFIX=wallabag_
    - SYMFONY__ENV__MAILER_DSN=smtp://127.0.0.1
    - SYMFONY__ENV__FROM_EMAIL=wallabag@example.com
    - SYMFONY__ENV__DOMAIN_NAME=http://localhost
    - SYMFONY__ENV__SERVER_NAME=wallabag
    - SYMFONY__ENV__SECRET=m8i7j6mpPoRPwrkk6y8YyDg9LILsSzGV
    - SYMFONY__ENV__REDIS_HOST=wallabag-redis
    volumes:
    - wallabag-images:/var/www/wallabag/web/assets/images
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  wallabag-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
    - MARIADB_ROOT_PASSWORD=4LSdPukaTLI52vUmNLaR0i1keA54IKwu
    volumes:
    - wallabag-db-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 20s
      timeout: 5s
      retries: 10
  wallabag-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - wallabag-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 5s
      retries: 10
volumes:
  wallabag-images: null
  wallabag-db-data: null
  wallabag-redis-data: null
x-casaos:
  id: com.dokploy.wallabag
  main: wallabag
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/wallabag/icon.svg
  title:
    en_US: wallabag
  tagline:
    en_US: wallabag is a self-hosted read-it-later application for saving, classifying, and readin...
  description:
    en_US: wallabag is a self-hosted read-it-later application for saving, classifying, and reading web articles.
  author: Dokploy Community
  developer: wallabag
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2.6.14"
  update_at: "2026-11-23"
  website: https://wallabag.org/
  repo: https://github.com/wallabag/wallabag
  docs: https://doc.wallabag.org/
