name: gitea-mysql
services:
  gitea:
    image: docker.gitea.com/gitea:1.24.4
    restart: unless-stopped
    environment:
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=mysql
    - GITEA__database__HOST=mysql:3306
    - GITEA__database__NAME=gitea
    - GITEA__database__USER=gitea
    - GITEA__database__PASSWD=6rFtQaUb0X72Ooa7RmtZq2cF
    volumes:
    - gitea-data:/data
    expose:
    - '3000'
    - '22'
    depends_on:
    - mysql
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3000/
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  mysql:
    image: docker.io/library/mysql:8
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=Y24lCBZNryAzDNzSTT1cyhAy
    - MYSQL_USER=gitea
    - MYSQL_PASSWORD=6rFtQaUb0X72Ooa7RmtZq2cF
    - MYSQL_DATABASE=gitea
    command:
    - --default-authentication-plugin=mysql_native_password
    volumes:
    - mysql-data:/var/lib/mysql
    expose:
    - '3306'
volumes:
  gitea-data: {}
  mysql-data: {}
x-casaos:
  id: com.dokploy.gitea-mysql
  main: gitea
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/gitea-mysql/icon.png
  title:
    en_US: Gitea (MySQL)
  tagline:
    en_US: Gitea bundled with MySQL 8
  description:
    en_US: Gitea bundled with MySQL 8.
  author: Dokploy Community
  developer: Gitea (MySQL)
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.24.4"
  update_at: "2026-11-27"
  website: https://gitea.io/
  repo: https://github.com/go-gitea/gitea
  docs: https://docs.gitea.com/
