name: hoppscotch
services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
    - 80
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_ENCRYPTION_KEY: ZRpbpsSPebz0hSx9pSe5SimUOHwQjAVU
      HOPP_AIO_ALTERNATE_PORT: '80'
      WHITELISTED_ORIGINS: https://localhost,http://localhost,app://hoppscotch
      VITE_BASE_URL: https://localhost
      VITE_SHORTCODE_BASE_URL: https://localhost
      VITE_ADMIN_URL: https://localhost/admin
      VITE_BACKEND_GQL_URL: https://localhost/backend/graphql
      VITE_BACKEND_WS_URL: wss://localhost/backend/graphql
      VITE_BACKEND_API_URL: https://localhost/backend/v1
      VITE_APP_TOS_LINK: https://docs.hoppscotch.io/support/terms
      VITE_APP_PRIVACY_POLICY_LINK: https://docs.hoppscotch.io/support/privacy
      ENABLE_SUBPATH_BASED_ACCESS: 'true'
    volumes:
    - hoppscotch-data:/app/data
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  postgres:
    image: postgres:16
    restart: unless-stopped
    expose:
    - 5432
    environment:
      POSTGRES_DB: hoppscotch
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: TvwhsYCsx7C4k4vIz8UTpA7EjR28DDuB
    volumes:
    - hoppscotch-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: hoppscotch/hoppscotch:latest
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -c
    command:
    - 'echo "Running database migrations..."

      pnpm dlx prisma migrate deploy && echo "Migration complete!"

      '
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    restart: 'no'
volumes:
  hoppscotch-data: null
  hoppscotch-postgres: null
x-casaos:
  id: com.dokploy.hoppscotch
  main: hoppscotch
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/hoppscotch/icon.png
  title:
    en_US: Hoppscotch (AIO + Migrations)
  tagline:
    en_US: Hoppscotch Community Edition (All-in-One) with automatic database migrations
  description:
    en_US: Hoppscotch Community Edition (All-in-One) with automatic database migrations. Includes backend, frontend, and admin
      under unified subpath routing.
  author: Dokploy Community
  developer: Hoppscotch (AIO + Migrations)
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://hoppscotch.io/
  repo: https://github.com/hoppscotch/hoppscotch
  docs: https://docs.hoppscotch.io/documentation/self-host/community-edition/install-and-build
