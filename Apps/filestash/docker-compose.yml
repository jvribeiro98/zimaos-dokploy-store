name: filestash
services:
  app:
    image: machines/filestash:latest
    restart: always
    environment:
    - APPLICATION_URL=localhost
    - CANARY=true
    - OFFICE_URL=http://wopi_server:9980
    - OFFICE_FILESTASH_URL=http://app:8334
    - OFFICE_REWRITE_URL=http://127.0.0.1:9980
    expose:
    - 8334
    volumes:
    - filestash:/app/data/state/
    ports:
    - target: 8334
      published: "8334"
      protocol: tcp
  wopi_server:
    image: collabora/code:24.04.10.2.1
    restart: always
    environment:
    - extra_params=--o:ssl.enable=false
    - aliasgroup1=https://.*:443
    command:
    - /bin/bash
    - -c
    - 'curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css

      /bin/su -s /bin/bash -c ''/start-collabora-online.sh'' cool

      '
    user: root
    expose:
    - 9980
volumes:
  filestash: null
x-casaos:
  id: com.dokploy.filestash
  main: app
  index: /
  port_map: "8334"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/filestash/icon.svg
  title:
    en_US: Filestash
  tagline:
    en_US: Filestash is the enterprise-grade file manager connecting your storage with your identi...
  description:
    en_US: Filestash is the enterprise-grade file manager connecting your storage with your identity provider and authorisations.
  author: Dokploy Community
  developer: Filestash
  category: Others
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://www.filestash.app/
  repo: https://github.com/mickael-kerjean/filestash
  docs: https://www.filestash.app/docs/
