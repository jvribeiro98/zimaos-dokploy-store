name: soketi
services:
  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-debian
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_HOST: 0.0.0.0
      SOKETI_PORT: '6001'
      SOKETI_METRICS_SERVER_PORT: '9601'
    restart: unless-stopped
    ports:
    - target: 6001
      published: "6001"
      protocol: tcp
x-casaos:
  id: com.dokploy.soketi
  main: soketi
  index: /
  port_map: "6001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/soketi/icon.png
  title:
    en_US: Soketi
  tagline:
    en_US: Soketi is your simple, fast, and resilient open-source WebSockets server
  description:
    en_US: Soketi is your simple, fast, and resilient open-source WebSockets server.
  author: Dokploy Community
  developer: Soketi
  category: Social
  architectures:
  - amd64
  - arm64
  version: "1.6.1-16"
  update_at: "2026-11-27"
  website: https://soketi.app/
  repo: https://github.com/soketi/soketi
  docs: https://docs.soketi.app/
