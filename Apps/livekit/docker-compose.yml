name: livekit
services:
  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
    - /DATA/AppData/$AppID/livekit.yaml:/etc/livekit.yaml
    ports:
    - 8080:8080
    - 8080:8080/udp
    - 8080:8080/udp
    - target: 7880
      published: "7880"
      protocol: tcp
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:${LIVEKIT_PORT} || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /etc/redis.conf
    volumes:
    - /DATA/AppData/$AppID/redis.conf:/etc/redis.conf
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
    - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
    - /DATA/AppData/$AppID/egress.yaml:/etc/egress.yaml
    cap_add:
    - CAP_SYS_ADMIN
    depends_on:
      livekit:
        condition: service_healthy
  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    environment:
    - INGRESS_CONFIG_FILE=/etc/ingress.yaml
    volumes:
    - /DATA/AppData/$AppID/ingress.yaml:/etc/ingress.yaml
    ports:
    - 8080:8080
    - 8080:8080/udp
    depends_on:
      livekit:
        condition: service_healthy
x-casaos:
  id: com.dokploy.livekit
  main: livekit
  index: /
  port_map: "7880"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/livekit/icon.svg
  title:
    en_US: Livekit
  tagline:
    en_US: LiveKit is an open source platform for developers building realtime media applications
  description:
    en_US: LiveKit is an open source platform for developers building realtime media applications.
  author: Dokploy Community
  developer: Livekit
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.9.0"
  update_at: "2026-11-28"
  website: https://livekit.io/
  repo: https://github.com/livekit/livekit
  docs: https://docs.livekit.io/
  tips:
