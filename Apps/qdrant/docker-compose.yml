name: qdrant
services:
  qdrant:
    image: qdrant/qdrant:latest
    environment:
    - SERVICE_FQDN_QDRANT_6333
    - QDRANT__SERVICE__API_KEY=maTcMXfWV2o5zzzHLRXPzBFP4WTWTWTg
    expose:
    - '6333'
    volumes:
    - qdrant_data:/qdrant/storage
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    ports:
    - target: 6333
      published: "6333"
      protocol: tcp
volumes:
  qdrant_data: {}
x-casaos:
  id: com.dokploy.qdrant
  main: qdrant
  index: /
  port_map: "6333"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/qdrant/icon.svg
  title:
    en_US: Qdrant
  tagline:
    en_US: An open-source vector database designed for high-performance similarity search and stor...
  description:
    en_US: An open-source vector database designed for high-performance similarity search and storage of embeddings.
  author: Dokploy Community
  developer: Qdrant
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://qdrant.tech/
  repo: https://github.com/qdrant/qdrant
  docs: https://qdrant.tech/documentation/
