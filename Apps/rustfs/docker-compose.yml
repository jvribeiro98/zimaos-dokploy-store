name: rustfs
services:
  rustfs:
    image: rustfs/rustfs:latest
    volumes:
    - rustfs-data:/data
    environment:
    - RUSTFS_ACCESS_KEY=rustfsadmin
    - RUSTFS_SECRET_KEY=X06JrJLUPDCh30ig
    - RUSTFS_ADDRESS=0.0.0.0:9000
    - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    - RUSTFS_CONSOLE_ENABLE=true
    - RUSTFS_CORS_ALLOWED_ORIGINS=*
    - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    command: /data
    restart: unless-stopped
    ports:
    - target: 9001
      published: "9001"
      protocol: tcp
volumes:
  rustfs-data: null
x-casaos:
  id: com.dokploy.rustfs
  main: rustfs
  index: /
  port_map: "9001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/rustfs/icon.svg
  title:
    en_US: RustFS
  tagline:
    en_US: RustFS is a high-performance, S3-compatible distributed object storage system built in...
  description:
    en_US: RustFS is a high-performance, S3-compatible distributed object storage system built in Rust. 2.3x faster than MinIO
      for small objects, with full S3 API compatibility.
  author: Dokploy Community
  developer: RustFS
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://rustfs.com/
  repo: https://github.com/rustfs/rustfs
  docs: https://docs.rustfs.com/
