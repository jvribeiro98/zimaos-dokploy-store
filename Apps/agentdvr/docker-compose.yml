name: agentdvr
services:
  agentdvr:
    image: mekayelanik/ispyagentdvr:latest
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/New_York
    - AGENTDVR_WEBUI_PORT=8090
    volumes:
    - agentdvr-config:/AgentDVR/Media/XML/
    - agentdvr-media:/AgentDVR/Media/WebServerRoot/Media/
    - agentdvr-commands:/AgentDVR/Commands/
    expose:
    - 8090
    - 3478/udp
    - 50000-50100/udp
    ports:
    - target: 8090
      published: "8090"
      protocol: tcp
volumes:
  agentdvr-config: {}
  agentdvr-media: {}
  agentdvr-commands: {}
x-casaos:
  id: com.dokploy.agentdvr
  main: agentdvr
  index: /
  port_map: "8090"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/agentdvr/icon.png
  title:
    en_US: Agent DVR
  tagline:
    en_US: Agent DVR is a comprehensive video surveillance software with motion detection, alerts,...
  description:
    en_US: Agent DVR is a comprehensive video surveillance software with motion detection, alerts, and remote access capabilities.
  author: Dokploy Community
  developer: Agent DVR
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://www.ispyconnect.com/
  repo: https://github.com/ispysoftware/AgentDVR
  docs: https://www.ispyconnect.com/userguide-agent-dvr.aspx
