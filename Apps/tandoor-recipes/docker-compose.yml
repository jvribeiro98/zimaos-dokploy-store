  author: Dokploy Community
  developer: Tandoor Recipes
  category: Home
  architectures:
  - amd64
  - arm64
  version: "2.6.11"
  update_at: "2026-11-24"
  website: https://tandoor.dev/
  repo: https://github.com/TandoorRecipes/recipes
  docs: https://docs.tandoor.dev/
