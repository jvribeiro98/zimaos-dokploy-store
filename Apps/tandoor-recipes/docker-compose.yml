name: tandoor-recipes
services:
  tandoor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: sEGLxD3eTokzX0fFspLMmAH01s3Zt4jC
      POSTGRES_DB: tandoor
    volumes:
    - tandoor_db_data:/var/lib/postgresql/data
  tandoor-recipes:
    image: vabene1111/recipes:2.6.11
    restart: unless-stopped
    depends_on:
    - tandoor-db
    environment:
      SECRET_KEY: NYETaZU62FQAy0Ku4FTeIw5WthG62GtFgV02wGnydMNY3QK6l4M4VdwFNomFvzou
      TANDOOR_PORT: '8080'
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: tandoor-db
      POSTGRES_PORT: '5432'
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: sEGLxD3eTokzX0fFspLMmAH01s3Zt4jC
      POSTGRES_DB: tandoor
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://localhost
    volumes:
    - tandoor_staticfiles:/opt/recipes/staticfiles
    - tandoor_mediafiles:/opt/recipes/mediafiles
    expose:
    - '8080'
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  tandoor_db_data: null
  tandoor_staticfiles: null
  tandoor_mediafiles: null
x-casaos:
  id: com.dokploy.tandoor-recipes
  main: tandoor-recipes
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/tandoor-recipes/icon.svg
  title:
    en_US: Tandoor Recipes
  tagline:
    en_US: Tandoor Recipes is a self-hosted recipe manager, meal planner, and shopping list applic...
  description:
