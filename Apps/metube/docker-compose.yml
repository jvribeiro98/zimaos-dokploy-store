name: metube
services:
  metube:
    image: ghcr.io/alexta69/metube
    restart: unless-stopped
    expose:
    - 8081
    volumes:
    - /DATA/AppData/$AppID/downloads:/downloads
    ports:
    - target: 8081
      published: "8081"
      protocol: tcp
x-casaos:
  id: com.dokploy.metube
  main: metube
  index: /
  port_map: "8081"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/metube/icon.png
  title:
    en_US: MeTube
  tagline:
    en_US: MeTube is a web-based YouTube downloader that allows downloading videos and audio using...
  description:
    en_US: MeTube is a web-based YouTube downloader that allows downloading videos and audio using yt-dlp.
  author: Dokploy Community
  developer: MeTube
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://github.com/alexta69/metube
  repo: https://github.com/alexta69/metube
  docs: https://github.com/alexta69/metube/wiki
