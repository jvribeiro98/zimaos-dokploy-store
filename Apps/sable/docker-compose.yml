name: sable
services:
  sable:
    image: ghcr.io/drudge/sable:1.6.1
    restart: unless-stopped
    dns:
    - 1.1.1.1
    - 9.9.9.9
    ports:
    - '1053'
    - '1053'
    - target: 5380
      published: "5380"
      protocol: tcp
    expose:
    - 5380
    environment:
    - TZ=UTC
    - SABLE_WEB_UPDATES=true
    volumes:
    - sable-data:/data
volumes:
  sable-data: {}
x-casaos:
  id: com.dokploy.sable
  main: sable
  index: /
  port_map: "5380"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sable/icon.svg
  title:
    en_US: Sable
  tagline:
    en_US: Sable is a modern, high-performance DNS platform with recursive and authoritative DNS,...
  description:
    en_US: Sable is a modern, high-performance DNS platform with recursive and authoritative DNS, blocking, DNSSEC, observability,
      clustering, and a polished web console.
  author: Dokploy Community
  developer: Sable
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.6.1"
  update_at: "2026-11-24"
  website: https://www.sabledns.io
  repo: https://github.com/drudge/sable
  docs: https://www.sabledns.io/docs
