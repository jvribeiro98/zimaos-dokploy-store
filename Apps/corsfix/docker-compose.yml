name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:170af5a5ea2ea02745f74e898d7a187b68b21d57953427ce932edb02d9964476370a617bff4674f9aa9a19885170f8de6fbfa4823f0f9a589bb07019a71f6290@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:b480ea99c391d159db07aea37f7158c8bd7f37b1dac80a399a630021cc5ebedec9e747dbb677df5789e608d03c6195bc7c5b1ff9df912243c3b4ef95f7025eff@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: ieKwVjbKa3j9TMezXsQVDSRXIHFA219EplDfDign6fs=
      AUTH_SECRET: m5uLJWB3kpg+RM+iGL7eUpALlCuCte/Nrl+yoinffc8=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:170af5a5ea2ea02745f74e898d7a187b68b21d57953427ce932edb02d9964476370a617bff4674f9aa9a19885170f8de6fbfa4823f0f9a589bb07019a71f6290@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:b480ea99c391d159db07aea37f7158c8bd7f37b1dac80a399a630021cc5ebedec9e747dbb677df5789e608d03c6195bc7c5b1ff9df912243c3b4ef95f7025eff@redis:6379
      KEK_VERSION_1: ieKwVjbKa3j9TMezXsQVDSRXIHFA219EplDfDign6fs=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: 170af5a5ea2ea02745f74e898d7a187b68b21d57953427ce932edb02d9964476370a617bff4674f9aa9a19885170f8de6fbfa4823f0f9a589bb07019a71f6290
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: b480ea99c391d159db07aea37f7158c8bd7f37b1dac80a399a630021cc5ebedec9e747dbb677df5789e608d03c6195bc7c5b1ff9df912243c3b4ef95f7025eff
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-28"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
