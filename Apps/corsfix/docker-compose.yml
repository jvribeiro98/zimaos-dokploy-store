name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:26d7d222020f2bcf1b2c6c5da811827da2bdf53da399369de5ab0428de53c93d4dac9172cf0f276762c8b0d40feb7d5239eaccfe88072180962ceb34f8597004@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:3191f8baa817ab2b6f4715cf9b77802cf0e0c8f9b4decd20d784e80bb5133cfd61be7a55d570fe9e5ae3c12a3b04a0e90e22a48701e58181963fb0e4f722b593@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: dXIT1YDyBfqaSWDoaLY/YccsZuqI7aPDp9Ty6yekqi4=
      AUTH_SECRET: M8lL4NnIxlS56QTHAiY+RazN2BCVgPC/OeeasTfpVDM=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:26d7d222020f2bcf1b2c6c5da811827da2bdf53da399369de5ab0428de53c93d4dac9172cf0f276762c8b0d40feb7d5239eaccfe88072180962ceb34f8597004@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:3191f8baa817ab2b6f4715cf9b77802cf0e0c8f9b4decd20d784e80bb5133cfd61be7a55d570fe9e5ae3c12a3b04a0e90e22a48701e58181963fb0e4f722b593@redis:6379
      KEK_VERSION_1: dXIT1YDyBfqaSWDoaLY/YccsZuqI7aPDp9Ty6yekqi4=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: 26d7d222020f2bcf1b2c6c5da811827da2bdf53da399369de5ab0428de53c93d4dac9172cf0f276762c8b0d40feb7d5239eaccfe88072180962ceb34f8597004
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: 3191f8baa817ab2b6f4715cf9b77802cf0e0c8f9b4decd20d784e80bb5133cfd61be7a55d570fe9e5ae3c12a3b04a0e90e22a48701e58181963fb0e4f722b593
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-23"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
