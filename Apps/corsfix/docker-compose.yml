name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:2c7973bdee4d613e1dc60ea14254dad4c77993c4422a4a6ba24e42d665506be3aeb83e7eff4f32f4b01417de3cbd4e1a401048c4abad2103e26f28a250da6a52@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:2502720abd2b285f8a282b89a7a7d9956934e253005cf75bac9cad44cea080d1a00ac602d8f4e7d5e1add946d63697dc982baaf057867530b69eb15a7fe04e36@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: /zPsegc17yd/3geLr+FghyoJVphTr6j4FKGzEFijh8k=
      AUTH_SECRET: KdEYguS715+InJVNlgGOdlQ07wv1bA431MMcxx6H/ls=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:2c7973bdee4d613e1dc60ea14254dad4c77993c4422a4a6ba24e42d665506be3aeb83e7eff4f32f4b01417de3cbd4e1a401048c4abad2103e26f28a250da6a52@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:2502720abd2b285f8a282b89a7a7d9956934e253005cf75bac9cad44cea080d1a00ac602d8f4e7d5e1add946d63697dc982baaf057867530b69eb15a7fe04e36@redis:6379
      KEK_VERSION_1: /zPsegc17yd/3geLr+FghyoJVphTr6j4FKGzEFijh8k=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: 2c7973bdee4d613e1dc60ea14254dad4c77993c4422a4a6ba24e42d665506be3aeb83e7eff4f32f4b01417de3cbd4e1a401048c4abad2103e26f28a250da6a52
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: 2502720abd2b285f8a282b89a7a7d9956934e253005cf75bac9cad44cea080d1a00ac602d8f4e7d5e1add946d63697dc982baaf057867530b69eb15a7fe04e36
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-24"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
