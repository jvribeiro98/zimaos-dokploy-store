name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:ed9bdcae5e8278e302bbab073ac6e1ef5e6c2d3a19974c42d3908ae78ddae2baa595a00a2aaf5545ed454160c8995afa6c38613c659e1dd9d1671f3bebdd34dc@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:3a716c195bf1898e1c2e161b0309e61a6d9f512af7a2c21b8f5cfd31fc1b2d18e9408763543c343f0704bc5c609963a1858f26b9bbd7b3106f7061021adb98e2@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: WHVE1/cDDxV3S30dSaz95QkTUaeVItMGgn7pRPZq0cw=
      AUTH_SECRET: u1TojJsLCPQblKoHOvlTk6qXL+DS0yjQoFuTALkOcR8=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:ed9bdcae5e8278e302bbab073ac6e1ef5e6c2d3a19974c42d3908ae78ddae2baa595a00a2aaf5545ed454160c8995afa6c38613c659e1dd9d1671f3bebdd34dc@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:3a716c195bf1898e1c2e161b0309e61a6d9f512af7a2c21b8f5cfd31fc1b2d18e9408763543c343f0704bc5c609963a1858f26b9bbd7b3106f7061021adb98e2@redis:6379
      KEK_VERSION_1: WHVE1/cDDxV3S30dSaz95QkTUaeVItMGgn7pRPZq0cw=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: ed9bdcae5e8278e302bbab073ac6e1ef5e6c2d3a19974c42d3908ae78ddae2baa595a00a2aaf5545ed454160c8995afa6c38613c659e1dd9d1671f3bebdd34dc
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: 3a716c195bf1898e1c2e161b0309e61a6d9f512af7a2c21b8f5cfd31fc1b2d18e9408763543c343f0704bc5c609963a1858f26b9bbd7b3106f7061021adb98e2
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-22"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
