name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:1597bdb0a2ac53e9dab9fcf3add042b6343523eb9f58ebdd4d615b19e597208add15c40dcd3c3d3e411bfc193530904235009fda04292453cf1439105204d48e@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:2b27f96525d8da3b10de701d402dd5ad0e23356dbde620de4ea4e120213598eeec1f37a6f44f6b4a4f353eed8fc29c4832b7b2268e7d9877ac834e237e60d259@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: qO8bseQhczSg5UCDFpA3WgpgiSE9NveaDuwMlvROxJw=
      AUTH_SECRET: fCv3FJ1Br8lyEV1xxEQ1cjxvdIQpLYf1EkPfzUMbcrM=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:1597bdb0a2ac53e9dab9fcf3add042b6343523eb9f58ebdd4d615b19e597208add15c40dcd3c3d3e411bfc193530904235009fda04292453cf1439105204d48e@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:2b27f96525d8da3b10de701d402dd5ad0e23356dbde620de4ea4e120213598eeec1f37a6f44f6b4a4f353eed8fc29c4832b7b2268e7d9877ac834e237e60d259@redis:6379
      KEK_VERSION_1: qO8bseQhczSg5UCDFpA3WgpgiSE9NveaDuwMlvROxJw=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: 1597bdb0a2ac53e9dab9fcf3add042b6343523eb9f58ebdd4d615b19e597208add15c40dcd3c3d3e411bfc193530904235009fda04292453cf1439105204d48e
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: 2b27f96525d8da3b10de701d402dd5ad0e23356dbde620de4ea4e120213598eeec1f37a6f44f6b4a4f353eed8fc29c4832b7b2268e7d9877ac834e237e60d259
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-27"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
