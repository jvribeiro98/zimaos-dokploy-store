name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:bf99426e2491efe4002f08a4eb21bd35a022f46941e2b263b14cf438fa7063632dcc1c68dec11ab59081d199db92bf1b3be141134ad0f9a528f654a7941002df@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:8b4bc354ab8deea500545c01d5f8ef68b5ddf29730ed4364a0599af917ae292fdff44b3da8b24e35166fc76b8583f4d61b829f2e8b0ad4887fafa8cd1b75d885@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: 9+nGGCUPYyBOXUyy+vOV/77J8d0z2BqRn6aSguDFuVU=
      AUTH_SECRET: xGEYj3L+Jh1JAfVMQbcc5CKpO0YdguZ8celIxsIwd1I=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:bf99426e2491efe4002f08a4eb21bd35a022f46941e2b263b14cf438fa7063632dcc1c68dec11ab59081d199db92bf1b3be141134ad0f9a528f654a7941002df@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:8b4bc354ab8deea500545c01d5f8ef68b5ddf29730ed4364a0599af917ae292fdff44b3da8b24e35166fc76b8583f4d61b829f2e8b0ad4887fafa8cd1b75d885@redis:6379
      KEK_VERSION_1: 9+nGGCUPYyBOXUyy+vOV/77J8d0z2BqRn6aSguDFuVU=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: bf99426e2491efe4002f08a4eb21bd35a022f46941e2b263b14cf438fa7063632dcc1c68dec11ab59081d199db92bf1b3be141134ad0f9a528f654a7941002df
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: 8b4bc354ab8deea500545c01d5f8ef68b5ddf29730ed4364a0599af917ae292fdff44b3da8b24e35166fc76b8583f4d61b829f2e8b0ad4887fafa8cd1b75d885
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-22"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
