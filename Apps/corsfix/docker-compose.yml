name: corsfix
services:
  corsfix:
    image: ghcr.io/corsfix/corsfix-app:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    platform: linux/amd64
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      MONGODB_URI: mongodb://corsfix:41a9c95a9f0f502e27074c5fc790310c2c3523da2fcd0c10c5c9e56c40103f83af6f408bc62a864f807ce679cecd0f9a0cafda6f81cfbd20c8fbc346b1ee5a82@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:ec688014aa6081dced854c4949bd0fb40bf17a96a39ddd9380e3522eaa14cb29fae5658a8e273dd3083002844bfdae58c2ec21684f1e892ad4cb57dad959c239@redis:6379
      KEK_VERSION: KEK_VERSION_1
      KEK_VERSION_1: KXBdRVqoa6OEQoSOlzqgkDu7vx9ZUiN575ZqGcafYpo=
      AUTH_SECRET: cn/PT5h0SuHjtYorRj1S/nir32hdp59vfZOg1xFcXyw=
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://localhost
      PROXY_DOMAIN: localhost
      DISABLE_SIGNUP: 'false'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  corsfix-proxy:
    image: ghcr.io/corsfix/corsfix-proxy:8899bb15e71c7238285ccefc4c95a0cd47daeaf0
    restart: unless-stopped
    expose:
    - '80'
    environment:
      MONGODB_URI: mongodb://corsfix:41a9c95a9f0f502e27074c5fc790310c2c3523da2fcd0c10c5c9e56c40103f83af6f408bc62a864f807ce679cecd0f9a0cafda6f81cfbd20c8fbc346b1ee5a82@mongodb:27017/db?authSource=admin
      REDIS_URI: redis://default:ec688014aa6081dced854c4949bd0fb40bf17a96a39ddd9380e3522eaa14cb29fae5658a8e273dd3083002844bfdae58c2ec21684f1e892ad4cb57dad959c239@redis:6379
      KEK_VERSION_1: KXBdRVqoa6OEQoSOlzqgkDu7vx9ZUiN575ZqGcafYpo=
      APP_DOMAIN: localhost
      RPM: '180'
      ALLOWED_ORIGINS: ''
      ALLOWED_TARGETS: ''
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: corsfix
      MONGO_INITDB_ROOT_PASSWORD: 41a9c95a9f0f502e27074c5fc790310c2c3523da2fcd0c10c5c9e56c40103f83af6f408bc62a864f807ce679cecd0f9a0cafda6f81cfbd20c8fbc346b1ee5a82
      MONGO_INITDB_DATABASE: db
    volumes:
    - mongodb-data:/data/db
    - mongodb-config:/data/configdb
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase
        admin --eval ''quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'''
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    environment:
      REDIS_PASSWORD: ec688014aa6081dced854c4949bd0fb40bf17a96a39ddd9380e3522eaa14cb29fae5658a8e273dd3083002844bfdae58c2ec21684f1e892ad4cb57dad959c239
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mongodb-data: null
  mongodb-config: null
  redis-data: null
x-casaos:
  id: com.dokploy.corsfix
  main: corsfix
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/corsfix/icon.svg
  title:
    en_US: Corsfix
  tagline:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applicatio...
  description:
    en_US: Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target
      allowlists, encrypted API secrets, response caching, and a management dashboard.
  author: Dokploy Community
  developer: Corsfix
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
  update_at: "2026-11-26"
  website: https://corsfix.com
  repo: https://github.com/corsfix/corsfix
  docs: https://corsfix.com/docs/open-source/self-hosting
