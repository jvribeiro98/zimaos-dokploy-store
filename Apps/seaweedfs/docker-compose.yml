name: seaweedfs
services:
  master:
    image: chrislusf/seaweedfs:4.02
    command: '-v=0 master -volumeSizeLimitMB=10240 -ip=master -ip.bind=0.0.0.0 -port=9333 -mdir=/data/master

      '
    volumes:
    - seaweedfs-master:/data/master
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:9333
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
    - 9333
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
  volume:
    image: chrislusf/seaweedfs:4.02
    command: '-v=0 volume -mserver="master:9333" -port=8080 -dir=/data/volume -max=100

      '
    volumes:
    - seaweedfs-volume:/data/volume
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped
    expose:
    - 8080
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
  filer:
    image: chrislusf/seaweedfs:4.02
    command: '-v=0 filer -defaultReplicaPlacement=000 -master="master:9333" -ip=filer -ip.bind=0.0.0.0 -port=8888

      '
    environment:
    - WEED_MASTER=master:9333
    volumes:
    - seaweedfs-filer:/data
    depends_on:
    - master
    - volume
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8888
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    expose:
    - 8888
    ports:
    - target: 8888
      published: "8888"
      protocol: tcp
  s3:
    image: chrislusf/seaweedfs:4.02
    command: '-v=0 s3 -filer="filer:8888" -ip.bind=0.0.0.0 -port=8333

      '
    environment:
    - AWS_ACCESS_KEY_ID=admin
    - AWS_SECRET_ACCESS_KEY=5Fuw60bzha3cBgQP
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    expose:
    - 8333
volumes:
  seaweedfs-master: null
  seaweedfs-volume: null
  seaweedfs-filer: null
x-casaos:
  id: com.dokploy.seaweedfs
  main: filer
  index: /
  port_map: "8888"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/seaweedfs/icon.svg
  title:
    en_US: SeaweedFS
  tagline:
    en_US: SeaweedFS is a fast distributed storage system for blobs, objects, and files
  description:
    en_US: SeaweedFS is a fast distributed storage system for blobs, objects, and files. Features S3-compatible API, POSIX
      FUSE mount, and WebDAV support.
  author: Dokploy Community
  developer: SeaweedFS
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "4.02"
  update_at: "2026-11-28"
  website: https://seaweedfs.com/
  repo: https://github.com/seaweedfs/seaweedfs
  docs: https://github.com/seaweedfs/seaweedfs/wiki
