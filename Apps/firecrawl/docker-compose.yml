name: firecrawl
services:
  firecrawl-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: firecrawl
    configs:
    - source: db-init-prerequisites
      target: /docker-entrypoint-initdb.d/010-prerequisites.sql
    - source: db-init-schema
      target: /docker-entrypoint-initdb.d/020-current-schema.sql
    - source: db-init-constraints
      target: /docker-entrypoint-initdb.d/030-selfhost-constraints.sql
    - source: db-init-rpcs
      target: /docker-entrypoint-initdb.d/040-selfhost-rpcs.sql
    volumes:
    - firecrawl-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d firecrawl
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
        compress: 'true'
  firecrawl-db-seed:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: 'no'
    depends_on:
      firecrawl-db:
        condition: service_healthy
    environment:
      PGHOST: firecrawl-db
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ${APP_POSTGRES_PASSWORD:?required}
      PGDATABASE: firecrawl
      FIRECRAWL_ORG_ID: ${FIRECRAWL_ORG_ID:?required}
      FIRECRAWL_TEAM_ID: ${FIRECRAWL_TEAM_ID:?required}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?required}
    configs:
    - source: db-seed
      target: /seed.sql
    command:
    - /bin/sh
    - -ec
    - psql -v org_id="$${FIRECRAWL_ORG_ID}" -v team_id="$${FIRECRAWL_TEAM_ID}" -v api_key="$${FIRECRAWL_API_KEY}" -f /seed.sql
    logging: *id001
  nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NUQ_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
    volumes:
    - nuq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *id001
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
    - /bin/sh
    - -ec
    - exec redis-server --bind 0.0.0.0 --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging: *id001
  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?required}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - check_running
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *id001
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
    restart: unless-stopped
    environment:
      PORT: '3000'
      MAX_CONCURRENT_PAGES: '10'
      ALLOW_LOCAL_WEBHOOKS: 'false'
      BLOCK_MEDIA: 'true'
      PROXY_SERVER: ''
      PROXY_USERNAME: ''
      PROXY_PASSWORD: ''
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp/.cache:noexec,nosuid,size=1g
    logging: *id001
  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:2.11.230@sha256:7c5bf28dd3397be9a5bfb103adeef9adefbad352d223011da1bab606a0044416
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      ENV: local
      HOST: 0.0.0.0
      PORT: '3002'
      EXTRACT_WORKER_PORT: '3004'
      WORKER_PORT: '3005'
      USE_DB_AUTHENTICATION: 'true'
      DATABASE_URL: postgresql://postgres:${APP_POSTGRES_PASSWORD:?required}@firecrawl-db:5432/firecrawl
      DATABASE_REPLICA_URL: postgresql://postgres:${APP_POSTGRES_PASSWORD:?required}@firecrawl-db:5432/firecrawl
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      REDIS_RATE_LIMIT_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      NUQ_DATABASE_URL: postgresql://postgres:${NUQ_POSTGRES_PASSWORD:?required}@nuq-postgres:5432/postgres
      NUQ_DATABASE_URL_LISTEN: postgresql://postgres:${NUQ_POSTGRES_PASSWORD:?required}@nuq-postgres:5432/postgres
      NUQ_RABBITMQ_URL: amqp://${RABBITMQ_USER:?required}:${RABBITMQ_PASSWORD:?required}@rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NUQ_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: postgres
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: '5432'
      NUM_WORKERS_PER_QUEUE: '8'
      CRAWL_CONCURRENT_REQUESTS: '10'
      MAX_CONCURRENT_JOBS: '5'
      BROWSER_POOL_SIZE: '5'
      HARNESS_STARTUP_TIMEOUT_MS: '120000'
      LOGGING_LEVEL: INFO
      DISABLE_ENGPICKER: 'true'
      BULL_AUTH_KEY: ${BULL_AUTH_KEY:?required}
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: ''
      OPENROUTER_API_KEY: ''
      OLLAMA_BASE_URL: ''
      MODEL_NAME: ''
      MODEL_EMBEDDING_NAME: ''
      SEARCHAPI_API_KEY: ''
      LLAMAPARSE_API_KEY: ''
      SLACK_WEBHOOK_URL: ''
      SEARXNG_ENDPOINT: ''
      SEARXNG_ENGINES: ''
      SEARXNG_CATEGORIES: ''
      SELF_HOSTED_WEBHOOK_URL: ''
      SELF_HOSTED_WEBHOOK_HMAC_SECRET: 66004441b0f3aa0c2cf7c083b83c6697a72f62ed778d72d5479c2d480f3ef890
      PROXY_SERVER: ''
      PROXY_USERNAME: ''
      PROXY_PASSWORD: ''
      ALLOW_LOCAL_WEBHOOKS: 'false'
    expose:
    - '3002'
    depends_on:
      firecrawl-db-seed:
        condition: service_completed_successfully
      nuq-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      playwright-service:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3002/v0/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *id001
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.14@sha256:3d93169968848d371a6a56ca1ab18b47a8906ba461b8eba0688866354f5431d5
    restart: unless-stopped
    environment:
      SWAGGER_JSON_URL: /openapi.json
      DEEP_LINKING: 'true'
      DISPLAY_OPERATION_ID: 'false'
      DISPLAY_REQUEST_DURATION: 'true'
      DOC_EXPANSION: none
      PERSIST_AUTHORIZATION: 'true'
      TRY_IT_OUT_ENABLED: 'true'
    configs:
    - source: firecrawl-openapi
      target: /tmp/openapi.json.gz.b64
    command:
    - /bin/sh
    - -ec
    - base64 -d /tmp/openapi.json.gz.b64 | gzip -dc > /usr/share/nginx/html/openapi.json; exec /docker-entrypoint.sh nginx
      -g 'daemon off;'
    expose:
    - '8080'
    logging: *id001
  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    configs:
    - source: firecrawl-gateway-nginx
      target: /etc/nginx/conf.d/default.conf
    expose:
    - '8080'
    depends_on:
      firecrawl:
        condition: service_healthy
      swagger-ui:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/v0/health/liveness
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *id001
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-logging: *id001
configs:
  db-init-prerequisites:
    content: "\\set ON_ERROR_STOP on\n\nCREATE SCHEMA IF NOT EXISTS extensions;\nCREATE EXTENSION IF NOT EXISTS pgcrypto WITH\
      \ SCHEMA extensions;\n\nCREATE TABLE IF NOT EXISTS public.organizations (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n\
      \  name text NOT NULL,\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT\
      \ now()\n);\n"
  db-init-schema:
    content: "CREATE TABLE \"agent_sponsors\" (\n  \"id\" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name \"agent_sponsors_id_seq\"\
      \ INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),\n  \"email\" text NOT NULL,\n  \"status\"\
      \ text DEFAULT 'pending' NOT NULL,\n  \"verification_deadline\" timestamp with time zone NOT NULL,\n  \"agent_name\"\
      \ text NOT NULL,\n  \"sandboxed_team_id\" uuid,\n  \"api_key_id\" bigint,\n  \"requesting_ip\" text,\n  \"tos_version\"\
      \ text,\n  \"tos_hash\" text,\n  \"verification_token\" text NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT\
      \ now(),\n  \"verified_at\" timestamp with time zone,\n  \"updated_at\" timestamp with time zone DEFAULT now()\n);\n\
      --> statement-breakpoint\nCREATE TABLE \"agents\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\" uuid NOT NULL,\n  \"\
      team_id\" uuid NOT NULL,\n  \"options\" jsonb,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"time_taken\" numeric NOT NULL,\n  \"credits_cost\" integer NOT NULL,\n  \"cost_tracking\" jsonb,\n  \"is_successful\"\
      \ boolean NOT NULL,\n  \"error\" text\n);\n--> statement-breakpoint\nCREATE TABLE \"api_keys\" (\n  \"id\" bigint GENERATED\
      \ BY DEFAULT AS IDENTITY (sequence name \"api_keys_id_seq\" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START\
      \ WITH 1 CACHE 1),\n  \"created_at\" timestamp with time zone DEFAULT now(),\n  \"key\" uuid DEFAULT gen_random_uuid(),\n\
      \  \"name\" text,\n  \"team_id\" uuid,\n  \"owner_id\" uuid,\n  \"agent_provisioned\" boolean DEFAULT false,\n  \"concurrency\"\
      \ integer,\n  CONSTRAINT \"api_keys_id_team_id_key\" UNIQUE(\"id\",\"team_id\")\n);\n--> statement-breakpoint\nCREATE\
      \ TABLE \"batch_scrapes\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\" uuid NOT NULL,\n  \"team_id\" uuid NOT NULL,\n\
      \  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"num_docs\" integer NOT NULL,\n  \"credits_cost\"\
      \ integer NOT NULL,\n  \"cancelled\" boolean NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"blocklist\" (\n\
      \  \"id\" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name \"blocklist_id_seq\" INCREMENT BY 1 MINVALUE 1 MAXVALUE\
      \ 9223372036854775807 START WITH 1 CACHE 1),\n  \"data\" jsonb NOT NULL,\n  \"org_id\" uuid\n);\n--> statement-breakpoint\n\
      CREATE TABLE \"blocklist_hits\" (\n  \"id\" uuid NOT NULL,\n  \"domain\" text NOT NULL,\n  \"url\" text,\n  \"team_id\"\
      \ uuid,\n  \"origin\" text,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\n\
      CREATE TABLE \"browser_session_activities\" (\n  \"id\" bigint GENERATED ALWAYS AS IDENTITY (sequence name \"browser_session_activities_id_seq\"\
      \ INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1 CACHE 1),\n  \"team_id\" text NOT NULL,\n  \"\
      session_id\" text NOT NULL,\n  \"language\" text NOT NULL,\n  \"timeout\" integer NOT NULL,\n  \"exit_code\" integer,\n\
      \  \"killed\" boolean DEFAULT false NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n \
      \ \"source\" text DEFAULT 'browser'\n);\n--> statement-breakpoint\nCREATE TABLE \"browser_sessions\" (\n  \"id\" uuid\
      \ NOT NULL,\n  \"team_id\" text NOT NULL,\n  \"request_id\" uuid,\n  \"should_bill\" boolean DEFAULT true NOT NULL,\n\
      \  \"browser_id\" text NOT NULL,\n  \"workspace_id\" text NOT NULL,\n  \"context_id\" text NOT NULL,\n  \"cdp_url\"\
      \ text NOT NULL,\n  \"cdp_path\" text NOT NULL,\n  \"stream_web_view\" boolean DEFAULT false NOT NULL,\n  \"status\"\
      \ text DEFAULT 'active' NOT NULL,\n  \"ttl_total\" integer NOT NULL,\n  \"ttl_without_activity\" integer,\n  \"created_at\"\
      \ timestamp with time zone DEFAULT now() NOT NULL,\n  \"updated_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"deleted_at\" timestamp with time zone,\n  \"credits_used\" integer,\n  \"cdp_interactive_path\" text,\n  \"scrape_id\"\
      \ uuid\n);\n--> statement-breakpoint\nCREATE TABLE \"code_searches\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\" uuid\
      \ NOT NULL,\n  \"target\" text NOT NULL,\n  \"team_id\" uuid NOT NULL,\n  \"options\" jsonb,\n  \"response\" jsonb,\n\
      \  \"num_results\" integer NOT NULL,\n  \"time_taken\" numeric NOT NULL,\n  \"credits_cost\" integer NOT NULL,\n  \"\
      is_successful\" boolean NOT NULL,\n  \"error\" text,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL\n\
      );\n--> statement-breakpoint\nCREATE TABLE \"crawls\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\" uuid NOT NULL,\n\
      \  \"url\" text NOT NULL,\n  \"team_id\" uuid NOT NULL,\n  \"options\" jsonb,\n  \"created_at\" timestamp with time\
      \ zone DEFAULT now() NOT NULL,\n  \"num_docs\" integer NOT NULL,\n  \"credits_cost\" integer NOT NULL,\n  \"cancelled\"\
      \ boolean NOT NULL,\n  \"monitor_id\" uuid,\n  \"monitor_check_id\" uuid\n);\n--> statement-breakpoint\nCREATE TABLE\
      \ \"deep_researches\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\" uuid NOT NULL,\n  \"query\" text NOT NULL,\n  \"\
      team_id\" uuid NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"time_taken\" numeric\
      \ NOT NULL,\n  \"credits_cost\" integer NOT NULL,\n  \"cost_tracking\" jsonb,\n  \"options\" jsonb\n);\n--> statement-breakpoint\n\
      CREATE TABLE \"deterministic_json_llm_cache\" (\n  \"id\" uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  \"cache_key\"\
      \ text NOT NULL UNIQUE,\n  \"response\" text NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT\
