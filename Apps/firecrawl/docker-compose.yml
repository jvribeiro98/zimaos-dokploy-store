  db-init-constraints:
    content: "\\set ON_ERROR_STOP on\n\n-- The public Drizzle schema mirrors Firecrawl's managed database shape, where\n--\
      \ several constraints are applied out-of-band. Recreate those constraints for\n-- a standalone PostgreSQL database.\n\
      DO $$firecrawl$$\nDECLARE\n  table_record record;\nBEGIN\n  FOR table_record IN\n    SELECT c.table_name\n    FROM information_schema.columns\
      \ c\n    JOIN information_schema.tables t\n      ON t.table_schema = c.table_schema\n     AND t.table_name = c.table_name\n\
      \    WHERE c.table_schema = 'public'\n      AND c.column_name = 'id'\n      AND c.is_nullable = 'NO'\n      AND t.table_type\
      \ = 'BASE TABLE'\n      AND NOT EXISTS (\n        SELECT 1\n        FROM pg_constraint pc\n        JOIN pg_class rel\
      \ ON rel.oid = pc.conrelid\n        JOIN pg_namespace ns ON ns.oid = rel.relnamespace\n        WHERE ns.nspname = 'public'\n\
      \          AND rel.relname = c.table_name\n          AND pc.contype = 'p'\n      )\n  LOOP\n    EXECUTE format(\n  \
      \    'ALTER TABLE public.%I ADD CONSTRAINT %I PRIMARY KEY (id)',\n      table_record.table_name,\n      table_record.table_name\
      \ || '_pkey'\n    );\n  END LOOP;\nEND\n$$firecrawl$$;\n\nCREATE UNIQUE INDEX IF NOT EXISTS api_keys_key_unique\n  ON\
      \ public.api_keys (key);\nCREATE UNIQUE INDEX IF NOT EXISTS idempotency_keys_key_unique\n  ON public.idempotency_keys\
      \ (key);\nCREATE UNIQUE INDEX IF NOT EXISTS slack_installations_team_id_unique\n  ON public.slack_installations (team_id);\n\
      CREATE UNIQUE INDEX IF NOT EXISTS monitor_pages_identity_unique\n  ON public.monitor_pages (monitor_id, target_id, url_hash);\n\
      CREATE UNIQUE INDEX IF NOT EXISTS monitor_email_recipients_identity_unique\n  ON public.monitor_email_recipients (monitor_id,\
      \ email);\n\nCREATE INDEX IF NOT EXISTS api_keys_team_id_idx ON public.api_keys (team_id);\nCREATE INDEX IF NOT EXISTS\
      \ requests_team_id_idx ON public.requests (team_id);\nCREATE INDEX IF NOT EXISTS requests_dr_clean_by_idx\n  ON public.requests\
      \ (dr_clean_by)\n  WHERE dr_clean_by IS NOT NULL;\nCREATE INDEX IF NOT EXISTS monitors_due_idx\n  ON public.monitors\
      \ (next_run_at)\n  WHERE status = 'active' AND deleted_at IS NULL;\n"
  db-init-rpcs:
    content: "\\set ON_ERROR_STOP on\n\n-- Firecrawl's current API calls these PostgreSQL functions directly. They are\n--\
      \ not included in the public self-host guide, so this file supplies standalone\n-- equivalents. Billing is intentionally\
      \ unlimited for this private self-host.\n\nCREATE OR REPLACE FUNCTION public.selfhost_unlimited_rate_limit_flags()\n\
      RETURNS jsonb\nLANGUAGE sql\nIMMUTABLE\nAS $$function$$\n  SELECT jsonb_build_object(\n    'rateLimitOverrides',\n \
      \   jsonb_build_object(\n      'crawl', 2147483647,\n      'crawlStatus', 2147483647,\n      'scrape', 2147483647,\n\
      \      'scrapeAgentPreview', 2147483647,\n      'preview', 2147483647,\n      'search', 2147483647,\n      'map', 2147483647,\n\
      \      'extract', 2147483647,\n      'extractStatus', 2147483647,\n      'extractAgentPreview', 2147483647,\n      'browser',\
      \ 2147483647,\n      'browserExecute', 2147483647,\n      'browserReplay', 2147483647,\n      'account', 2147483647,\n\
      \      'supportAsk', 2147483647,\n      'supportDocsSearch', 2147483647,\n      'research', 2147483647,\n      'developerSearch',\
      \ 2147483647,\n      'labs', 2147483647\n    )\n  )\n$$function$$;\n\nCREATE TABLE IF NOT EXISTS public.firecrawl_change_tracking_scrapes\
      \ (\n  id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,\n  team_id uuid NOT NULL,\n  url text NOT NULL,\n  job_id\
      \ text NOT NULL,\n  change_tracking_tag text,\n  date_added timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX IF\
      \ NOT EXISTS firecrawl_change_tracking_lookup_idx\n  ON public.firecrawl_change_tracking_scrapes\n    (team_id, url,\
      \ change_tracking_tag, date_added DESC);\n\nCREATE OR REPLACE FUNCTION public.auth_chunk_1(\n  input_key text,\n  input_credential_purpose\
      \ text DEFAULT 'general'\n)\nRETURNS TABLE (\n  api_key text,\n  api_key_id bigint,\n  team_id uuid,\n  org_id uuid,\n\
      \  flags jsonb,\n  is_banned boolean\n)\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\n\
      AS $$function$$\n  SELECT\n    k.key::text,\n    k.id,\n    t.id,\n    t.org_id,\n    public.selfhost_unlimited_rate_limit_flags(),\n\
      \    COALESCE(t.banned, false)\n  FROM public.api_keys k\n  JOIN public.teams t ON t.id = k.team_id\n  WHERE k.key::text\
      \ = input_key\n  LIMIT 1\n$$function$$;\n\nCREATE OR REPLACE FUNCTION public.auth_chunk_1_from_team(input_team text)\n\
      RETURNS TABLE (\n  api_key text,\n  api_key_id bigint,\n  team_id uuid,\n  org_id uuid,\n  flags jsonb,\n  is_banned\
      \ boolean\n)\nLANGUAGE sql\nSTABLE\nSECURITY DEFINER\nSET search_path = public, pg_temp\nAS $$function$$\n  SELECT\n\
      \    k.key::text,\n    k.id,\n    t.id,\n    t.org_id,\n    public.selfhost_unlimited_rate_limit_flags(),\n    COALESCE(t.banned,\
      \ false)\n  FROM public.teams t\n  LEFT JOIN LATERAL (\n    SELECT ak.id, ak.key\n    FROM public.api_keys ak\n    WHERE\
      \ ak.team_id = t.id\n    ORDER BY ak.id\n    LIMIT 1\n  ) k ON true\n  WHERE t.id = input_team::uuid\n  LIMIT 1\n$$function$$;\n\
      \nCREATE OR REPLACE FUNCTION public.bill_team_7(\n  _team_id uuid,\n  sub_id text,\n  credits numeric,\n  i_api_key_id\
      \ bigint,\n  is_extract_param boolean\n)\nRETURNS TABLE (api_key text)\nLANGUAGE sql\nVOLATILE\nSECURITY DEFINER\nSET\
      \ search_path = public, pg_temp\nAS $$function$$\n  SELECT k.key::text\n  FROM public.api_keys k\n  WHERE k.team_id\
      \ = _team_id\n    AND (i_api_key_id IS NULL OR k.id = i_api_key_id)\n  ORDER BY k.id\n  LIMIT 1\n$$function$$;\n\nCREATE\
      \ OR REPLACE FUNCTION public.credits_billed_by_crawl_id_2(i_crawl_id uuid)\nRETURNS TABLE (credits_billed bigint)\n\
      LANGUAGE sql\nSTABLE\nSET search_path = public, pg_temp\nAS $$function$$\n  SELECT COALESCE((\n    SELECT c.credits_cost::bigint\n\
      \    FROM public.crawls c\n    WHERE c.id = i_crawl_id\n    LIMIT 1\n  ), 0::bigint)\n$$function$$;\n\nCREATE OR REPLACE\
      \ FUNCTION public.change_tracking_insert_scrape(\n  p_team_id uuid,\n  p_url text,\n  p_job_id text,\n  p_change_tracking_tag\
      \ text,\n  p_date_added timestamptz\n)\nRETURNS bigint\nLANGUAGE plpgsql\nVOLATILE\nSET search_path = public, pg_temp\n\
      AS $$function$$\nDECLARE\n  inserted_id bigint;\nBEGIN\n  INSERT INTO public.firecrawl_change_tracking_scrapes (\n \
      \   team_id, url, job_id, change_tracking_tag, date_added\n  ) VALUES (\n    p_team_id, p_url, p_job_id, p_change_tracking_tag,\
      \ p_date_added\n  )\n  RETURNING id INTO inserted_id;\n  RETURN inserted_id;\nEND\n$$function$$;\n\nCREATE OR REPLACE\
      \ FUNCTION public.diff_get_last_scrape_v7(\n  i_team_id uuid,\n  i_url text,\n  i_tag text\n)\nRETURNS TABLE (o_job_id\
      \ text, o_date_added timestamptz)\nLANGUAGE sql\nSTABLE\nSET search_path = public, pg_temp\nAS $$function$$\n  SELECT\
      \ ct.job_id, ct.date_added\n  FROM public.firecrawl_change_tracking_scrapes ct\n  WHERE ct.team_id = i_team_id\n   \
      \ AND ct.url = i_url\n    AND ct.change_tracking_tag IS NOT DISTINCT FROM i_tag\n  ORDER BY ct.date_added DESC\n  LIMIT\
      \ 1\n$$function$$;\n\nCREATE OR REPLACE FUNCTION public.get_zdr_cleanup_batch_2(p_limit integer)\nRETURNS TABLE (request_id\
      \ uuid, ids uuid[])\nLANGUAGE sql\nSTABLE\nSET search_path = public, pg_temp\nAS $$function$$\n  SELECT NULL::uuid,\
      \ ARRAY[]::uuid[]\n  WHERE false\n$$function$$;\n\nCREATE OR REPLACE FUNCTION public.monitoring_claim_due_monitors(\n\
      \  p_worker_id text,\n  p_limit integer,\n  p_lease_seconds integer\n)\nRETURNS SETOF public.monitors\nLANGUAGE plpgsql\n\
      VOLATILE\nSET search_path = public, pg_temp\nAS $$function$$\nBEGIN\n  RETURN QUERY\n  WITH due AS (\n    SELECT m.id\n\
      \    FROM public.monitors m\n    WHERE m.status = 'active'\n      AND m.deleted_at IS NULL\n      AND m.next_run_at\
      \ IS NOT NULL\n      AND m.next_run_at <= now()\n      AND (m.locked_until IS NULL OR m.locked_until < now())\n    ORDER\
      \ BY m.next_run_at\n    FOR UPDATE SKIP LOCKED\n    LIMIT GREATEST(p_limit, 0)\n  )\n  UPDATE public.monitors m\n  SET\
      \ locked_at = now(),\n      locked_until = now() + make_interval(secs => GREATEST(p_lease_seconds, 1)),\n      updated_at\
      \ = now()\n  FROM due\n  WHERE m.id = due.id\n  RETURNING m.*;\nEND\n$$function$$;\n\nCREATE OR REPLACE FUNCTION public.get_agent_free_requests_left(i_team_id\
      \ uuid)\nRETURNS TABLE (free_requests_left integer)\nLANGUAGE sql\nSTABLE\nAS $$function$$\n  SELECT 2147483647\n$$function$$;\n\
      \nCREATE OR REPLACE FUNCTION public.agent_consume_free_request_if_left(i_team_id uuid)\nRETURNS TABLE (consumed boolean)\n\
      LANGUAGE sql\nVOLATILE\nAS $$function$$\n  SELECT true\n$$function$$;\n"
  db-seed:
    content: "\\set ON_ERROR_STOP on\n\nINSERT INTO public.organizations (id, name)\nVALUES (:'org_id'::uuid, 'Self-hosted')\n\
      ON CONFLICT (id) DO UPDATE SET updated_at = now();\n\nINSERT INTO public.teams (id, name, org_id, banned)\nVALUES (:'team_id'::uuid,\
      \ 'Self-hosted', :'org_id'::uuid, false)\nON CONFLICT (id) DO UPDATE\nSET org_id = EXCLUDED.org_id,\n    banned = false,\n\
      \    updated_at = now();\n\nINSERT INTO public.api_keys (key, name, team_id)\nVALUES (regexp_replace(:'api_key', '^fc-',\
      \ '')::uuid, 'Dokploy production', :'team_id'::uuid)\nON CONFLICT (key) DO UPDATE\nSET team_id = EXCLUDED.team_id,\n\
      \    name = EXCLUDED.name;\n\n-- Workers require one global row even when the self-host blocklist is empty.\nINSERT\
      \ INTO public.blocklist (data, org_id)\nSELECT '{\"blocklist\":[],\"allowedKeywords\":[]}'::jsonb, NULL\nWHERE NOT EXISTS\
      \ (\n  SELECT 1 FROM public.blocklist WHERE org_id IS NULL\n);\n"
