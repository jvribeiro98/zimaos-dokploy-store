      \ timestamp with time zone DEFAULT now() NOT NULL,\n  \"updated_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"last_used_at\" timestamp with time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"eb-sync\"\
      \ (\n  \"id\" bigint GENERATED BY DEFAULT AS IDENTITY (sequence name \"eb-sync_id_seq\" INCREMENT BY 1 MINVALUE 1 MAXVALUE\
      \ 9223372036854775807 START WITH 1 CACHE 1),\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"\
      team_id\" text\n);\n--> statement-breakpoint\nCREATE TABLE \"extracts\" (\n  \"id\" uuid NOT NULL,\n  \"request_id\"\
      \ uuid NOT NULL,\n  \"urls\" text[] NOT NULL,\n  \"options\" jsonb,\n  \"model_kind\" text NOT NULL,\n  \"team_id\"\
      \ uuid NOT NULL,\n  \"is_successful\" boolean NOT NULL,\n  \"error\" text,\n  \"created_at\" timestamp with time zone\
      \ DEFAULT now() NOT NULL,\n  \"credits_cost\" integer NOT NULL,\n  \"cost_tracking\" jsonb\n);\n--> statement-breakpoint\n\
      CREATE TABLE \"idempotency_keys\" (\n  \"key\" uuid DEFAULT gen_random_uuid() NOT NULL,\n  \"created_at\" timestamp\
      \ with time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"ip_restriction_config\" (\n  \"\
      id\" uuid DEFAULT gen_random_uuid() NOT NULL,\n  \"team_id\" uuid NOT NULL UNIQUE,\n  \"allowed_ips\" jsonb DEFAULT\
      \ '[]' NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"updated_at\" timestamp with\
      \ time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"key_restriction_config\" (\n  \"id\"\
      \ uuid DEFAULT gen_random_uuid() NOT NULL,\n  \"api_key_id\" bigint NOT NULL UNIQUE,\n  \"team_id\" uuid NOT NULL,\n\
      \  \"allowed_formats\" jsonb DEFAULT '[]' NOT NULL,\n  \"allowed_endpoints\" jsonb DEFAULT '[]' NOT NULL,\n  \"created_at\"\
      \ timestamp with time zone DEFAULT now() NOT NULL,\n  \"updated_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  CONSTRAINT \"allowed_formats_is_string_array\" CHECK (jsonb_typeof(\"allowed_formats\") = 'array' AND NOT jsonb_path_exists(\"\
      allowed_formats\", '$$[*] ? (@.type() != \"string\")')),\n  CONSTRAINT \"allowed_endpoints_is_string_array\" CHECK (jsonb_typeof(\"\
      allowed_endpoints\") = 'array' AND NOT jsonb_path_exists(\"allowed_endpoints\", '$$[*] ? (@.type() != \"string\")'))\n\
      );\n--> statement-breakpoint\nCREATE TABLE \"keyless_credit_usage\" (\n  \"id\" bigint GENERATED BY DEFAULT AS IDENTITY\
      \ (sequence name \"keyless_credit_usage_id_seq\" INCREMENT BY 1 MINVALUE 1 MAXVALUE 9223372036854775807 START WITH 1\
      \ CACHE 1),\n  \"team_id\" uuid NOT NULL,\n  \"ip\" text NOT NULL,\n  \"credits_used\" integer NOT NULL,\n  \"created_at\"\
      \ timestamp with time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"llm_texts\" (\n  \"\
      id\" uuid DEFAULT gen_random_uuid() NOT NULL,\n  \"origin_url\" text NOT NULL,\n  \"llmstxt\" text NOT NULL,\n  \"llmstxt_full\"\
      \ text NOT NULL,\n  \"max_urls\" integer NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"updated_at\" timestamp with time zone\n);\n--> statement-breakpoint\nCREATE TABLE \"llmstxts\" (\n  \"id\" uuid\
      \ NOT NULL,\n  \"request_id\" uuid NOT NULL,\n  \"url\" text NOT NULL,\n  \"team_id\" uuid NOT NULL,\n  \"created_at\"\
      \ timestamp with time zone DEFAULT now() NOT NULL,\n  \"num_urls\" integer NOT NULL,\n  \"options\" jsonb,\n  \"cost_tracking\"\
      \ jsonb,\n  \"credits_cost\" integer NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"maps\" (\n  \"id\" uuid\
      \ NOT NULL,\n  \"request_id\" uuid NOT NULL,\n  \"url\" text NOT NULL,\n  \"options\" jsonb,\n  \"team_id\" uuid NOT\
      \ NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"num_results\" integer NOT NULL,\n  \"\
      credits_cost\" integer NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"mcp_action_logs\" (\n  \"id\" uuid PRIMARY\
      \ KEY DEFAULT gen_random_uuid(),\n  \"team_id\" uuid NOT NULL,\n  \"user_id\" uuid,\n  \"api_key_id\" bigint,\n  \"\
      oauth_client_id\" text,\n  \"auth_type\" text NOT NULL,\n  \"tool_name\" text NOT NULL,\n  \"status\" text NOT NULL,\n\
      \  \"request_id\" uuid NOT NULL,\n  \"client_name\" text,\n  \"client_version\" text,\n  \"error_class\" text,\n  \"\
      resource\" text NOT NULL,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n  \"expires_at\" timestamp\
      \ with time zone NOT NULL,\n  CONSTRAINT \"mcp_action_logs_team_request_unique\" UNIQUE(\"team_id\",\"request_id\")\n\
      );\n--> statement-breakpoint\nCREATE TABLE \"monitor_check_pages\" (\n  \"id\" uuid NOT NULL,\n  \"check_id\" uuid NOT\
      \ NULL,\n  \"monitor_id\" uuid NOT NULL,\n  \"team_id\" uuid NOT NULL,\n  \"target_id\" text NOT NULL,\n  \"url\" text\
      \ NOT NULL,\n  \"url_hash\" bytea NOT NULL,\n  \"status\" text NOT NULL,\n  \"previous_scrape_id\" uuid,\n  \"current_scrape_id\"\
      \ uuid,\n  \"diff_gcs_key\" text,\n  \"diff_text_bytes\" integer,\n  \"diff_json_bytes\" integer,\n  \"status_code\"\
      \ integer,\n  \"error\" text,\n  \"metadata\" jsonb,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"judgment\" jsonb\n);\n--> statement-breakpoint\nCREATE TABLE \"monitor_checks\" (\n  \"id\" uuid NOT NULL,\n  \"\
      monitor_id\" uuid NOT NULL,\n  \"team_id\" uuid NOT NULL,\n  \"trigger\" text NOT NULL,\n  \"status\" text DEFAULT 'queued'\
      \ NOT NULL,\n  \"scheduled_for\" timestamp with time zone,\n  \"started_at\" timestamp with time zone,\n  \"finished_at\"\
      \ timestamp with time zone,\n  \"estimated_credits\" integer,\n  \"reserved_credits\" integer,\n  \"actual_credits\"\
      \ integer,\n  \"autumn_lock_id\" text,\n  \"billing_status\" text DEFAULT 'not_applicable' NOT NULL,\n  \"total_pages\"\
      \ integer DEFAULT 0 NOT NULL,\n  \"same_count\" integer DEFAULT 0 NOT NULL,\n  \"changed_count\" integer DEFAULT 0 NOT\
      \ NULL,\n  \"new_count\" integer DEFAULT 0 NOT NULL,\n  \"removed_count\" integer DEFAULT 0 NOT NULL,\n  \"error_count\"\
      \ integer DEFAULT 0 NOT NULL,\n  \"target_results\" jsonb,\n  \"webhook_payload\" jsonb,\n  \"email_payload\" jsonb,\n\
      \  \"notification_status\" jsonb,\n  \"error\" text,\n  \"created_at\" timestamp with time zone DEFAULT now() NOT NULL,\n\
      \  \"updated_at\" timestamp with time zone DEFAULT now() NOT NULL\n);\n--> statement-breakpoint\nCREATE TABLE \"monitor_email_recipients\"\
      \ (\n  \"id\" uuid DEFAULT gen_random_uuid() NOT NULL,\n  \"monitor_id\" uuid NOT NULL,\n  \"team_id\" uuid NOT NULL,\n\
      \  \"email\" text NOT NULL,\n  \"status\" text DEFAULT 'pending' NOT NULL,\n  \"token\" text NOT NULL,\n  \"source\"\
      \ text DEFAULT 'opt_in' NOT NULL,\n  \"confirmation_sent_at\" timestamp with time zone,\n  \"confirmed_at\" timestamp\
