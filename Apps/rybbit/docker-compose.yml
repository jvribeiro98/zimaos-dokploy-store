name: rybbit
services:
  rybbit_clickhouse:
    image: clickhouse/clickhouse-server:25.5
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - /DATA/AppData/$AppID/clickhouse_config:/etc/clickhouse-server/config.d
    environment:
    - CLICKHOUSE_DB=analytics
    - CLICKHOUSE_USER=default
    - CLICKHOUSE_PASSWORD=LrKBmkw37qJ0OJR9xxjywu8XMpZTIKFX
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8123/ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  rybbit_postgres:
    image: postgres:17.5
    environment:
    - POSTGRES_DB=analytics
    - POSTGRES_USER=frog
    - POSTGRES_PASSWORD=nqVy4vpoTuvpFTQLVVysJX3ENtAZjjJP
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  rybbit_redis:
    image: redis:7-alpine
    volumes:
    - redis_data:/data
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    - --maxmemory-policy
    - noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - --no-auth-warning
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
  rybbit_backend:
    image: ghcr.io/rybbit-io/rybbit-backend:v2.7.0
    environment:
    - NODE_ENV=production
    - CLICKHOUSE_HOST=http://rybbit_clickhouse:8123
    - CLICKHOUSE_DB=analytics
    - CLICKHOUSE_USER=default
    - CLICKHOUSE_PASSWORD=LrKBmkw37qJ0OJR9xxjywu8XMpZTIKFX
    - POSTGRES_HOST=rybbit_postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=analytics
    - POSTGRES_USER=frog
    - POSTGRES_PASSWORD=nqVy4vpoTuvpFTQLVVysJX3ENtAZjjJP
    - REDIS_HOST=rybbit_redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=gJOxqhBPfKp1ws9MD8GM6ogEMhv0Yinq
    - BETTER_AUTH_SECRET=hZnrZQ9TZPAk37rTjWyBSqDa2gBkzoxfg9oY/3Lz4UM=
    - BASE_URL=http://localhost
    - DISABLE_SIGNUP=false
    - DISABLE_TELEMETRY=false
    depends_on:
      rybbit_clickhouse:
        condition: service_healthy
      rybbit_postgres:
        condition: service_started
      rybbit_redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3001/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
    - target: 3001
      published: "3001"
      protocol: tcp
  rybbit_client:
    image: ghcr.io/rybbit-io/rybbit-client:v2.7.0
    environment:
    - NODE_ENV=production
    - NEXT_PUBLIC_BACKEND_URL=http://localhost
    - NEXT_PUBLIC_DISABLE_SIGNUP=false
    depends_on:
    - rybbit_backend
    restart: unless-stopped
volumes:
  clickhouse_data: null
  postgres_data: null
  redis_data: null
x-casaos:
  id: com.dokploy.rybbit
  main: rybbit_backend
  index: /api
  port_map: "3001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/rybbit/icon.png
  title:
    en_US: Rybbit
  tagline:
    en_US: Open-source and privacy-friendly alternative to Google Analytics that is 10x more intui...
  description:
    en_US: Open-source and privacy-friendly alternative to Google Analytics that is 10x more intuitive
  author: Dokploy Community
  developer: Rybbit
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2.7.0"
  update_at: "2026-11-25"
  website: https://rybbit.io
  repo: https://github.com/rybbit-io/rybbit
  docs: https://www.rybbit.io/docs
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./clickhouse_config/enable_json.xml,
        ./clickhouse_config/logging_rules.xml, ./clickhouse_config/network.xml, ./clickhouse_config/user_logging.xml). Review
        environment variables before starting.
