name: libretranslate
services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    expose:
    - '5000'
    environment:
    - LT_API_KEYS=true
    - LT_API_KEYS_DB_PATH=/app/db/api_keys.db
    volumes:
    - libretranslate_models:/home/libretranslate/.local
    - libretranslate_api_keys:/app/db
    ports:
    - target: 5000
      published: "5000"
      protocol: tcp
volumes:
  libretranslate_models: null
  libretranslate_api_keys: null
x-casaos:
  id: com.dokploy.libretranslate
  main: libretranslate
  index: /
  port_map: "5000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/libretranslate/icon.svg
  title:
    en_US: LibreTranslate
  tagline:
    en_US: LibreTranslate is a free and open-source machine translation API, powered by Argos Tran...
  description:
    en_US: LibreTranslate is a free and open-source machine translation API, powered by Argos Translate. Self-hosted, no external
      dependencies, and supports multiple languages.
  author: Dokploy Community
  developer: LibreTranslate
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.7.3"
  update_at: "2026-11-24"
  website: https://libretranslate.com/
  repo: https://github.com/LibreTranslate/LibreTranslate
  docs: https://docs.libretranslate.com/
