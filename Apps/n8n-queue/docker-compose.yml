name: n8n-queue
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_USER=admin
    - POSTGRES_PASSWORD=U7JStGiKahaIqOSHIxaZN1xr
    - POSTGRES_DB=n8n
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
    - REDIS_PASSWORD=UxvGEl1o6yLEcbvdZWXCLUXi
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
  n8n:
    image: n8nio/n8n:2.30.4
    restart: unless-stopped
    environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_USER=admin
    - DB_POSTGRESDB_PASSWORD=U7JStGiKahaIqOSHIxaZN1xr
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_BULL_REDIS_PASSWORD=UxvGEl1o6yLEcbvdZWXCLUXi
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
    - N8N_ENCRYPTION_KEY=IIgrtFsW9ug6spn/0A1ITTUt0GO8Ua18Oh/AWZdHquc=
    - N8N_HOST=localhost
    - N8N_PORT=5678
    - N8N_PROTOCOL=http
    - N8N_PROXY_HOPS=1
    - NODE_ENV=production
    - N8N_WEBHOOK_URL=https://localhost/
    - N8N_EDITOR_BASE_URL=https://localhost/
    - GENERIC_TIMEZONE=Europe/Berlin
    - N8N_SECURE_COOKIE=false
    volumes:
    - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:5678/healthz
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
    - target: 5678
      published: "5678"
      protocol: tcp
  n8n-worker:
    image: n8nio/n8n:2.30.4
    restart: unless-stopped
    command: worker
    deploy:
      replicas: ${N8N_WORKER_REPLICAS:-2}
    environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=n8n
    - DB_POSTGRESDB_USER=admin
    - DB_POSTGRESDB_PASSWORD=U7JStGiKahaIqOSHIxaZN1xr
    - EXECUTIONS_MODE=queue
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_BULL_REDIS_PORT=6379
    - QUEUE_BULL_REDIS_PASSWORD=UxvGEl1o6yLEcbvdZWXCLUXi
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - N8N_ENCRYPTION_KEY=IIgrtFsW9ug6spn/0A1ITTUt0GO8Ua18Oh/AWZdHquc=
    - NODE_ENV=production
    - GENERIC_TIMEZONE=Europe/Berlin
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:5678/healthz
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: null
  redis_data: null
  n8n_data: null
x-casaos:
  id: com.dokploy.n8n-queue
  main: n8n
  index: /
  port_map: "5678"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/n8n-queue/icon.png
  title:
    en_US: n8n Queue Mode
  tagline:
    en_US: 'n8n running in queue mode for high-throughput production workloads: the main instance h...'
  description:
    en_US: 'n8n running in queue mode for high-throughput production workloads: the main instance handles the editor and webhooks
      while a scalable pool of workers executes workflows from a Redis (Bull) queue, backed by PostgreSQL.'
  author: Dokploy Community
  developer: n8n Queue Mode
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2.30.4"
  update_at: "2026-11-22"
  website: https://n8n.io/
  repo: https://github.com/n8n-io/n8n
  docs: https://docs.n8n.io/hosting/scaling/queue-mode/
