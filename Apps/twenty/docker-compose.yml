name: twenty
services:
  twenty-change-vol-ownership:
    image: ubuntu
    user: root
    volumes:
    - twenty-server-local-data:/tmp/server-local-data
    - twenty-docker-data:/tmp/docker-data
    command: 'bash -c " chown -R 1000:1000 /tmp/server-local-data && chown -R 1000:1000 /tmp/docker-data"

      '
    restart: unless-stopped
  twenty-server:
    image: twentycrm/twenty:latest
    volumes:
    - twenty-server-local-data:/app/packages/twenty-server//DATA/AppData/twenty/data.local-storage
    - twenty-docker-data:/app/docker-data
    environment:
      PORT: '3000'
      SERVER_URL: http://localhost
      FRONT_BASE_URL: http://localhost
      PG_DATABASE_URL: postgres://twenty:fYLebbTEXv7ev7HqJpGoeIAq0ljv7Wcf@twenty-postgres:5432/twenty
      ENABLE_DB_MIGRATIONS: 'true'
      REDIS_URL: redis://twenty-redis:6379
      IS_SIGN_UP_DISABLED: 'false'
      SIGN_IN_PREFILLED: 'false'
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: 'true'
      STORAGE_TYPE: local
      APP_SECRET: HzzN/OkJYhSkzy8U0qakKHxNXjqfI1lhr3rA7mLEKyc=
    depends_on:
      twenty-change-vol-ownership:
        condition: service_completed_successfully
      twenty-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: always
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  twenty-worker:
    image: twentycrm/twenty:latest
    command:
    - yarn
    - worker:prod
    environment:
      PG_DATABASE_URL: postgres://twenty:fYLebbTEXv7ev7HqJpGoeIAq0ljv7Wcf@twenty-postgres:5432/twenty
      SERVER_URL: http://localhost
      FRONT_BASE_URL: http://localhost
      REDIS_URL: redis://twenty-redis:6379
      ENABLE_DB_MIGRATIONS: 'false'
      STORAGE_TYPE: local
      APP_SECRET: HzzN/OkJYhSkzy8U0qakKHxNXjqfI1lhr3rA7mLEKyc=
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    restart: always
  twenty-postgres:
    image: postgres:17-alpine
    volumes:
    - twenty-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: fYLebbTEXv7ev7HqJpGoeIAq0ljv7Wcf
      POSTGRES_DB: twenty
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER} -d twenty
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
  twenty-redis:
    image: redis:latest
    volumes:
    - twenty-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
volumes:
  twenty-docker-data: null
  twenty-postgres-data: null
  twenty-server-local-data: null
  twenty-redis-data: null
x-casaos:
  id: com.dokploy.twenty
  main: twenty-server
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/twenty/icon.svg
  title:
    en_US: Twenty CRM
  tagline:
    en_US: Twenty is a modern CRM and an open-source alternative to Salesforce
  description:
    en_US: Twenty is a modern CRM and an open-source alternative to Salesforce. Self-host it on your own server with Dokploy,
      which deploys Twenty as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Twenty CRM
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://twenty.com
  repo: https://github.com/twentyhq/twenty
  docs: https://docs.twenty.com
