name: node-red
services:
  node-red:
    image: nodered/node-red:5.0.10
    restart: unless-stopped
    expose:
    - 1880
    environment:
    - TZ=UTC
    volumes:
    - node_red_data:/data
    ports:
    - target: 1880
      published: "1880"
      protocol: tcp
volumes:
  node_red_data: {}
x-casaos:
  id: com.dokploy.node-red
  main: node-red
  index: /
  port_map: "1880"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/node-red/icon.svg
  title:
    en_US: Node-RED
  tagline:
    en_US: Node-RED is a flow-based programming tool for wiring together hardware devices, APIs an...
  description:
    en_US: Node-RED is a flow-based programming tool for wiring together hardware devices, APIs and online services — drag
      nodes onto a canvas, connect them, and deploy automations for your smart home, MQTT devices and webhooks.
  author: Dokploy Community
  developer: Node-RED
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "5.0.10"
  update_at: "2026-11-28"
  website: https://nodered.org
  repo: https://github.com/node-red/node-red
  docs: https://nodered.org/docs/
