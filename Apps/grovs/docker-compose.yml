name: grovs
services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grovs
      POSTGRES_PASSWORD: FrwuJNf8dAtodnJWo2yYtWuK2wliQwks
      POSTGRES_DB: grovs_production
    command:
    - postgres
    - -c
    - max_connections=200
    volumes:
    - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory-policy
    - noeviction
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: grovs_production
      CLICKHOUSE_USER: grovs
      CLICKHOUSE_PASSWORD: 5ifmV8em9ln5MRm51eYiMVTw5zwYOc7m
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      interval: 10s
      timeout: 5s
      retries: 30
