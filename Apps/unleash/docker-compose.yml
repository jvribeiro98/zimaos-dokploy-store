name: unleash
services:
  unleash:
    image: unleashorg/unleash-server:7.4.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://unleash:NI9g59RqFGaxywD4hlVdBe8tNpSGlApz@db/unleash
      DATABASE_SSL: 'false'
      LOG_LEVEL: warn
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 1s
      timeout: 1m
      retries: 5
      start_period: 15s
    ports:
    - target: 4242
      published: "4242"
      protocol: tcp
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: NI9g59RqFGaxywD4hlVdBe8tNpSGlApz
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - --username=${DB_USER}
      - --host=127.0.0.1
      - --port=5432
      interval: 2s
      timeout: 1m
      retries: 5
      start_period: 10s
volumes:
  db_data: null
x-casaos:
  id: com.dokploy.unleash
  main: unleash
  index: /
  port_map: "4242"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/unleash/icon.png
  title:
    en_US: Unleash
  tagline:
    en_US: Open-source feature management platform
  description:
    en_US: Open-source feature management platform
  author: Dokploy Community
  developer: Unleash
  category: Others
  architectures:
  - amd64
  - arm64
  version: "7.4.0"
  update_at: "2026-11-26"
  website: https://www.getunleash.io/
  repo: https://github.com/unleash/unleash
  docs: https://docs.getunleash.io/
