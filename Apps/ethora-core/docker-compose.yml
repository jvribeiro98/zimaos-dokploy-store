  main: api
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/ethora-core/icon.svg
  title:
    en_US: Ethora Core
  tagline:
    en_US: 'Self-hosted chat and messaging server: API, web chat and admin panel, XMPP server (ejab...'
  description:
    en_US: 'Self-hosted chat and messaging server: API, web chat and admin panel, XMPP server (ejabberd) and file storage,
      with SDKs for web, iOS, Android and React Native.'
  author: Dokploy Community
