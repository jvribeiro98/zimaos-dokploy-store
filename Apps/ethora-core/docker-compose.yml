        scripts/init.sh, scripts/verify.js, scripts/render-config.sh, scripts/mongo-init.sh, scripts/xmpp-start.sh, scripts/frontend-start.sh,
        templates/backend.env.template, templates/frontend.env.template, templates/centrifugo-config.json.template). Review
