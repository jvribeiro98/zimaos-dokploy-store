name: affinepro
services:
  affinepro:
    image: ghcr.io/toeverything/affine:stable
    restart: unless-stopped
    expose:
    - 3010
    volumes:
    - affine-storage:/root/.affine/storage
    - affine-config:/root/.affine/config
    environment:
    - REDIS_SERVER_HOST=redis
    - REDIS_SERVER_PASSWORD=udNUwvzSBpruKCog
    - DATABASE_URL=postgresql://postgres:ONyjsos1o8P6LCgC@db:5432/affinepro
    - AFFINE_INDEXER_ENABLED=false
    - AFFINE_SERVER_HOST=localhost
    - MAILER_HOST=
    - MAILER_PORT=587
    - MAILER_USER=
    - MAILER_PASSWORD=
    - MAILER_SENDER=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
    - target: 3010
      published: "3010"
      protocol: tcp
  migration:
    image: ghcr.io/toeverything/affine:stable
    command:
    - sh
    - -c
    - node ./scripts/self-host-predeploy.js
    environment:
    - REDIS_SERVER_HOST=redis
    - REDIS_SERVER_PASSWORD=udNUwvzSBpruKCog
    - DATABASE_URL=postgresql://postgres:ONyjsos1o8P6LCgC@db:5432/affinepro
    - AFFINE_INDEXER_ENABLED=false
    - AFFINE_SERVER_HOST=localhost
    - MAILER_HOST=
    - MAILER_PORT=587
    - MAILER_USER=
    - MAILER_PASSWORD=
    - MAILER_SENDER=
    volumes:
    - affine-storage:/root/.affine/storage
    - affine-config:/root/.affine/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
    - POSTGRES_PASSWORD=ONyjsos1o8P6LCgC
    - POSTGRES_DB=affinepro
    - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -d
      - affinepro
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a '${REDIS_PASSWORD}' ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  affine-storage: {}
  affine-config: {}
  postgres-data: {}
  redis-data: {}
x-casaos:
  id: com.dokploy.affinepro
  main: affinepro
  index: /
  port_map: "3010"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/affinepro/icon.png
  title:
    en_US: Affine Pro
  tagline:
    en_US: AFFiNE is a workspace for notes, docs, and whiteboards, and an alternative to Notion
  description:
    en_US: AFFiNE is a workspace for notes, docs, and whiteboards, and an alternative to Notion. Self-host it on your own
      server with Dokploy, which deploys AFFiNE as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Affine Pro
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "stable"
  update_at: "2026-11-22"
  website: https://affine.pro/
  repo: https://github.com/toeverything/Affine
  docs: https://docs.affine.pro/
