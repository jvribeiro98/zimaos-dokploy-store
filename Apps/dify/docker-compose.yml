name: dify
services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    volumes:
    - /DATA/AppData/$AppID/dify-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      plugin_daemon:
        condition: service_started
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  init_permissions:
    image: busybox:1.36
    command:
    - sh
    - -c
    - "FLAG_FILE=\"/app/api/storage/.init_permissions\"\nif [ -f \"$$FLAG_FILE\" ]; then\n  echo \"Permissions already initialized.\"\
      \n  exit 0\nfi\necho \"Initializing permissions for /app/api/storage\"\nchown -R 1001:1001 /app/api/storage && touch\
      \ \"$$FLAG_FILE\"\n"
    volumes:
    - dify-app-storage:/app/api/storage
    restart: 'no'
  api:
    image: langgenius/dify-api:1.15.0
    restart: always
    environment:
      LOG_LEVEL: INFO
      DEPLOY_ENV: PRODUCTION
      SECRET_KEY: nxGy0xVlbhoGGIAa8Mj4eLlPzUnQbhUH68O6kS+Izny7v8/SQoGldY2f
      MIGRATION_ENABLED: 'true'
      CONSOLE_API_URL: https://localhost
      CONSOLE_WEB_URL: https://localhost
      SERVICE_API_URL: https://localhost
      APP_API_URL: https://localhost
      APP_WEB_URL: https://localhost
      FILES_URL: https://localhost
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: https://localhost
      ENDPOINT_URL_TEMPLATE: https://localhost/e/{hook_id}
      ENABLE_COLLABORATION_MODE: 'false'
      WEB_API_CORS_ALLOW_ORIGINS: '*'
      CONSOLE_CORS_ALLOW_ORIGINS: '*'
      DB_USERNAME: postgres
      DB_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: amMSjF3WgNeEihMeRccEa1YeMFAFDy3b
      REDIS_DB: '0'
      CELERY_BROKER_URL: redis://:amMSjF3WgNeEihMeRccEa1YeMFAFDy3b@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: '5432'
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      PGVECTOR_DATABASE: dify
      PGVECTOR_MIN_CONNECTION: '1'
      PGVECTOR_MAX_CONNECTION: '5'
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: m8C6RzXU1I57UddQJ8MkDlLfbAYY7TZ9
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: J3jZWNHv34VBroB9Z9Bi+79OaqupPN6nsl5br9YoFOxCcrWVRYL+27mn
      INNER_API_KEY_FOR_PLUGIN: /ml5A++PL+QmBsFH/dhQ0HJ+SyyOXW3/rQdfNN9geOy+3n4t3MrFGdAq
      PLUGIN_MAX_PACKAGE_SIZE: '52428800'
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: '5003'
      MARKETPLACE_ENABLED: 'true'
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MODE: api
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - dify-app-storage:/app/api/storage
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
  worker:
    image: langgenius/dify-api:1.15.0
    restart: always
    environment:
      LOG_LEVEL: INFO
      DEPLOY_ENV: PRODUCTION
      SECRET_KEY: nxGy0xVlbhoGGIAa8Mj4eLlPzUnQbhUH68O6kS+Izny7v8/SQoGldY2f
      MIGRATION_ENABLED: 'true'
      CONSOLE_API_URL: https://localhost
      CONSOLE_WEB_URL: https://localhost
      SERVICE_API_URL: https://localhost
      APP_API_URL: https://localhost
      APP_WEB_URL: https://localhost
      FILES_URL: https://localhost
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: https://localhost
      ENDPOINT_URL_TEMPLATE: https://localhost/e/{hook_id}
      ENABLE_COLLABORATION_MODE: 'false'
      WEB_API_CORS_ALLOW_ORIGINS: '*'
      CONSOLE_CORS_ALLOW_ORIGINS: '*'
      DB_USERNAME: postgres
      DB_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: amMSjF3WgNeEihMeRccEa1YeMFAFDy3b
      REDIS_DB: '0'
      CELERY_BROKER_URL: redis://:amMSjF3WgNeEihMeRccEa1YeMFAFDy3b@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: '5432'
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      PGVECTOR_DATABASE: dify
      PGVECTOR_MIN_CONNECTION: '1'
      PGVECTOR_MAX_CONNECTION: '5'
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: m8C6RzXU1I57UddQJ8MkDlLfbAYY7TZ9
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: J3jZWNHv34VBroB9Z9Bi+79OaqupPN6nsl5br9YoFOxCcrWVRYL+27mn
      INNER_API_KEY_FOR_PLUGIN: /ml5A++PL+QmBsFH/dhQ0HJ+SyyOXW3/rQdfNN9geOy+3n4t3MrFGdAq
      PLUGIN_MAX_PACKAGE_SIZE: '52428800'
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: '5003'
      MARKETPLACE_ENABLED: 'true'
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MODE: worker
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - dify-app-storage:/app/api/storage
  worker_beat:
    image: langgenius/dify-api:1.15.0
    restart: always
    environment:
      LOG_LEVEL: INFO
      DEPLOY_ENV: PRODUCTION
      SECRET_KEY: nxGy0xVlbhoGGIAa8Mj4eLlPzUnQbhUH68O6kS+Izny7v8/SQoGldY2f
      MIGRATION_ENABLED: 'true'
      CONSOLE_API_URL: https://localhost
      CONSOLE_WEB_URL: https://localhost
      SERVICE_API_URL: https://localhost
      APP_API_URL: https://localhost
      APP_WEB_URL: https://localhost
      FILES_URL: https://localhost
      INTERNAL_FILES_URL: http://api:5001
      TRIGGER_URL: https://localhost
      ENDPOINT_URL_TEMPLATE: https://localhost/e/{hook_id}
      ENABLE_COLLABORATION_MODE: 'false'
      WEB_API_CORS_ALLOW_ORIGINS: '*'
      CONSOLE_CORS_ALLOW_ORIGINS: '*'
      DB_USERNAME: postgres
      DB_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: amMSjF3WgNeEihMeRccEa1YeMFAFDy3b
      REDIS_DB: '0'
      CELERY_BROKER_URL: redis://:amMSjF3WgNeEihMeRccEa1YeMFAFDy3b@redis:6379/1
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: pgvector
      PGVECTOR_HOST: db
      PGVECTOR_PORT: '5432'
      PGVECTOR_USER: postgres
      PGVECTOR_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      PGVECTOR_DATABASE: dify
      PGVECTOR_MIN_CONNECTION: '1'
      PGVECTOR_MAX_CONNECTION: '5'
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: m8C6RzXU1I57UddQJ8MkDlLfbAYY7TZ9
      SSRF_PROXY_HTTP_URL: http://ssrf_proxy:3128
      SSRF_PROXY_HTTPS_URL: http://ssrf_proxy:3128
      PLUGIN_DAEMON_URL: http://plugin_daemon:5002
      PLUGIN_DAEMON_KEY: J3jZWNHv34VBroB9Z9Bi+79OaqupPN6nsl5br9YoFOxCcrWVRYL+27mn
      INNER_API_KEY_FOR_PLUGIN: /ml5A++PL+QmBsFH/dhQ0HJ+SyyOXW3/rQdfNN9geOy+3n4t3MrFGdAq
      PLUGIN_MAX_PACKAGE_SIZE: '52428800'
      PLUGIN_REMOTE_INSTALL_HOST: localhost
      PLUGIN_REMOTE_INSTALL_PORT: '5003'
      MARKETPLACE_ENABLED: 'true'
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MODE: beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    image: langgenius/dify-web:1.15.0
    restart: always
    environment:
      CONSOLE_API_URL: https://localhost
      APP_API_URL: https://localhost
      SERVER_CONSOLE_API_URL: http://api:5001
      ENABLE_COLLABORATION_MODE: 'false'
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      NEXT_TELEMETRY_DISABLED: '1'
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      POSTGRES_DB: dify
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - dify-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dify
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:6-alpine
    restart: always
    environment:
      REDISCLI_AUTH: amMSjF3WgNeEihMeRccEa1YeMFAFDy3b
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - dify-redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 30
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    environment:
      API_KEY: m8C6RzXU1I57UddQJ8MkDlLfbAYY7TZ9
      GIN_MODE: release
      WORKER_TIMEOUT: '15'
      ENABLE_NETWORK: 'true'
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: '8194'
    volumes:
    - dify-sandbox-deps:/dependencies
  ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    volumes:
    - /DATA/AppData/$AppID/dify-squid.conf:/etc/squid/squid.conf:ro
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.3-local
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: QCx56UXfnqLTwIb3DesHpYl7wiB1DZdQ
      DB_DATABASE: dify_plugin
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: amMSjF3WgNeEihMeRccEa1YeMFAFDy3b
      SERVER_PORT: '5002'
      SERVER_KEY: J3jZWNHv34VBroB9Z9Bi+79OaqupPN6nsl5br9YoFOxCcrWVRYL+27mn
      MAX_PLUGIN_PACKAGE_SIZE: '52428800'
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: /ml5A++PL+QmBsFH/dhQ0HJ+SyyOXW3/rQdfNN9geOy+3n4t3MrFGdAq
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: '5003'
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: 'true'
      PYTHON_ENV_INIT_TIMEOUT: '120'
      PLUGIN_MAX_EXECUTION_TIMEOUT: '600'
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
    volumes:
    - dify-plugin-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
