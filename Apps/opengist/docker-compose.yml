name: opengist
services:
  opengist:
    image: ghcr.io/thomiceli/opengist:1
    restart: unless-stopped
    expose:
    - 6157
    - 2222
    volumes:
    - opengist-data:/opengist
    environment:
    - UID=1001
    - GID=1001
    - OG_LOG_LEVEL=info
    ports:
    - target: 6157
      published: "6157"
      protocol: tcp
volumes:
  opengist-data: {}
x-casaos:
  id: com.dokploy.opengist
  main: opengist
  index: /
  port_map: "6157"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/opengist/icon.svg
  title:
    en_US: OpenGist
  tagline:
    en_US: OpenGist is a self-hosted pastebin alternative
  description:
    en_US: OpenGist is a self-hosted pastebin alternative.
  author: Dokploy Community
  developer: OpenGist
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1"
  update_at: "2026-11-27"
  website: https://github.com/thomiceli/opengist
  repo: https://github.com/thomiceli/opengist
  docs: https://github.com/thomiceli/opengist
