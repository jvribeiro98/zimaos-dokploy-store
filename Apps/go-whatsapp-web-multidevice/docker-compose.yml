name: go-whatsapp-web-multidevice
services:
  whatsapp:
    image: aldinokemal2104/go-whatsapp-web-multidevice
    restart: always
    expose:
    - '3080'
    volumes:
    - whatsapp:/app/storages
    command:
    - rest
    - --basic-auth=${WA_USER}:${WA_PASSWORD}
    - --port=3080
    - --debug=true
    - --os=Chrome
    - --account-validation=false
    ports:
    - target: 3080
      published: "3080"
      protocol: tcp
volumes:
  whatsapp: null
x-casaos:
  id: com.dokploy.go-whatsapp-web-multidevice
  main: whatsapp
  index: /
  port_map: "3080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/go-whatsapp-web-multidevice/icon.svg
  title:
    en_US: WhatsApp API Multi Device Version
  tagline:
    en_US: WhatsApp API Multi Device Version the open-source, self-hosted whatsapp api
  description:
    en_US: WhatsApp API Multi Device Version the open-source, self-hosted whatsapp api. Send a chat, image and voice note
      with your own server.
  author: Dokploy Community
  developer: WhatsApp API Multi Device Version
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://github.com/aldinokemal/go-whatsapp-web-multidevice
  repo: https://github.com/aldinokemal/go-whatsapp-web-multidevice
  docs: https://github.com/aldinokemal/go-whatsapp-web-multidevice
