name: billmora
services:
  billmora-app:
    image: ghcr.io/billmora/billmora:latest
    restart: always
    environment:
    - APP_NAME=Billmora
    - APP_ENV=production
    - APP_KEY=base64:wA203UFEBBz7GsiyjDz6t4tirA0UU4uzcY6sPxnPHg0=
    - APP_URL=https://localhost
    - DB_CONNECTION=mariadb
    - DB_HOST=billmora-db
    - DB_PORT=3306
    - DB_DATABASE=billmora
    - DB_USERNAME=billmora
    - DB_PASSWORD=8G0aGtg3kCE10WxF
    - REDIS_HOST=billmora-redis
    - REDIS_PASSWORD=7mQREcwcMvPgUjvj
    - REDIS_PORT=6379
    - SESSION_DRIVER=redis
    - CACHE_STORE=redis
    - QUEUE_CONNECTION=redis
    - AUTORUN_ENABLED=true
    - AUTORUN_LARAVEL_MIGRATION=true
    - AUTORUN_LARAVEL_MIGRATION_FORCE=true
    - AUTORUN_LARAVEL_MIGRATION_SEED=true
    - AUTORUN_LARAVEL_STORAGE_LINK=true
    volumes:
    - billmora-storage:/var/www/html/storage
    - billmora-plugins:/var/www/html/plugin
    - billmora-themes-resources:/var/www/html/resources/themes
    - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      billmora-db:
        condition: service_healthy
      billmora-redis:
        condition: service_healthy
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  billmora-worker:
    image: ghcr.io/billmora/billmora:latest
    restart: always
    command:
    - php
    - artisan
    - queue:work
    - --sleep=3
    - --tries=3
    - --max-time=3600
    environment:
    - APP_NAME=Billmora
    - APP_ENV=production
    - APP_KEY=base64:wA203UFEBBz7GsiyjDz6t4tirA0UU4uzcY6sPxnPHg0=
    - APP_URL=https://localhost
    - DB_CONNECTION=mariadb
    - DB_HOST=billmora-db
    - DB_PORT=3306
    - DB_DATABASE=billmora
    - DB_USERNAME=billmora
    - DB_PASSWORD=8G0aGtg3kCE10WxF
    - REDIS_HOST=billmora-redis
    - REDIS_PASSWORD=7mQREcwcMvPgUjvj
    - REDIS_PORT=6379
    - SESSION_DRIVER=redis
    - CACHE_STORE=redis
    - QUEUE_CONNECTION=redis
    - AUTORUN_ENABLED=false
    volumes:
    - billmora-storage:/var/www/html/storage
    - billmora-plugins:/var/www/html/plugin
    - billmora-themes-resources:/var/www/html/resources/themes
    - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      billmora-db:
        condition: service_healthy
      billmora-redis:
        condition: service_healthy
  billmora-scheduler:
    image: ghcr.io/billmora/billmora:latest
    restart: always
    command:
    - /bin/sh
    - -c
    - while true; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done
    environment:
    - APP_NAME=Billmora
    - APP_ENV=production
    - APP_KEY=base64:wA203UFEBBz7GsiyjDz6t4tirA0UU4uzcY6sPxnPHg0=
    - APP_URL=https://localhost
    - DB_CONNECTION=mariadb
    - DB_HOST=billmora-db
    - DB_PORT=3306
    - DB_DATABASE=billmora
    - DB_USERNAME=billmora
    - DB_PASSWORD=8G0aGtg3kCE10WxF
    - REDIS_HOST=billmora-redis
    - REDIS_PASSWORD=7mQREcwcMvPgUjvj
    - REDIS_PORT=6379
    - SESSION_DRIVER=redis
    - CACHE_STORE=redis
    - QUEUE_CONNECTION=redis
    - AUTORUN_ENABLED=false
    volumes:
    - billmora-storage:/var/www/html/storage
    - billmora-plugins:/var/www/html/plugin
    - billmora-themes-resources:/var/www/html/resources/themes
    - billmora-themes-public:/var/www/html/public/themes
    depends_on:
      billmora-db:
        condition: service_healthy
      billmora-redis:
        condition: service_healthy
  billmora-db:
    image: mariadb:11
    restart: always
    environment:
    - MARIADB_DATABASE=billmora
    - MARIADB_USER=billmora
    - MARIADB_PASSWORD=8G0aGtg3kCE10WxF
    - MARIADB_ROOT_PASSWORD=PJMfuvVk4fhdWfrP
    volumes:
    - billmora-db-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  billmora-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - billmora-redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --no-auth-warning
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  billmora-storage: null
  billmora-plugins: null
  billmora-themes-resources: null
  billmora-themes-public: null
  billmora-db-data: null
  billmora-redis-data: null
x-casaos:
  id: com.dokploy.billmora
  main: billmora-app
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/billmora/icon.svg
  title:
    en_US: Billmora
  tagline:
    en_US: Billmora (Billing Management, Operation, and Recurring Automation) is a free, open-sour...
  description:
    en_US: Billmora (Billing Management, Operation, and Recurring Automation) is a free, open-source platform for hosting
      providers to manage clients, invoicing, and server provisioning.
  author: Dokploy Community
  developer: Billmora
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://billmora.com
  repo: https://github.com/Billmora/billmora
  docs: https://billmora.com/docs/introduction
