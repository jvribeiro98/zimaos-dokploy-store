name: openpanel
services:
  op-db:
    image: postgres:14-alpine
    restart: always
    volumes:
    - op-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
    - POSTGRES_DB=openpanel
    - POSTGRES_USER=openpanel
    - POSTGRES_PASSWORD=aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ
  op-kv:
    image: redis:7.2.5-alpine
    restart: always
    volumes:
    - op-kv-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory-policy noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  op-ch:
    image: clickhouse/clickhouse-server:25.10.2.65
    restart: always
    volumes:
    - op-ch-data:/var/lib/clickhouse
    - op-ch-logs:/var/log/clickhouse-server
    - /DATA/AppData/$AppID/clickhouse_config:/etc/clickhouse-server/config.d
    - /DATA/AppData/$AppID/clickhouse_users:/etc/clickhouse-server/users.d
    - /DATA/AppData/$AppID/clickhouse_init:/docker-entrypoint-initdb.d
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --query "SELECT 1" -d openpanel
      interval: 10s
      timeout: 5s
      retries: 5
  op-api:
    image: lindesvard/openpanel-api:2.2.1
    restart: always
    command: "sh -c \"\n  echo 'Waiting for PostgreSQL to be ready...'\n  while ! nc -z op-db 5432; do\n    sleep 1\n  done\n\
      \  echo 'PostgreSQL is ready'\n\n  echo 'Waiting for ClickHouse to be ready...'\n  while ! nc -z op-ch 8123; do\n  \
      \  sleep 1\n  done\n  echo 'ClickHouse is ready'\n\n  echo 'Running migrations...'\n\n  CI=true pnpm -r run migrate:deploy\n\
      \n  pnpm start\n\"\n"
    environment:
      NODE_ENV: production
      SELF_HOSTED: 'true'
      API_URL: http://localhost/api
      DASHBOARD_URL: http://localhost
      DATABASE_URL: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      DATABASE_URL_DIRECT: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      REDIS_URL: redis://default:ESQeHI8IaOtsW3QgXfHv7tYGhgqHzUjk@op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
      COOKIE_SECRET: VxJpDzps6rt3N8ucHRFy3TF0Wua1tD/MquMsNUL3r1U=
      ALLOW_REGISTRATION: 'true'
      ALLOW_INVITATION: 'true'
      EMAIL_SENDER: ''
      RESEND_API_KEY: ''
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      op-db:
        condition: service_healthy
      op-ch:
        condition: service_healthy
      op-kv:
        condition: service_healthy
  op-dashboard:
    image: lindesvard/openpanel-dashboard:2.2.1
    restart: always
    depends_on:
      op-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELF_HOSTED: 'true'
      API_URL: http://localhost/api
      DASHBOARD_URL: http://localhost
      DATABASE_URL: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      DATABASE_URL_DIRECT: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      REDIS_URL: redis://default:ESQeHI8IaOtsW3QgXfHv7tYGhgqHzUjk@op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  op-worker:
    image: lindesvard/openpanel-worker:2.2.1
    restart: always
    depends_on:
      op-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SELF_HOSTED: 'true'
      API_URL: http://localhost/api
      DASHBOARD_URL: http://localhost
      DATABASE_URL: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      DATABASE_URL_DIRECT: postgres://openpanel:aMaGjWXrtkxASCxI9cVycYqY6mGpoKgZ@op-db:5432/openpanel?schema=public
      REDIS_URL: redis://default:ESQeHI8IaOtsW3QgXfHv7tYGhgqHzUjk@op-kv:6379
      CLICKHOUSE_URL: http://op-ch:8123/openpanel
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/healthcheck || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
x-common:
  NODE_ENV: production
  SELF_HOSTED: 'true'
  API_URL: ${API_URL}
  DASHBOARD_URL: ${DASHBOARD_URL}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@op-db:5432/${POSTGRES_DB}?schema=public
  DATABASE_URL_DIRECT: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@op-db:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://default:${REDIS_PASSWORD}@op-kv:6379
  CLICKHOUSE_URL: http://op-ch:8123/openpanel
volumes:
  op-db-data: null
  op-kv-data: null
  op-ch-data: null
  op-ch-logs: null
