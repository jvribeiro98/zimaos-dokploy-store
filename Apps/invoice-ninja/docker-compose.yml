name: invoice-ninja
services:
  app:
    image: invoiceninja/invoiceninja-debian:5.13.56
    restart: unless-stopped
    depends_on:
    - mysql
    - redis
    environment:
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_URL=https://localhost
    - APP_KEY=LecvzHW6iWsq6Ns07IGAVvyhehaCuOKK
    - REQUIRE_HTTPS=false
    - TRUSTED_PROXIES=*
    - PDF_GENERATOR=snappdf
    - CACHE_DRIVER=redis
    - QUEUE_CONNECTION=redis
    - SESSION_DRIVER=redis
    - REDIS_HOST=redis
    - REDIS_PASSWORD=null
    - FILESYSTEM_DISK=debian_docker
    - DB_CONNECTION=mysql
    - DB_HOST=mysql
    - DB_PORT=3306
    - DB_DATABASE=ninja
    - DB_USERNAME=ninja
    - DB_PASSWORD=X84wUvQg9zVfMDeJebOFbNGm63VQjmMF
    - IN_USER_EMAIL=admin@example.com
    - IN_PASSWORD=IlG2CUL0o1q2VwlT
    volumes:
    - app_public:/var/www/html/public
    - app_storage:/var/www/html/storage
  server:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    depends_on:
    - app
    command:
    - sh
    - -c
    - "cat > /etc/nginx/conf.d/default.conf <<'EOF'\nserver {\n    listen 80 default_server;\n    server_name _;\n    root\
      \ /var/www/html/public;\n    index index.php;\n    client_max_body_size 20M;\n    location / {\n        try_files $$uri\
      \ $$uri/ /index.php?$$query_string;\n    }\n    location ~ \\.php$$ {\n        fastcgi_split_path_info ^(.+\\.php)(/.+)$$;\n\
      \        fastcgi_pass app:9000;\n        fastcgi_index index.php;\n        include fastcgi_params;\n        fastcgi_param\
      \ SCRIPT_FILENAME $$document_root$$fastcgi_script_name;\n    }\n    location ~ /\\.(?!well-known).* {\n        deny\
      \ all;\n    }\n}\nEOF\nexec nginx -g 'daemon off;'\n"
    volumes:
    - app_public:/var/www/html/public:ro
    - app_storage:/var/www/html/storage:ro
    expose:
    - '80'
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
    - MYSQL_DATABASE=ninja
    - MYSQL_USER=ninja
    - MYSQL_PASSWORD=X84wUvQg9zVfMDeJebOFbNGm63VQjmMF
    - MYSQL_ROOT_PASSWORD=Yac2Siut4ckXJzlEayfhg4iizJLnyUTY
    volumes:
    - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
volumes:
  app_public: null
  app_storage: null
  mysql_data: null
  redis_data: null
x-casaos:
  id: com.dokploy.invoice-ninja
  main: server
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/invoice-ninja/icon.svg
  title:
    en_US: Invoice Ninja
  tagline:
    en_US: Invoice Ninja is open-source software for invoicing, payments, expenses and time tracki...
  description:
    en_US: 'Invoice Ninja is open-source software for invoicing, payments, expenses and time tracking: create and send invoices,
      accept online payments, manage clients and projects, and automate recurring billing.'
  author: Dokploy Community
  developer: Invoice Ninja
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "5.13.56"
  update_at: "2026-11-24"
  website: https://invoiceninja.com
  repo: https://github.com/invoiceninja/invoiceninja
  docs: https://invoiceninja.github.io
