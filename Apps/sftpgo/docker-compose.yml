name: sftpgo
services:
  sftpgo:
    image: drakkan/sftpgo:v2.7.3
    restart: unless-stopped
    volumes:
    - sftpgo_data:/srv/sftpgo
    - sftpgo_home:/var/lib/sftpgo
    expose:
    - '8080'
    - '2022'
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  sftpgo_data: null
  sftpgo_home: null
x-casaos:
  id: com.dokploy.sftpgo
  main: sftpgo
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sftpgo/icon.svg
  title:
    en_US: SFTPGo
  tagline:
    en_US: SFTPGo is a full-featured and highly configurable SFTP, HTTP/S, FTP/S, and WebDAV server
  description:
    en_US: SFTPGo is a full-featured and highly configurable SFTP, HTTP/S, FTP/S, and WebDAV server.
  author: Dokploy Community
  developer: SFTPGo
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2.7.3"
  update_at: "2026-11-28"
  website: https://sftpgo.com/
  repo: https://github.com/drakkan/sftpgo
  docs: https://docs.sftpgo.com/
