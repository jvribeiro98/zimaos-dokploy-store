name: openobserve
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.70.0
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: admin@example.com
      ZO_ROOT_USER_PASSWORD: u3aI9qNN9FzcOzNi2aMJ00mDeoS2IGhD
      ZO_DATA_DIR: /data
    expose:
    - 5080
    - 5081
    volumes:
    - data:/DATA/AppData/openobserve/data
    ports:
    - target: 5080
      published: "5080"
      protocol: tcp
volumes:
  data: null
x-casaos:
  id: com.dokploy.openobserve
  main: openobserve
  index: /
  port_map: "5080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openobserve/icon.svg
  title:
    en_US: Openobserve
  tagline:
    en_US: OpenObserve (O2) is a cloud-native observability platform that unifies logs, metrics, a...
  description:
    en_US: OpenObserve (O2) is a cloud-native observability platform that unifies logs, metrics, and traces into one solution.
  author: Dokploy Community
  developer: Openobserve
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "0.70.0"
  update_at: "2026-11-22"
  website: https://openobserve.ai/
  repo: https://github.com/openobserve/openobserve
  docs: https://openobserve.ai/docs/
