name: hoarder
services:
  web:
    image: ghcr.io/hoarder-app/hoarder:0.22.0
    restart: unless-stopped
    volumes:
    - hoarder-data:/data
    expose:
    - 3000
    environment:
    - DISABLE_SIGNUPS
    - NEXTAUTH_URL=http://localhost
    - NEXTAUTH_SECRET=X8eyNjq6LerRhOwsTTOveHLGBKggM3Jy7sD86xRQQJI=
    - MEILI_ADDR=http://meilisearch:7700
    - BROWSER_WEB_URL=http://chrome:9222
    - DATA_DIR=/data
    - MEILI_MASTER_KEY=koC3fhUrIummxpjkDZGj5IF5wR8IAJaZr20XH55EcHY=
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
    - --no-sandbox
    - --disable-gpu
    - --disable-dev-shm-usage
    - --remote-debugging-address=0.0.0.0
    - --remote-debugging-port=9222
    - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
    - MEILI_MASTER_KEY=koC3fhUrIummxpjkDZGj5IF5wR8IAJaZr20XH55EcHY=
    - MEILI_NO_ANALYTICS=true
    volumes:
    - meilisearch-data:/meili_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:7700/health
      interval: 2s
      timeout: 10s
      retries: 15
volumes:
  meilisearch-data: null
  hoarder-data: null
x-casaos:
  id: com.dokploy.hoarder
  main: web
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/hoarder/icon.svg
  title:
    en_US: Hoarder
  tagline:
    en_US: Hoarder is an open source "Bookmark Everything" app that uses AI for automatically tagg...
  description:
    en_US: Hoarder is an open source "Bookmark Everything" app that uses AI for automatically tagging the content you throw
      at it.
  author: Dokploy Community
  developer: Hoarder
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.22.0"
  update_at: "2026-11-24"
  website: https://hoarder.app/
  repo: https://github.com/hoarder/hoarder
  docs: https://docs.hoarder.app/
