name: trailbase
services:
  trailbase:
    image: trailbase/trailbase:latest
    restart: unless-stopped
    volumes:
    - trailbase-data:/app/traildepot
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:4000/api/healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - target: 4000
      published: "4000"
      protocol: tcp
volumes:
  trailbase-data: {}
x-casaos:
  id: com.dokploy.trailbase
  main: trailbase
  index: /
  port_map: "4000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/trailbase/icon.svg
  title:
    en_US: TrailBase
  tagline:
    en_US: TrailBase is a blazingly fast, open-source application server with type-safe APIs, buil...
  description:
    en_US: TrailBase is a blazingly fast, open-source application server with type-safe APIs, built-in WebAssembly runtime,
      realtime, auth, and admin UI built on Rust, SQLite & Wasmtime.
  author: Dokploy Community
  developer: TrailBase
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://trailbase.io/
  repo: https://github.com/trailbaseio/trailbase
  docs: https://trailbase.io/getting-started/install
