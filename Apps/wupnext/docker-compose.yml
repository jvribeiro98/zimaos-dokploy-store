name: wupnext
services:
  wupnext:
    image: docker.io/javierlnmn/wupnext:0.3.0
    restart: unless-stopped
    environment:
      SECRET_KEY: TLsZmQcK7dpUdSQwKcr0qPwqXye40RZj1gwNG01cpJNO6eSBzK
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://localhost
      SITE_URL: https://localhost
      MCP_BASE_URL: https://localhost
      EMAIL_BACKEND: anymail.backends.resend.EmailBackend
      DEFAULT_FROM_EMAIL: wupnext <onboarding@resend.dev>
      RESEND_API_KEY: ''
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: IyFmkIoUO5db1QDelzQ57U2u
    expose:
    - '8000'
    volumes:
    - wupnext-db:/app/db
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  wupnext-worker:
    image: docker.io/javierlnmn/wupnext:latest
    restart: unless-stopped
    command: python manage.py qcluster
    environment:
      SECRET_KEY: TLsZmQcK7dpUdSQwKcr0qPwqXye40RZj1gwNG01cpJNO6eSBzK
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost
      CSRF_TRUSTED_ORIGINS: https://localhost
      SITE_URL: https://localhost
      EMAIL_BACKEND: anymail.backends.resend.EmailBackend
      DEFAULT_FROM_EMAIL: wupnext <onboarding@resend.dev>
      RESEND_API_KEY: ''
      Q_WORKERS: '2'
      Q_TIMEOUT: '60'
      Q_RETRY: '120'
    volumes:
    - wupnext-db:/app/db
    depends_on:
    - wupnext
volumes:
  wupnext-db: null
x-casaos:
  id: com.dokploy.wupnext
  main: wupnext
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/wupnext/icon.svg
  title:
    en_US: WupNext
  tagline:
    en_US: 'WupNext is a self-hosted to-do and task queue app: groups, subtasks, deadlines, a built...'
  description:
    en_US: 'WupNext is a self-hosted to-do and task queue app: groups, subtasks, deadlines, a built-in pomodoro timer, email
      reminders, and an MCP server so an AI client can work the board. Server-rendered Django with HTMX, backed by SQLite.'
  author: Dokploy Community
  developer: WupNext
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.3.0"
  update_at: "2026-11-26"
  repo: https://github.com/javierlnmn/wupnext
