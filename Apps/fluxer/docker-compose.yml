name: fluxer
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
    - '80'
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - gateway
    - media-proxy
    - static-proxy
    - admin
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: 70f7e320614831cca76b6efc6c0710325a37008019a922f3f2ba7672ae5cd1363648304c65487f59e5d713ed35ecdd2a16f91cc662c87d55906224dc05ba63e2
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fluxer -d fluxer
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: 554c29f58efb3bf0de118db4e9beff595f17ebf1abd328ef3b9f233eec0181cf3d24b18f368b14fa335e5f68149e46ac90fb415e8208b646ef938162644be76c
    volumes:
    - meilisearch-data:/meili_data
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    restart: unless-stopped
    command:
    - server
    - -s3
    - -dir=/data
    volumes:
    - seaweedfs-data:/data
  gifs:
    restart: unless-stopped
    image: ${FLUXER_REGISTRY:-ghcr.io/fluxerapp}/fluxer-gifs:${FLUXER_IMAGE_TAG:-v1}
