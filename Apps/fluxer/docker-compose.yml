name: fluxer
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
    - '80'
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - gateway
    - media-proxy
    - static-proxy
    - admin
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: 6791a9e901e17ad75c6a318b3c72366241b7959def6f73a8719befb66dc7667d49c47ad91168473a91e705b269eaf5f8f44ed10c697a9b94c5abb5a4fbf8a613
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fluxer -d fluxer
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: e6cbc1dbd4df983fdc16b2089f5caa074b70e0d8cc56731d897ece927f6f2118cba2a7a5dcb039728f48f7bd3376b3731d2c24b1dd414654e9ca976c1d3b8cc8
    volumes:
    - meilisearch-data:/meili_data
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    restart: unless-stopped
    command:
    - server
    - -s3
    - -dir=/data
    volumes:
    - seaweedfs-data:/data
  gifs:
    restart: unless-stopped
    image: ${FLUXER_REGISTRY:-ghcr.io/fluxerapp}/fluxer-gifs:${FLUXER_IMAGE_TAG:-v1}
