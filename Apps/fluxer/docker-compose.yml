name: fluxer
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
    - '80'
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - gateway
    - media-proxy
    - static-proxy
    - admin
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: 63f75434b09d9cf684cf2b603d5d6cbbac2204029b9d45f2de3b9d589b17111e489d43bab698c5d2ae402c59965f0b35ab548a8933acc11ed82b19e58247fd92
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fluxer -d fluxer
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: 287ffc82404869efeb82a9ecba377e05040de932ceb637394ce16f70c6268a32ba8790c25fc42ee26f7e9a679a9ab16c60920440160ad3cc879060214a11e988
    volumes:
    - meilisearch-data:/meili_data
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    restart: unless-stopped
    command:
    - server
    - -s3
    - -dir=/data
    volumes:
    - seaweedfs-data:/data
  gifs:
    restart: unless-stopped
    image: ${FLUXER_REGISTRY:-ghcr.io/fluxerapp}/fluxer-gifs:${FLUXER_IMAGE_TAG:-v1}
