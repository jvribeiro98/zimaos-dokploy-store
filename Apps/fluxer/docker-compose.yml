name: fluxer
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
    - '80'
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - gateway
    - media-proxy
    - static-proxy
    - admin
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: 3ae9521e78b49a917abdbb97e41974f9a92bf263cb93840166e354772fa0bbe13810ade11d055edc5adae8ec942072d447bf6b2bf8ba272cf4da015fc00433ce
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fluxer -d fluxer
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: 46335fb821b190a942c0dae61cb9acb24283e048cb1f2e1dfa60ca67529f9bccb295a4b035dabf7c064037c2aff34588aaeb4656b1dbd4fe294c119de32d3070
