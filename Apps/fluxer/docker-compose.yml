volumes:
  caddy-data: null
  caddy-config: null
  postgres-data: null
  nats-data: null
  meilisearch-data: null
  seaweedfs-data: null
configs:
  caddyfile:
    content: ":80 {\n    encode zstd gzip\n    handle /.well-known/* {\n        reverse_proxy api:8080\n    }\n    handle_path\
      \ /api/* {\n        reverse_proxy api:8080\n    }\n    handle /gateway {\n        rewrite * /\n        reverse_proxy\
      \ gateway:8080\n    }\n    handle_path /gateway/* {\n        reverse_proxy gateway:8080\n    }\n    handle_path /media/*\
      \ {\n        reverse_proxy media-proxy:8080\n    }\n    handle_path /livekit/* {\n        reverse_proxy livekit:7880\n\
      \    }\n    handle /admin {\n        rewrite * /\n        reverse_proxy admin:8080\n    }\n    handle_path /admin/*\
      \ {\n        reverse_proxy admin:8080\n    }\n    @staticAssets path /fonts/* /web/* /emoji/* /libs/* /avatars/* /badges/*\
      \ /desktop/* /embeds/*\n    handle @staticAssets {\n        reverse_proxy static-proxy:8080\n    }\n    handle {\n \
      \       reverse_proxy app-proxy:8080\n    }\n}\n:8088 {\n    handle_path /api/* {\n        reverse_proxy api:8080\n\
      \    }\n}\n"
  livekit_config:
    content: "port: 7880\nlog_level: info\nrtc:\n  tcp_port: 7881\n  udp_port: 7882\n  use_external_ip: true\n  stun_servers:\n\
      \    - stun.l.google.com:19302\n    - stun1.l.google.com:19302\nwebhook:\n  api_key: ${LIVEKIT_API_KEY}\n  urls:\n \
      \   - http://api:8080/webhooks/livekit\n"
