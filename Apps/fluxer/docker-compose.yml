name: fluxer
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
    - '80'
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
    - api
    - gateway
    - media-proxy
    - static-proxy
    - admin
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxer
      POSTGRES_USER: fluxer
      POSTGRES_PASSWORD: 40659000e1afebf77f9816257286d80a2a3ad6ff4ec0614cbffd074ae59894964c313c4cb6b2676771d3021f8290b38b05ae2b2827940ad1bc67cd008b9d60e4
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U fluxer -d fluxer
      interval: 10s
      timeout: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command:
    - -js
    - -sd
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: 451a173e1a076ddb5b585a9523e5cad8228ceef79e23503cf8ef5a04b9884401113a43e8fbebdcdc8b82aedaa6fdae350678fea460884d4c6c2bdb736bf0463e
    volumes:
    - meilisearch-data:/meili_data
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    restart: unless-stopped
    command:
    - server
    - -s3
    - -dir=/data
    volumes:
    - seaweedfs-data:/data
  gifs:
    restart: unless-stopped
    image: ${FLUXER_REGISTRY:-ghcr.io/fluxerapp}/fluxer-gifs:${FLUXER_IMAGE_TAG:-v1}
