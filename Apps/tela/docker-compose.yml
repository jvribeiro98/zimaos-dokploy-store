name: tela
services:
  proxy:
    image: ghcr.io/zcag/tela-proxy:0.7.0
    restart: unless-stopped
    environment:
    - TELA_SITE_ADDRESS=:80
    - TELA_UPSTREAM_BACKEND=backend:8080
    - TELA_UPSTREAM_FRONTEND=frontend:80
    depends_on:
    - backend
    - frontend
    volumes:
    - caddy-data:/data
    - caddy-config:/config
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  backend:
    image: ghcr.io/zcag/tela-backend:0.7.0
    restart: unless-stopped
    environment:
    - TELA_PUBLIC_BASE_URL=https://localhost
    - TELA_DATABASE_URL=postgres://tela:Rj6RKrn0e4r5128KIQw9Z9PuePBwFAmi@postgres:5432/tela?sslmode=disable
    - TELA_SHARE_SECRET=TYIUtUhx1jtWxKd0IWx1MyEIV4AP2SgrlN1P81iTP5chgmcF0oXFY06A3Lsp4edj
    - TELA_API_KEY_SECRET=Lj8Cs7KUhJ72hRvl3FMjYG9tYustaZ3YDzk97rx74V1ey6U4qFOXLoqU1ciyh8lm
    - TELA_DECK_URL=http://deck:3344
    - TELA_GOTENBERG_URL=http://gotenberg:3000
    - TELA_PDF_RENDER_BASE_URL=http://proxy
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: ghcr.io/zcag/tela-frontend:0.7.0
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=tela
    - POSTGRES_PASSWORD=Rj6RKrn0e4r5128KIQw9Z9PuePBwFAmi
    - POSTGRES_DB=tela
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U tela -d tela
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
    - pgdata:/var/lib/postgresql/data
  deck:
    image: ghcr.io/zcag/tela-deck:0.7.0
    restart: unless-stopped
    volumes:
    - deckcache:/data
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
volumes:
  pgdata: null
  deckcache: null
  caddy-data: null
  caddy-config: null
x-casaos:
  id: com.dokploy.tela
  main: proxy
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/tela/icon.png
  title:
    en_US: tela
  tagline:
    en_US: Self-hostable, markdown-native team wiki with live collaboration, full-text and semanti...
  description:
    en_US: Self-hostable, markdown-native team wiki with live collaboration, full-text and semantic search, WebDAV sync, public
      spaces, Slidev decks, PDF export, and a built-in MCP server so AI agents are first-class editors.
  author: Dokploy Community
  developer: tela
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.7.0"
  update_at: "2026-11-24"
  website: https://telawiki.com
  repo: https://github.com/zcag/tela
  docs: https://telawiki.com/public/spaces/16
