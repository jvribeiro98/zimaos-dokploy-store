name: wordpress
services:
  wordpress:
    image: wordpress:latest
    command:
    - bash
    - -c
    - "if [ -n \"$$WP_DOMAIN\" ]; then\n  (\n    for i in $$(seq 1 60); do\n      TRAEFIK_IP=\"$$(getent hosts dokploy-traefik\
      \ | awk '{print $$1; exit}')\"\n      if [ -n \"$$TRAEFIK_IP\" ]; then\n        grep -q \"[[:space:]]$$WP_DOMAIN\\$$\"\
      \ /etc/hosts || echo \"$$TRAEFIK_IP $$WP_DOMAIN\" >> /etc/hosts\n        break\n      fi\n      sleep 2\n    done\n\
      \  ) &\nfi\nexec docker-entrypoint.sh apache2-foreground\n"
    volumes:
    - wp_app:/var/www/html
    - /DATA/AppData/$AppID/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: $DB_NAME
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: $DB_PASSWORD
      WORDPRESS_DEBUG: '0'
      WP_DOMAIN: localhost
      WORDPRESS_CONFIG_EXTRA: 'define(''WP_MEMORY_LIMIT'', ''256M'');

        define(''DISALLOW_FILE_EDIT'', true);

        '
    depends_on:
      wp_db:
        condition: service_healthy
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  wp_db:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
    - wp_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: $DB_PASSWORD
      MYSQL_DATABASE: $DB_NAME
    healthcheck:
      test:
      - CMD-SHELL
      - exit | mysql -h localhost -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  wp_app: null
  wp_data: null
x-casaos:
  id: com.dokploy.wordpress
  main: wordpress
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/wordpress/icon.png
  title:
    en_US: Wordpress
  tagline:
    en_US: Wordpress is a free and open source content management system (CMS) for publishing and...
  description:
    en_US: Wordpress is a free and open source content management system (CMS) for publishing and managing websites.
  author: Dokploy Community
  developer: Wordpress
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://wordpress.org/
  repo: https://github.com/WordPress/WordPress
  docs: https://wordpress.org/documentation/
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (uploads.ini). Review environment
        variables before starting.
