name: triggerdotdev
services:
  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:${TRIGGER_IMAGE_TAG:-v3}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      LOGIN_ORIGIN: http://localhost
      APP_ORIGIN: http://localhost
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost/otel
      ELECTRIC_ORIGIN: http://electric:3000
    expose:
    - 3000
    depends_on:
    - postgres
    - redis
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-16}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
    - postgres-data:/var/lib/postgresql/data/
    expose:
    - 5432
    command:
    - -c
    - wal_level=logical
  redis:
    image: redis:${REDIS_IMAGE_TAG:-7}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
    - redis-data:/data
    expose:
    - 6379
  docker-provider:
    image: ghcr.io/triggerdotdev/provider/docker:${TRIGGER_IMAGE_TAG:-v3}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    user: root
    depends_on:
    - webapp
    expose:
    - 9020
    environment:
      PLATFORM_HOST: webapp
      PLATFORM_WS_PORT: '3030'
      SECURE_CONNECTION: 'false'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost/otel
      PLATFORM_SECRET: $PROVIDER_SECRET
  coordinator:
    image: ghcr.io/triggerdotdev/coordinator:${TRIGGER_IMAGE_TAG:-v3}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    user: root
    depends_on:
    - webapp
    expose:
    - 9020
    environment:
      PLATFORM_HOST: webapp
      PLATFORM_WS_PORT: '3030'
      SECURE_CONNECTION: 'false'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost/otel
      PLATFORM_SECRET: $COORDINATOR_SECRET
  electric:
    image: electricsql/electric:${ELECTRIC_IMAGE_TAG:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      DATABASE_URL: postgresql://triggeruser:Bz5v8Hc4JWbPKT+igGJkdWiqUezsh7JE@postgres:5432/triggerdb?sslmode=disable
    depends_on:
    - postgres
    expose:
    - 3000
x-webapp-env:
  LOGIN_ORIGIN: ${TRIGGER_PROTOCOL:-http}://${TRIGGER_DOMAIN:-localhost:3040}
  APP_ORIGIN: ${TRIGGER_PROTOCOL:-http}://${TRIGGER_DOMAIN:-localhost:3040}
  DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${TRIGGER_PROTOCOL:-http}://${TRIGGER_DOMAIN:-localhost:3040}/otel
  ELECTRIC_ORIGIN: http://electric:3000
x-worker-env:
  PLATFORM_HOST: webapp
  PLATFORM_WS_PORT: 3030
  SECURE_CONNECTION: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: ${TRIGGER_PROTOCOL:-http}://${TRIGGER_DOMAIN:-localhost:3040}/otel
volumes:
  postgres-data: null
  redis-data: null
x-casaos:
  id: com.dokploy.triggerdotdev
  main: webapp
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/triggerdotdev/icon.svg
  title:
    en_US: Trigger.dev
  tagline:
    en_US: Trigger is a platform for building event-driven applications
  description:
    en_US: Trigger is a platform for building event-driven applications.
  author: Dokploy Community
  developer: Trigger.dev
  category: Others
  architectures:
  - amd64
  - arm64
  version: "3"
  update_at: "2026-11-22"
  website: https://trigger.dev/
  repo: https://github.com/triggerdotdev/trigger.dev
  docs: https://trigger.dev/docs
