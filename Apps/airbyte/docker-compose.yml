name: airbyte
services:
  db:
    image: airbyte/db:${AIRBYTE_VERSION}
    environment:
      POSTGRES_DB: db-airbyte
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
    - db-data:/var/lib/postgresql/data
    restart: unless-stopped
  minio:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "mkdir -p /etc/seaweedfs\nprintf '{\"identities\":[{\"name\":\"airbyte\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\"\
      :\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \\\n  \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"\
      \ > /etc/seaweedfs/s3.json\nexec weed server -dir=/storage -ip.bind=0.0.0.0 \\\n  -master.volumeSizeLimitMB=1024 -volume.max=0\
      \ \\\n  -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json\n"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: WrOcFuSsWXljuJUWwCZ4s68RGNUcpxD8
    volumes:
    - minio-data:/storage
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9000/healthz
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  minio-init:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    entrypoint:
    - /bin/sh
    - /scripts/init-minio.sh
    environment:
      SEAWEEDFS_MASTER: minio:9333
    volumes:
    - /DATA/AppData/$AppID/scripts/init-minio.sh:/scripts/init-minio.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    environment:
      AUTO_SETUP: 'true'
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: db
      POSTGRES_USER: airbyte
      POSTGRES_PWD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      POSTGRES_TLS_ENABLED: 'false'
      POSTGRES_TLS_DISABLE_HOST_VERIFICATION: 'false'
      SQL_TLS_ENABLED: 'false'
      SQL_TLS_DISABLE_HOST_VERIFICATION: 'false'
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 0.0.0.0
    volumes:
    - /DATA/AppData/$AppID/config/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /bin/bash
      - -ec
      - exec 3<>/dev/tcp/127.0.0.1/7233
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  k3s:
    image: rancher/k3s:${K3S_VERSION}
    command:
    - server
    - --node-name=airbyte-k3s
    - --disable=traefik
    - --disable=servicelb
    - --disable=metrics-server
    - --disable=coredns
    - --tls-san=k3s
    privileged: true
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: '0644'
    tmpfs:
    - /run
    - /var/run
    volumes:
    - k3s-data:/var/lib/rancher/k3s
    - k3s-kubeconfig:/output
    healthcheck:
      test:
      - CMD
      - /bin/kubectl
      - get
      - --raw=/readyz
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  docker-dns:
    image: rancher/mirrored-coredns-coredns:${COREDNS_VERSION}
    command:
    - -conf
    - /etc/coredns/Corefile
    volumes:
    - /DATA/AppData/$AppID/config/docker-dns.Corefile:/etc/coredns/Corefile:ro
    network_mode: service:k3s
    depends_on:
      k3s:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /coredns
      - -version
      interval: 10s
      timeout: 5s
      retries: 3
  k3s-bootstrap:
    image: rancher/k3s:${K3S_VERSION}
    entrypoint:
    - /bin/sh
    - /scripts/bootstrap-k3s.sh
    environment:
      AIRBYTE_ADMIN_PASSWORD: MpY9bxZU6L9zB7SGBBQjDrQH4k0sP04u
      AIRBYTE_ADMIN_CLIENT_ID: oXw4ddKWmWuEqGQiSFYyx3xUk1ZdMKB4
      AIRBYTE_ADMIN_CLIENT_SECRET: IcVDzonBdjLQeraGvmTumnlPOaTNLM4L
      AIRBYTE_JWT_SIGNATURE_SECRET: g696VwbtjiOxyYWvcK55lJEhpBumIDsu
      DATABASE_USER: airbyte
      DATABASE_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: WrOcFuSsWXljuJUWwCZ4s68RGNUcpxD8
    volumes:
    - k3s-kubeconfig:/kube
    - /DATA/AppData/$AppID/config/k3s-resources.yaml:/config/k3s-resources.yaml:ro
    - /DATA/AppData/$AppID/scripts/bootstrap-k3s.sh:/scripts/bootstrap-k3s.sh:ro
    depends_on:
      k3s:
        condition: service_healthy
      docker-dns:
        condition: service_started
    restart: on-failure
  dataplane-credentials:
    image: rancher/k3s:${K3S_VERSION}
    entrypoint:
    - /bin/sh
    - /scripts/export-dataplane-credentials.sh
    volumes:
    - k3s-kubeconfig:/kube:ro
    - dataplane-credentials:/credentials
    - /DATA/AppData/$AppID/scripts/export-dataplane-credentials.sh:/scripts/export-dataplane-credentials.sh:ro
    depends_on:
      bootloader:
        condition: service_completed_successfully
    restart: on-failure
  bootloader:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AB_INSTANCE_ADMIN_PASSWORD: ${AIRBYTE_ADMIN_PASSWORD:?Set AIRBYTE_ADMIN_PASSWORD in .env}
      AB_INSTANCE_ADMIN_CLIENT_ID: ${AIRBYTE_ADMIN_CLIENT_ID:?Set AIRBYTE_ADMIN_CLIENT_ID in .env}
      AB_INSTANCE_ADMIN_CLIENT_SECRET: ${AIRBYTE_ADMIN_CLIENT_SECRET:?Set AIRBYTE_ADMIN_CLIENT_SECRET in .env}
      AB_JWT_SIGNATURE_SECRET: ${AIRBYTE_JWT_SIGNATURE_SECRET:?Set AIRBYTE_JWT_SIGNATURE_SECRET in .env}
      CONNECTOR_PROFILER_IMAGE: airbyte/async-profiler:2.2.0
      CONNECTOR_SIDECAR_IMAGE: airbyte/connector-sidecar:2.2.0
      CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:2.2.0
      WORKLOAD_INIT_IMAGE: airbyte/workload-init-container:2.2.0
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      KUBECONFIG: /kube/config.yaml
      MICRONAUT_ENVIRONMENTS: k8s,control-plane,edition-community
      JOB_KUBE_NAMESPACE: default
      DD_SERVICE: airbyte-bootloader
    restart: on-failure
    image: airbyte/bootloader:${AIRBYTE_VERSION}
    volumes:
    - k3s-kubeconfig:/kube:ro
    depends_on:
      db:
        condition: service_healthy
      k3s-bootstrap:
        condition: service_completed_successfully
  server:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AB_INSTANCE_ADMIN_PASSWORD: ${AIRBYTE_ADMIN_PASSWORD:?Set AIRBYTE_ADMIN_PASSWORD in .env}
      AB_INSTANCE_ADMIN_CLIENT_ID: ${AIRBYTE_ADMIN_CLIENT_ID:?Set AIRBYTE_ADMIN_CLIENT_ID in .env}
      AB_INSTANCE_ADMIN_CLIENT_SECRET: ${AIRBYTE_ADMIN_CLIENT_SECRET:?Set AIRBYTE_ADMIN_CLIENT_SECRET in .env}
      AB_JWT_SIGNATURE_SECRET: ${AIRBYTE_JWT_SIGNATURE_SECRET:?Set AIRBYTE_JWT_SIGNATURE_SECRET in .env}
      CONNECTOR_PROFILER_IMAGE: airbyte/async-profiler:2.2.0
      CONNECTOR_SIDECAR_IMAGE: airbyte/connector-sidecar:2.2.0
      CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:2.2.0
      WORKLOAD_INIT_IMAGE: airbyte/workload-init-container:2.2.0
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      DD_SERVICE: airbyte-server
    restart: unless-stopped
    image: airbyte/server:${AIRBYTE_VERSION}
    expose:
    - 8001
    healthcheck:
      test:
      - CMD
      - /bin/bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/8001

        printf ''GET /api/v1/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3

        read -r status <&3

        [[ "$$status" == *" 200 "* ]]

        '
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 10s
    depends_on:
      bootloader:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    ports:
    - target: 8001
      published: "8001"
      protocol: tcp
  manifest-server:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AB_INSTANCE_ADMIN_PASSWORD: ${AIRBYTE_ADMIN_PASSWORD:?Set AIRBYTE_ADMIN_PASSWORD in .env}
      AB_INSTANCE_ADMIN_CLIENT_ID: ${AIRBYTE_ADMIN_CLIENT_ID:?Set AIRBYTE_ADMIN_CLIENT_ID in .env}
      AB_INSTANCE_ADMIN_CLIENT_SECRET: ${AIRBYTE_ADMIN_CLIENT_SECRET:?Set AIRBYTE_ADMIN_CLIENT_SECRET in .env}
      AB_JWT_SIGNATURE_SECRET: ${AIRBYTE_JWT_SIGNATURE_SECRET:?Set AIRBYTE_JWT_SIGNATURE_SECRET in .env}
      CONNECTOR_PROFILER_IMAGE: airbyte/async-profiler:2.2.0
      CONNECTOR_SIDECAR_IMAGE: airbyte/connector-sidecar:2.2.0
      CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:2.2.0
      WORKLOAD_INIT_IMAGE: airbyte/workload-init-container:2.2.0
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      DD_SERVICE: airbyte-manifest-server
      AIRBYTE_ENABLE_UNSAFE_CODE: 'false'
    restart: unless-stopped
    image: airbyte/manifest-server:${MANIFEST_SERVER_VERSION}
    depends_on:
      bootloader:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8080/health/", timeout=5); assert response.status
        == 200
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  workload-api-server:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AB_INSTANCE_ADMIN_PASSWORD: ${AIRBYTE_ADMIN_PASSWORD:?Set AIRBYTE_ADMIN_PASSWORD in .env}
      AB_INSTANCE_ADMIN_CLIENT_ID: ${AIRBYTE_ADMIN_CLIENT_ID:?Set AIRBYTE_ADMIN_CLIENT_ID in .env}
      AB_INSTANCE_ADMIN_CLIENT_SECRET: ${AIRBYTE_ADMIN_CLIENT_SECRET:?Set AIRBYTE_ADMIN_CLIENT_SECRET in .env}
      AB_JWT_SIGNATURE_SECRET: ${AIRBYTE_JWT_SIGNATURE_SECRET:?Set AIRBYTE_JWT_SIGNATURE_SECRET in .env}
      CONNECTOR_PROFILER_IMAGE: airbyte/async-profiler:2.2.0
      CONNECTOR_SIDECAR_IMAGE: airbyte/connector-sidecar:2.2.0
      CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:2.2.0
      WORKLOAD_INIT_IMAGE: airbyte/workload-init-container:2.2.0
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      DD_SERVICE: airbyte-workload-api
    restart: unless-stopped
    image: airbyte/workload-api-server:${AIRBYTE_VERSION}
    depends_on:
      bootloader:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - /bin/bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/8085

        printf ''GET /health/liveness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3

        read -r status <&3

        [[ "$$status" == *" 200 "* ]]

        '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AB_INSTANCE_ADMIN_PASSWORD: ${AIRBYTE_ADMIN_PASSWORD:?Set AIRBYTE_ADMIN_PASSWORD in .env}
      AB_INSTANCE_ADMIN_CLIENT_ID: ${AIRBYTE_ADMIN_CLIENT_ID:?Set AIRBYTE_ADMIN_CLIENT_ID in .env}
      AB_INSTANCE_ADMIN_CLIENT_SECRET: ${AIRBYTE_ADMIN_CLIENT_SECRET:?Set AIRBYTE_ADMIN_CLIENT_SECRET in .env}
      AB_JWT_SIGNATURE_SECRET: ${AIRBYTE_JWT_SIGNATURE_SECRET:?Set AIRBYTE_JWT_SIGNATURE_SECRET in .env}
      CONNECTOR_PROFILER_IMAGE: airbyte/async-profiler:2.2.0
      CONNECTOR_SIDECAR_IMAGE: airbyte/connector-sidecar:2.2.0
      CONTAINER_ORCHESTRATOR_IMAGE: airbyte/container-orchestrator:2.2.0
      WORKLOAD_INIT_IMAGE: airbyte/workload-init-container:2.2.0
      JAVA_OPTS: -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      DD_SERVICE: airbyte-worker
    restart: unless-stopped
    image: airbyte/worker:${AIRBYTE_VERSION}
    depends_on:
      bootloader:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      workload-api-server:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - /bin/bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/9000

        printf ''GET / HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3

        read -r status <&3

        [[ "$$status" == *" 200 "* ]]

        '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  cron:
    environment:
      AIRBYTE_VERSION: ${AIRBYTE_VERSION:?Set AIRBYTE_VERSION in .env}
      AIRBYTE_URL: ${AIRBYTE_URL:?Set AIRBYTE_URL in .env}
      AIRBYTE_API_HOST: ${AIRBYTE_API_HOST:?Set AIRBYTE_API_HOST in .env}
      AIRBYTE_SERVER_HOST: server:8001
      INTERNAL_API_HOST: http://server:8001
      MANIFEST_SERVER_API_HOST: http://manifest-server:8080
      CONTROL_PLANE_TOKEN_ENDPOINT: http://server:8001/api/v1/dataplanes/token
      WORKLOAD_API_HOST: http://workload-api-server:8007
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: http://minio:9000
      DATABASE_HOST: db
      DATABASE_DB: ${DATABASE_DB:?Set DATABASE_DB in .env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_URL: jdbc:postgresql://db:5432/db-airbyte
      CONFIG_DATABASE_REPLICA_USER: airbyte
      CONFIG_DATABASE_REPLICA_PASSWORD: qTmdEZ8V7Sn9J4SMq0lewKFRRKLQS9e7
