name: docmost
services:
  docmost:
    image: docmost/docmost:0.4.1
    depends_on:
    - db
    - redis
    environment:
    - APP_URL=http://localhost:3000
    - APP_SECRET=rosMA56RLqpneQKRxHbWRP78U7aQ7bar
    - DATABASE_URL=postgresql://docmost:BUsZQB1fMpZKtmV215ltHUVhwG767JGg@db:5432/docmost?schema=public
    - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    volumes:
    - docmost:/app/data/storage
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  db:
    image: postgres:16-alpine
    environment:
    - POSTGRES_DB=docmost
    - POSTGRES_USER=docmost
    - POSTGRES_PASSWORD=BUsZQB1fMpZKtmV215ltHUVhwG767JGg
    restart: unless-stopped
    volumes:
    - db_docmost_data:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
    - redis_docmost_data:/data
volumes:
  docmost: null
  db_docmost_data: null
  redis_docmost_data: null
x-casaos:
  id: com.dokploy.docmost
  main: docmost
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/docmost/icon.png
  title:
    en_US: Docmost
  tagline:
    en_US: Docmost is a collaborative wiki and documentation tool
  description:
    en_US: Docmost is a collaborative wiki and documentation tool. Self-host it on your own server with Dokploy, which deploys
      Docmost as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Docmost
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.4.1"
  update_at: "2026-11-27"
  website: https://docmost.com/
  repo: https://github.com/docmost/docmost
  docs: https://docmost.com/docs/
