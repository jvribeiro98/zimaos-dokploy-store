name: n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.104.0
    restart: always
    environment:
    - N8N_HOST=localhost
    - N8N_PORT=5678
    - N8N_PROTOCOL=http
    - NODE_ENV=production
    - WEBHOOK_URL=https://localhost/
    - GENERIC_TIMEZONE=Europe/Berlin
    - N8N_SECURE_COOKIE=false
    volumes:
    - n8n_data:/home/node/.n8n
    ports:
    - target: 5678
      published: "5678"
      protocol: tcp
volumes:
  n8n_data: null
x-casaos:
  id: com.dokploy.n8n
  main: n8n
  index: /
  port_map: "5678"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/n8n/icon.png
  title:
    en_US: n8n
  tagline:
    en_US: n8n is an open-source, low-code platform for automating workflows and integrations
  description:
    en_US: n8n is an open-source, low-code platform for automating workflows and integrations. Self-host it on your own server
      with Dokploy, which deploys n8n as a Docker Compose service in minutes.
  author: Dokploy Community
  developer: n8n
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.104.0"
  update_at: "2026-11-22"
  website: https://n8n.io/
  repo: https://github.com/n8n-io/n8n
  docs: https://docs.n8n.io/
