name: changedetection
services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.49
    restart: unless-stopped
    expose:
    - 5000
    volumes:
    - datastore:/datastore
    ports:
    - target: 5000
      published: "5000"
      protocol: tcp
volumes:
  datastore: null
x-casaos:
  id: com.dokploy.changedetection
  main: changedetection
  index: /
  port_map: "5000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/changedetection/icon.png
  title:
    en_US: Change Detection
  tagline:
    en_US: Changedetection
  description:
    en_US: Changedetection.io is an intelligent tool designed to monitor changes on websites. Perfect for smart shoppers,
      data journalists, research engineers, data scientists, and security researchers.
  author: Dokploy Community
  developer: Change Detection
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.49"
  update_at: "2026-11-28"
  website: https://changedetection.io
  repo: https://github.com/dgtlmoon/changedetection.io
  docs: https://github.com/dgtlmoon/changedetection.io/wiki
