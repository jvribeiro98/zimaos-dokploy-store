name: grist
services:
  grist:
    image: gristlabs/grist:latest
    restart: unless-stopped
    expose:
    - 8484
    volumes:
    - grist_data:/persist
    environment:
      GRIST_DEFAULT_EMAIL: admin@example.com
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET:-}
      GRIST_SINGLE_ORG: ${GRIST_SINGLE_ORG:-}
      GRIST_HOME_INSTANCE: ${GRIST_HOME_INSTANCE:-}
    ports:
    - target: 8484
      published: "8484"
      protocol: tcp
volumes:
  grist_data: null
x-casaos:
  id: com.dokploy.grist
  main: grist
  index: /
  port_map: "8484"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/grist/icon.png
  title:
    en_US: Grist
  tagline:
    en_US: Grist is an open-source spreadsheet and database alternative that combines the flexibil...
  description:
    en_US: Grist is an open-source spreadsheet and database alternative that combines the flexibility of spreadsheets with
      the power of databases.
  author: Dokploy Community
  developer: Grist
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://www.getgrist.com/
  repo: https://github.com/gristlabs/grist-core
  docs: https://support.getgrist.com/self-managed/
