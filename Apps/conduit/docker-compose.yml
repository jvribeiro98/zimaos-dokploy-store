name: conduit
services:
  homeserver:
    image: registry.gitlab.com/famedly/conduit/matrix-conduit:v0.9.0
    restart: unless-stopped
    volumes:
    - db:/var/lib/matrix-conduit/
    environment:
      CONDUIT_SERVER_NAME: localhost
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_PORT: '6167'
      CONDUIT_MAX_REQUEST_SIZE: '20000000'
      CONDUIT_ALLOW_REGISTRATION: 'true'
      CONDUIT_ALLOW_FEDERATION: 'true'
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: 'true'
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_CONFIG: ''
    ports:
    - target: 6167
      published: "6167"
      protocol: tcp
volumes:
  db: null
x-casaos:
  id: com.dokploy.conduit
  main: homeserver
  index: /
  port_map: "6167"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/conduit/icon.svg
  title:
    en_US: Conduit
  tagline:
    en_US: Conduit is a simple, fast and reliable chat server powered by Matrix
  description:
    en_US: Conduit is a simple, fast and reliable chat server powered by Matrix
  author: Dokploy Community
  developer: Conduit
  category: Social
  architectures:
  - amd64
  - arm64
  version: "0.9.0"
  update_at: "2026-11-28"
  website: https://conduit.rs/
  repo: https://gitlab.com/famedly/conduit
  docs: https://docs.conduit.rs/
