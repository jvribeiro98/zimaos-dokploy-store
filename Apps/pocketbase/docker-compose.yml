name: pocketbase
services:
  pocketbase:
    image: adrianmusante/pocketbase:latest
    restart: always
    expose:
    - 8090
    volumes:
    - pocketbase-data:/pocketbase
    environment:
    - POCKETBASE_ADMIN_EMAIL=admin@example.com
    - POCKETBASE_ADMIN_PASSWORD=1dSJGX8vLZhsKeYoHFVmdH1pKja3QtPe
    - POCKETBASE_ADMIN_UPSERT=true
    - POCKETBASE_PORT_NUMBER=8090
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8090/_/
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
    - target: 8090
      published: "8090"
      protocol: tcp
volumes:
  pocketbase-data: {}
x-casaos:
  id: com.dokploy.pocketbase
  main: pocketbase
  index: /
  port_map: "8090"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/pocketbase/icon.svg
  title:
    en_US: PocketBase
  tagline:
    en_US: Open Source backend in 1 file
  description:
    en_US: Open Source backend in 1 file
  author: Dokploy Community
  developer: PocketBase
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://pocketbase.io/
  repo: https://github.com/pocketbase/pocketbase
  docs: https://pocketbase.io/docs/
