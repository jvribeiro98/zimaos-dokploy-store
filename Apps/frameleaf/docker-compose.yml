name: frameleaf
services:
  frameleaf:
    image: ghcr.io/frameleaf/frameleaf-server:frameleaf-v1.2.3
    restart: unless-stopped
    expose:
    - 2283
    volumes:
    - frameleaf-library:/data
    - frameleaf-studio-worker:/run/frameleaf/studio-worker
    environment:
      DB_HOSTNAME: frameleaf-database
      DB_USERNAME: frameleaf
      DB_PASSWORD: wsuo4DJi84HhVrVWjBgu7RfsYQncZUau
      DB_DATABASE_NAME: frameleaf
      FRAMELEAF_MACHINE_LEARNING_URL: http://frameleaf-machine-learning:3003
      TZ: Etc/UTC
    depends_on:
      frameleaf-database:
        condition: service_healthy
    shm_size: 2gb
    stop_grace_period: 10s
    healthcheck:
      disable: false
    ports:
    - target: 2283
      published: "2283"
      protocol: tcp
  frameleaf-machine-learning:
    image: ghcr.io/frameleaf/frameleaf-machine-learning:frameleaf-v1.2.3
    restart: unless-stopped
    volumes:
    - frameleaf-model-cache:/cache
    - frameleaf-studio-worker:/run/frameleaf/studio-worker:ro
    environment:
      FRAMELEAF_STUDIO_WORKER_SERVER_URL: http://frameleaf:2283
      TZ: Etc/UTC
    healthcheck:
      disable: false
  frameleaf-database:
    image: ghcr.io/frameleaf/frameleaf-postgres:19beta4-pgvector0.8.7@sha256:7b155ed85302ab66c1022309f1f70f0b79f98f70bd52af8d7d3611a0cbf08cf0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: wsuo4DJi84HhVrVWjBgu7RfsYQncZUau
      POSTGRES_USER: frameleaf
      POSTGRES_DB: frameleaf
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
    - frameleaf-postgres:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready --host=127.0.0.1 --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" && /usr/local/bin/healthcheck.sh
      interval: 30s
      start_period: 5m
      start_interval: 5s
volumes:
  frameleaf-library: null
  frameleaf-model-cache: null
  frameleaf-postgres: null
  frameleaf-studio-worker: null
x-casaos:
  id: com.dokploy.frameleaf
  main: frameleaf
  index: /
  port_map: "2283"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/frameleaf/icon.png
  title:
    en_US: Frameleaf
  tagline:
    en_US: Frameleaf is a self-hosted photo and video library with native apps, private face and s...
  description:
    en_US: Frameleaf is a self-hosted photo and video library with native apps, private face and smart search, photo and video
      editing, and optional cloud backup. It is an open-source (AGPLv3) fork of Immich and is currently in beta.
  author: Dokploy Community
  developer: Frameleaf
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.2.3"
  update_at: "2026-11-22"
  website: https://frameleaf.app/
  repo: https://github.com/Frameleaf/frameleaf-app
  docs: https://frameleaf.app/docs/start/introduction/
