name: directus
services:
  directus:
    image: directus/directus:12.1.1
    expose:
    - 8055
    volumes:
    - directus_uploads:/directus/uploads
    - directus_extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider -q http://127.0.0.1:8055/server/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    environment:
      SECRET: HHlLr9qtSF4Ed6zzbXmBmDBYlGFtwu/jJuSfS7diqmx27VRsoZEEmZs/kGSjmeY/4r55w0tCJRJMlZ28H/ABMQ==
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ThPc4ibGc3S3B6xUglfAmgj3nYBHhkxC
      CACHE_ENABLED: 'true'
      CACHE_AUTO_PURGE: 'true'
      CACHE_STORE: redis
      REDIS: redis://cache:6379
      WEBSOCKETS_ENABLED: 'true'
      PUBLIC_URL: https://localhost
      LICENSE_KEY: ''
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: VhwpUpqOhHHH9uacIS9rIgys
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    restart: unless-stopped
    ports:
    - target: 8055
      published: "8055"
      protocol: tcp
  database:
    image: postgis/postgis:13-master
    volumes:
    - directus_database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ThPc4ibGc3S3B6xUglfAmgj3nYBHhkxC
      POSTGRES_DB: directus
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready --host=localhost --username=$$POSTGRES_USER
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    restart: unless-stopped
  cache:
    image: redis:6
    healthcheck:
      test:
      - CMD-SHELL
      - '[ $$(redis-cli ping) = ''PONG'' ]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    restart: unless-stopped
volumes:
  directus_uploads: null
  directus_extensions: null
  directus_database: null
x-casaos:
  id: com.dokploy.directus
  main: directus
  index: /
  port_map: "8055"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/directus/icon.jpg
  title:
    en_US: Directus
  tagline:
    en_US: Directus is an open-source headless CMS that adds an API and admin app to your SQL data...
  description:
    en_US: Directus is an open-source headless CMS that adds an API and admin app to your SQL database. Self-host it on your
      own server with Dokploy, which deploys Directus as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Directus
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "12.1.1"
  update_at: "2026-11-23"
  website: https://directus.io/
  repo: https://github.com/directus/directus
  docs: https://directus.com/docs/
