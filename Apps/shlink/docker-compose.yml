name: shlink
services:
  shlink:
    image: shlinkio/shlink:stable
    environment:
    - INITIAL_API_KEY=Qm96yVjYPzu1wsaDt3xSonvMzTmB7S
    - DEFAULT_DOMAIN=localhost
    - IS_HTTPS_ENABLED=false
    volumes:
    - shlink-data:/etc/shlink/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080/rest/v3/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  shlink-web:
    image: shlinkio/shlink-web-client
    environment:
    - SHLINK_SERVER_API_KEY=Qm96yVjYPzu1wsaDt3xSonvMzTmB7S
    - SHLINK_SERVER_URL=http://localhost
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8080
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  shlink-data: null
x-casaos:
  id: com.dokploy.shlink
  main: shlink-web
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/shlink/icon.svg
  title:
    en_US: Shlink
  tagline:
    en_US: URL shortener that can be used to serve shortened URLs under your own domain
  description:
    en_US: URL shortener that can be used to serve shortened URLs under your own domain.
  author: Dokploy Community
  developer: Shlink
  category: Others
  architectures:
  - amd64
  - arm64
  version: "stable"
  update_at: "2026-11-28"
  website: https://shlink.io
  repo: https://github.com/shlinkio/shlink
  docs: https://shlink.io/documentation
