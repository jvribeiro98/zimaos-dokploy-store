name: imgproxy
services:
  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    expose:
    - 8080
    environment:
      IMGPROXY_KEY: 707eacab0a559d670afe8d620fcf15907a06dc4319cf707768097c294ba9a36c460a6a28b7562787748e33deee65d2253a4d4e2f2358f88f4c17c61502b711d005b4b93ec81113325121660e2876aa07a1d8e1a9af6e20a452b857bf663dd54037b06f394db3e2760127f6186144afeeca852daa741cf4b64003543a94ef7f4a
      IMGPROXY_SALT: 822812c94a558b1c23baecb267001318216e244d0e6906cf9c9415406c54c338df77879757dc02662b733f02fd22559f4c7c08c3c00ff76f26094ce095effaca6c5b80d3120b79e3f6328b50f9dd3586434161bcf3da630c532942d1be814052cbac309f9efbfdfb4bd776750104bf24ecccf7628f1240c81993e98baed32bcc
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_ENFORCE_WEBP: 'true'
      IMGPROXY_TTL: '30600'
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: 'false'
      IMGPROXY_READ_TIMEOUT: '10'
      IMGPROXY_WRITE_TIMEOUT: '10'
      IMGPROXY_KEEP_ALIVE_TIMEOUT: '10'
      IMGPROXY_DOWNLOAD_TIMEOUT: '5'
      IMGPROXY_CONCURRENCY: ''
      IMGPROXY_MAX_CLIENTS: '10'
      IMGPROXY_SO_REUSEPORT: ''
      IMGPROXY_USER_AGENT: ''
      IMGPROXY_USE_ETAG: 'true'
      IMGPROXY_QUALITY: '80'
      IMGPROXY_ALLOWED_SOURCES: http://localhost,https://localhost
      IMGPROXY_ALLOW_ORIGIN: '*'
      IMGPROXY_MAX_SRC_FILE_SIZE: '20971520'
      IMGPROXY_MAX_SRC_RESOLUTION: '50'
      IMGPROXY_LOG_LEVEL: error
  nginx:
    image: nginx:1.28.2-alpine
    restart: unless-stopped
    expose:
    - 80
    environment:
      NGINX_CACHE_LEVELS: '1:2'
      NGINX_CACHE_KEYS_ZONE_SIZE: 32m
      NGINX_CACHE_MAX_SIZE: 500m
      NGINX_CACHE_INACTIVE: 30d
      NGINX_CACHE_USE_TEMP_PATH: 'off'
      NGINX_CACHE_EXPIRES: 30d
    depends_on:
    - imgproxy
    volumes:
    - nginx-cache:/tmp/cache
    command:
    - /bin/sh
    - -c
    - "cat <<EOF > /etc/nginx/conf.d/default.conf\nproxy_cache_path /tmp/cache levels=$${NGINX_CACHE_LEVELS} keys_zone=my_cache:$${NGINX_CACHE_KEYS_ZONE_SIZE}\
      \ max_size=$${NGINX_CACHE_MAX_SIZE} inactive=$${NGINX_CACHE_INACTIVE} use_temp_path=$${NGINX_CACHE_USE_TEMP_PATH};\n\
      \nserver {\n  listen 80 default_server;\n  listen [::]:80 default_server;\n\n  location / {\n    expires $${NGINX_CACHE_EXPIRES};\n\
      \    access_log off;\n    set \\$$handle_webp 0;\n    if (\\$$http_accept ~* \"image/webp\") {\n      set \\$$handle_webp\
      \ 1;\n    }\n    proxy_cache my_cache;\n    proxy_cache_use_stale error timeout updating http_500 http_502 http_503\
      \ http_504;\n    proxy_cache_background_update on;\n    proxy_cache_lock on;\n    proxy_cache_key \"\\$$scheme\\$$host\\\
      $$uri\\$$handle_webp\";\n    server_tokens off;\n    proxy_pass http://imgproxy:8080;\n  }\n}\nEOF\nexec nginx -g 'daemon\
      \ off;'\n"
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  nginx-cache: null
x-casaos:
  id: com.dokploy.imgproxy
  main: nginx
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/imgproxy/icon.png
  title:
    en_US: imgproxy
  tagline:
    en_US: imgproxy is a fast and secure image processing server, fronted by nginx with built-in r...
  description:
    en_US: imgproxy is a fast and secure image processing server, fronted by nginx with built-in response caching for repeated
      transformations.
  author: Dokploy Community
  developer: imgproxy
  category: Media
  architectures:
  - amd64
  - arm64
  version: "3.30.1"
  update_at: "2026-11-23"
  website: https://imgproxy.net/
  repo: https://github.com/imgproxy/imgproxy
  docs: https://docs.imgproxy.net/
