name: homebox
services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest
    restart: unless-stopped
    expose:
    - '7745'
    environment:
    - TZ=Etc/UTC
    - HBOX_AUTH_API_KEY_PEPPER=hURMIqgyeDH8aEG1BLpcsaCsVxe1xPKNq2U7Y5AxmD0Jij16cxgvTnj1CLdsgDPY
    volumes:
    - homebox-data:/data
    ports:
    - target: 7745
      published: "7745"
      protocol: tcp
volumes:
  homebox-data: null
x-casaos:
  id: com.dokploy.homebox
  main: homebox
  index: /
  port_map: "7745"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/homebox/icon.svg
  title:
    en_US: Homebox
  tagline:
    en_US: Homebox is a self-hosted home inventory and organization app for tracking belongings, l...
  description:
    en_US: Homebox is a self-hosted home inventory and organization app for tracking belongings, locations, and labels.
  author: Dokploy Community
  developer: Homebox
  category: Home
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://homebox.software/
  repo: https://github.com/sysadminsmedia/homebox
  docs: https://homebox.software/en/
