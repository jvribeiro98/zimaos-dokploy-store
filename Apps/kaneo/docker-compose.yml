name: kaneo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: G0z6gI4rIcOyWbyhFptS7z9jyx9HNCnC
    volumes:
    - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.35.0
    environment:
      KANEO_CLIENT_URL: http://localhost
      AUTH_SECRET: 0789d04fbf3b0f23179f6e0af85f20a4ad057e91929bf33080fadff9fd90c290f4bd7f6d7244b08a66ac4b8661856545ffc17040151a4b602c3af616e6946965
      DATABASE_URL: postgresql://kaneo:G0z6gI4rIcOyWbyhFptS7z9jyx9HNCnC@postgres:5432/kaneo
    expose:
    - 5173
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -Y
      - 'off'
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:5173/api/health
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    ports:
    - target: 5173
      published: "5173"
      protocol: tcp
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.kaneo
  main: kaneo
  index: /
  port_map: "5173"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/kaneo/icon.png
  title:
    en_US: Kaneo
  tagline:
    en_US: Kaneo - an open source project management platform focused on simplicity and efficiency
  description:
    en_US: Kaneo - an open source project management platform focused on simplicity and efficiency. Self-host it, customize
      it, make it yours.
  author: Dokploy Community
  developer: Kaneo
  category: Others
  architectures:
  - amd64
  - arm64
  version: "2.35.0"
  update_at: "2026-11-22"
  website: https://kaneo.app/
  repo: https://github.com/usekaneo/kaneo
  docs: https://kaneo.app/docs/
