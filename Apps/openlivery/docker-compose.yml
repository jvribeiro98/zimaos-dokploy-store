name: openlivery
services:
  openlivery:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
    - '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlivery
      POSTGRES_USER: openlivery
      POSTGRES_PASSWORD: 459b5197d1ea3ce54919c2167e0fd584f8d1fa9b151b6d90895052ecd6560ae2ab891ef658ba4bc1d712ac14e2bcdf35
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openlivery -d openlivery
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://openlivery:459b5197d1ea3ce54919c2167e0fd584f8d1fa9b151b6d90895052ecd6560ae2ab891ef658ba4bc1d712ac14e2bcdf35@db:5432/openlivery
      SECRET_KEY: f6781b4214531ea8dd1beba1b09a9889f50434150f1601b7edb6f73b393aee8526ec30142ac0179afd28517528fb0cf54c0e29b123eb7c134e7a9c624732bc71
      ENCRYPTION_KEY: a783c573de0d4144be6c2e37847a7a6289c34d21b97dd279b500befd6dafa0582c5f5c31db16d3e938bb3592fabb9107815bc3d0d8edcbef41a20053c7dfb09d
      WHATSAPP_BRIDGE_TOKEN: 723e085be8d056b716a2c221dd40cf689bb56adcd2a46fe46405838f5666c7c500a8060f60f2fb3107b517940674923a5810bccbd4ec5f4516e67335f5cc9f7f
      FRONTEND_URL: http://localhost
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
      ALLOW_MULTI_AGENCY: 'false'
    volumes:
    - backend-storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  whatsapp:
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: '3101'
      WHATSAPP_BRIDGE_TOKEN: 723e085be8d056b716a2c221dd40cf689bb56adcd2a46fe46405838f5666c7c500a8060f60f2fb3107b517940674923a5810bccbd4ec5f4516e67335f5cc9f7f
      WHATSAPP_STORE_URL: postgres://openlivery:459b5197d1ea3ce54919c2167e0fd584f8d1fa9b151b6d90895052ecd6560ae2ab891ef658ba4bc1d712ac14e2bcdf35@db:5432/openlivery?sslmode=disable&search_path=whatsmeow
      WHATSAPP_LOG_LEVEL: silent
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/bridge
      - -healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data: null
  backend-storage: null
x-casaos:
  id: com.dokploy.openlivery
  main: openlivery
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openlivery/icon.png
  title:
    en_US: OpenLivery
  tagline:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and brand...
  description:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and branded portals in one self-hosted
      installation
  author: Dokploy Community
  developer: OpenLivery
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.0"
  update_at: "2026-11-24"
  website: https://www.openlivery.com
  repo: https://github.com/sarrazola/openlivery
  docs: https://github.com/sarrazola/openlivery/blob/main/docs/en/self-hosting.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
