name: openlivery
services:
  openlivery:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
    - '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlivery
      POSTGRES_USER: openlivery
      POSTGRES_PASSWORD: ba92f70c911805ff5eed74a932bf9aeab5bfda36e5913d3fc3f6c923c97f834182db9b5cd1af75654769cc6326ac9c1d
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openlivery -d openlivery
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://openlivery:ba92f70c911805ff5eed74a932bf9aeab5bfda36e5913d3fc3f6c923c97f834182db9b5cd1af75654769cc6326ac9c1d@db:5432/openlivery
      SECRET_KEY: 56b186ea1d21b770f7c22ca32d6f1a1b10c1dcb1974dd2aaf0b740ecc1186271e53717841a6786c53adab8a031fda76caa1f73eea18ce3ba84d65939943d99e6
      ENCRYPTION_KEY: 762fce0a2880c65e0d5eb169ddcf23e5c600394651cb3c6fa28aca002cf3f5c37ac96c32bf550333b834e42f68183c4fa40344a20263ef2f416b7f63223754ec
      WHATSAPP_BRIDGE_TOKEN: 72ee8c2af254f44d473e356720f83b48eb4e5951b4fff05eb981defa87bc776f5c785a1cb6834325b1de218cb0931bf80cf60217d1a59e284b4cda78a6391273
      FRONTEND_URL: http://localhost
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
      ALLOW_MULTI_AGENCY: 'false'
    volumes:
    - backend-storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  whatsapp:
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: '3101'
      WHATSAPP_BRIDGE_TOKEN: 72ee8c2af254f44d473e356720f83b48eb4e5951b4fff05eb981defa87bc776f5c785a1cb6834325b1de218cb0931bf80cf60217d1a59e284b4cda78a6391273
      WHATSAPP_STORE_URL: postgres://openlivery:ba92f70c911805ff5eed74a932bf9aeab5bfda36e5913d3fc3f6c923c97f834182db9b5cd1af75654769cc6326ac9c1d@db:5432/openlivery?sslmode=disable&search_path=whatsmeow
      WHATSAPP_LOG_LEVEL: silent
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/bridge
      - -healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data: null
  backend-storage: null
x-casaos:
  id: com.dokploy.openlivery
  main: openlivery
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openlivery/icon.png
  title:
    en_US: OpenLivery
  tagline:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and brand...
  description:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and branded portals in one self-hosted
      installation
  author: Dokploy Community
  developer: OpenLivery
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.0"
  update_at: "2026-11-25"
  website: https://www.openlivery.com
  repo: https://github.com/sarrazola/openlivery
  docs: https://github.com/sarrazola/openlivery/blob/main/docs/en/self-hosting.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
