name: openlivery
services:
  openlivery:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
    - '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlivery
      POSTGRES_USER: openlivery
      POSTGRES_PASSWORD: 63aa19a85025738bcb89118a2e725d2b2d9a01c1f46bc7a7203d3cb83e396811ef0a0870b27150b3348048dca3f8e2a3
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openlivery -d openlivery
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://openlivery:63aa19a85025738bcb89118a2e725d2b2d9a01c1f46bc7a7203d3cb83e396811ef0a0870b27150b3348048dca3f8e2a3@db:5432/openlivery
      SECRET_KEY: 78d8ef774d387be4938b4538bc48a7ee93be18b88d87d68c2a604a78e3bc8a9d790e448332ae35f6896507fed9923570fdca53bc71dedc84df699bed1d0f822a
      ENCRYPTION_KEY: 70deabd4fc42fd9810ed7f3562aaf1f7ef657ae9eefef01e24ad74bf136716c434ac7638752977fd01ca2fe252249cdb963ceb7adef4e93b7bb593fa74694147
      WHATSAPP_BRIDGE_TOKEN: 32a5432d86c6b67138466208d0b96a807c9a863ddb01098f359b1184438e34649eaaddcb80a9019d53f6a761979964f7c8f79c307a5586e30ebdbacaa2183d2b
      FRONTEND_URL: http://localhost
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
      ALLOW_MULTI_AGENCY: 'false'
    volumes:
    - backend-storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  whatsapp:
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: '3101'
      WHATSAPP_BRIDGE_TOKEN: 32a5432d86c6b67138466208d0b96a807c9a863ddb01098f359b1184438e34649eaaddcb80a9019d53f6a761979964f7c8f79c307a5586e30ebdbacaa2183d2b
      WHATSAPP_STORE_URL: postgres://openlivery:63aa19a85025738bcb89118a2e725d2b2d9a01c1f46bc7a7203d3cb83e396811ef0a0870b27150b3348048dca3f8e2a3@db:5432/openlivery?sslmode=disable&search_path=whatsmeow
      WHATSAPP_LOG_LEVEL: silent
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/bridge
      - -healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data: null
  backend-storage: null
x-casaos:
  id: com.dokploy.openlivery
  main: openlivery
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openlivery/icon.png
  title:
    en_US: OpenLivery
  tagline:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and brand...
  description:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and branded portals in one self-hosted
      installation
  author: Dokploy Community
  developer: OpenLivery
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.0"
  update_at: "2026-11-23"
  website: https://www.openlivery.com
  repo: https://github.com/sarrazola/openlivery
  docs: https://github.com/sarrazola/openlivery/blob/main/docs/en/self-hosting.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
