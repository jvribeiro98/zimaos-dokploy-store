name: openlivery
services:
  openlivery:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
    - '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlivery
      POSTGRES_USER: openlivery
      POSTGRES_PASSWORD: d5bbcbcbdb627f752486b9cf3abc9c2cecf1f64f1034a4965a1ded2d7d43ee634dcd0800753313684a5c10524243d0a8
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openlivery -d openlivery
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://openlivery:d5bbcbcbdb627f752486b9cf3abc9c2cecf1f64f1034a4965a1ded2d7d43ee634dcd0800753313684a5c10524243d0a8@db:5432/openlivery
      SECRET_KEY: 391ed04431252917cf6465ab3ec630b448479c9e56d10508e8ac9b0343ffe69d35038c6bd44cbae77325ca35054e99e08107b886975930663614ca75a3bf8e97
      ENCRYPTION_KEY: f5a62c818d1b6c4afc258d7b37e9ebc1fd8f0ae0d9b0c323d97a6d90df6eac4c460754c73d1e7d54f9078d38f71e0e94ac19a3a969cae96265d6c041a7148639
      WHATSAPP_BRIDGE_TOKEN: ca780448157775280479ddad481d3af4e7523eaac2c6fcd4019c51f1efb6788ba967ddd34b3fffd34b1aa0f729695fb655a901769ac7ccf9a67edcd2da99bbe2
      FRONTEND_URL: http://localhost
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
      ALLOW_MULTI_AGENCY: 'false'
    volumes:
    - backend-storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  whatsapp:
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: '3101'
      WHATSAPP_BRIDGE_TOKEN: ca780448157775280479ddad481d3af4e7523eaac2c6fcd4019c51f1efb6788ba967ddd34b3fffd34b1aa0f729695fb655a901769ac7ccf9a67edcd2da99bbe2
      WHATSAPP_STORE_URL: postgres://openlivery:d5bbcbcbdb627f752486b9cf3abc9c2cecf1f64f1034a4965a1ded2d7d43ee634dcd0800753313684a5c10524243d0a8@db:5432/openlivery?sslmode=disable&search_path=whatsmeow
      WHATSAPP_LOG_LEVEL: silent
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/bridge
      - -healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data: null
  backend-storage: null
x-casaos:
  id: com.dokploy.openlivery
  main: openlivery
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openlivery/icon.png
  title:
    en_US: OpenLivery
  tagline:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and brand...
  description:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and branded portals in one self-hosted
      installation
  author: Dokploy Community
  developer: OpenLivery
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.0"
  update_at: "2026-11-27"
  website: https://www.openlivery.com
  repo: https://github.com/sarrazola/openlivery
  docs: https://github.com/sarrazola/openlivery/blob/main/docs/en/self-hosting.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
