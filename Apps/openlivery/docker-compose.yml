name: openlivery
services:
  openlivery:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
    - '80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlivery
      POSTGRES_USER: openlivery
      POSTGRES_PASSWORD: 9125372abfbe4623becacf418f8ffebd5ffe045638fe668289abccaa26243f02692784d301045a7c9ebbfcf6697996b0
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U openlivery -d openlivery
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/sarrazola/openlivery-api:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://openlivery:9125372abfbe4623becacf418f8ffebd5ffe045638fe668289abccaa26243f02692784d301045a7c9ebbfcf6697996b0@db:5432/openlivery
      SECRET_KEY: 33145042abf23aedebef65428944d81382d12aaa5eac25e12c363c9ab86e687b454fc55a52cf2839352c8c73baf09c2ea019ddbd1e4e501cc4bdca1cd706ebc0
      ENCRYPTION_KEY: 4fbb42dad1fa54273e7f8c2410c04b3195e81b39fdadeb9bd1353101d38c07d732af38f7ad5d0a9051889b004ca1778eb5a7c54145a23a8b8db8c853d3748602
      WHATSAPP_BRIDGE_TOKEN: 383f0400f578e9793586ff187e7cda16b9b8679793a66e06ec27744345aeab6ef93f1bcd81db4d169ed8e0cbefc4fd623ce2a61b364cdfa6d238f3ad79ea6cdd
      FRONTEND_URL: http://localhost
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_URL: http://whatsapp:3101
      STORAGE_DIR: /app/backend/storage
      ALLOW_MULTI_AGENCY: 'false'
    volumes:
    - backend-storage:/app/backend/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ghcr.io/sarrazola/openlivery-web:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  whatsapp:
    image: ghcr.io/sarrazola/openlivery-whatsapp:v0.4.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: '3101'
      WHATSAPP_BRIDGE_TOKEN: 383f0400f578e9793586ff187e7cda16b9b8679793a66e06ec27744345aeab6ef93f1bcd81db4d169ed8e0cbefc4fd623ce2a61b364cdfa6d238f3ad79ea6cdd
      WHATSAPP_STORE_URL: postgres://openlivery:9125372abfbe4623becacf418f8ffebd5ffe045638fe668289abccaa26243f02692784d301045a7c9ebbfcf6697996b0@db:5432/openlivery?sslmode=disable&search_path=whatsmeow
      WHATSAPP_LOG_LEVEL: silent
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/bridge
      - -healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data: null
  backend-storage: null
x-casaos:
  id: com.dokploy.openlivery
  main: openlivery
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openlivery/icon.png
  title:
    en_US: OpenLivery
  tagline:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and brand...
  description:
    en_US: MIT-licensed WhatsApp AI agents for agencies, with separate client workspaces and branded portals in one self-hosted
      installation
  author: Dokploy Community
  developer: OpenLivery
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.0"
  update_at: "2026-11-22"
  website: https://www.openlivery.com
  repo: https://github.com/sarrazola/openlivery
  docs: https://github.com/sarrazola/openlivery/blob/main/docs/en/self-hosting.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
