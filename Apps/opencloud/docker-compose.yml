name: opencloud
services:
  opencloud:
    image: opencloudeu/opencloud:7.2
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
    - -c
    - opencloud init || true; opencloud server
    environment:
    - OC_URL=https://localhost
    - INITIAL_ADMIN_PASSWORD=vSBF172InQimiNP4iGMcY09Q9vbW44PS
    - IDM_ADMIN_PASSWORD=vSBF172InQimiNP4iGMcY09Q9vbW44PS}
    - PROXY_HTTP_ADDR=0.0.0.0:9200
    - PROXY_TLS=false
    - OC_INSECURE=false
    - OC_LOG_LEVEL=info
    volumes:
    - opencloud-config:/etc/opencloud
    - opencloud-data:/var/lib/opencloud
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9200/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    ports:
    - target: 9200
      published: "9200"
      protocol: tcp
volumes:
  opencloud-config: {}
  opencloud-data: {}
x-casaos:
  id: com.dokploy.opencloud
  main: opencloud
  index: /
  port_map: "9200"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/opencloud/icon.svg
  title:
    en_US: OpenCloud
  tagline:
    en_US: Open source cloud platform for secure file sync, sharing, and content collaboration
  description:
    en_US: Open source cloud platform for secure file sync, sharing, and content collaboration
  author: Dokploy Community
  developer: OpenCloud
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "7.2"
  update_at: "2026-11-23"
  website: https://opencloud.eu
  repo: https://github.com/opencloud-eu/opencloud
  docs: https://docs.opencloud.eu
