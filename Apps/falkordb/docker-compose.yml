name: falkordb
services:
  falkordb:
    image: falkordb/falkordb:v4.20.4-alpine
    restart: unless-stopped
    environment:
    - REDIS_ARGS=--requirepass aa8054ee0e97aa605227047380cada88e510df7ad7c8dbe46055bd2020b8e240 --appendonly yes
    - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000 IMPORT_FOLDER /app/.data/import
    - FALKORDB_PASSWORD=aa8054ee0e97aa605227047380cada88e510df7ad7c8dbe46055bd2020b8e240
    - AUTH_URL=https://localhost
    - AUTH_SECRET=Pc6lRjbBDex7cxyog3D8IalEjZZpihf24N32+Nwg39UNPOH+VyFm22u1ufDCrNQL
    - NEXTAUTH_URL=https://localhost
    - NEXTAUTH_SECRET=Pc6lRjbBDex7cxyog3D8IalEjZZpihf24N32+Nwg39UNPOH+VyFm22u1ufDCrNQL
    - ENCRYPTION_KEY=da3cc9c6580fb553d75de165e702a755a8b319ac141f50b10b4b5ea3bfbbb521
    - ALLOWED_ORIGINS=https://localhost
    - TRUST_PROXY_HEADERS=true
    - CSV_STORAGE=local
    - CSV_LOCAL_TEMP_DIR=/app/.data/import
    - CSV_LOCAL_LOAD_URI_MODE=file
    - API_TOKEN_STORAGE_PATH=/app/.data/api_tokens.json
    volumes:
    - falkordb_data:/var/lib/falkordb/data
    - falkordb_browser_data:/app/.data
    expose:
    - 3000
    - 6379
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH=$$FALKORDB_PASSWORD redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  falkordb_data: null
  falkordb_browser_data: null
x-casaos:
  id: com.dokploy.falkordb
  main: falkordb
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/falkordb/icon.svg
  title:
    en_US: FalkorDB
  tagline:
    en_US: A high-performance graph database for knowledge graphs, GraphRAG, agent memory, fraud d...
  description:
    en_US: A high-performance graph database for knowledge graphs, GraphRAG, agent memory, fraud detection and other relationship-heavy
      workloads. Includes the FalkorDB Browser interface.
  author: Dokploy Community
  developer: FalkorDB
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "4.20.4"
  update_at: "2026-11-24"
  website: https://www.falkordb.com/
  repo: https://github.com/FalkorDB/FalkorDB
  docs: https://docs.falkordb.com/
