name: flatnotes
services:
  flatnotes:
    image: dullage/flatnotes:latest
    restart: unless-stopped
    environment:
      PUID: '1000'
      PGID: '1000'
      FLATNOTES_AUTH_TYPE: password
      FLATNOTES_USERNAME: admin
      FLATNOTES_PASSWORD: A8DgfUwgp1kyXdVV
      FLATNOTES_SECRET_KEY: JlGTmlW2a4MjesY02PZyzITbQNdNLptw
      FLATNOTES_SESSION_EXPIRY_DAYS: '30'
      FLATNOTES_TOTP_KEY: ''
      FLATNOTES_PATH_PREFIX: ''
      FLATNOTES_QUICK_ACCESS_HIDE: 'false'
      FLATNOTES_QUICK_ACCESS_TITLE: RECENTLY MODIFIED
      FLATNOTES_QUICK_ACCESS_TERM: '*'
      FLATNOTES_QUICK_ACCESS_SORT: lastModified
      FLATNOTES_QUICK_ACCESS_LIMIT: '4'
    expose:
    - 8080
    volumes:
    - flatnotes-data:/data
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  flatnotes-data: {}
x-casaos:
  id: com.dokploy.flatnotes
  main: flatnotes
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/flatnotes/icon.png
  title:
    en_US: Flatnotes
  tagline:
    en_US: A self-hosted, modern note-taking web app that saves your notes as plain text Markdown...
  description:
    en_US: A self-hosted, modern note-taking web app that saves your notes as plain text Markdown files.
  author: Dokploy Community
  developer: Flatnotes
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://flatnotes.io
  repo: https://github.com/dullage/flatnotes
  docs: https://github.com/dullage/flatnotes
