name: komga
services:
  komga:
    image: gotson/komga:1.30.1
    restart: unless-stopped
    expose:
    - 25600
    environment:
    - TZ=UTC
    volumes:
    - config:/config
    - /DATA/AppData/komga/data:/data
    ports:
    - target: 25600
      published: "25600"
      protocol: tcp
volumes:
  config: {}
x-casaos:
  id: com.dokploy.komga
  main: komga
  index: /
  port_map: "25600"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/komga/icon.png
  title:
    en_US: Komga
  tagline:
    en_US: Komga is a media server for comics and mangas — it serves CBZ, CBR, EPUB and PDF librar...
  description:
    en_US: Komga is a media server for comics and mangas — it serves CBZ, CBR, EPUB and PDF libraries with a web reader, OPDS
      support and smart collections.
  author: Dokploy Community
  developer: Komga
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.30.1"
  update_at: "2026-11-27"
  website: https://komga.org
  repo: https://github.com/gotson/komga
  docs: https://komga.org/docs/introduction/
