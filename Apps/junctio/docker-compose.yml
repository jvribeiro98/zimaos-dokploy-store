name: junctio
services:
  junctio:
    image: ghcr.io/k2so-dev/junctio:0.2.6
    restart: unless-stopped
    expose:
    - 3000
    environment:
      JUNCTIO_SECRET: 2d3ba5377722c7ee6f883fff8378cba6d40a7527640321be251a37a94017d3f9c8f06e5e5c69649ab5092031f7ff5b14d581e261c77b4b63139c89732548fbc1
      JUNCTIO_BASE_URL: https://localhost
      JUNCTIO_TRUST_PROXY: 'true'
    volumes:
    - junctio-data:/data
    - junctio-cache:/cache
    tmpfs:
    - /tmp
    read_only: true
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  junctio-data: {}
  junctio-cache: {}
x-casaos:
  id: com.dokploy.junctio
  main: junctio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/junctio/icon.png
  title:
    en_US: Junctio
  tagline:
    en_US: Self-hosted MCP gateway that puts stdio, Docker and remote MCP servers behind one endpo...
  description:
    en_US: Self-hosted MCP gateway that puts stdio, Docker and remote MCP servers behind one endpoint per client, with API
      key or OAuth downstream auth and upstream tokens refreshed before they expire.
  author: Dokploy Community
  developer: Junctio
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.2.6"
  update_at: "2026-11-24"
  website: https://junctio.org
  repo: https://github.com/k2so-dev/junctio
  docs: https://junctio.org/docs/
