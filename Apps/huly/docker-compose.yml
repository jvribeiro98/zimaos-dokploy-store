name: huly
services:
  nginx:
    image: nginx:1.21.3
    expose:
    - 80
    volumes:
    - /DATA/AppData/$AppID/volumes/nginx/.huly.nginx:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  mongodb:
    image: mongo:7-jammy
    environment:
    - PUID=1000
    - PGID=1000
    volumes:
    - db:/data/db
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
    - files:/data
    restart: unless-stopped
  elastic:
    image: elasticsearch:7.14.2
    command: '/bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin
      install --silent ingest-attachment;

      /usr/local/bin/docker-entrypoint.sh eswrapper"

      '
    volumes:
    - elastic:/usr/share/elasticsearch/data
    environment:
    - ELASTICSEARCH_PORT_NUMBER=9200
    - BITNAMI_DEBUG=true
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    - http.cors.enabled=true
    - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION}
    environment:
    - SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION}
    environment:
    - SERVER_PORT=3333
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - SERVER_CURSOR_MAXTIMEMS=30000
    - DB_URL=mongodb://mongodb:27017
    - MONGO_URL=mongodb://mongodb:27017
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - FRONT_URL=http://localhost:8087
    - ACCOUNTS_URL=http://account:3000
    - FULLTEXT_URL=http://fulltext:4700
    - STATS_URL=http://stats:4900
    - LAST_NAME_FIRST=true
    restart: unless-stopped
  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION}
    environment:
    - COLLABORATOR_PORT=3078
    - SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - ACCOUNTS_URL=http://account:3000
    - DB_URL=mongodb://mongodb:27017
    - STATS_URL=http://stats:4900
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped
  account:
    image: hardcoreeng/account:${HULY_VERSION}
    environment:
    - SERVER_PORT=3000
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - DB_URL=mongodb://mongodb:27017
    - MONGO_URL=mongodb://mongodb:27017
    - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://localhost/_transactor
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - FRONT_URL=http://front:8080
    - STATS_URL=http://stats:4900
    - MODEL_ENABLED=*
    - ACCOUNTS_URL=http://localhost:3000
    - ACCOUNT_PORT=3000
    restart: unless-stopped
  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION}
    environment:
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - DB_URL=mongodb://mongodb:27017
    - MONGO_URL=mongodb://mongodb:27017
    - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://localhost/_transactor
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - MODEL_ENABLED=*
    - ACCOUNTS_URL=http://account:3000
    - STATS_URL=http://stats:4900
    restart: unless-stopped
  front:
    image: hardcoreeng/front:${HULY_VERSION}
    environment:
    - SERVER_PORT=8080
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - LOVE_ENDPOINT=http${SECURE:+s}://localhost/_love
    - ACCOUNTS_URL=http${SECURE:+s}://localhost/_accounts
    - REKONI_URL=http${SECURE:+s}://localhost/_rekoni
    - CALENDAR_URL=http${SECURE:+s}://localhost/_calendar
    - GMAIL_URL=http${SECURE:+s}://localhost/_gmail
    - TELEGRAM_URL=http${SECURE:+s}://localhost/_telegram
    - STATS_URL=http${SECURE:+s}://localhost/_stats
    - UPLOAD_URL=/files
    - ELASTIC_URL=http://elastic:9200
    - COLLABORATOR_URL=ws${SECURE:+s}://localhost/_collaborator
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - DB_URL=mongodb://mongodb:27017
    - MONGO_URL=mongodb://mongodb:27017
    - TITLE=Huly
    - DEFAULT_LANGUAGE=en
    - LAST_NAME_FIRST=true
    - DESKTOP_UPDATES_CHANNEL=selfhost
    restart: unless-stopped
  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION}
    environment:
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    - DB_URL=mongodb://mongodb:27017
    - FULLTEXT_DB_URL=http://elastic:9200
    - ELASTIC_INDEX_NAME=huly_storage_index
    - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    - REKONI_URL=http://rekoni:4004
    - ACCOUNTS_URL=http://account:3000
    - STATS_URL=http://stats:4900
    restart: unless-stopped
  stats:
    image: hardcoreeng/stats:${HULY_VERSION}
    environment:
    - PORT=4900
    - SERVER_SECRET=dWq9XqGoY8AWwNPkRp3HC/P0F+y+H6n19kveENNFzRGx2yikOppa9BbEkwvD4tDBDP1f0j8ws9hcXLyTJlkTtA==
    restart: unless-stopped
volumes:
  db: null
  elastic: null
  files: null
x-casaos:
  id: com.dokploy.huly
  main: nginx
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/huly/icon.svg
  title:
    en_US: Huly
  tagline:
    en_US: Huly is an all-in-one project management platform and an alternative to Linear and Jira
  description:
    en_US: Huly is an all-in-one project management platform and an alternative to Linear and Jira. Self-host it on your own
      server with Dokploy, which deploys Huly as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Huly
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.6.377"
  update_at: "2026-11-24"
  website: https://huly.io/
  repo: https://github.com/hcengineering/huly-selfhost
  docs: https://docs.huly.io/
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (volumes/nginx/.huly.nginx).
        Review environment variables before starting.
