name: pairdrop
services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    restart: unless-stopped
    expose:
    - '3000'
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    volumes:
    - pairdrop-config:/config
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  pairdrop-config: null
x-casaos:
  id: com.dokploy.pairdrop
  main: pairdrop
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/pairdrop/icon.svg
  title:
    en_US: PairDrop
  tagline:
    en_US: PairDrop is a self-hosted local file sharing web app for sending files and text between...
  description:
    en_US: PairDrop is a self-hosted local file sharing web app for sending files and text between nearby devices.
  author: Dokploy Community
  developer: PairDrop
  category: Others
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://pairdrop.net/
  repo: https://github.com/schlagmichdoch/PairDrop
  docs: https://github.com/schlagmichdoch/PairDrop/blob/master/docs/host-your-own.md
