name: aptabase
services:
  aptabase_db:
    image: postgres:15-alpine
    restart: always
    volumes:
    - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: aptabase
      POSTGRES_PASSWORD: sTr0NGp4ssw0rd
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U aptabase
      interval: 10s
      timeout: 5s
      retries: 5
  aptabase_events_db:
    image: clickhouse/clickhouse-server:23.8.16.16-alpine
    restart: always
    volumes:
    - events-db-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: aptabase
      CLICKHOUSE_PASSWORD: sTr0NGp4ssw0rd
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8123 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  aptabase:
    image: ghcr.io/aptabase/aptabase:main
    restart: always
    environment:
      BASE_URL: http://localhost
      AUTH_SECRET: rBcVanh8nuE4eQZOI+tKNX9KRejkTEVRCkxZIzqkBlM=
      DATABASE_URL: Server=aptabase_db;Port=5432;User Id=aptabase;Password=sTr0NGp4ssw0rd;Database=aptabase
      CLICKHOUSE_URL: Host=aptabase_events_db;Port=8123;Username=aptabase;Password=sTr0NGp4ssw0rd
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  db-data:
    driver: local
  events-db-data:
    driver: local
x-casaos:
  id: com.dokploy.aptabase
  main: aptabase
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/aptabase/icon.svg
  title:
    en_US: Aptabase
  tagline:
    en_US: Aptabase is a self-hosted web analytics platform that lets you track website traffic an...
  description:
    en_US: Aptabase is a self-hosted web analytics platform that lets you track website traffic and user behavior.
  author: Dokploy Community
  developer: Aptabase
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://aptabase.com/
  repo: https://github.com/aptabase/aptabase
  docs: https://github.com/aptabase/aptabase/blob/main/README.md
