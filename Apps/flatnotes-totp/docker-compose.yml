name: flatnotes-totp
services:
  flatnotes:
    image: dullage/flatnotes:latest
    restart: unless-stopped
    environment:
      PUID: '1000'
      PGID: '1000'
      FLATNOTES_AUTH_TYPE: totp
      FLATNOTES_USERNAME: admin
      FLATNOTES_PASSWORD: W0JP5vnFw3D8U3Io
      FLATNOTES_SECRET_KEY: 8LFszltx3x73p0kLt03ktH7IdQTIL1BC
      FLATNOTES_TOTP_KEY: 4RlFOYu7zpTI1VXP36GyKpfNiTn2fRZD
      FLATNOTES_SESSION_EXPIRY_DAYS: '30'
      FLATNOTES_PATH_PREFIX: ''
    expose:
    - 8080
    volumes:
    - flatnotes-data:/data
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  flatnotes-data: {}
x-casaos:
  id: com.dokploy.flatnotes-totp
  main: flatnotes
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/flatnotes-totp/icon.png
  title:
    en_US: Flatnotes (TOTP)
  tagline:
    en_US: Flatnotes with TOTP authentication enabled (username + password + one-time passcode)
  description:
    en_US: Flatnotes with TOTP authentication enabled (username + password + one-time passcode).
  author: Dokploy Community
  developer: Flatnotes (TOTP)
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://flatnotes.io
  repo: https://github.com/dullage/flatnotes
  docs: https://github.com/dullage/flatnotes
