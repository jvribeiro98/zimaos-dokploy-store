name: bigcapital
services:
  webapp:
    image: bigcapitalhq/webapp:latest
    restart: unless-stopped
    depends_on:
    - server
    expose:
    - '80'
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  server:
    image: bigcapitalhq/server:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    expose:
    - '3000'
    environment:
    - MAIL_HOST=
    - MAIL_USERNAME=
    - MAIL_PASSWORD=
    - MAIL_PORT=587
    - MAIL_SECURE=false
    - MAIL_FROM_NAME=BigCapital
    - MAIL_FROM_ADDRESS=noreply@localhost
    - DB_HOST=mysql
    - DB_USER=bigcapital
    - DB_PASSWORD=Jes0yBGCeQFnSzJkCBc9xOT5aSh6beqK
    - DB_CHARSET=utf8mb4
    - SYSTEM_DB_NAME=bigcapital
    - TENANT_DB_NAME_PERFIX=bigcapital_tenant_
    - JWT_SECRET=979fab05facae072d3381ea523321695d3baf3c268130e22aff2bb789792b71d6a996eed2354a4193a7464f0709997315b8ef6d00a45ed7212f3cdc819bc9d1c
    - MONGODB_DATABASE_URL=mongodb://mongo/bigcapital
    - BASE_URL=https://localhost
    - AGENDASH_AUTH_USER=admin
    - AGENDASH_AUTH_PASSWORD=ek2sTdG88RGjbc4Zcnl6Kg9Y
    - SIGNUP_DISABLED=false
    - SIGNUP_ALLOWED_DOMAINS=
    - SIGNUP_ALLOWED_EMAILS=
    - SIGNUP_EMAIL_CONFIRMATION=false
    - GOTENBERG_URL=http://gotenberg:9000
    - GOTENBERG_DOCS_URL=http://gotenberg:9000
    - EXCHANGE_RATE_SERVICE=openexchangerates
    - OPEN_EXCHANGE_RATE_APP_ID=
    - BANKING_CONNECT=false
    - PLAID_ENV=sandbox
    - PLAID_CLIENT_ID=
    - PLAID_SECRET=
    - PLAID_LINK_WEBHOOK=
    - LEMONSQUEEZY_API_KEY=
    - LEMONSQUEEZY_STORE_ID=
    - LEMONSQUEEZY_WEBHOOK_SECRET=
    - HOSTED_ON_BIGCAPITAL_CLOUD=false
    - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=false
    - NEW_RELIC_LOG=false
    - NEW_RELIC_AI_MONITORING_ENABLED=false
    - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=10000
    - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=10000
    - NEW_RELIC_LICENSE_KEY=
    - NEW_RELIC_APP_NAME=BigCapital
    - S3_REGION=
    - S3_ACCESS_KEY_ID=
    - S3_SECRET_ACCESS_KEY=
    - S3_ENDPOINT=
    - S3_BUCKET=
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
    - MYSQL_DATABASE=bigcapital
    - MYSQL_USER=bigcapital
    - MYSQL_PASSWORD=Jes0yBGCeQFnSzJkCBc9xOT5aSh6beqK
    - MYSQL_ROOT_PASSWORD=FfPE2N1fHxPKPBeduSfMaHlJnH4NmLsJ
    volumes:
    - mysql:/var/lib/mysql
    expose:
    - '3306'
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mongo:
    image: mongo:7
    restart: unless-stopped
    expose:
    - '27017'
    volumes:
    - mongo:/data/db
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
    - '6379'
    volumes:
    - redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
    - '9000'
volumes:
  mysql:
    name: bigcapital_mysql
    driver: local
  mongo:
    name: bigcapital_mongo
    driver: local
  redis:
    name: bigcapital_redis
    driver: local
x-casaos:
  id: com.dokploy.bigcapital
  main: webapp
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/bigcapital/icon.svg
  title:
    en_US: BigCapital
  tagline:
    en_US: BigCapital is a great open source alternative to QuickBooks
  description:
    en_US: BigCapital is a great open source alternative to QuickBooks. A comprehensive accounting and financial management
      system for businesses.
  author: Dokploy Community
  developer: BigCapital
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://bigcapital.app/
  repo: https://github.com/bigcapitalhq/bigcapital
  docs: https://github.com/bigcapitalhq/bigcapital
