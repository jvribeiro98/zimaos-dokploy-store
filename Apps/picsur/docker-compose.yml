name: picsur
services:
  picsur:
    image: ghcr.io/caramelfur/picsur:latest
    restart: unless-stopped
    environment:
      PICSUR_DB_HOST: picsur_postgres
      PICSUR_DB_PORT: '5432'
      PICSUR_DB_USERNAME: picsur
      PICSUR_DB_PASSWORD: cEBtBL1EB2DWj5Q5B50jWRhfiiUQdZfK
      PICSUR_DB_DATABASE: picsur
      PICSUR_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PICSUR_JWT_SECRET: ${JWT_SECRET}
    expose:
    - 8080
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  picsur_postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: picsur
      POSTGRES_USER: picsur
      POSTGRES_PASSWORD: cEBtBL1EB2DWj5Q5B50jWRhfiiUQdZfK
    volumes:
    - picsur-data:/var/lib/postgresql/data
volumes:
  picsur-data: {}
x-casaos:
  id: com.dokploy.picsur
  main: picsur
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/picsur/icon.png
  title:
    en_US: Picsur
  tagline:
    en_US: Picsur is a simple, self-hosted image hosting service with an admin interface and Postg...
  description:
    en_US: Picsur is a simple, self-hosted image hosting service with an admin interface and Postgres backend.
  author: Dokploy Community
  developer: Picsur
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://github.com/CaramelFur/picsur
  repo: https://github.com/CaramelFur/picsur
  docs: https://github.com/CaramelFur/picsur#readme
