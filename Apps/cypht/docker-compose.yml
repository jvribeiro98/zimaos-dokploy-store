name: cypht
services:
  cypht:
    image: cypht/cypht:2.13.0
    restart: unless-stopped
    depends_on:
      cypht-db:
        condition: service_healthy
      cypht-redis:
        condition: service_healthy
    expose:
    - 80
    environment:
      AUTH_USERNAME: admin
      AUTH_PASSWORD: 2wK3fpcTpXdT3X07DtDETucJ
      ADMIN_USERS: admin
      AUTH_TYPE: DB
      USER_CONFIG_TYPE: DB
      DB_CONNECTION_TYPE: host
      DB_DRIVER: mysql
      DB_HOST: cypht-db
      DB_PORT: '3306'
      DB_NAME: cypht
      DB_USER: cypht
      DB_PASS: biwHQURfz3Q5cMfFHE4oXDizi2jsRyrO
      SESSION_TYPE: REDIS
      ENABLE_REDIS: 'true'
      REDIS_SERVER: cypht-redis
      REDIS_PORT: '6379'
      REDIS_PASS: r7IEBlxR0wVFuD3GxgDEZVT9uY0z2PYA
      REDIS_SOCKET: ''
      ENABLE_MEMCACHED: 'false'
      ENCRYPT_LOCAL_STORAGE: 'true'
    volumes:
    - cypht-attachments:/var/lib/hm3/attachments
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  cypht-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: cypht
      MARIADB_USER: cypht
      MARIADB_PASSWORD: biwHQURfz3Q5cMfFHE4oXDizi2jsRyrO
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
    - cypht-db:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
  cypht-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: r7IEBlxR0wVFuD3GxgDEZVT9uY0z2PYA
    command:
    - sh
    - -c
    - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
    - cypht-redis:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  cypht-attachments: {}
  cypht-db: {}
  cypht-redis: {}
x-casaos:
  id: com.dokploy.cypht
  main: cypht
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/cypht/icon.svg
  title:
    en_US: Cypht
  tagline:
    en_US: Lightweight open source webmail aggregator
  description:
    en_US: Lightweight open source webmail aggregator. Read and send mail from multiple IMAP, SMTP, JMAP and EWS accounts
      in one place.
  author: Dokploy Community
  developer: Cypht
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2.13.0"
  update_at: "2026-11-23"
  website: https://cypht.org/
  repo: https://github.com/cypht-org/cypht
  docs: https://cypht.org/install.html
