  main: agent-zero
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/agent-zero/icon.svg
  title:
    en_US: Agent Zero
  tagline:
    en_US: Agent Zero is an open-source autonomous AI agent framework with memory and tool use cap...
  description:
    en_US: Agent Zero is an open-source autonomous AI agent framework with memory and tool use capabilities.
  author: Dokploy Community
  developer: Agent Zero
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.9"
  update_at: "2026-11-28"
  website: https://www.agent-zero.ai
  repo: https://github.com/agent0ai/agent-zero
  docs: https://www.agent-zero.ai/p/docs/
