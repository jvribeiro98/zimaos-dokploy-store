name: agent-zero
services:
  agent-zero:
    image: agent0ai/agent-zero:v1.9
    restart: unless-stopped
    expose:
    - '80'
    environment:
    - AUTH_LOGIN=admin
    - AUTH_PASSWORD=VG48l5yuUlmytwz9b0rVu54Qn71lX8KG
    volumes:
    - agent-zero-data:/a0/usr
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  agent-zero-data: null
x-casaos:
