name: beszel
services:
  beszel:
    image: henrygd/beszel:0.10.2
    restart: unless-stopped
    expose:
    - 8090
    volumes:
    - beszel_data:/beszel_data
    - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
    - target: 8090
      published: "8090"
      protocol: tcp
volumes:
  beszel_data: {}
x-casaos:
  id: com.dokploy.beszel
  main: beszel
  index: /
  port_map: "8090"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/beszel/icon.svg
  title:
    en_US: Beszel
  tagline:
    en_US: A lightweight server monitoring hub with historical data, docker stats, and alerts
  description:
    en_US: A lightweight server monitoring hub with historical data, docker stats, and alerts.
  author: Dokploy Community
  developer: Beszel
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.10.2"
  update_at: "2026-11-27"
  website: https://beszel.dev
  repo: https://github.com/henrygd/beszel
  docs: https://beszel.dev/guide/getting-started
