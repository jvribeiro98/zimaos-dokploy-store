name: crawlab-worker
services:
  crawlab-worker:
    image: crawlabteam/crawlab:latest
    restart: unless-stopped
    environment:
    - CRAWLAB_NODE_MASTER=N
    - CRAWLAB_GRPC_ADDRESS=<master_node_ip>:9666
    - CRAWLAB_FS_FILER_URL=http://<master_node_ip>:8080/api/filer
    volumes:
    - crawlab-worker-data:/root/.crawlab
    - crawlab-worker-app:/data
    deploy:
      resources:
        limits:
          cpus: ${CPU_LIMIT:-0.8}
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  crawlab-worker-data: null
  crawlab-worker-app: null
x-casaos:
  id: com.dokploy.crawlab-worker
  main: crawlab-worker
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/crawlab-worker/icon.jpeg
  title:
    en_US: Crawlab (Worker)
  tagline:
    en_US: Crawlab worker node for distributed web crawling
  description:
    en_US: Crawlab worker node for distributed web crawling. Connects to an existing Crawlab master node via gRPC.
  author: Dokploy Community
  developer: Crawlab (Worker)
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://crawlab.cn
  repo: https://github.com/crawlab-team/crawlab
  docs: https://docs.crawlab.cn
