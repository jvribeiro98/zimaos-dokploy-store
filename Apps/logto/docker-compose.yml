name: logto
services:
  app:
    image: ghcr.io/logto-io/logto:1.41.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
    - sh
    - -c
    - npm run cli db seed -- --swe && npm start
    environment:
      TRUST_PROXY_HEADER: '1'
      DB_URL: postgres://logto:vkeWONXrLwLy1BlxdTjXxmaCG2v9CRoO@postgres:5432/logto
      ENDPOINT: http://localhost
      ADMIN_ENDPOINT: http://localhost
    volumes:
    - logto-connectors:/etc/logto/packages/core/connectors
    ports:
    - target: 3001
      published: "3001"
      protocol: tcp
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: vkeWONXrLwLy1BlxdTjXxmaCG2v9CRoO
      POSTGRES_DB: logto
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U logto -d logto
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  logto-connectors: null
  postgres-data: null
x-casaos:
  id: com.dokploy.logto
  main: app
  index: /
  port_map: "3001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/logto/icon.png
  title:
    en_US: Logto
  tagline:
    en_US: Logto is an open-source Identity and Access Management (IAM) platform designed to strea...
  description:
    en_US: Logto is an open-source Identity and Access Management (IAM) platform designed to streamline Customer Identity
      and Access Management (CIAM) and Workforce Identity Management.
  author: Dokploy Community
  developer: Logto
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.41.0"
  update_at: "2026-11-22"
  website: https://logto.io/
  repo: https://github.com/logto-io/logto
  docs: https://docs.logto.io/introduction
