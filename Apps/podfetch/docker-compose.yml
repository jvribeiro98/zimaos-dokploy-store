name: podfetch
services:
  podfetch:
    image: samuel19982/podfetch:v5.2.2
    restart: unless-stopped
    environment:
    - DATABASE_URL=sqlite:///app/db/podcast.db
    - POLLING_INTERVAL=300
    - BASIC_AUTH=true
    - USERNAME=admin
    - PASSWORD=onkmqWKEf9pPYgrBhqZeqCEh
    - GPODDER_INTEGRATION_ENABLED=true
    volumes:
    - podfetch-podcasts:/app/podcasts
    - podfetch-db:/app/db
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
volumes:
  podfetch-podcasts: {}
  podfetch-db: {}
x-casaos:
  id: com.dokploy.podfetch
  main: podfetch
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/podfetch/icon.png
  title:
    en_US: PodFetch
  tagline:
    en_US: PodFetch is a sleek, self-hosted podcast manager that automatically downloads new episo...
  description:
    en_US: PodFetch is a sleek, self-hosted podcast manager that automatically downloads new episodes, offers a web UI for
      listening and managing podcasts, and provides a GPodder-compatible sync API for mobile apps like AntennaPod.
  author: Dokploy Community
  developer: PodFetch
  category: Media
  architectures:
  - amd64
  - arm64
  version: "5.2.2"
  update_at: "2026-11-27"
  website: https://samtv12345.github.io/PodFetch/
  repo: https://github.com/SamTV12345/PodFetch
  docs: https://samtv12345.github.io/PodFetch/
