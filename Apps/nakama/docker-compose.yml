name: nakama
services:
  nakama:
    image: ghcr.io/ahmadrosid/nakama:0.4.71
    restart: unless-stopped
    expose:
    - 4310
    environment:
      NAKAMA_CONFIG_DIR: /nakama/data
      NAKAMA_BACKUP_DIR: /nakama/backups
      NAKAMA_UPDATER_DIR: /nakama/updates
      NAKAMA_SECRETS_KEY: e8hzMJ33zAtrzdMvzM+Itq01Bb3rRXTWV+9OOzlU458=
      NAKAMA_WEB_PUBLIC_URL: https://localhost
      NAKAMA_TRUST_PROXY: 'true'
    volumes:
    - nakama-data:/nakama/data
    - nakama-backups:/nakama/backups
    - nakama-updates:/nakama/updates
    ports:
    - target: 4310
      published: "4310"
      protocol: tcp
  updater:
    image: docker:29-cli
    profiles:
    - updater
    environment:
    - DOCKER_HOST=unix:///var/run/docker.sock
    - NAKAMA_IMAGE=ghcr.io/ahmadrosid/nakama:${NAKAMA_VERSION:-latest}
    entrypoint:
    - sh
    - -c
    - docker run --rm --entrypoint cat "$$NAKAMA_IMAGE" /app/scripts/nakama-updater.sh > /tmp/updater.sh && exec sh /tmp/updater.sh
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - .:/compose
    - nakama-updates:/updates
    restart: unless-stopped
volumes:
  nakama-data: null
  nakama-backups: null
  nakama-updates: null
x-casaos:
  id: com.dokploy.nakama
  main: nakama
  index: /
  port_map: "4310"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/nakama/icon.svg
  title:
    en_US: Nakama
  tagline:
    en_US: 'AI agent platform for teams: a shared workspace where agents get their own tools, skill...'
  description:
    en_US: 'AI agent platform for teams: a shared workspace where agents get their own tools, skills, memory and channels
      (Telegram, WhatsApp, Discord, Slack) with orgs, invites and roles built in.'
  author: Dokploy Community
  developer: Nakama
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.4.71"
  update_at: "2026-11-22"
  website: https://getnakama.cloud
  repo: https://github.com/ahmadrosid/nakama
  docs: https://ahmadrosid.github.io/nakama/
