name: hortusfox
services:
  app:
    image: ghcr.io/danielbrendel/hortusfox-web:latest
    restart: unless-stopped
    volumes:
    - app_images:/var/www/html/public/img
    - app_logs:/var/www/html/app/logs
    - app_backup:/var/www/html/public/backup
    - app_themes:/var/www/html/public/themes
    - app_migrate:/var/www/html/app/migrations
    environment:
      APP_ADMIN_EMAIL: admin@example.com
      APP_ADMIN_PASSWORD: 9voC3XadZ7kvX6pC
      APP_TIMEZONE: UTC
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: hortusfox
      DB_USERNAME: hortususer
      DB_PASSWORD: HeJVKQOKtgtVTixA3Obf
      DB_CHARSET: utf8mb4
    depends_on:
    - db
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: 7BmErtbuEqJAfYSoKvjBPggJ
      MARIADB_DATABASE: hortusfox
      MARIADB_USER: hortususer
      MARIADB_PASSWORD: HeJVKQOKtgtVTixA3Obf
    volumes:
    - db_data:/var/lib/mysql
volumes:
  db_data: null
  app_images: null
  app_logs: null
  app_backup: null
  app_themes: null
  app_migrate: null
x-casaos:
  id: com.dokploy.hortusfox
  main: app
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/hortusfox/icon.png
  title:
    en_US: HortusFox
  tagline:
    en_US: HortusFox is an open source task and photo management app, designed for photographers a...
  description:
    en_US: HortusFox is an open source task and photo management app, designed for photographers and creatives to manage projects,
      tasks, and images effectively.
  author: Dokploy Community
  developer: HortusFox
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "5.0"
  update_at: "2026-11-26"
  website: https://www.hortusfox.com
  repo: https://github.com/danielbrendel/hortusfox-web
  docs: https://github.com/danielbrendel/hortusfox-web#readme
