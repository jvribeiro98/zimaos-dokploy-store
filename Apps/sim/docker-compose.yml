name: sim
services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:X4yy7uO5zbtUTUxUwnAHNLg8O38XasSc@db:5432/simstudio
    - BETTER_AUTH_URL=http://localhost
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_SECRET=f7gIzNuUh7xwkqGFd6RejeoLOf9oN9us
    - ENCRYPTION_KEY=d4f41d37860103ae1996d4421286fa828f2db164c1585a2305ec661ea43536457048d828018ba6733a21133f0ba9bed2c0a43f59e623b4aae1fdade6c36e47df
    - API_ENCRYPTION_KEY=8d4b7755d4e93a2f8c7a7524e9b4a7de4d863702186f796a1ebf7fd541b8b4f9c518852756392477a08f9653d5f2bcba592732afecc8816038b6f8d122ce5a86
    - INTERNAL_API_SECRET=JJajJITCYRm2cJC7Fwt86Cd9ztsbCm05
    - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  realtime:
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:X4yy7uO5zbtUTUxUwnAHNLg8O38XasSc@db:5432/simstudio
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_URL=http://localhost
    - BETTER_AUTH_SECRET=f7gIzNuUh7xwkqGFd6RejeoLOf9oN9us
    - INTERNAL_API_SECRET=JJajJITCYRm2cJC7Fwt86Cd9ztsbCm05
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
    - DATABASE_URL=postgresql://postgres:X4yy7uO5zbtUTUxUwnAHNLg8O38XasSc@db:5432/simstudio
    depends_on:
      db:
        condition: service_healthy
    command:
    - bun
    - run
    - db:migrate
    restart: 'no'
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=X4yy7uO5zbtUTUxUwnAHNLg8O38XasSc
    - POSTGRES_DB=simstudio
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.sim
  main: simstudio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sim/icon.svg
  title:
    en_US: Sim
  tagline:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows
  description:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows.
  author: Dokploy Community
  developer: Sim
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://sim.ai
  repo: https://github.com/simstudioai/sim
  docs: https://docs.sim.ai
