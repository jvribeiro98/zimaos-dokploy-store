name: sim
services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:WNm2YF1XBadDMhmGh4qGmgeqne90GJxx@db:5432/simstudio
    - BETTER_AUTH_URL=http://localhost
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_SECRET=FyA2wfPYz48M8Ny5q1yrQSyd9zFiUg9W
    - ENCRYPTION_KEY=75319cf2ef7ec917698c5d80716f6a148fe7e64152672551fc51e6f137c2f3d70e545f3c0b7e1f2048484dee012ede33eda5f57f242dda36280e35c63574ff65
    - API_ENCRYPTION_KEY=e6235338eed3bb0e40ed6f334162617e324da14f6e5be3b213eeb106e16b2fad5a67cb5d255efbc3de8ff3479d7cf5a83ecaad7c73c64656fad4d0aae80ae5fb
    - INTERNAL_API_SECRET=f0YaswyvMfeI48BC6bcGgQ76mmAqSHjZ
    - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  realtime:
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:WNm2YF1XBadDMhmGh4qGmgeqne90GJxx@db:5432/simstudio
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_URL=http://localhost
    - BETTER_AUTH_SECRET=FyA2wfPYz48M8Ny5q1yrQSyd9zFiUg9W
    - INTERNAL_API_SECRET=f0YaswyvMfeI48BC6bcGgQ76mmAqSHjZ
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
    - DATABASE_URL=postgresql://postgres:WNm2YF1XBadDMhmGh4qGmgeqne90GJxx@db:5432/simstudio
    depends_on:
      db:
        condition: service_healthy
    command:
    - bun
    - run
    - db:migrate
    restart: 'no'
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=WNm2YF1XBadDMhmGh4qGmgeqne90GJxx
    - POSTGRES_DB=simstudio
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.sim
  main: simstudio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sim/icon.svg
  title:
    en_US: Sim
  tagline:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows
  description:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows.
  author: Dokploy Community
  developer: Sim
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://sim.ai
  repo: https://github.com/simstudioai/sim
  docs: https://docs.sim.ai
