name: sim
services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:DUv0nebxbR5Gqgkk2UfjVA4T4G4DucZq@db:5432/simstudio
    - BETTER_AUTH_URL=http://localhost
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_SECRET=MmFl8Fr9WjWsHNB6KMmtZBIm3sbjFcRJ
    - ENCRYPTION_KEY=0ebc7f9eb1ad71a084d8ec591467d1ba9ccc9e5bf191555921783a4514e04786d54bf837dec11a469538dcae804d223b61d3afc3b2d203d51fb1c305e36e1456
    - API_ENCRYPTION_KEY=ad8806d247d0ceedeac5f9cd67f1a9e9834f16c32ec3eab01ac75403e0dcca3c538d88bc03a991f4407a4eca22f053bc96e6ae3a9608c7c2b8c7a63c496004ba
    - INTERNAL_API_SECRET=jBL7ryWadODjSt03X4BjbMY9wRe0yYzb
    - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  realtime:
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:DUv0nebxbR5Gqgkk2UfjVA4T4G4DucZq@db:5432/simstudio
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_URL=http://localhost
    - BETTER_AUTH_SECRET=MmFl8Fr9WjWsHNB6KMmtZBIm3sbjFcRJ
    - INTERNAL_API_SECRET=jBL7ryWadODjSt03X4BjbMY9wRe0yYzb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
    - DATABASE_URL=postgresql://postgres:DUv0nebxbR5Gqgkk2UfjVA4T4G4DucZq@db:5432/simstudio
    depends_on:
      db:
        condition: service_healthy
    command:
    - bun
    - run
    - db:migrate
    restart: 'no'
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=DUv0nebxbR5Gqgkk2UfjVA4T4G4DucZq
    - POSTGRES_DB=simstudio
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.sim
  main: simstudio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sim/icon.svg
  title:
    en_US: Sim
  tagline:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows
  description:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows.
  author: Dokploy Community
  developer: Sim
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://sim.ai
  repo: https://github.com/simstudioai/sim
  docs: https://docs.sim.ai
