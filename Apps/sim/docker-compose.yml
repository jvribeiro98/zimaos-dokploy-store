name: sim
services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:0Caz9MiufRQN0x2pr6NAyadj2rTWmujM@db:5432/simstudio
    - BETTER_AUTH_URL=http://localhost
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_SECRET=rSpO1KW40LFAXHarWlJqftC0zqRue57T
    - ENCRYPTION_KEY=b3b4fd78723262860bb01f881129a20d0b458ddb069142eb7dd24e21dfb571a77fafa16c32cd7fbecac40528c0e9f44688d893ca8bcf3adbcf09509e3dc6f225
    - API_ENCRYPTION_KEY=d7851e370a85e959d5eef8ed835e83c7f91395ac1b4ccf4af449099fd918f1f0180a180024c491bc19fc8ae0b46ea567067c4f5fcc18a9101142f88f2d141c77
    - INTERNAL_API_SECRET=HP0U4Qddz2b1vVG6GLkkGD1agiNXcGUb
    - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  realtime:
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:0Caz9MiufRQN0x2pr6NAyadj2rTWmujM@db:5432/simstudio
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_URL=http://localhost
    - BETTER_AUTH_SECRET=rSpO1KW40LFAXHarWlJqftC0zqRue57T
    - INTERNAL_API_SECRET=HP0U4Qddz2b1vVG6GLkkGD1agiNXcGUb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
    - DATABASE_URL=postgresql://postgres:0Caz9MiufRQN0x2pr6NAyadj2rTWmujM@db:5432/simstudio
    depends_on:
      db:
        condition: service_healthy
    command:
    - bun
    - run
    - db:migrate
    restart: 'no'
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=0Caz9MiufRQN0x2pr6NAyadj2rTWmujM
    - POSTGRES_DB=simstudio
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.sim
  main: simstudio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sim/icon.svg
  title:
    en_US: Sim
  tagline:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows
  description:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows.
  author: Dokploy Community
  developer: Sim
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://sim.ai
  repo: https://github.com/simstudioai/sim
  docs: https://docs.sim.ai
