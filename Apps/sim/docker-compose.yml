name: sim
services:
  simstudio:
    image: ghcr.io/simstudioai/simstudio:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:ehmPt3RJ8GsaGqDT706F2c6nkd95zuSx@db:5432/simstudio
    - BETTER_AUTH_URL=http://localhost
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_SECRET=8Mu56KzBejpa0IUizw6OeAJ6VeMiBZPr
    - ENCRYPTION_KEY=963ab4c9875177ccba333e1ba80a643497c3843ad2f60b0bf97888bbe30b998d7087223d499c5f4e65d317a2616c46cff18aac19e309232af13bda8bfa8f5e7d
    - API_ENCRYPTION_KEY=ad869effd3b634a36cbdf9ee37a840f1a7c8271db91dcb41278003780f27d89c10567d52960a3b15ac70a2da39fa76a805d341962559f166e21365a5572e3570
    - INTERNAL_API_SECRET=BtvIUPjhcuF8tRhQIvcaJElUMjkfod54
    - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      realtime:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3000
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  realtime:
    image: ghcr.io/simstudioai/realtime:latest
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://postgres:ehmPt3RJ8GsaGqDT706F2c6nkd95zuSx@db:5432/simstudio
    - NEXT_PUBLIC_APP_URL=http://localhost
    - BETTER_AUTH_URL=http://localhost
    - BETTER_AUTH_SECRET=8Mu56KzBejpa0IUizw6OeAJ6VeMiBZPr
    - INTERNAL_API_SECRET=BtvIUPjhcuF8tRhQIvcaJElUMjkfod54
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:3002/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
  migrations:
    image: ghcr.io/simstudioai/migrations:latest
    working_dir: /app/packages/db
    environment:
    - DATABASE_URL=postgresql://postgres:ehmPt3RJ8GsaGqDT706F2c6nkd95zuSx@db:5432/simstudio
    depends_on:
      db:
        condition: service_healthy
    command:
    - bun
    - run
    - db:migrate
    restart: 'no'
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=ehmPt3RJ8GsaGqDT706F2c6nkd95zuSx
    - POSTGRES_DB=simstudio
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.sim
  main: simstudio
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sim/icon.svg
  title:
    en_US: Sim
  tagline:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows
  description:
    en_US: Open-source visual workflow builder for building and deploying AI agent workflows.
  author: Dokploy Community
  developer: Sim
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://sim.ai
  repo: https://github.com/simstudioai/sim
  docs: https://docs.sim.ai
