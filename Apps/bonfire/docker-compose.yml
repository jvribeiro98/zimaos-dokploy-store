name: bonfire
services:
  bonfire:
    image: bonfirenetworks/bonfire:1.0.5-social-amd64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      search:
        condition: service_started
    environment:
    - HOSTNAME=localhost
    - PUBLIC_PORT=80
    - SERVER_PORT=4000
    - APP_NAME=Bonfire
    - LANG=en_US.UTF-8
    - SECRET_KEY_BASE=hHVO9MUyi4BnDtVg4kpPThY8IN7AYAHUSilxKAnTSrCNvpuVfFv3hqrNndYYcaMp
    - SIGNING_SALT=Hl9s3Hv7OVysFnQG22bLI8RbOOscRq6L
    - ENCRYPTION_SALT=T2qW9Otxba9igYYCudggMdcpYk6uZhh9
    - RELEASE_COOKIE=4obOhtI3d3aWMKYj5Lfd3pGL7aTIswnx
    - POSTGRES_HOST=db
    - POSTGRES_USER=postgres
    - POSTGRES_DB=bonfire_db
    - POSTGRES_PASSWORD=8Wb69KeO2IGKzZ31eBLayRJdnY0m25rz
    - DB_MIGRATE_INDEXES_CONCURRENTLY=${DB_MIGRATE_INDEXES_CONCURRENTLY:-false}
    - SEARCH_ADAPTER=meili
    - SEARCH_MEILI_INSTANCE=http://search:7700
    - MEILI_MASTER_KEY=jMsNQstCtraANP3mi54htWyskqF3zsGg
    - MAIL_BACKEND=${MAIL_BACKEND:-none}
    - MAIL_SERVER=${MAIL_SERVER:-}
    - MAIL_PORT=${MAIL_PORT:-}
    - MAIL_USER=${MAIL_USER:-}
    - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    - MAIL_DOMAIN=${MAIL_DOMAIN:-}
    - MAIL_FROM=${MAIL_FROM:-}
    - MAIL_KEY=${MAIL_KEY:-}
    - UPLOAD_LIMIT=20
    volumes:
    - bonfire-uploads:/opt/app/data/uploads
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4000
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    ports:
    - target: 4000
      published: "4000"
      protocol: tcp
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_DB=bonfire_db
    - POSTGRES_PASSWORD=8Wb69KeO2IGKzZ31eBLayRJdnY0m25rz
    volumes:
    - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d bonfire_db
      interval: 10s
      timeout: 5s
      retries: 10
  search:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
    - MEILI_MASTER_KEY=jMsNQstCtraANP3mi54htWyskqF3zsGg
    - MEILI_ENV=production
    - MEILI_NO_ANALYTICS=true
    volumes:
    - search-data:/meili_data
volumes:
  bonfire-uploads: null
  db-data: null
  search-data: null
x-casaos:
  id: com.dokploy.bonfire
  main: bonfire
  index: /
  port_map: "4000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/bonfire/icon.svg
  title:
    en_US: Bonfire
  tagline:
    en_US: 'Federated social networking toolkit for communities: customizable digital spaces with A...'
  description:
    en_US: 'Federated social networking toolkit for communities: customizable digital spaces with ActivityPub federation,
      flexible boundaries and moderation tools.'
  author: Dokploy Community
  developer: Bonfire
  category: Social
  architectures:
  - amd64
  - arm64
  version: "1.0.5"
  update_at: "2026-11-27"
  website: https://bonfirenetworks.org
  repo: https://github.com/bonfire-networks/bonfire-app
  docs: https://docs.bonfirenetworks.org
