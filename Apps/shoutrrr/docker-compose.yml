name: shoutrrr
services:
  shoutrrr:
    image: ghcr.io/coollabsio/shoutrrr:1.5.4
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Keep the generated APP_KEY}
      APP_URL: ${APP_URL:?Set APP_URL to the public URL}
      SELF_HOSTED: 'true'
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      OCTANE_SERVER: frankenphp
      OCTANE_HTTPS: 'false'
      SESSION_SECURE_COOKIE: 'false'
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_DATABASE: ${DB_DATABASE:-/var/www/html/database/sqlite/database.sqlite}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      MAIL_MAILER: log
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INSTANCE_REGISTRATIONS_ENABLED: 'false'
      QUEUE_WORKER_ENABLED: ${QUEUE_WORKER_ENABLED:-true}
      QUEUE_WORKER_COUNT: ${QUEUE_WORKER_COUNT:-1}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      INERTIA_SSR_ENABLED: ${INERTIA_SSR_ENABLED:-false}
    expose:
    - '8080'
    volumes:
    - shoutrrr-storage:/var/www/html/storage
    - shoutrrr-sqlite:/var/www/html/database/sqlite
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - http://127.0.0.1:8080/up
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  shoutrrr-storage: null
  shoutrrr-sqlite: null
x-casaos:
  id: com.dokploy.shoutrrr
  main: shoutrrr
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/shoutrrr/icon.svg
  title:
    en_US: Shoutrrr
  tagline:
    en_US: Shoutrrr is an open source social media scheduler for drafting, scheduling, and publish...
  description:
    en_US: Shoutrrr is an open source social media scheduler for drafting, scheduling, and publishing posts across multiple
      accounts and workspaces.
  author: Dokploy Community
  developer: Shoutrrr
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.5.4"
  update_at: "2026-11-22"
  website: https://shoutrrr.com
  repo: https://github.com/coollabsio/shoutrrr
  docs: https://shoutrrr.com/docs/getting-started
