name: mcpspan
services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcpspan
      POSTGRES_PASSWORD: 5vBX6rt38WXDjD0qBvr033wmMaP2GxVm
      POSTGRES_DB: mcpspan
    volumes:
    - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U mcpspan -d mcpspan
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: ghcr.io/mcpspan/core-api:0.16.0
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mcpspan:5vBX6rt38WXDjD0qBvr033wmMaP2GxVm@db:5432/mcpspan
    command:
    - ./node_modules/.bin/node-pg-migrate
    - up
  api:
    image: ghcr.io/mcpspan/core-api:0.16.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://mcpspan:5vBX6rt38WXDjD0qBvr033wmMaP2GxVm@db:5432/mcpspan
      PORT: '6271'
      API_KEY_SECRET: Jqv9Mz8C/0hpFL8b5M5z1Q2dNMtzF4JwLrxKbD2e8g0aUO+KVdkeOU/ivYY1SX+Q
      MCPSPAN_DASHBOARD_URL: http://localhost
    expose:
    - 6271
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:6271/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  dashboard:
    image: ghcr.io/mcpspan/core-dashboard:0.16.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CORE_API_URL: http://api:6271
      MCPSPAN_INGEST_URL: http://localhost
    expose:
    - 6270
    ports:
    - target: 6270
      published: "6270"
      protocol: tcp
volumes:
  db-data: {}
x-casaos:
  id: com.dokploy.mcpspan
  main: dashboard
  index: /
  port_map: "6270"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mcpspan/icon.svg
  title:
    en_US: mcpspan
  tagline:
    en_US: 'mcpspan is open-source analytics for MCP servers: which tools agents call, how often th...'
  description:
    en_US: 'mcpspan is open-source analytics for MCP servers: which tools agents call, how often they fail and why, which
      clients call them, and how fast they answer. Add one line with an SDK in any of eight languages, or none at all behind
      its proxy, and see it in the dashboard. Parameter values never leave your server.'
  author: Dokploy Community
  developer: mcpspan
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.16.0"
  update_at: "2026-11-24"
  website: https://mcpspan.com
  repo: https://github.com/mcpspan/mcpspan
  docs: https://mcpspan.com/docs/self-hosting/
