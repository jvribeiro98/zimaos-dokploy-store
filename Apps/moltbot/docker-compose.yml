name: moltbot
services:
  moltbot-gateway:
    image: ghcr.io/moltbot/clawdbot:2026.1.24-1
    environment:
      HOME: /home/node
      TERM: xterm-256color
      CLAWDBOT_GATEWAY_TOKEN: eJLG5sU2t2WS7dFf971TcNZHN2TDZx9N
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      CLAWDBOT_GATEWAY_URL: ws://0.0.0.0:18789
      OPENROUTER_API_KEY: YOUR-API-KEY
    volumes:
    - moltbot-config:/home/node/.clawdbot
    - moltbot-workspace:/home/node/clawd
    expose:
    - '18789'
    - '18790'
    init: true
    restart: unless-stopped
    command:
    - node
    - dist/index.js
    - gateway
    - --bind
    - auto
    - --port
    - '18789'
    - --allow-unconfigured
    ports:
    - target: 18789
      published: "18789"
      protocol: tcp
volumes:
  moltbot-config: null
  moltbot-workspace: null
x-casaos:
  id: com.dokploy.moltbot
  main: moltbot-gateway
  index: /
  port_map: "18789"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/moltbot/icon.svg
  title:
    en_US: Moltbot
  tagline:
    en_US: WhatsApp gateway CLI with Pi RPC agent - self-hosted AI-powered messaging platform
  description:
    en_US: WhatsApp gateway CLI with Pi RPC agent - self-hosted AI-powered messaging platform
  author: Dokploy Community
  developer: Moltbot
  category: AI
  architectures:
  - amd64
  - arm64
  version: "2026.1.25"
  update_at: "2026-11-24"
  website: https://molt.bot
  repo: https://github.com/moltbot/moltbot
  docs: https://docs.molt.bot
