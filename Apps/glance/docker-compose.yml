name: glance
services:
  glance:
    image: glanceapp/glance
    volumes:
    - /DATA/AppData/$AppID/app/config/:/app/config
    - /DATA/AppData/$AppID/app/assets:/app/assets
    expose:
    - 8080
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.glance
  main: glance
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/glance/icon.png
  title:
    en_US: Glance
  tagline:
    en_US: A self-hosted dashboard that puts all your feeds in one place
  description:
    en_US: A self-hosted dashboard that puts all your feeds in one place. Features RSS feeds, weather, bookmarks, site monitoring,
      and more in a minimal, fast interface.
  author: Dokploy Community
  developer: Glance
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-22"
  website: https://glance.app/
  repo: https://github.com/glanceapp/glance
  docs: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (app/config/glance.yml).
        Review environment variables before starting.
