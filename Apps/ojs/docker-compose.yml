name: ojs
services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: h5KNfyHEVHZmgQRp
      MYSQL_DATABASE: ojs
      MYSQL_USER: ojs
      MYSQL_PASSWORD: AGPjcfZ9QwHBf5YS
    volumes:
    - ojs-db-data:/var/lib/mysql
    restart: unless-stopped
  ojs:
    image: pkpofficial/ojs:3_3_0-21
    hostname: ${COMPOSE_PROJECT_NAME}
    expose:
    - 80
    - 443
    volumes:
    - /etc/localtime:/etc/localtime
    - ojs-private-files:/var/www/files
    - ojs-public-files:/var/www/html/public
    depends_on:
    - db
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  ojs-db-data: {}
  ojs-private-files: {}
  ojs-public-files: {}
x-casaos:
  id: com.dokploy.ojs
  main: ojs
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/ojs/icon.svg
  title:
    en_US: Open Journal Systems
  tagline:
    en_US: Open Journal Systems (OJS) is a journal management and publishing system that has been...
  description:
    en_US: Open Journal Systems (OJS) is a journal management and publishing system that has been developed by the Public
      Knowledge Project through its federally funded efforts to expand and improve access to research.
  author: Dokploy Community
  developer: Open Journal Systems
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "3.3.0-21"
  update_at: "2026-11-25"
  website: https://pkp.sfu.ca/ojs/
  repo: https://github.com/pkp/docker-ojs
  docs: https://pkp.sfu.ca/ojs/docs/
