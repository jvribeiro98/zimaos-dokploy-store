name: dozzle
services:
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
    - 8080
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.dozzle
  main: dozzle
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/dozzle/icon.png
  title:
    en_US: Dozzle
  tagline:
    en_US: Dozzle is a real-time log viewer for Docker containers
  description:
    en_US: Dozzle is a real-time log viewer for Docker containers. Self-host it on your own server with Dokploy, which deploys
      Dozzle as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Dozzle
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://dozzle.dev
  repo: https://github.com/amir20/dozzle
  docs: https://dozzle.dev/guide/what-is-dozzle
