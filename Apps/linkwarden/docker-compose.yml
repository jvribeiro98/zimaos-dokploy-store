name: linkwarden
services:
  linkwarden:
    environment:
    - NEXTAUTH_SECRET=Lu9M5zjEm8u9slmyle8BXpd8CtDlBH5DgeUEgOHnJNk=
    - NEXTAUTH_URL=http://localhost/api/v1/auth
    - DATABASE_URL=postgresql://linkwarden:YZRNQn6i9G42NQp8Onnqf05ufY3s9ZL0@postgres:5432/linkwarden
    restart: unless-stopped
    image: ghcr.io/linkwarden/linkwarden:v2.9.3
    expose:
    - 3000
    volumes:
    - linkwarden-data:/data/data
    depends_on:
    - postgres
    healthcheck:
      test: curl --fail http://localhost:3000 || exit 1
      interval: 60s
      retries: 2
      start_period: 60s
      timeout: 15s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: linkwarden
      POSTGRES_DB: linkwarden
      POSTGRES_PASSWORD: YZRNQn6i9G42NQp8Onnqf05ufY3s9ZL0
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  linkwarden-data: null
  postgres-data: null
x-casaos:
  id: com.dokploy.linkwarden
  main: linkwarden
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/linkwarden/icon.png
  title:
    en_US: Linkwarden
  tagline:
    en_US: Linkwarden is an open-source bookmark manager for saving, organizing, and archiving links
  description:
    en_US: Linkwarden is an open-source bookmark manager for saving, organizing, and archiving links. Self-host it on your
      own server with Dokploy, which deploys Linkwarden as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Linkwarden
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2.9.3"
  update_at: "2026-11-23"
  website: https://linkwarden.app/
  repo: https://github.com/linkwarden/linkwarden
  docs: https://docs.linkwarden.app/
