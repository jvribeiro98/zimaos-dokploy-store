name: classicpress
services:
  classicpress:
    image: classicpress/classicpress:php8.3-apache
    expose:
    - '80'
    environment:
    - WORDPRESS_DB_HOST=db
    - WORDPRESS_DB_USER=wordpress
    - WORDPRESS_DB_PASSWORD=HcwkKuERht93PYLj
    - WORDPRESS_DB_NAME=wordpress
    volumes:
    - wordpress-data:/var/www/html
    depends_on:
    - db
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  db:
    image: mariadb:10.6
    environment:
    - MYSQL_DATABASE=wordpress
    - MYSQL_USER=wordpress
    - MYSQL_PASSWORD=HcwkKuERht93PYLj
    - MYSQL_ROOT_PASSWORD=fcrEZDajACjFtRhp
    volumes:
    - db-data:/var/lib/mysql
    restart: unless-stopped
volumes:
  wordpress-data: null
  db-data: null
x-casaos:
  id: com.dokploy.classicpress
  main: classicpress
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/classicpress/icon.png
  title:
    en_US: ClassicPress
  tagline:
    en_US: ClassicPress is a community-led open source content management system for creators
  description:
    en_US: ClassicPress is a community-led open source content management system for creators. It is a fork of WordPress 6.2
      that preserves the TinyMCE classic editor as the default option.
  author: Dokploy Community
  developer: ClassicPress
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "php8.3-apache"
  update_at: "2026-11-28"
  website: https://www.classicpress.net/
  repo: https://github.com/ClassicPress/
  docs: https://docs.classicpress.net/
