name: plunk
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plunk
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: QKFjX3mvDMYzheBxcUJrk6L91FKH7aq8
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U plunk
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plunk
      MINIO_ROOT_PASSWORD: yMiwVsBznd5JOr49496lBzxOTtHz1t5L
    volumes:
    - minio_data:/data
    expose:
    - 9000
    - 9001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
  plunk:
    image: ghcr.io/useplunk/plunk:latest
    restart: unless-stopped
    environment:
      SERVICE: all
      NODE_ENV: production
      DATABASE_URL: postgresql://plunk:QKFjX3mvDMYzheBxcUJrk6L91FKH7aq8@postgres:5432/plunk
      DIRECT_DATABASE_URL: postgresql://plunk:QKFjX3mvDMYzheBxcUJrk6L91FKH7aq8@postgres:5432/plunk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: unjVHgXKIITEXUBEM2OljWDDPlLazZTGXMdoPyuM2xpkZxSXr2UT7oMhfGKOM2LL
      NGINX_PORT: '80'
      API_DOMAIN: localhost
      DASHBOARD_DOMAIN: localhost
      LANDING_DOMAIN: localhost
      WIKI_DOMAIN: localhost
      USE_HTTPS: 'true'
      AWS_SES_REGION: us-east-1
      AWS_SES_ACCESS_KEY_ID: <your-aws-ses-access-key-id>
      AWS_SES_SECRET_ACCESS_KEY: <your-aws-ses-secret-access-key>
      SES_CONFIGURATION_SET: <your-ses-configuration-set>
      SES_CONFIGURATION_SET_NO_TRACKING: ${SES_CONFIGURATION_SET_NO_TRACKING}
      GITHUB_OAUTH_CLIENT: ''
      GITHUB_OAUTH_SECRET: ''
      GOOGLE_OAUTH_CLIENT: ''
      GOOGLE_OAUTH_SECRET: ''
      STRIPE_SK: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_PRICE_ONBOARDING: ''
      STRIPE_PRICE_EMAIL_USAGE: ''
      STRIPE_METER_EVENT_NAME: emails
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: plunk
      S3_ACCESS_KEY_SECRET: yMiwVsBznd5JOr49496lBzxOTtHz1t5L
      S3_BUCKET: uploads
      S3_PUBLIC_URL: https://localhost/uploads
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_DOMAIN: ''
      PORT_SECURE: '465'
      PORT_SUBMISSION: '587'
      PLUNK_API_KEY: ''
      PLUNK_FROM_ADDRESS: ''
    volumes:
    - /etc/dokploy/traefik/dynamic/acme.json:/certs/acme.json:ro
    expose:
    - 80
    - 465
    - 587
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  plunk_data:
    driver: local
x-casaos:
  id: com.dokploy.plunk
  main: plunk
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/plunk/icon.png
  title:
    en_US: Plunk
  tagline:
    en_US: Plunk is the open-source, affordable email platform that brings together marketing, tra...
  description:
    en_US: Plunk is the open-source, affordable email platform that brings together marketing, transactional and broadcast
      emails into one single, complete solution
  author: Dokploy Community
  developer: Plunk
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://www.useplunk.com/
  repo: https://github.com/useplunk/plunk
  docs: https://docs.useplunk.com
