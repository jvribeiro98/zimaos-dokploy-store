name: flarum
services:
  flarum:
    image: crazymax/flarum:latest
    restart: unless-stopped
    expose:
    - 8000
    environment:
    - FLARUM_BASE_URL=https://localhost
    - DB_HOST=db
    - DB_NAME=flarum
    - DB_USER=flarum
    - DB_PASSWORD=dIrkuX3kw0jR1gtf
    volumes:
    - flarum-data:/data
    depends_on:
    - db
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=4E25Ne2C6SlRqZpD
    - MYSQL_DATABASE=flarum
    - MYSQL_USER=flarum
    - MYSQL_PASSWORD=dIrkuX3kw0jR1gtf
    volumes:
    - db-data:/var/lib/mysql
volumes:
  flarum-data: {}
  db-data: {}
x-casaos:
  id: com.dokploy.flarum
  main: flarum
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/flarum/icon.png
  title:
    en_US: Flarum
  tagline:
    en_US: Flarum is a delightfully simple, modern forum software
  description:
    en_US: Flarum is a delightfully simple, modern forum software. It is fast, free, and easy to use with a clean and extensible
      architecture.
  author: Dokploy Community
  developer: Flarum
  category: Social
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://flarum.org/
  repo: https://github.com/flarum/flarum
  docs: https://docs.flarum.org/
