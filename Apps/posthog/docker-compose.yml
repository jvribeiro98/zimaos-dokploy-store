name: posthog
services:
  init-assets:
    image: alpine:3.21
    restart: on-failure
    logging: &id001
      driver: json-file
      options:
        max-size: 50m
        max-file: '3'
    entrypoint: /bin/sh
    command:
    - -c
    - "set -e\napk add --no-cache git curl brotli >/dev/null\nif [ ! -f /assets/.ok-${POSTHOG_VERSION} ]; then\n  echo \"\
      Fetching PostHog repo assets @ ${POSTHOG_VERSION}\"\n  rm -rf /tmp/ph && mkdir -p /tmp/ph && cd /tmp/ph\n  git init\
      \ -q .\n  git remote add origin https://github.com/PostHog/posthog.git\n  git sparse-checkout set --no-cone /docker/clickhouse/\
      \ /posthog/idl/ /posthog/user_scripts/\n  git -c protocol.version=2 fetch -q --depth 1 --filter=blob:none origin ${POSTHOG_VERSION}\n\
      \  git checkout -q FETCH_HEAD\n  rm -rf /assets/clickhouse /assets/idl /assets/user_scripts /assets/.ok-*\n  cp -r docker/clickhouse\
      \ /assets/clickhouse\n  cp -r posthog/idl /assets/idl\n  cp -r posthog/user_scripts /assets/user_scripts\n  touch /assets/.ok-${POSTHOG_VERSION}\n\
      \  echo \"Repo assets ready\"\nfi\nif [ ! -s /share/GeoLite2-City.mmdb ]; then\n  echo \"Downloading GeoLite2 database\"\
      \n  curl -sL --http1.1 https://mmdbcdn.posthog.net/ | brotli --decompress --output=/share/GeoLite2-City.mmdb\n  chmod\
      \ 644 /share/GeoLite2-City.mmdb\nfi\necho \"init-assets done\"\n"
    volumes:
    - posthog-assets:/assets
    - geoip-data:/share
  db:
    image: postgres:15.12-alpine
    restart: unless-stopped
    logging: *id001
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U posthog
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - /DATA/AppData/$AppID/db-init:/docker-entrypoint-initdb.d:ro
  redis7:
    image: redis:7.2-alpine
    restart: unless-stopped
    logging: *id001
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
    - redis-data:/data
  zookeeper:
    image: zookeeper:3.7.0
    restart: unless-stopped
    logging: *id001
    environment:
      ZOO_AUTOPURGE_PURGEINTERVAL: '1'
      ZOO_AUTOPURGE_SNAPRETAINCOUNT: '3'
    volumes:
    - zookeeper-data:/data
    - zookeeper-datalog:/datalog
  kafka:
    image: docker.io/redpandadata/redpanda:v25.1.9
    restart: unless-stopped
    logging: *id001
    command:
    - redpanda
    - start
    - --kafka-addr internal://0.0.0.0:9092
    - --advertise-kafka-addr internal://kafka:9092
    - --rpc-addr kafka:33145
    - --advertise-rpc-addr kafka:33145
    - --mode dev-container
    - --smp 1
    - --memory 1G
    - --reserve-memory 0M
    - --overprovisioned
    - --set redpanda.empty_seed_starts_cluster=false
    - --seeds kafka:33145
    - --set redpanda.auto_create_topics_enabled=true
    volumes:
    - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  kafka-init:
    image: docker.io/redpandadata/redpanda:v25.1.9
    restart: on-failure
    logging: *id001
    entrypoint: /bin/sh
    depends_on:
      kafka:
        condition: service_healthy
    command:
    - -c
    - "set -e\nTOPICS=\"clickhouse_events_json \\\n    clickhouse_ai_events_json \\\n    clickhouse_heatmap_events \\\n  \
      \  clickhouse_ingestion_warnings \\\n    events_plugin_ingestion \\\n    events_plugin_ingestion_dlq \\\n    events_plugin_ingestion_overflow\
      \ \\\n    events_plugin_ingestion_async \\\n    events_plugin_ingestion_historical \\\n    ingestion-clientwarnings-main-1\
      \ \\\n    heatmaps_ingestion \\\n    session_recording_snapshot_item_events \\\n    session_recording_snapshot_item_overflow\
      \ \\\n    clickhouse_groups \\\n    clickhouse_person \\\n    clickhouse_person_distinct_id \\\n    clickhouse_app_metrics2\
      \ \\\n    log_entries \\\n    clickhouse_tophog\"\nfor topic in $$TOPICS; do\n  rpk topic create \"$$topic\" --brokers\
      \ kafka:9092 -p 1 -r 1 2>/dev/null \\\n    || rpk topic list --brokers kafka:9092 | grep -q \"$$topic\"\ndone\necho\
      \ \"Kafka topics ready\"\n"
  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    restart: unless-stopped
    logging: *id001
    depends_on:
      init-assets:
        condition: service_completed_successfully
      zookeeper:
        condition: service_started
      kafka:
        condition: service_started
    entrypoint: /bin/bash
    command:
    - -c
    - "set -e\ncp /assets/clickhouse/config.xml /etc/clickhouse-server/config.xml\ncp /assets/clickhouse/config.d/default.xml\
      \ /etc/clickhouse-server/config.d/default.xml\ncp /assets/clickhouse/users.xml /etc/clickhouse-server/users.xml\ncp\
      \ /assets/clickhouse/user_defined_function.xml /etc/clickhouse-server/user_defined_function.xml\nmkdir -p /var/lib/clickhouse/format_schemas\
      \ /var/lib/clickhouse/user_scripts\ncp -r /assets/idl/. /var/lib/clickhouse/format_schemas/\ncp -r /assets/user_scripts/.\
      \ /var/lib/clickhouse/user_scripts/\nchmod -R 755 /var/lib/clickhouse/user_scripts\nchown -R clickhouse:clickhouse /var/lib/clickhouse/format_schemas\
      \ /var/lib/clickhouse/user_scripts || true\n# Materialize system log tables (system.crash_log is required by the\n#\
      \ custom_metrics ClickHouse migration), mirroring upstream init-db.sh\n(\n  i=0\n  while [ $$i -lt 90 ]; do\n    if\
      \ clickhouse-client --query \"SELECT 1\" >/dev/null 2>&1; then\n      clickhouse-client --query \"SYSTEM FLUSH LOGS\"\
      \ && echo \"system logs flushed\" && break\n    fi\n    sleep 2\n    i=$$((i+1))\n  done\n) &\nexec /entrypoint.sh\n"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
      KAFKA_HOSTS: kafka:9092
    volumes:
    - posthog-assets:/assets:ro
    - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
  web:
    image: posthog/posthog:${POSTHOG_VERSION}
    restart: unless-stopped
    logging: *id001
    command:
    - sh
    - -c
    - ./bin/migrate && exec ./bin/docker-server
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_started
    environment:
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PGHOST: db
      PGUSER: posthog
      PGPASSWORD: posthog
      PERSONS_DB_WRITER_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DB_READER_URL: postgres://posthog:posthog@db:5432/posthog
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      CLICKHOUSE_API_USER: api
      CLICKHOUSE_API_PASSWORD: apipass
      CLICKHOUSE_APP_USER: app
      CLICKHOUSE_APP_PASSWORD: apppass
      CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
      CLICKHOUSE_LOGS_CLUSTER_SECURE: 'false'
      REDIS_URL: redis://redis7:6379/
      KAFKA_HOSTS: kafka:9092
      FLAGS_REDIS_ENABLED: 'false'
      OBJECT_STORAGE_ENABLED: 'true'
      OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      SESSION_RECORDING_V2_S3_ENDPOINT: http://objectstorage:19000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: object_storage_root_user
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: object_storage_root_password
      RECORDING_API_URL: http://recording-api:6738
      SITE_URL: http://localhost
      SECRET_KEY: gi5xQnLma0QeyVDh31acGTIQa46h3FNSP1VQysVe9RWbd9iz4MnauaZtebI3fSSE
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DEPLOYMENT: hobby
      IS_BEHIND_PROXY: 'true'
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      SECURE_COOKIES: 'false'
      CDP_API_URL: http://plugins:6738
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags:3001
      LIVESTREAM_HOST: http://localhost/livestream
      API_QUERIES_PER_TEAM: '{"1": 100}'
      OTEL_SDK_DISABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      NGINX_UNIT_APP_PROCESSES: '2'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fs http://localhost:8000/_health || exit 1
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 600s
  worker:
    image: posthog/posthog:${POSTHOG_VERSION}
    restart: unless-stopped
    logging: *id001
    command: ./bin/docker-worker-celery --with-scheduler
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PGHOST: db
      PGUSER: posthog
      PGPASSWORD: posthog
      PERSONS_DB_WRITER_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DB_READER_URL: postgres://posthog:posthog@db:5432/posthog
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      CLICKHOUSE_API_USER: api
      CLICKHOUSE_API_PASSWORD: apipass
      CLICKHOUSE_APP_USER: app
      CLICKHOUSE_APP_PASSWORD: apppass
      CLICKHOUSE_LOGS_CLUSTER_HOST: clickhouse
      CLICKHOUSE_LOGS_CLUSTER_SECURE: 'false'
      REDIS_URL: redis://redis7:6379/
      KAFKA_HOSTS: kafka:9092
      FLAGS_REDIS_ENABLED: 'false'
      OBJECT_STORAGE_ENABLED: 'true'
      OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      SESSION_RECORDING_V2_S3_ENDPOINT: http://objectstorage:19000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: object_storage_root_user
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: object_storage_root_password
      RECORDING_API_URL: http://recording-api:6738
      SITE_URL: http://localhost
      SECRET_KEY: gi5xQnLma0QeyVDh31acGTIQa46h3FNSP1VQysVe9RWbd9iz4MnauaZtebI3fSSE
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DEPLOYMENT: hobby
      IS_BEHIND_PROXY: 'true'
      DISABLE_SECURE_SSL_REDIRECT: 'true'
      SECURE_COOKIES: 'false'
      CDP_API_URL: http://plugins:6738
      FEATURE_FLAGS_SERVICE_URL: http://feature-flags:3001
      LIVESTREAM_HOST: http://localhost/livestream
      API_QUERIES_PER_TEAM: '{"1": 100}'
      OTEL_SDK_DISABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      POSTHOG_SKIP_MIGRATION_CHECKS: '1'
      WEB_CONCURRENCY: '2'
  plugins:
    image: posthog/posthog-node:${POSTHOG_NODE_VERSION}
    restart: unless-stopped
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      init-assets:
        condition: service_completed_successfully
    environment:
      NODEJS_CAPABILITY_GROUPS: cdp_workflows,realtime_cohorts,feature_flags
      SITE_URL: http://localhost
      SECRET_KEY: gi5xQnLma0QeyVDh31acGTIQa46h3FNSP1VQysVe9RWbd9iz4MnauaZtebI3fSSE
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      CYCLOTRON_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      CDP_REDIS_HOST: redis7
      CDP_REDIS_PORT: '6379'
      LOGS_REDIS_HOST: redis7
      LOGS_REDIS_TLS: 'false'
      TRACES_REDIS_HOST: redis7
      TRACES_REDIS_TLS: 'false'
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: '6379'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      OBJECT_STORAGE_ENABLED: 'true'
      OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost
      OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
      OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
    volumes:
    - geoip-data:/share:ro
  ingestion-general:
    image: posthog/posthog-node:${POSTHOG_NODE_VERSION}
    restart: unless-stopped
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      init-assets:
        condition: service_completed_successfully
    environment:
      PLUGIN_SERVER_MODE: ingestion-v2-combined
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: '6379'
      CDP_REDIS_HOST: redis7
      LOGS_REDIS_HOST: redis7
      LOGS_REDIS_TLS: 'false'
      TRACES_REDIS_HOST: redis7
      TRACES_REDIS_TLS: 'false'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
    volumes:
    - geoip-data:/share:ro
  ingestion-sessionreplay:
    image: posthog/posthog-node:${POSTHOG_NODE_VERSION}
    restart: unless-stopped
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_started
    environment:
      PLUGIN_SERVER_MODE: recordings-blob-ingestion-v2
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      SESSION_RECORDING_V2_S3_ENDPOINT: http://objectstorage:19000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: object_storage_root_user
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: object_storage_root_password
      SESSION_RECORDING_V2_S3_TIMEOUT_MS: '120000'
  recording-api:
    image: posthog/posthog-node:${POSTHOG_NODE_VERSION}
    restart: unless-stopped
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_started
      objectstorage:
        condition: service_started
    environment:
      PLUGIN_SERVER_MODE: recording-api
      ENCRYPTION_SALT_KEYS: 7cf622aceedf9c0e120a1feca15c878b9fa3b53b6a5a5a5704bede88824017f0
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      REDIS_URL: redis://redis7:6379/
      SESSION_RECORDING_API_REDIS_HOST: redis7
      SESSION_RECORDING_API_REDIS_PORT: '6379'
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: 'false'
      CLICKHOUSE_VERIFY: 'false'
      SESSION_RECORDING_V2_S3_ENDPOINT: http://objectstorage:19000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: object_storage_root_user
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: object_storage_root_password
  capture:
    image: ghcr.io/posthog/posthog/capture:master
    restart: unless-stopped
    logging: *id001
    depends_on:
      kafka:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: events_plugin_ingestion
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      CAPTURE_MODE: events
      RUST_LOG: info,rdkafka=warn
      CAPTURE_V1_SINKS: msk
      CAPTURE_V1_SINK_MSK_KAFKA_HOSTS: kafka:9092
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_MAIN: events_plugin_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HISTORICAL: events_plugin_ingestion_historical
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_OVERFLOW: events_plugin_ingestion_overflow
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_DLQ: events_plugin_ingestion_dlq
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_EXCEPTION: ingestion-errortracking-main
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_HEATMAP: heatmaps_ingestion
      CAPTURE_V1_SINK_MSK_KAFKA_TOPIC_CLIENT_INGESTION_WARNING: ingestion-clientwarnings-main-1
  replay-capture:
    image: ghcr.io/posthog/posthog/capture:master
    restart: unless-stopped
    logging: *id001
    depends_on:
      kafka:
        condition: service_healthy
      redis7:
        condition: service_healthy
    environment:
      ADDRESS: 0.0.0.0:3000
      KAFKA_TOPIC: session_recording_snapshot_item_events
      KAFKA_HOSTS: kafka:9092
      REDIS_URL: redis://redis7:6379/
      CAPTURE_MODE: recordings
  feature-flags:
    image: ghcr.io/posthog/posthog/feature-flags:master
    restart: unless-stopped
    logging: *id001
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      init-assets:
        condition: service_completed_successfully
    environment:
      WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      REDIS_URL: redis://redis7:6379/
      ADDRESS: 0.0.0.0:3001
      RUST_LOG: info
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: '6379'
    volumes:
    - geoip-data:/share:ro
  hypercache-server:
    image: ghcr.io/posthog/posthog/hypercache-server:master
    restart: unless-stopped
    logging: *id001
    depends_on:
      redis7:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis7:6379/
      ADDRESS: 0.0.0.0:3002
      RUST_LOG: info
  livestream:
    image: ghcr.io/posthog/posthog/livestream:master
    restart: unless-stopped
    logging: *id001
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      LIVESTREAM_JWT_SECRET: gi5xQnLma0QeyVDh31acGTIQa46h3FNSP1VQysVe9RWbd9iz4MnauaZtebI3fSSE
    volumes:
    - /DATA/AppData/$AppID/livestream/configs.yml:/configs/configs.yml:ro
  objectstorage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    logging: *id001
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
    - objectstorage-data:/data
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *id001
    depends_on:
      web:
        condition: service_started
    entrypoint: sh
    command: -c 'printf "%s" "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
    environment:
      CADDYFILE: "{\n    auto_https off\n}\n:80 {\n    @capture path /e /e/ /e/* /i/v0 /i/v0/ /i/v0/* /i/v1/analytics/events\
