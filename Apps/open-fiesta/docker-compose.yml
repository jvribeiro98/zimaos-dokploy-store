name: open-fiesta
services:
  ai_fiesta:
    image: ghcr.io/jaainil/open-fiesta-ghcr:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UNSTABLE_INFERENCE_API_KEY: ${UNSTABLE_INFERENCE_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL}
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
x-casaos:
  id: com.dokploy.open-fiesta
  main: ai_fiesta
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/open-fiesta/icon.png
  title:
    en_US: Open Fiesta
  tagline:
    en_US: Open Fiesta is an open-source AI chat and inference UI, supporting multiple backends su...
  description:
    en_US: Open Fiesta is an open-source AI chat and inference UI, supporting multiple backends such as OpenRouter, Gemini,
      and Ollama.
  author: Dokploy Community
  developer: Open Fiesta
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://github.com/jaainil/open-fiesta
  repo: https://github.com/jaainil/open-fiesta
  docs: https://github.com/jaainil/open-fiesta#readme
