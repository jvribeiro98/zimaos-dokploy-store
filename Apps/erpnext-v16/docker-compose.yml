name: erpnext-v16
services:
  backend:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: &id001
      restart_policy:
        condition: always
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - 127.0.0.1:8000
      interval: 2s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  frontend:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    command:
    - nginx-entrypoint.sh
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ''
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - 127.0.0.1:8080
      interval: 2s
      timeout: 30s
      retries: 30
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  queue-default:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    command:
    - bench
    - worker
    - --queue
    - default
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - redis-queue:6379
      interval: 2s
      timeout: 10s
      retries: 30
    depends_on:
      configurator:
        condition: service_completed_successfully
    restart: unless-stopped
  queue-long:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    command:
    - bench
    - worker
    - --queue
    - long
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - redis-queue:6379
      interval: 2s
      timeout: 10s
      retries: 30
    depends_on:
      configurator:
        condition: service_completed_successfully
    restart: unless-stopped
  queue-short:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    command:
    - bench
    - worker
    - --queue
    - short
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - redis-queue:6379
      interval: 2s
      timeout: 10s
      retries: 30
    depends_on:
      configurator:
        condition: service_completed_successfully
    restart: unless-stopped
  scheduler:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - redis-queue:6379
      interval: 2s
      timeout: 10s
      retries: 30
    command:
    - bench
    - schedule
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped
  websocket:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy: *id001
    healthcheck:
      test:
      - CMD
      - wait-for-it
      - websocket:9000
      interval: 2s
      timeout: 10s
      retries: 30
    command:
    - node
    - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped
  configurator:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
    entrypoint:
    - bash
    - -c
    command:
    - "echo \"[configurator] starting\"; if [[ $${REGENERATE_APPS_TXT} == \"1\" ]]; then\n  echo \"[configurator] regenerating\
      \ sites/apps.txt\";\n  ls -1 apps > sites/apps.txt;\nfi; existing_db_host=$$(grep -hs '^' sites/common_site_config.json\
      \ | jq -r \".db_host // empty\" 2>/dev/null || true); if [[ -n \"$${existing_db_host}\" ]]; then\n  echo \"[configurator]\
      \ common_site_config.json already configured, skipping\";\n  exit 0;\nfi; echo \"[configurator] applying bench global\
      \ config\"; bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache\
      \ \"redis://$$REDIS_CACHE\"; bench set-config -g redis_queue \"redis://$$REDIS_QUEUE\"; bench set-config -g redis_socketio\
      \ \"redis://$$REDIS_SOCKETIO\"; bench set-config -gp socketio_port $$SOCKETIO_PORT; echo \"[configurator] done\";\n"
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      REDIS_SOCKETIO: redis-socketio:6379
      SOCKETIO_PORT: '9000'
      REGENERATE_APPS_TXT: '1'
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped
  create-site:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
    entrypoint:
    - bash
    - -c
    command:
    - "wait-for-it -t 300 $${DB_HOST}:$${DB_PORT}; wait-for-it -t 120 redis-cache:6379; wait-for-it -t 120 redis-queue:6379;\
      \ export start=`date +%s`; until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r \".db_host // empty\"` ]] &&\
      \ \\\n  [[ -n `grep -hs ^ sites/common_site_config.json | jq -r \".redis_cache // empty\"` ]] && \\\n  [[ -n `grep -hs\
      \ ^ sites/common_site_config.json | jq -r \".redis_queue // empty\"` ]];\ndo\n  echo \"Waiting for sites/common_site_config.json\
      \ to be created\";\n  sleep 5;\n  if (( `date +%s`-start > 120 )); then\n    echo \"could not find sites/common_site_config.json\
      \ with required keys\";\n    exit 1\n  fi\ndone; echo \"sites/common_site_config.json found\"; [[ -d \"sites/${SITE_NAME}\"\
      \ ]] && echo \"${SITE_NAME} already exists\" && exit 0; bench new-site --mariadb-user-host-login-scope='%' --admin-password=$${ADMIN_PASSWORD}\
      \ --db-root-username=root --db-root-password=$${DB_ROOT_PASSWORD} $${INSTALL_APP_ARGS} $${SITE_NAME}; if [[ $${ENABLE_SCHEDULER}\
      \ == \"1\" ]]; then\n  bench --site $${SITE_NAME} enable-scheduler;\nelse\n  echo \"Skipping scheduler enable\";\nfi;\n"
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    environment:
      SITE_NAME: localhost
      ADMIN_PASSWORD: bK7BUFJy6k5ylDX6rwBHipoIey9i71Xy
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_ROOT_PASSWORD: bxXeYtHBskl7SIBMzEfELQhWuGO18IeB
      INSTALL_APP_ARGS: --install-app erpnext
      ENABLE_SCHEDULER: '1'
    restart: unless-stopped
  migration:
    image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
    pull_policy: ${PULL_POLICY:-always}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none
    entrypoint:
    - bash
    - -c
    command:
    - 'curl -f -H "Host: ${SITE_NAME}" http://frontend:8080/api/method/ping || { echo "Site not reachable yet, skipping migration";
      exit 0; }; bench --site all set-config -p maintenance_mode 1; bench --site all set-config -p pause_scheduler 1; bench
      --site all migrate; bench --site all set-config -p maintenance_mode 0; bench --site all set-config -p pause_scheduler
      0;

      '
    volumes:
    - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped
  db:
    image: mariadb:${DB_VERSION:-11.8.6}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 30
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    environment:
    - MARIADB_ROOT_PASSWORD=bxXeYtHBskl7SIBMzEfELQhWuGO18IeB
    volumes:
    - db-data:/var/lib/mysql
    restart: unless-stopped
  redis-cache:
    deploy:
      restart_policy:
        condition: always
    image: redis:6.2-alpine
    volumes:
    - redis-cache-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis-queue:
    deploy:
      restart_policy:
        condition: always
    image: redis:6.2-alpine
    volumes:
    - redis-queue-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  redis-socketio:
    deploy:
      restart_policy:
        condition: always
    image: redis:6.2-alpine
    volumes:
    - redis-socketio-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped
x-custom-image:
  image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
  pull_policy: ${PULL_POLICY:-always}
  deploy: *id001
volumes:
  db-data: null
  redis-cache-data: null
  redis-queue-data: null
  redis-socketio-data: null
  sites:
    driver_opts:
      type: ${SITE_VOLUME_TYPE}
      o: ${SITE_VOLUME_OPTS}
      device: ${SITE_VOLUME_DEV}
x-casaos:
  id: com.dokploy.erpnext-v16
  main: frontend
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/erpnext-v16/icon.svg
  title:
    en_US: ERPNext
  tagline:
    en_US: 100% Open Source and highly customizable ERP software
  description:
    en_US: 100% Open Source and highly customizable ERP software.
  author: Dokploy Community
  developer: ERPNext
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "ersion-16"
  update_at: "2026-11-22"
  website: https://frappe.io/erpnext
  repo: https://github.com/frappe/erpnext
  docs: https://docs.frappe.io/erpnext
