name: infisical
services:
  backend:
    image: infisical/infisical:v0.162.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
    - NODE_ENV=production
    - ENCRYPTION_KEY=c359c5131575296b4031d2f3a1925c7f8ebcab60ac6af0c22315f863ae2605be
    - AUTH_SECRET=kvyc5GdlhdKhUqIcxPl8/KY2nfzgo7gMgdIyCHAPAGU=
    - SITE_URL=http://localhost
    - DB_CONNECTION_URI=postgres://infisical:TcWKMRv5e4LKiPRE2G7oKcY7egktdoup@db:5432/infisical
    - REDIS_URL=redis://redis:6379
    - SMTP_HOST=
    - SMTP_PORT=587
    - SMTP_FROM_ADDRESS=
    - SMTP_FROM_NAME=Infisical
    - SMTP_USERNAME=
    - SMTP_PASSWORD=
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  redis:
    image: redis:7.4.1
    restart: always
    volumes:
    - redis_infisical_data:/data
  db:
    image: postgres:14-alpine
    restart: always
    environment:
    - POSTGRES_PASSWORD=TcWKMRv5e4LKiPRE2G7oKcY7egktdoup
    - POSTGRES_USER=infisical
    - POSTGRES_DB=infisical
    volumes:
    - pg_infisical_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list
      interval: 5s
      timeout: 10s
      retries: 10
volumes:
  pg_infisical_data: null
  redis_infisical_data: null
x-casaos:
  id: com.dokploy.infisical
  main: backend
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/infisical/icon.jpg
  title:
    en_US: Infisical
  tagline:
    en_US: All-in-one platform to securely manage application configuration and secrets across you...
  description:
    en_US: All-in-one platform to securely manage application configuration and secrets across your team and infrastructure.
  author: Dokploy Community
  developer: Infisical
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.162.6"
  update_at: "2026-11-22"
  website: https://infisical.com/
  repo: https://github.com/Infisical/infisical
  docs: https://infisical.com/docs/documentation/getting-started/introduction
