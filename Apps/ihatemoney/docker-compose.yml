name: ihatemoney
services:
  ihatemoney:
    image: ihatemoney/ihatemoney:latest
    environment:
    - DEBUG=False
    - ACTIVATE_DEMO_PROJECT=True
    - ACTIVATE_ADMIN_DASHBOARD=False
    - ADMIN_PASSWORD=ZvF8i5g8iNUdbrDvE9mYdWGRBeMtRL3c
    - ALLOW_PUBLIC_PROJECT_CREATION=True
    - BABEL_DEFAULT_TIMEZONE=UTC
    - GREENLET_TEST_CPP=no
    - MAIL_DEFAULT_SENDER=Budget manager <admin@example.com>
    - MAIL_PASSWORD=scN5kYbfO1083WBE0HQLxSj9XWaRaUQ6
    - MAIL_PORT=25
    - MAIL_SERVER=localhost
    - MAIL_USE_SSL=False
    - MAIL_USE_TLS=False
    - MAIL_USERNAME=admin
    - SECRET_KEY=SON26w3lhV7CWS2FktnAwknajoNBSJI8kGh1BgHp4uiCALAQyi8wKn7NbNTL71nq
    - SESSION_COOKIE_SECURE=True
    - SHOW_ADMIN_EMAIL=True
    - SQLALCHEMY_DATABASE_URI=sqlite:////database/ihatemoney.db
    - SQLALCHEMY_TRACK_MODIFICATIONS=False
    - APPLICATION_ROOT=/
    - ENABLE_CAPTCHA=False
    - LEGAL_LINK=
    - PORT=8000
    - PUID=0
    - PGID=0
    volumes:
    - /DATA/AppData/$AppID/sqlite-db:/database
    restart: unless-stopped
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
x-casaos:
  id: com.dokploy.ihatemoney
  main: ihatemoney
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/ihatemoney/icon.png
  title:
    en_US: I Hate Money
  tagline:
    en_US: I Hate Money is a web application for managing shared expenses among groups of people
  description:
    en_US: I Hate Money is a web application for managing shared expenses among groups of people. It helps you track who owes
      what to whom, making it easy to split bills and manage group finances.
  author: Dokploy Community
  developer: I Hate Money
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://ihatemoney.org/
  repo: https://github.com/spiral-project/ihatemoney
  docs: https://ihatemoney.readthedocs.io/
