name: gitea-postgres
services:
  gitea:
    image: docker.gitea.com/gitea:1.27.3
    restart: unless-stopped
    environment:
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__database__DB_TYPE=postgres
    - GITEA__database__HOST=postgres:5432
    - GITEA__database__NAME=gitea
    - GITEA__database__USER=admin
    - GITEA__database__PASSWD=2HyvpKJyrE94nOA9Z66Qgfif
    - GITEA__server__DOMAIN=localhost
    - GITEA__server__SSH_DOMAIN=localhost}
    - GITEA__server__ROOT_URL=https://localhost/
    - GITEA__server__LFS_START_SERVER=true
    - GITEA__service__DISABLE_REGISTRATION=false
    - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    volumes:
    - gitea-data:/data
    expose:
    - '3000'
    - '22'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3000/api/healthz
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_USER=admin
    - POSTGRES_PASSWORD=2HyvpKJyrE94nOA9Z66Qgfif
    - POSTGRES_DB=gitea
    volumes:
    - pg-data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-gitea}
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  gitea-data: {}
  pg-data: {}
x-casaos:
  id: com.dokploy.gitea-postgres
  main: gitea
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/gitea-postgres/icon.png
  title:
    en_US: Gitea (PostgreSQL)
  tagline:
    en_US: Gitea is a lightweight Git service for hosting code repositories
  description:
    en_US: Gitea is a lightweight Git service for hosting code repositories. Self-host it on your own server with Dokploy,
      which deploys Gitea as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Gitea (PostgreSQL)
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.27.3"
  update_at: "2026-11-23"
  website: https://gitea.io/
  repo: https://github.com/go-gitea/gitea
  docs: https://docs.gitea.com/
