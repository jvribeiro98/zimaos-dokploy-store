name: mulesoft-esb
services:
  mule:
    image: yogeshmulecraft/mulece-esb:latest
    restart: unless-stopped
    expose:
    - '8081'
    environment:
    - MULE_VERSION=4.9.0
    - HTTP_PORT=8081
    - MULE_HOME=/opt/mule-standalone
    - MULE_BASE=/opt/mule-standalone
    - TZ=UTC
    - MULE_VERBOSE_EXCEPTIONS=true
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:${HTTP_PORT:-8081}/ || exit 0
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s
    ports:
    - target: 8081
      published: "8081"
      protocol: tcp
x-casaos:
  id: com.dokploy.mulesoft-esb
  main: mule
  index: /
  port_map: "8081"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mulesoft-esb/icon.png
  title:
    en_US: MuleSoft ESB Runtime Community Edition
  tagline:
    en_US: MuleSoft ESB Runtime  is a lightweight, Java-based integration platform that allows you...
  description:
    en_US: MuleSoft ESB Runtime  is a lightweight, Java-based integration platform that allows you to easily integrate applications,
      data sources, and APIs. It provides powerful connectors and data transformation capabilities for building robust integration
      solutions.
  author: Dokploy Community
  developer: MuleSoft ESB Runtime Community Edition
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://www.mulesoft.com/
  repo: https://github.com/mulesoft
  docs: https://docs.mulesoft.com/
