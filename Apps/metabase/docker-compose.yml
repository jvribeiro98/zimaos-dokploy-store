name: metabase
services:
  metabase:
    image: metabase/metabase:v0.63.18
    restart: unless-stopped
    expose:
    - 3000
    volumes:
    - /dev/urandom:/dev/random:ro
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: '5432'
      MB_DB_USER: metabase
      MB_DB_PASS: W5qDtq0mKOCSx3x9MyYJSEoHmqKqYjti
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: W5qDtq0mKOCSx3x9MyYJSEoHmqKqYjti
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U metabase -d metabaseappdb
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: null
x-casaos:
  id: com.dokploy.metabase
  main: metabase
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/metabase/icon.png
  title:
    en_US: Metabase
  tagline:
    en_US: Metabase is an open-source business intelligence tool for exploring and visualizing data
  description:
    en_US: Metabase is an open-source business intelligence tool for exploring and visualizing data. Self-host it on your
      own server with Dokploy, which deploys Metabase as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Metabase
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "0.63.18"
  update_at: "2026-11-22"
  website: https://www.metabase.com/
  repo: https://github.com/metabase/metabase
  docs: https://www.metabase.com/docs/
