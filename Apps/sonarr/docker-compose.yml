name: sonarr
services:
  sonarr:
    image: linuxserver/sonarr:4.0.20
    restart: unless-stopped
    expose:
    - 8989
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=UTC
    volumes:
    - config:/config
    - /DATA/AppData/sonarr/data:/tv
    - /DATA/AppData/sonarr/data:/downloads
    ports:
    - target: 8989
      published: "8989"
      protocol: tcp
volumes:
  config: {}
x-casaos:
  id: com.dokploy.sonarr
  main: sonarr
  index: /
  port_map: "8989"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/sonarr/icon.png
  title:
    en_US: Sonarr
  tagline:
    en_US: Sonarr is a PVR for Usenet and BitTorrent users — it monitors RSS feeds for new episode...
  description:
    en_US: Sonarr is a PVR for Usenet and BitTorrent users — it monitors RSS feeds for new episodes of your favourite shows
      and grabs, sorts and renames them for your media server.
  author: Dokploy Community
  developer: Sonarr
  category: Media
  architectures:
  - amd64
  - arm64
  version: "4.0.20"
  update_at: "2026-11-26"
  website: https://sonarr.tv
  repo: https://github.com/Sonarr/Sonarr
  docs: https://wiki.servarr.com/sonarr
