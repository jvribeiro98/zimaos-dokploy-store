name: mailu
services:
  front:
    image: ghcr.io/mailu/nginx:2024.06
    restart: unless-stopped
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: &id001
    - 1.1.1.1
    - 8.8.8.8
    ports:
    - '25:25'
    - 465:465
    - 587:587
    - 993:993
    - target: 80
      published: "80"
      protocol: tcp
    volumes:
    - mailu-certs:/certs
    healthcheck:
      test:
      - CMD-SHELL
      - curl -m3 -skfLo /dev/null http://127.0.0.1:10204/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
    - admin
  admin:
    image: ghcr.io/mailu/admin:2024.06
    restart: unless-stopped
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: *id001
    volumes:
    - mailu-data:/data
    - mailu-dkim:/dkim
    depends_on:
    - redis
  imap:
    image: ghcr.io/mailu/dovecot:2024.06
    restart: unless-stopped
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: *id001
    volumes:
    - mailu-mail:/mail
    depends_on:
    - front
  smtp:
    image: ghcr.io/mailu/postfix:2024.06
    restart: unless-stopped
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: *id001
    volumes:
    - mailu-mailqueue:/queue
    depends_on:
    - front
  antispam:
    image: ghcr.io/mailu/rspamd:2024.06
    restart: unless-stopped
    hostname: antispam
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: *id001
    volumes:
    - mailu-filter:/var/lib/rspamd
    depends_on:
    - front
    - redis
  webmail:
    image: ghcr.io/mailu/webmail:2024.06
    restart: unless-stopped
    environment:
    - SECRET_KEY=CV5MiLCF8snjLMhD
    - DOMAIN=localhost
    - HOSTNAMES=localhost
    - POSTMASTER=admin
    - TLS_FLAVOR=mail-letsencrypt
    - SUBNET=172.16.0.0/12
    - ADMIN=true
    - WEBMAIL=roundcube
    - API=false
    - WEBDAV=none
    - ANTIVIRUS=none
    - SCAN_MACROS=false
    - PORTS=25,80,443,465,587,993,4190
    - MESSAGE_SIZE_LIMIT=50000000
    - FULL_TEXT_SEARCH=en
    - WEBROOT_REDIRECT=/webmail
    - WEB_ADMIN=/admin
    - WEB_WEBMAIL=/webmail
    - SITENAME=Mailu
    - WEBSITE=https://mailu.io
    - REAL_IP_FROM=172.16.0.0/12
    - REAL_IP_HEADER=X-Forwarded-For
    - INITIAL_ADMIN_ACCOUNT=admin
    - INITIAL_ADMIN_DOMAIN=localhost
    - INITIAL_ADMIN_PW=dvyBDQQerVGG5BdeCXTS5wpczgC788jv
    - INITIAL_ADMIN_MODE=ifmissing
    dns: *id001
    volumes:
    - mailu-webmail:/data
    depends_on:
    - front
    - imap
  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
    - mailu-redis:/data
x-mailu-env:
- SECRET_KEY=${SECRET_KEY}
- DOMAIN=${DOMAIN}
- HOSTNAMES=${DOMAIN}
- POSTMASTER=admin
- TLS_FLAVOR=mail-letsencrypt
- SUBNET=${SUBNET}
- ADMIN=true
- WEBMAIL=roundcube
- API=false
- WEBDAV=none
- ANTIVIRUS=none
- SCAN_MACROS=false
- PORTS=25,80,443,465,587,993,4190
- MESSAGE_SIZE_LIMIT=50000000
- FULL_TEXT_SEARCH=en
- WEBROOT_REDIRECT=/webmail
- WEB_ADMIN=/admin
- WEB_WEBMAIL=/webmail
- SITENAME=Mailu
- WEBSITE=https://mailu.io
- REAL_IP_FROM=${SUBNET}
- REAL_IP_HEADER=X-Forwarded-For
- INITIAL_ADMIN_ACCOUNT=${INITIAL_ADMIN_ACCOUNT}
- INITIAL_ADMIN_DOMAIN=${DOMAIN}
- INITIAL_ADMIN_PW=${INITIAL_ADMIN_PW}
- INITIAL_ADMIN_MODE=ifmissing
x-mailu-dns: *id001
volumes:
  mailu-certs: {}
  mailu-data: {}
  mailu-dkim: {}
  mailu-mail: {}
  mailu-mailqueue: {}
  mailu-filter: {}
  mailu-webmail: {}
  mailu-redis: {}
x-casaos:
  id: com.dokploy.mailu
  main: front
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mailu/icon.svg
  title:
    en_US: Mailu
  tagline:
    en_US: 'Full-featured open-source mail server as a set of Docker containers: SMTP (Postfix), IM...'
  description:
    en_US: 'Full-featured open-source mail server as a set of Docker containers: SMTP (Postfix), IMAP (Dovecot), Rspamd antispam,
      admin UI with DKIM management and Roundcube webmail.'
  author: Dokploy Community
  developer: Mailu
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2024.06"
  update_at: "2026-11-22"
  website: https://mailu.io/
  repo: https://github.com/Mailu/Mailu
  docs: https://mailu.io/2024.06/
