name: louez
services:
  louez:
    image: synapsr/louez:2.1.0
    restart: unless-stopped
    environment:
      LOUEZ_MODE: standalone
      DATABASE_URL: mysql://louez:2CcqKYBy93M1e2uFNBj4quNmCZa5noVV@mysql:3306/louez
      AUTH_URL: https://localhost
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_APP_URL: https://localhost
      NEXT_PUBLIC_APP_DOMAIN: localhost
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: louez
      S3_ACCESS_KEY_ID: louez
      S3_SECRET_ACCESS_KEY: CtARXhLwcD9VinoeQlmU2BMgFtriGqF1
      S3_PUBLIC_URL: /files
    volumes:
    - louez-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: louez
      MYSQL_USER: louez
      MYSQL_PASSWORD: 2CcqKYBy93M1e2uFNBj4quNmCZa5noVV
      MYSQL_ROOT_PASSWORD: tPNMRWqVDlYaHKk8xmB8rlTaKoR2OG8k
    volumes:
    - mysql-data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    command:
    - mkdir -p /data/louez && exec minio server /data
    environment:
      MINIO_ROOT_USER: louez
      MINIO_ROOT_PASSWORD: CtARXhLwcD9VinoeQlmU2BMgFtriGqF1
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://localhost:9000/minio/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  louez-data: null
  mysql-data: null
  minio-data: null
x-casaos:
  id: com.dokploy.louez
  main: louez
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/louez/icon.svg
  title:
    en_US: Louez
  tagline:
    en_US: 'Open-source equipment rental platform: a branded booking storefront with live availabil...'
  description:
    en_US: 'Open-source equipment rental platform: a branded booking storefront with live availability, plus a back office
      for reservations, customers, PDF contracts and revenue statistics. Ships with its database and a private image store,
      and installs its own schema on first boot.'
  author: Dokploy Community
  developer: Louez
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "2.1.0"
  update_at: "2026-11-25"
  website: https://louez.io
  repo: https://github.com/Synapsr/Louez
  docs: https://github.com/Synapsr/Louez#readme
