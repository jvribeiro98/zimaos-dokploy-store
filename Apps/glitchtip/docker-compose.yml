name: glitchtip
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: unless-stopped
    volumes:
    - pg-data:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
  web:
    image: glitchtip/glitchtip:6.1.0
    depends_on: &id001
    - postgres
    - valkey
    expose:
    - ${GLITCHTIP_PORT}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      VALKEY_URL: redis://valkey:6379
      SECRET_KEY: /xi1Wsn5gk8ch7N7HD1U1y5feHF1I2TDjneuVHQ5d7s=
      PORT: '8000'
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: https://localhost
      DEFAULT_FROM_EMAIL: admin@example.com
    restart: unless-stopped
    volumes:
    - uploads:/code/uploads
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  worker:
    image: glitchtip/glitchtip:6.1.0
    command: ./bin/run-worker.sh
    depends_on: *id001
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      VALKEY_URL: redis://valkey:6379
      SECRET_KEY: /xi1Wsn5gk8ch7N7HD1U1y5feHF1I2TDjneuVHQ5d7s=
      PORT: '8000'
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: https://localhost
      DEFAULT_FROM_EMAIL: admin@example.com
    restart: unless-stopped
    volumes:
    - uploads:/code/uploads
  migrate:
    image: glitchtip/glitchtip:6.1.0
    depends_on: *id001
    command: ./bin/run-migrate.sh
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      VALKEY_URL: redis://valkey:6379
      SECRET_KEY: /xi1Wsn5gk8ch7N7HD1U1y5feHF1I2TDjneuVHQ5d7s=
      PORT: '8000'
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: https://localhost
      DEFAULT_FROM_EMAIL: admin@example.com
    restart: unless-stopped
x-environment:
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  VALKEY_URL: redis://valkey:6379
  SECRET_KEY: ${SECRET_KEY}
  PORT: ${GLITCHTIP_PORT}
  EMAIL_URL: consolemail://
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
x-depends_on: *id001
volumes:
  pg-data: null
  uploads: null
x-casaos:
  id: com.dokploy.glitchtip
  main: web
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/glitchtip/icon.png
  title:
    en_US: Glitchtip
  tagline:
    en_US: Glitchtip is simple, open source error tracking
  description:
    en_US: Glitchtip is simple, open source error tracking
  author: Dokploy Community
  developer: Glitchtip
  category: Others
  architectures:
  - amd64
  - arm64
  version: "6.1.0"
  update_at: "2026-11-23"
  website: https://glitchtip.com/
  repo: https://gitlab.com/glitchtip/
  docs: https://glitchtip.com/documentation
