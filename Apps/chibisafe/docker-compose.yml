name: chibisafe
services:
  chibisafe:
    image: chibisafe/chibisafe:latest
    environment:
    - BASE_API_URL=http://chibisafe_server:8000
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:8001
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  chibisafe_server:
    image: chibisafe/chibisafe-server:latest
    volumes:
    - database:/app/database:rw
    - uploads:/app/uploads:rw
    - logs:/app/logs:rw
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:8000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  caddy:
    image: caddy:2-alpine
    volumes:
    - /DATA/AppData/$AppID/Caddyfile:/etc/caddy/Caddyfile:ro
    - uploads:/app/uploads:ro
    environment:
    - BASE_URL=":80"
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - --quiet
      - http://127.0.0.1:80
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  database: null
  uploads: null
  logs: null
x-casaos:
  id: com.dokploy.chibisafe
  main: caddy
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/chibisafe/icon.svg
  title:
    en_US: Chibisafe
  tagline:
    en_US: A beautiful and performant vault to save all your files in the cloud
  description:
    en_US: A beautiful and performant vault to save all your files in the cloud.
  author: Dokploy Community
  developer: Chibisafe
  category: Media
  architectures:
  - amd64
  - arm64
  version: "2-alpine"
  update_at: "2026-11-26"
  website: https://chibisafe.app
  repo: https://github.com/chibisafe/chibisafe
  docs: https://chibisafe.app/docs/intro
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (./Caddyfile). Review environment
        variables before starting.
