name: octoprint
services:
  octoprint:
    image: octoprint/octoprint:1.11.8
    restart: unless-stopped
    expose:
    - 5000
    environment:
    - TZ=UTC
    volumes:
    - octoprint_data:/octoprint
    ports:
    - target: 5000
      published: "5000"
      protocol: tcp
volumes:
  octoprint_data: {}
x-casaos:
  id: com.dokploy.octoprint
  main: octoprint
  index: /
  port_map: "5000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/octoprint/icon.png
  title:
    en_US: OctoPrint
  tagline:
    en_US: OctoPrint is the web interface for your 3D printer — control and monitor prints remotel...
  description:
    en_US: OctoPrint is the web interface for your 3D printer — control and monitor prints remotely, upload G-code, watch
      progress and webcam feeds, and extend it with plugins, all from the browser.
  author: Dokploy Community
  developer: OctoPrint
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.11.8"
  update_at: "2026-11-25"
  website: https://octoprint.org
  repo: https://github.com/OctoPrint/OctoPrint
  docs: https://docs.octoprint.org
