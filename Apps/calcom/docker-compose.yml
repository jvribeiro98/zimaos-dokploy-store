name: calcom
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
    - calcom-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=calcom
    - POSTGRES_PASSWORD=QndFVpdfZh4EVnpSjWtrdBZ8llRXrsg0
    - POSTGRES_DB=calendso
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  calcom:
    image: calcom/cal.com:v6.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
    - 3000
