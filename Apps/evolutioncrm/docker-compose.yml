      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:alpine
    restart: always
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data: null
  redis-data: null
  evo-processor-data: null
  evo-crm-data: null
x-casaos:
  id: com.dokploy.evolutioncrm
  main: evo-auth
  index: /
  port_map: "3001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/evolutioncrm/icon.png
  title:
    en_US: Evolution CRM
  tagline:
    en_US: Evo CRM Community is the open-source edition of the Evo CRM platform — a complete suite...
  description:
    en_US: Evo CRM Community is the open-source edition of the Evo CRM platform — a complete suite for AI-assisted customer
      support. It brings together authentication, CRM, AI agents, agent processing, bot pipelines and a modern frontend into
      a unified, self-hostable stack.
  author: Dokploy Community
  developer: Evolution CRM
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://evolutionfoundation.com.br
  repo: https://github.com/evolution-foundation/evo-crm-community
  docs: https://docs.evolutionfoundation.com.br
