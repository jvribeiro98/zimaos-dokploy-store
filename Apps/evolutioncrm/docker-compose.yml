    - EVO_AI_CRM_URL=http://evo-crm:3000
    - CORE_SERVICE_URL=http://evo-core:5555/api/v1
    - EVO_AUTH_BASE_URL=http://evo-auth:3001
    - APP_URL="http://localhost"
    - API_URL="http://localhost"
    - API_TITLE=Agent Processor Community
    - API_DESCRIPTION=Agent Processor Community for Evolution AI
    - API_VERSION=1.0.0
    - ORGANIZATION_NAME=Evolution CRM
    - TOOLS_CACHE_ENABLED=true
    - TOOLS_CACHE_TTL=3600
    restart: unless-stopped
  evo-bot-runtime:
    image: evoapicloud/evo-bot-runtime:latest
    environment:
    - LISTEN_ADDR=0.0.0.0:8080
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/3
    - AI_PROCESSOR_URL=http://evo-processor:8000
    - BOT_RUNTIME_SECRET=grln0HkvJRHVq5/SmK/dOgTq0y/EdYFUhhH6pcWyYpFMea2yG9vpWKgXuaT5IiqpAL7ks/MyDiMsjP7azZNTrQ==
    - AI_CALL_TIMEOUT_SECONDS=30
    restart: unless-stopped
  evo-crm-frontend:
    image: evoapicloud/evo-ai-frontend-community:latest
    environment:
    - VITE_APP_ENV=production
    - VITE_API_URL="http://localhost"
    - VITE_AUTH_API_URL="http://localhost"
    - VITE_EVOAI_API_URL="http://localhost"
    - VITE_AGENT_PROCESSOR_URL="http://localhost"
    - VITE_WS_URL=wss://localhost
    - VITE_FRONT_URL="http://localhost"
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
    - postgres-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_DB=evo_crm_community
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=jH8DZ79iyHtRM8V2mo8fUjqoS5FzNFrC
