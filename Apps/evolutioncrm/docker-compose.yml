    - DOORKEEPER_JWT_ALGORITHM=hs256
    - DOORKEEPER_JWT_ISS=evo-auth-service
    - MFA_ISSUER=EvoCRM
    - SIDEKIQ_CONCURRENCY=10
  evo-crm:
    image: evoapicloud/evo-ai-crm-community:latest
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0"
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:3000/health/live
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      evo-auth:
        condition: service_healthy
    environment:
    - RAILS_ENV=production
    - SECRET_KEY_BASE=aWEqepDVgkmk4S2uO2G+D5nn06zSVtgo0TKXxkGr/4OtUNbxwO1bmQMDpPfZ6e2TquFKR6fK+YAwEwOjlgNa9g==
    - JWT_SECRET_KEY=LljjQtr46PqZqvBamLp9vRg7/02rq1/5Lun+stXi8F1d/WgD3O8NBU1mp4+6Y1boIGxzLWLbHnIc+AWz3iY9gw==
    - EVOAI_CRM_API_TOKEN=nUAnqkWoctLxgkNDKX9nWTsWV8VIuBHB68ajwthmTq0hkMMD+WiX5rjRaaXmuer5DoryhN35F5TsD/5bi4bZTw==
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_USERNAME=postgres
    - POSTGRES_PASSWORD=jH8DZ79iyHtRM8V2mo8fUjqoS5FzNFrC
    - POSTGRES_DATABASE=evo_crm_production
    - POSTGRES_SSLMODE=disable
    - REDIS_URL=redis://redis:6379/3
    - EVO_AUTH_SERVICE_URL=http://evo-auth:3001
    - EVO_AI_CORE_SERVICE_URL=http://evo-core:5555
    - BACKEND_URL="http://localhost"
    - FRONTEND_URL="http://localhost"
    - CORS_ORIGINS="http://localhost","http://localhost"
    - EVOLUTION_API_ONLY_SERVER=true
    - DISABLE_TELEMETRY=true
    - LOG_LEVEL=info
    - ENABLE_ACCOUNT_SIGNUP=true
    - ENABLE_PUSH_RELAY_SERVER=true
    - ENABLE_INBOX_EVENTS=true
    - BOT_RUNTIME_URL=http://evo-bot-runtime:8080
    - BOT_RUNTIME_SECRET=grln0HkvJRHVq5/SmK/dOgTq0y/EdYFUhhH6pcWyYpFMea2yG9vpWKgXuaT5IiqpAL7ks/MyDiMsjP7azZNTrQ==
    - BOT_RUNTIME_POSTBACK_BASE_URL="http://localhost"
    volumes:
    - evo-crm-data:/app/storage
  evo-crm-sidekiq:
    image: evoapicloud/evo-ai-crm-community:latest
    command:
    - bundle
    - exec
    - sidekiq
    - -C
    - config/sidekiq.yml
    healthcheck:
      disable: true
    depends_on:
      evo-crm:
        condition: service_healthy
    environment:
    - RAILS_ENV=production
    - SECRET_KEY_BASE=aWEqepDVgkmk4S2uO2G+D5nn06zSVtgo0TKXxkGr/4OtUNbxwO1bmQMDpPfZ6e2TquFKR6fK+YAwEwOjlgNa9g==
    - JWT_SECRET_KEY=LljjQtr46PqZqvBamLp9vRg7/02rq1/5Lun+stXi8F1d/WgD3O8NBU1mp4+6Y1boIGxzLWLbHnIc+AWz3iY9gw==
    - EVOAI_CRM_API_TOKEN=nUAnqkWoctLxgkNDKX9nWTsWV8VIuBHB68ajwthmTq0hkMMD+WiX5rjRaaXmuer5DoryhN35F5TsD/5bi4bZTw==
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_USERNAME=postgres
    - POSTGRES_PASSWORD=jH8DZ79iyHtRM8V2mo8fUjqoS5FzNFrC
    - POSTGRES_DATABASE=evo_crm_production
    - POSTGRES_SSLMODE=disable
    - REDIS_URL=redis://redis:6379/3
    - EVO_AUTH_SERVICE_URL="http://localhost"
    - EVO_AI_CORE_SERVICE_URL=http://evo-core:5555
    - BACKEND_URL="http://localhost"
    - FRONTEND_URL="http://localhost"
    - CORS_ORIGINS="http://localhost","http://localhost","http://localhost"
    - DISABLE_TELEMETRY=true
    - LOG_LEVEL=info
    - ENABLE_ACCOUNT_SIGNUP=true
    - ENABLE_PUSH_RELAY_SERVER=true
    - ENABLE_INBOX_EVENTS=true
    - BOT_RUNTIME_URL=http://evo-bot-runtime:8080
    - BOT_RUNTIME_SECRET=grln0HkvJRHVq5/SmK/dOgTq0y/EdYFUhhH6pcWyYpFMea2yG9vpWKgXuaT5IiqpAL7ks/MyDiMsjP7azZNTrQ==
    - BOT_RUNTIME_POSTBACK_BASE_URL="http://localhost"
    - SIDEKIQ_CONCURRENCY=10
    restart: unless-stopped
  evo-core:
    image: evoapicloud/evo-ai-core-service-community:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_USER=postgres
    - DB_PASSWORD=jH8DZ79iyHtRM8V2mo8fUjqoS5FzNFrC
    - DB_NAME=evo_crm_production
    - DB_SSLMODE=disable
    - DB_MAX_IDLE_CONNS=10
    - DB_MAX_OPEN_CONNS=100
    - DB_CONN_MAX_LIFETIME=1h
    - DB_CONN_MAX_IDLE_TIME=30m
    - PORT=5555
    - SECRET_KEY_BASE=aWEqepDVgkmk4S2uO2G+D5nn06zSVtgo0TKXxkGr/4OtUNbxwO1bmQMDpPfZ6e2TquFKR6fK+YAwEwOjlgNa9g==
    - JWT_SECRET_KEY=LljjQtr46PqZqvBamLp9vRg7/02rq1/5Lun+stXi8F1d/WgD3O8NBU1mp4+6Y1boIGxzLWLbHnIc+AWz3iY9gw==
    - JWT_ALGORITHM=HS256
    - ENCRYPTION_KEY=ylycu64zKcGdNcunWQeZRO0IjQ0xDTbe619kVnB5Bzs=
    - EVOLUTION_BASE_URL=http://evo-crm:3000
    - EVO_AUTH_BASE_URL=http://evo-auth:3001
    - AI_PROCESSOR_URL=http://evo-processor:8000
    - AI_PROCESSOR_VERSION=v1
  evo-processor:
    image: evoapicloud/evo-ai-processor-community:latest
    depends_on:
      evo-crm:
        condition: service_healthy
    environment:
    - POSTGRES_CONNECTION_STRING=postgresql://postgres:jH8DZ79iyHtRM8V2mo8fUjqoS5FzNFrC@postgres:5432/evo_crm_production
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_SSL=false
    - REDIS_DB=3
    - REDIS_KEY_PREFIX="a2a:"
    - REDIS_TTL=3600
    - HOST=0.0.0.0
    - PORT=8000
    - DEBUG=false
    - SECRET_KEY_BASE=aWEqepDVgkmk4S2uO2G+D5nn06zSVtgo0TKXxkGr/4OtUNbxwO1bmQMDpPfZ6e2TquFKR6fK+YAwEwOjlgNa9g==
    - ENCRYPTION_KEY=ylycu64zKcGdNcunWQeZRO0IjQ0xDTbe619kVnB5Bzs=
