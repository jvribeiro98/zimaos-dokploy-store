name: evolutioncrm
services:
  evo-auth:
    image: evoapicloud/evo-auth-service-community:latest
    command: sh -c "bundle exec rails db:prepare && bundle exec rails s -p 3001 -b 0.0.0.0"
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3001/up
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - RAILS_ENV=production
    - RAILS_MAX_THREADS=5
    - SECRET_KEY_BASE=aWEqepDVgkmk4S2uO2G+D5nn06zSVtgo0TKXxkGr/4OtUNbxwO1bmQMDpPfZ6e2TquFKR6fK+YAwEwOjlgNa9g==
