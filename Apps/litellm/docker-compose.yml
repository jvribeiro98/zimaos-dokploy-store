name: litellm
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litellm:SXC9yW66bUkTicxKdq4nPLDodwzmP0h8@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: k1sqfFVLHyLVZb89lZ8K3VuApPAB4MT4iQTi3ZcU8Z7XoNQxxKbF6Coqnw8FGrTB
      UI_USERNAME: admin
      UI_PASSWORD: fk5OfmyM6tLaGpimVoPMfxryI0qEOv35
      STORE_MODEL_IN_DB: 'True'
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: ''
      COHERE_API_KEY: ''
      OR_SITE_URL: ''
      OR_APP_NAME: LiteLLM Example app
      OR_API_KEY: ''
      AZURE_API_BASE: ''
      AZURE_API_VERSION: ''
      AZURE_API_KEY: ''
      REPLICATE_API_KEY: ''
      REPLICATE_API_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      INFISICAL_TOKEN: ''
      NOVITA_API_KEY: ''
      INFINITY_API_KEY: ''
    expose:
    - 4000
    ports:
    - target: 4000
      published: "4000"
      protocol: tcp
  litellm-db:
    image: postgres:16-alpine
    restart: on-failure:5
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - litellm-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: SXC9yW66bUkTicxKdq4nPLDodwzmP0h8
volumes:
  litellm-db: {}
x-casaos:
  id: com.dokploy.litellm
  main: litellm
  index: /
  port_map: "4000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/litellm/icon.png
  title:
    en_US: LiteLLM
  tagline:
    en_US: LiteLLM is a lightweight OpenAI API-compatible proxy for managing multiple LLM provider...
  description:
    en_US: LiteLLM is a lightweight OpenAI API-compatible proxy for managing multiple LLM providers with a single endpoint.
  author: Dokploy Community
  developer: LiteLLM
  category: AI
  architectures:
  - amd64
  - arm64
  version: "main-stable"
  update_at: "2026-11-22"
  website: https://docs.litellm.ai
  repo: https://github.com/BerriAI/litellm
  docs: https://docs.litellm.ai/docs/proxy/quick_start
