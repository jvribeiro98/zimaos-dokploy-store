name: uptime-kotlin
services:
  uptime-kotlin:
    image: ghcr.io/theomeunier/uptime-kotlin:1.5.0
    restart: unless-stopped
    mem_limit: 512m
    expose:
    - 8080
    environment:
      TZ: Europe/Paris
      QUARKUS_DATASOURCE_USERNAME: uptime-kotlin
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/uptime-kotlin
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY is required}
      MP_JWT_VERIFY_ISSUER: https://localhost/
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptime-kotlin
      POSTGRES_USER: uptime-kotlin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - uptime-kotlin-db:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U uptime-kotlin -d uptime-kotlin
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uptime-kotlin-db: null
x-casaos:
  id: com.dokploy.uptime-kotlin
  main: uptime-kotlin
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/uptime-kotlin/icon.png
  title:
    en_US: Uptime Kotlin
  tagline:
    en_US: Uptime Kotlin is an open-source monitoring tool that tracks the uptime of your websites...
  description:
    en_US: Uptime Kotlin is an open-source monitoring tool that tracks the uptime of your websites and services. Self-host
      it on your own server with Dokploy, which deploys Uptime Kotlin as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Uptime Kotlin
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.5.0"
  update_at: "2026-11-25"
  website: https://uptime-kotlin.com/
  repo: https://github.com/TheoMeunier/uptime-kotlin
  docs: https://uptime-kotlin.com/docs
