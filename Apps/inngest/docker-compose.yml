name: inngest
services:
  inngest:
    image: inngest/inngest:v1.12.1
    restart: unless-stopped
    command: 'inngest start --host 0.0.0.0 --port 8288 --event-key ${INNGEST_EVENT_KEY} --signing-key ${INNGEST_SIGNING_KEY}
      --postgres-uri ${INNGEST_POSTGRES_URI} --redis-uri ${INNGEST_REDIS_URI} --poll-interval ${INNGEST_POLL_INTERVAL:-60}
      --queue-workers ${INNGEST_QUEUE_WORKERS:-100}

      '
    environment:
    - INNGEST_PORT=8288
    - INNGEST_HOST=0.0.0.0
    - INNGEST_EVENT_KEY=8556cbd32c7b1363b89884e5bdccbbd54081e833295dcd016f5189dc5f224d1a
    - INNGEST_SIGNING_KEY=148cb8a9922a540999802e91b7adb00b241ba149bf3e0d04efa480e987500c24
    - INNGEST_POSTGRES_URI=postgresql://inngest:fpAIgJvcGOxRKEg9dStK9wPt@postgres:5432/inngest?sslmode=disable
    - INNGEST_REDIS_URI=redis://redis:6379
    - INNGEST_POLL_INTERVAL=60
    - INNGEST_QUEUE_WORKERS=100
    - INNGEST_RETRY_INTERVAL=1
    - INNGEST_TICK=150
    - INNGEST_LOG_LEVEL=info
    - INNGEST_JSON=true
    - INNGEST_VERBOSE=false
    expose:
    - 8288
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - inngest_data:/home/inngest/.inngest
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8288/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
    - target: 8288
      published: "8288"
      protocol: tcp
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_DB=inngest
    - POSTGRES_USER=inngest
    - POSTGRES_PASSWORD=fpAIgJvcGOxRKEg9dStK9wPt
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    - PGUSER=inngest
    volumes:
    - postgres_data:/var/lib/postgresql/data
    expose:
    - 5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    sysctls:
    - net.core.somaxconn=1024
    volumes:
    - redis_data:/data
    expose:
    - 6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  inngest_data: null
  postgres_data: null
  redis_data: null
x-casaos:
  id: com.dokploy.inngest
  main: inngest
  index: /
  port_map: "8288"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/inngest/icon.svg
  title:
    en_US: Inngest
  tagline:
    en_US: Inngest is a developer platform for serverless event-driven workflows
  description:
    en_US: Inngest is a developer platform for serverless event-driven workflows. Build reliable, scalable background functions
      and workflows with built-in retries, scheduling, and observability.
  author: Dokploy Community
  developer: Inngest
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.12.1"
  update_at: "2026-11-22"
  website: https://www.inngest.com/
  repo: https://github.com/inngest/inngest
  docs: https://www.inngest.com/docs/self-hosting
