name: openresty-manager
services:
  openresty-manager:
    image: uusec/openresty-manager:latest
    restart: always
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /etc/resolv.conf:/etc/resolv.conf:ro
    - om_acme:/opt/om/acme
    - om_data:/opt/om/data
    - om_conf:/opt/om/nginx/conf
    ports:
    - target: 34567
      published: "34567"
      protocol: tcp
volumes:
  om_acme: null
  om_data: null
  om_conf: null
x-casaos:
  id: com.dokploy.openresty-manager
  main: openresty-manager
  index: /
  port_map: "34567"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openresty-manager/icon.svg
  title:
    en_US: OpenResty Manager
  tagline:
    en_US: The easiest using, powerful and beautiful OpenResty Manager (Nginx Enhanced Version) ,...
  description:
    en_US: The easiest using, powerful and beautiful OpenResty Manager (Nginx Enhanced Version) , open source alternative
      to OpenResty Edge, which can enable you to easily reverse proxy your websites with security running at home or internet,
      including Access Control, HTTP Flood Protection, Free SSL, without having to know too much about OpenResty or Let's
      Encrypt.
  author: Dokploy Community
  developer: OpenResty Manager
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.2.0"
  update_at: "2026-11-25"
  website: https://om.uusec.com/
  repo: https://github.com/Safe3/openresty-manager
  docs: https://github.com/Safe3/openresty-manager
