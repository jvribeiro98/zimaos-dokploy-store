name: 9router
services:
  9router:
    image: decolua/9router:0.5.59
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: '20128'
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      JWT_SECRET: 1QTg4Gr6YytI6x3Nyu0QoP6PkJLfdn9B0H5LxZIqPVZrT2WboXzedXq4jmAu7sFA
      INITIAL_PASSWORD: 7YjVsB4knkXaoW2JCt3Njdddh40CplFT
      API_KEY_SECRET: 0sH3WWk0BCOPLViBZMCFrh3n6Ub1vnefrffPbquAYtsRfCvr576sY8XVDRmldo1U
      MACHINE_ID_SALT: 25882H6fqTq1pgsPcSDVmJTRJ76lZChT
      BASE_URL: https://localhost
      NEXT_PUBLIC_BASE_URL: https://localhost
      HEADROOM_URL: http://headroom:8787
      AUTH_COOKIE_SECURE: 'true'
      REQUIRE_API_KEY: 'true'
    volumes:
    - 9router-data:/app/data
    depends_on:
      headroom:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://127.0.0.1:20128/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
    - target: 20128
      published: "20128"
      protocol: tcp
  headroom:
    image: ghcr.io/chopratejas/headroom:0.6.7
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8787/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  9router-data: null
x-casaos:
  id: com.dokploy.9router
  main: 9router
  index: /
  port_map: "20128"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/9router/icon.png
  title:
    en_US: 9Router
  tagline:
    en_US: Self-hosted AI model router that rotates requests across 40+ providers with automatic f...
  description:
    en_US: Self-hosted AI model router that rotates requests across 40+ providers with automatic fallback, exposing an OpenAI-compatible
      endpoint for coding agents.
  author: Dokploy Community
  developer: 9Router
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.5.59"
  update_at: "2026-11-23"
  website: https://9router.com
  repo: https://github.com/decolua/9router
  docs: https://github.com/decolua/9router/blob/master/DOCKER.md
