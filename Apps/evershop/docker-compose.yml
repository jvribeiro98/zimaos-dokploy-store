name: evershop
services:
  evershop-app:
    image: evershop/evershop:latest
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: '5432'
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: evershop
    depends_on:
    - database
    expose:
    - 3000
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
    - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: evershop
    expose:
    - ${DB_PORT}
volumes:
  postgres-data: null
x-casaos:
  id: com.dokploy.evershop
  main: evershop-app
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/evershop/icon.svg
  title:
    en_US: Evershop
  tagline:
    en_US: Your All-in-One open source ecommerce solution
  description:
    en_US: Your All-in-One open source ecommerce solution.
  author: Dokploy Community
  developer: Evershop
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://evershop.io/
  repo: https://github.com/evershopcommerce/evershop
  docs: https://evershop.io/docs/development/getting-started/introduction
