name: wallos
services:
  wallos:
    image: bellamy/wallos:latest
    expose:
    - '80'
    environment:
      TZ: Europe/Paris
    volumes:
    - wallos_db:/var/www/html/db
    - wallos_logos:/var/www/html/images/uploads/logos
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  wallos_db: null
  wallos_logos: null
x-casaos:
  id: com.dokploy.wallos
  main: wallos
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/wallos/icon.png
  title:
    en_US: Wallos
  tagline:
    en_US: Wallos is a self-hosted subscription tracking application that helps you manage and mon...
  description:
    en_US: Wallos is a self-hosted subscription tracking application that helps you manage and monitor your subscriptions,
      providing insights into your spending habits.
  author: Dokploy Community
  developer: Wallos
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://wallosapp.com
  repo: https://github.com/ellite/wallos
  docs: https://github.com/ellite/wallos?tab=readme-ov-file#getting-started
