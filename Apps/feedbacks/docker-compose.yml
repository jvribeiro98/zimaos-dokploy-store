name: feedbacks
services:
  feedbacks:
    image: softinator/feedbacks@sha256:f7d759e671b48906a4aa5deff92b4644a73a6a4239f32b4cebba5cfcef8cc97b
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_ORIGIN: ${APP_ORIGIN:?required}
      DATABASE_URL: postgresql://feedbacks:${POSTGRES_PASSWORD:?required}@postgres:5432/feedbacks
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      TRUST_PROXY_HOPS: '1'
      ASSET_DRIVER: s3
      ORGANIZATION_ID: ${ORGANIZATION_ID:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-feedbacks}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      NODE_EXTRA_CA_CERTS: /s3-config/public.crt
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GITHUB_APPS_JSON: ${GITHUB_APPS_JSON:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
    volumes:
    - feedbacks-s3-config:/s3-config:ro
    expose:
    - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully
    stop_grace_period: 15s
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedbacks
      POSTGRES_DB: feedbacks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
    - feedbacks-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U feedbacks -d feedbacks
      interval: 10s
      timeout: 5s
      retries: 10
  s3-init:
    image: alpine:3.22
    restart: 'no'
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
    volumes:
    - feedbacks-s3-config:/config
    entrypoint:
    - /bin/sh
    - -c
    command:
    - "set -e\nif [ ! -s /config/public.crt ]; then\n  apk add --no-cache openssl >/dev/null\n  openssl req -x509 -newkey\
      \ rsa:2048 -nodes -days 3650 \\\n    -subj \"/CN=s3\" -addext \"subjectAltName=DNS:s3\" \\\n    -addext \"basicConstraints=critical,CA:TRUE\"\
      \ \\\n    -keyout /config/private.key -out /config/public.crt\nfi\nprintf '{\"identities\":[{\"name\":\"feedbacks\"\
      ,\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"\
      Tagging\"]}]}' \\\n  \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" > /config/s3.json\nchmod 644 /config/*\n"
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/config/s3.json -s3.cert.file=/config/public.crt -s3.key.file=/config/private.key
    volumes:
    - feedbacks-s3:/data
    - feedbacks-s3-config:/config:ro
    depends_on:
      s3-init:
        condition: service_completed_successfully
  s3-bucket:
    image: alpine:3.22
    restart: 'no'
    depends_on:
    - s3
    environment:
      S3_BUCKET: ${S3_BUCKET:-feedbacks}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
    volumes:
    - feedbacks-s3-config:/config:ro
    entrypoint:
    - /bin/sh
    - -c
    command:
    - "set -e\napk add --no-cache curl >/dev/null\nfor i in $$(seq 1 60); do\n  code=$$(curl -s -o /dev/null -w '%{http_code}'\
      \ --cacert /config/public.crt \\\n    --aws-sigv4 \"aws:amz:us-east-1:s3\" --user \"$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY\"\
      \ \\\n    -X PUT \"https://s3:8333/$$S3_BUCKET\") || code=000\n  case \"$$code\" in 200|409) echo \"bucket ready ($$code)\"\
      ; exit 0;; esac\n  sleep 2\ndone\necho \"could not create bucket (last HTTP $$code)\"; exit 1\n"
volumes:
  feedbacks-postgres: null
  feedbacks-s3: null
  feedbacks-s3-config: null
x-casaos:
  id: com.dokploy.feedbacks
  main: feedbacks
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/feedbacks/icon.png
  title:
    en_US: Feedbacks
  tagline:
    en_US: Self-hosted website feedback, browser evidence and MCP handoff for coding assistants
  description:
    en_US: Self-hosted website feedback, browser evidence and MCP handoff for coding assistants. Ships with private SeaweedFS
      S3 storage; external S3 is optional.
  author: Dokploy Community
  developer: Feedbacks
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "0.2.1"
  update_at: "2026-11-24"
  website: https://feedbacks.softinator.ai
  repo: https://github.com/Softinator-TechLabs/feedbacks-oss
  docs: https://feedbacks.softinator.ai/docs/guide/self-host
