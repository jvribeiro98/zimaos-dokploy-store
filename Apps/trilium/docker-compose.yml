name: trilium
services:
  trilium:
    image: zadam/trilium:latest
    expose:
    - 8080
    restart: always
    volumes:
    - /root/trilium-backups:/home/node/trilium-data/backup
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.trilium
  main: trilium
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/trilium/icon.png
  title:
    en_US: Trilium
  tagline:
    en_US: Trilium Notes is a hierarchical note taking application with focus on building large pe...
  description:
    en_US: Trilium Notes is a hierarchical note taking application with focus on building large personal knowledge bases.
  author: Dokploy Community
  developer: Trilium
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://github.com/zadam/trilium
  repo: https://github.com/zadam/trilium
  docs: https://github.com/zadam/trilium/wiki/
