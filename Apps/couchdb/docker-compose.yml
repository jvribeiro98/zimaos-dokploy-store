name: couchdb
services:
  couchdb:
    image: couchdb:latest
    expose:
    - '5984'
    volumes:
    - couchdb-data:/opt/couchdb/data
    environment:
    - COUCHDB_USER=mxrK78TYvb0y9s7U
    - COUCHDB_PASSWORD=eEgzuvI6xbaowUpGC5Nf5VPyJ0tldAwX
    restart: unless-stopped
    ports:
    - target: 5984
