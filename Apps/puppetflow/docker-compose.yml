name: puppetflow
services:
  puppetflow:
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    restart: unless-stopped
    expose:
    - 8000
    volumes:
    - puppetflow-framework:/app/storage
    - puppetflow-execution:/app/data/execution
    - puppetflow-uploads:/app/data/storage
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8000/up
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pinokio:
        condition: service_started
      stream-server:
        condition: service_started
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  migrate:
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    command:
    - php
    - artisan
    - migrate
    - --force
    restart: 'no'
    volumes:
    - puppetflow-framework:/app/storage
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    depends_on:
      init-volumes:
        condition: service_completed_successfully
  queue-1:
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    command:
    - php
    - artisan
    - queue:work
    - --queue=1
    - --tries=1
    - --timeout=630
    - --sleep=3
    - --max-jobs=500
    - --max-time=3600
    restart: unless-stopped
    volumes:
    - puppetflow-framework:/app/storage
    - puppetflow-execution:/app/data/execution
    - puppetflow-uploads:/app/data/storage
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    depends_on:
      migrate:
        condition: service_completed_successfully
      stream-server:
        condition: service_started
  queue-2:
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    command:
    - php
    - artisan
    - queue:work
    - --queue=2
    - --tries=1
    - --timeout=630
    - --sleep=3
    - --max-jobs=500
    - --max-time=3600
    restart: unless-stopped
    volumes:
    - puppetflow-framework:/app/storage
    - puppetflow-execution:/app/data/execution
    - puppetflow-uploads:/app/data/storage
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    depends_on:
      migrate:
        condition: service_completed_successfully
      stream-server:
        condition: service_started
  scheduler:
    image: ghcr.io/puppetflow/puppetflow:v2026.11.7
    command:
    - php
    - artisan
    - schedule:work
    restart: unless-stopped
    volumes:
    - puppetflow-framework:/app/storage
    - puppetflow-execution:/app/data/execution
    - puppetflow-uploads:/app/data/storage
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    depends_on:
      migrate:
        condition: service_completed_successfully
  stream-server:
    image: ghcr.io/puppetflow/puppetflow-stream-server:v2026.11.7
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
    - 6080
    environment:
      APP_ENV: production
      LOG_STACK: single,stderr
      LANG: C.UTF-8
      LANGUAGE: en-US
      CONNECTION_TIMEOUT_MS: '60000000'
      APP_URL: http://localhost
      APP_KEY: base64:6M9vrAloeDbmm1FkA53EtZaxeGFA6OdtTPhDaGzmvRc=
      APP_QUEUES_COUNTER: '2'
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/database.sqlite
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PINOKIO_HOST: pinokio
      PINOKIO_PORT: '3000'
      PINOKIO_TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
      BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
      BROWSER_STREAM_PUBLIC_URL: http://localhost
      BROWSER_STREAM_ALLOWED_ORIGINS: http://localhost
      BROWSER_STREAM_SECRET: 8ade380d1b36ece89563618c3a749ced643761aa8b594427d133194a2a23d389
    depends_on:
      redis:
        condition: service_healthy
  init-volumes:
    image: busybox:1.37.0
    command:
    - sh
    - -c
    - touch /framework/database.sqlite && chown -R 33:33 /framework /execution /uploads /browsers
    restart: 'no'
    volumes:
    - puppetflow-framework:/framework
    - puppetflow-execution:/execution
    - puppetflow-uploads:/uploads
    - pinokio-downloads:/browsers
  pinokio:
    image: ghcr.io/puppetflow/pinokio:v2026.11.1
    restart: unless-stopped
    user: '33:33'
    shm_size: 1gb
    volumes:
    - puppetflow-execution:/app/data/execution
    - pinokio-downloads:/opt/browsers
    environment:
      TOKEN: 81bb9ea5de1b96b829f0493dd8b8bf2092d791ba2ad46e4481c14ac62e073880
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      LANG: C.UTF-8
      LANGUAGE: en-US
    depends_on:
      init-volumes:
        condition: service_completed_successfully
  redis:
    image: redis:8.2.1-alpine
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
x-puppetflow-environment:
  APP_ENV: production
  LOG_STACK: single,stderr
  LANG: ${LANG}
  LANGUAGE: ${LANGUAGE}
  CONNECTION_TIMEOUT_MS: ${CONNECTION_TIMEOUT_MS}
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}
  APP_QUEUES_COUNTER: '2'
  DB_CONNECTION: sqlite
  DB_DATABASE: /app/storage/database.sqlite
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  PINOKIO_HOST: pinokio
  PINOKIO_PORT: '3000'
  PINOKIO_TOKEN: ${PINOKIO_TOKEN}
  RUNNER_API_INTERNAL_URL: http://puppetflow:8000/api/internal/runner
  BROWSER_STREAM_INTERNAL_URL: http://stream-server:6080
  BROWSER_STREAM_PUBLIC_URL: ${BROWSER_STREAM_PUBLIC_URL}
  BROWSER_STREAM_ALLOWED_ORIGINS: ${APP_URL}
  BROWSER_STREAM_SECRET: ${BROWSER_STREAM_SECRET}
volumes:
  puppetflow-framework: null
  puppetflow-uploads: null
  puppetflow-execution: null
  pinokio-downloads: null
x-casaos:
  id: com.dokploy.puppetflow
  main: puppetflow
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/puppetflow/icon.png
  title:
    en_US: Puppetflow
  tagline:
    en_US: A self-hosted browser automation platform for building, running, and monitoring JavaScr...
  description:
    en_US: A self-hosted browser automation platform for building, running, and monitoring JavaScript workflows powered by
      Puppeteer.
  author: Dokploy Community
  developer: Puppetflow
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "2026.11.7"
  update_at: "2026-11-27"
  website: https://puppetflow.com/
  repo: https://github.com/puppetflow/puppetflow
  docs: https://docs.puppetflow.com/
