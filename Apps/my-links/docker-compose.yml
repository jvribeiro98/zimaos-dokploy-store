name: my-links
services:
  my-links:
    environment:
    - APP_KEY=lwR0gVjbH3Y5nfpBPdNK6RjYXroVdwFC1799n1S7jlg=
    - APP_URL=http://localhost
    - DB_PASSWORD=rHRFfgai2RbEIVl6BMkPqVrv2faLSZSc
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_USER=mylinks
    - DB_DATABASE=mylinks
    - HOST=0.0.0.0
    - PORT=3333
    - NODE_ENV=production
    - LOG_LEVEL=info
    restart: unless-stopped
    image: sonny93/my-links:5.3.0
    expose:
    - 3333
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3333/ >/dev/null || exit 1
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
    - target: 3333
      published: "3333"
      protocol: tcp
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: mylinks
      POSTGRES_DB: mylinks
      POSTGRES_PASSWORD: rHRFfgai2RbEIVl6BMkPqVrv2faLSZSc
    volumes:
    - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: null
x-casaos:
  id: com.dokploy.my-links
  main: my-links
  index: /
  port_map: "3333"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/my-links/icon.svg
  title:
    en_US: MyLinks
  tagline:
    en_US: Self-hostable bookmark manager to organize, search and share your favorite links
  description:
    en_US: Self-hostable bookmark manager to organize, search and share your favorite links.
  author: Dokploy Community
  developer: MyLinks
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "5.3.0"
  update_at: "2026-11-25"
  website: https://www.mylinks.app
  repo: https://github.com/my-links/my-links
  docs: https://docs.mylinks.app
