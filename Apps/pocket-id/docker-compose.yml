name: pocket-id
services:
  pocket-id:
    image: pocketid/pocket-id:v2.14.0
    restart: unless-stopped
    environment:
      APP_URL: https://localhost
      ENCRYPTION_KEY: LCPuBawv1QNpHcS0lUPvrETF83lfXt+S12/e3n0Qzso=
      TRUST_PROXY: 'true'
    volumes:
    - pocket-id-data:/app/data
    expose:
    - '1411'
    healthcheck:
      test:
      - CMD
      - /app/pocket-id
      - healthcheck
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    ports:
    - target: 1411
      published: "1411"
      protocol: tcp
volumes:
  pocket-id-data: null
x-casaos:
  id: com.dokploy.pocket-id
  main: pocket-id
  index: /
  port_map: "1411"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/pocket-id/icon.svg
  title:
    en_US: Pocket ID
  tagline:
    en_US: Pocket ID is a simple OpenID Connect and OAuth 2
  description:
    en_US: Pocket ID is a simple OpenID Connect and OAuth 2.0 provider that lets users authenticate to applications with passkeys.
  author: Dokploy Community
  developer: Pocket ID
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2.14.0"
  update_at: "2026-11-22"
  website: https://pocket-id.org/
  repo: https://github.com/pocket-id/pocket-id
  docs: https://pocket-id.org/docs/
