name: vault
services:
  vault:
    image: hashicorp/vault:2.0.3
    cap_add:
    - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: wqVJm8I9tx5aycyLmnRM08ld7n8cztHh
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    expose:
    - '8200'
    volumes:
    - vault-data:/vault/file
    command: server -dev -dev-root-token-id=${VAULT_DEV_ROOT_TOKEN_ID} -dev-listen-address=${VAULT_DEV_LISTEN_ADDRESS}
    restart: unless-stopped
    ports:
    - target: 8200
      published: "8200"
      protocol: tcp
volumes:
  vault-data: null
x-casaos:
  id: com.dokploy.vault
  main: vault
  index: /
  port_map: "8200"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/vault/icon.svg
  title:
    en_US: Vault
  tagline:
    en_US: Vault is HashiCorp's tool for securely storing and managing secrets and encryption keys
  description:
    en_US: Vault is HashiCorp's tool for securely storing and managing secrets and encryption keys. Self-host it on your own
      server with Dokploy, which deploys Vault as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Vault
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2.0.3"
  update_at: "2026-11-25"
  website: https://www.vaultproject.io/
  repo: https://github.com/hashicorp/vault
  docs: https://developer.hashicorp.com/vault/docs
