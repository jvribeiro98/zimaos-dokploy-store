name: windshift
services:
  windshift:
    image: ghcr.io/windshiftapp/windshift:v0.9.3
    restart: unless-stopped
    environment:
    - BASE_URL=https://localhost
    - PORT=8080
    - USE_PROXY=true
    - SSO_SECRET=6e98b31a7095a2db2ffe6029dc42bf8d68ab347e5cc314a19f876572b127eb6a03629b17479575ea971daba9ff909cb786074cdb05dae704d564b74a112ab78f
    - ATTACHMENT_PATH=/data/attachments
    - DB_TYPE=postgres
    - POSTGRES_HOST=db
    - POSTGRES_PORT=5432
    - POSTGRES_USER=windshift
    - POSTGRES_PASSWORD=24UKZfdezrjfoERUFSHkRzjQ41GTtzGI
    - POSTGRES_DB=windshift
    - LOG_LEVEL=info
    - LOG_FORMAT=json
    volumes:
    - windshift-data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  db:
    image: postgres:17.4
    restart: unless-stopped
    environment:
    - POSTGRES_USER=windshift
    - POSTGRES_PASSWORD=24UKZfdezrjfoERUFSHkRzjQ41GTtzGI
    - POSTGRES_DB=windshift
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  windshift-data: {}
  postgres-data: {}
x-casaos:
  id: com.dokploy.windshift
  main: windshift
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/windshift/icon.png
  title:
    en_US: Windshift
  tagline:
    en_US: Self-hosted work management platform with projects, tasks, sprints, and team collaboration
  description:
    en_US: Self-hosted work management platform with projects, tasks, sprints, and team collaboration.
  author: Dokploy Community
  developer: Windshift
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.9.3"
  update_at: "2026-11-26"
  website: https://windshift.sh/
  repo: https://github.com/Windshiftapp/core
  docs: https://windshift.sh/docs
