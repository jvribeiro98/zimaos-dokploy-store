name: kitchenowl
services:
  web:
    image: tombursch/kitchenowl:v0.7.1
    restart: unless-stopped
    environment:
    - JWT_SECRET_KEY=YsFskrd1qNtwjp9aTtstKtSA6EvhDons
    - DB_DRIVER=postgresql
    - DB_HOST=db
    - DB_NAME=kitchenowl
    - DB_USER=kitchenowl
    - DB_PASSWORD=SsnlH9NSKheC4iIpxozu5vDb
    volumes:
    - kitchenowl_files:/data
    depends_on:
    - db
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
    - POSTGRES_DB=kitchenowl
    - POSTGRES_USER=kitchenowl
    - POSTGRES_PASSWORD=SsnlH9NSKheC4iIpxozu5vDb
    volumes:
    - kitchenowl_db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
volumes:
  kitchenowl_files: {}
  kitchenowl_db: {}
x-casaos:
  id: com.dokploy.kitchenowl
  main: web
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/kitchenowl/icon.png
  title:
    en_US: KitchenOwl
  tagline:
    en_US: KitchenOwl is a self-hosted grocery list and recipe manager
  description:
    en_US: KitchenOwl is a self-hosted grocery list and recipe manager.
  author: Dokploy Community
  developer: KitchenOwl
  category: Home
  architectures:
  - amd64
  - arm64
  version: "0.7.1"
  update_at: "2026-11-23"
  website: https://kitchenowl.org/
  repo: https://github.com/TomBursch/kitchenowl
  docs: https://github.com/TomBursch/kitchenowl/wiki
