name: kuukura
services:
  kuukura:
    image: ghcr.io/victorlunam/kuukura:2026.10.13
    restart: unless-stopped
    environment:
      VAULT_DOMAIN: localhost
      VAULT_STORAGE: sqlite
      VAULT_SQLITE_PATH: /data/kuukura.db
      VAULT_KEY_PROVIDER: manual
      VAULT_MASTER_KEY_FILE: /keys/master_key
      VAULT_MASTER_KEY_GENERATE: 'true'
      VAULT_OIDC_CLIENT_ID: ''
      VAULT_OIDC_CLIENT_SECRET: ''
      VAULT_TRUSTED_PROXIES: ''
    volumes:
    - kuukura-data:/data
    - kuukura-keys:/keys
    expose:
    - 8080
    healthcheck:
      test:
      - CMD
      - /ku-server
      - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  kuukura-data: {}
  kuukura-keys: {}
x-casaos:
  id: com.dokploy.kuukura
  main: kuukura
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/kuukura/icon.svg
  title:
    en_US: kuukura
  tagline:
    en_US: 'kuukura is a self-hosted secrets vault for small teams: values are decrypted only on yo...'
  description:
    en_US: 'kuukura is a self-hosted secrets vault for small teams: values are decrypted only on your server, reveals require
      a passkey, and every access is audit-logged. Requires a Google OAuth client ID and secret, set in the Environment tab
      before deploying.'
  author: Dokploy Community
  developer: kuukura
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2026.10.13"
  update_at: "2026-11-25"
  website: https://kuukura-main-landing.neodev-f72.workers.dev
  repo: https://github.com/victorlunam/kuukura
  docs: https://github.com/victorlunam/kuukura/blob/main/docs/deploy.md
