name: markup
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
    - markup-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: markup
      POSTGRES_PASSWORD: 9q2ob8RQ483J5UxYYsDvMdWZk0ZB1AwF
      POSTGRES_DB: markup
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U markup -d markup
      interval: 10s
      timeout: 5s
      retries: 5
  markup:
    image: ghcr.io/pphilfre/markup:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://markup:9q2ob8RQ483J5UxYYsDvMdWZk0ZB1AwF@db:5432/markup
      NEXT_PUBLIC_DB_PROVIDER: postgres
      NEXT_PUBLIC_SITE_URL: https://localhost
      WORKOS_CLIENT_ID: client_id_change_me
      WORKOS_API_KEY: sk_change_me
      WORKOS_COOKIE_PASSWORD: HNXbghSKcJuMhglh97sKVLjQA1wVRJYi
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: https://localhost/callback
      NODE_ENV: production
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  markup-postgres-data: null
x-casaos:
  id: com.dokploy.markup
  main: markup
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/markup/icon.svg
  title:
    en_US: Markup
  tagline:
    en_US: Markup is a fast, keyboard-first markdown workspace with live preview, graph view, whit...
  description:
    en_US: Markup is a fast, keyboard-first markdown workspace with live preview, graph view, whiteboards, mind maps, and
      PostgreSQL-powered cloud sync.
  author: Dokploy Community
  developer: Markup
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "main"
  update_at: "2026-11-23"
  website: https://home.markup.freddiephilpot.dev/
  repo: https://github.com/pphilfre/markup
  docs: https://docs.markup.freddiephilpot.dev/
