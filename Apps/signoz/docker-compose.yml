name: signoz
services:
  init-clickhouse:
    restart: on-failure
    logging: &id001
      options:
        max-size: 50m
        max-file: '3'
    image: clickhouse/clickhouse-server:25.5.6
    command:
    - bash
    - -c
    - 'version="v0.0.1"

      node_os=$$(uname -s | tr ''[:upper:]'' ''[:lower:]'')

      node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)

      echo "Fetching histogram-binary for $${node_os}/$${node_arch}"

      cd /tmp

      wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"

      tar -xvzf histogram-quantile.tar.gz

      mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile

      '
    volumes:
    - /DATA/AppData/$AppID/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
  zookeeper-1:
    restart: unless-stopped
    logging: *id001
    image: signoz/zookeeper:3.7.1
    user: root
    labels: &id007
      signoz.io/scrape: 'true'
      signoz.io/port: '9141'
      signoz.io/path: /metrics
    healthcheck: &id008
      test:
      - CMD-SHELL
      - curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
    - zookeeper-1:/bitnami/zookeeper
    environment:
    - ZOO_SERVER_ID=1
    - ALLOW_ANONYMOUS_LOGIN=yes
    - ZOO_AUTOPURGE_INTERVAL=1
    - ZOO_ENABLE_PROMETHEUS_METRICS=yes
    - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
  clickhouse:
    restart: unless-stopped
    logging: *id001
    image: clickhouse/clickhouse-server:25.5.6
    tty: true
    labels: &id003
      signoz.io/scrape: 'true'
      signoz.io/port: '9363'
      signoz.io/path: /metrics
    depends_on: &id004
      init-clickhouse:
        condition: service_completed_successfully
      zookeeper-1:
        condition: service_healthy
    healthcheck: &id005
      test:
      - CMD
      - wget
      - --spider
      - -q
      - 0.0.0.0:8123/ping
      interval: 30s
      timeout: 5s
      retries: 3
    ulimits: &id006
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    hostname: clickhouse
    volumes:
    - /DATA/AppData/$AppID/clickhouse/config.xml:/etc/clickhouse-server/config.xml
    - /DATA/AppData/$AppID/clickhouse/user_scripts:/var/lib/clickhouse/user_scripts/
    - /DATA/AppData/$AppID/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
    - /DATA/AppData/$AppID/clickhouse/docker_related_config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml
    - clickhouse:/var/lib/clickhouse/
  signoz:
    restart: unless-stopped
    logging: *id001
    depends_on: &id002
      clickhouse:
        condition: service_healthy
      schema-migrator-sync:
        condition: service_completed_successfully
    image: signoz/signoz:v0.97.1
    command:
    - --config=/root/config/prometheus.yml
    expose:
    - '8080'
    volumes:
    - /DATA/AppData/$AppID/signoz/prometheus.yml:/root/config/prometheus.yml
    - sqlite:/var/lib/signoz/
    environment:
    - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
    - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
    - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
    - STORAGE=clickhouse
    - TELEMETRY_ENABLED=true
    - DEPLOYMENT_TYPE=docker-standalone-amd
    - DOT_METRICS_ENABLED=true
    - SIGNOZ_JWT_SECRET=3onDyFGWpBqWYBn4knG3I7PtfEAap1MqGqNAiyhEPWUikwi1i0UcqKuvPLWBKrRk
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - localhost:8080/api/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  otel-collector:
    restart: unless-stopped
    logging: *id001
    depends_on:
      signoz:
        condition: service_healthy
    image: signoz/signoz-otel-collector:v0.129.7
    command:
    - --config=/etc/otel-collector-config.yaml
    volumes:
    - /DATA/AppData/$AppID/collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    expose:
    - '4317'
    - '4318'
  schema-migrator-sync:
    restart: on-failure
    logging: *id001
    image: signoz/signoz-schema-migrator:v0.129.7
    command:
    - sync
    - --dsn=tcp://clickhouse:9000
    - --up=
    depends_on:
      clickhouse:
        condition: service_healthy
  schema-migrator-async:
    restart: on-failure
    logging: *id001
    depends_on: *id002
    image: signoz/signoz-schema-migrator:v0.129.7
    command:
    - async
    - --dsn=tcp://clickhouse:9000
    - --up=
x-common:
  restart: unless-stopped
  logging: *id001
x-clickhouse-defaults:
  restart: unless-stopped
  logging: *id001
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  labels: *id003
  depends_on: *id004
  healthcheck: *id005
  ulimits: *id006
  environment:
  - CLICKHOUSE_SKIP_USER_SETUP=1
x-zookeeper-defaults:
  restart: unless-stopped
  logging: *id001
  image: signoz/zookeeper:3.7.1
  user: root
  labels: *id007
  healthcheck: *id008
x-db-depend:
  restart: unless-stopped
  logging: *id001
  depends_on: *id002
volumes:
  clickhouse:
    name: signoz-clickhouse
  sqlite:
    name: signoz-sqlite
  zookeeper-1:
    name: signoz-zookeeper-1
x-casaos:
  id: com.dokploy.signoz
  main: signoz
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/signoz/icon.svg
  title:
    en_US: SigNoz
  tagline:
    en_US: SigNoz is an open-source Datadog or New Relic alternative
  description:
    en_US: SigNoz is an open-source Datadog or New Relic alternative. Get APM, logs,traces, metrics, exceptions, & alerts
      in a single tool.
  author: Dokploy Community
  developer: SigNoz
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.97.1"
  update_at: "2026-11-23"
  website: https://signoz.io/
  repo: https://github.com/SigNoz/signoz
  docs: https://signoz.io/docs/
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (clickhouse/config.xml,
        clickhouse/cluster.xml, clickhouse/docker_related_config.xml, signoz/prometheus.yml, collector/otel-collector-config.yaml,
        clickhouse/user_scripts/empty.txt). Review environment variables before starting.
