name: shopware
services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: shopware
      MYSQL_USER: shopware
      MYSQL_PASSWORD: ea3f6b67e516be5d6f8dd277b14cb746469205b07470511c45c35a956f0609e3
      MYSQL_ROOT_PASSWORD: 39f8a2af6ceed05bc2e4818f94f0fbc8cbf383144d6d15d490f349b35e615937
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
    - database-data:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: 8de70c608ca7f316dc3c8796350f6b9a8a0f424b59e7293a17d11c96bc5338d9
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
    - redis-data:/data
  bootstrap:
    image: ${SHOPWARE_CLI_IMAGE:-shopware/shopware-cli:0.14.3-php-8.4}
    restart: 'no'
    environment:
      APP_ENV: prod
      APP_SECRET: 8c61be5542db9e259d1cdadcdc53d676c88844828515ad27cf1fcc31e1a4c2569c4d089090f7b3ba9c6fdeba7f282a30182dc3073756543b813e0b8b55031164
      INSTANCE_ID: ee7c82534e3f2b40bcdafb650b50aadbb798d29e10ecea53ee75060f4eb6db2d
      APP_URL: http://localhost
      ENABLE_DEMO_DATA: '1'
      TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-port,x-forwarded-prefix
      DATABASE_HOST: database
      DATABASE_PORT: '3306'
      DATABASE_NAME: shopware
      DATABASE_USER: shopware
      DATABASE_PASSWORD: ea3f6b67e516be5d6f8dd277b14cb746469205b07470511c45c35a956f0609e3
      DATABASE_URL: mysql://shopware:ea3f6b67e516be5d6f8dd277b14cb746469205b07470511c45c35a956f0609e3@database:3306/shopware?charset=utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 8de70c608ca7f316dc3c8796350f6b9a8a0f424b59e7293a17d11c96bc5338d9
      MAILER_DSN: null://localhost
      LOCK_DSN: redis://:8de70c608ca7f316dc3c8796350f6b9a8a0f424b59e7293a17d11c96bc5338d9@redis:6379/1
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async
      MESSENGER_TRANSPORT_LOW_PRIORITY_DSN: doctrine://default?queue_name=low_priority
      MESSENGER_TRANSPORT_FAILURE_DSN: doctrine://default?queue_name=failed
      COMPOSER_PLUGIN_LOADER: '1'
      SHOPWARE_HTTP_CACHE_ENABLED: '1'
      SHOPWARE_HTTP_DEFAULT_TTL: '7200'
      INSTALL_LOCALE: en-GB
      INSTALL_CURRENCY: EUR
      INSTALL_ADMIN_USERNAME: admin
      INSTALL_ADMIN_PASSWORD: HXQCrIWKKCkRwHO5saPE
      PHP_SESSION_HANDLER: redis
      PHP_SESSION_SAVE_PATH: tcp://redis:6379?auth=8de70c608ca7f316dc3c8796350f6b9a8a0f424b59e7293a17d11c96bc5338d9
      PHP_SESSION_COOKIE_LIFETIME: '0'
      PHP_SESSION_GC_MAXLIFETIME: '1440'
      PHP_MAX_UPLOAD_SIZE: 128M
      PHP_MAX_EXECUTION_TIME: '300'
      PHP_MEMORY_LIMIT: 512M
      FPM_PM: dynamic
      FPM_PM_MAX_CHILDREN: '20'
      FPM_PM_START_SERVERS: '4'
      FPM_PM_MIN_SPARE_SERVERS: '2'
      FPM_PM_MAX_SPARE_SERVERS: '6'
      BLUE_GREEN_DEPLOYMENT: '0'
      COMPOSER_ALLOW_SUPERUSER: '1'
      COMPOSER_HOME: /tmp/composer
      SHOPWARE_VERSION: 6.7.12.1
      SHOPWARE_DOCKER_VERSION: 0.3.0
      DEMO_DATA_VERSION: 2.1.0
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    - "mkdir -p /run/shopware-secrets /var/www/html\n\nif [ ! -s /run/shopware-secrets/jwt-private.pem ] || [ ! -s /run/shopware-secrets/jwt-public.pem\
      \ ]; then\n  echo \"Generating JWT keypair.\"\n  openssl genpkey -algorithm RSA -out /run/shopware-secrets/jwt-private.pem\
      \ -pkeyopt rsa_keygen_bits:2048\n  openssl rsa -pubout -in /run/shopware-secrets/jwt-private.pem -out /run/shopware-secrets/jwt-public.pem\n\
      \  chmod 600 /run/shopware-secrets/jwt-private.pem\n  chmod 644 /run/shopware-secrets/jwt-public.pem\nfi\n\nexport JWT_PRIVATE_KEY=\"\
      $$(cat /run/shopware-secrets/jwt-private.pem)\"\nexport JWT_PUBLIC_KEY=\"$$(cat /run/shopware-secrets/jwt-public.pem)\"\
      \n\nif [ -f /var/www/html/composer.json ] && [ -f /var/www/html/bin/console ] && [ -f /var/www/html/vendor/autoload.php\
      \ ]; then\n  echo \"Shopware source already exists. Skipping bootstrap.\"\n  exit 0\nfi\n\nif find /var/www/html -mindepth\
      \ 1 -maxdepth 1 -print -quit | grep -q .; then\n  echo \"Incomplete Shopware source detected. Cleaning bootstrap volume.\"\
      \n  find /var/www/html -mindepth 1 -maxdepth 1 -exec rm -rf {} +\nfi\n\ntmp_dir=\"$$(mktemp -d)\"\n\n# Composer >=2.9\
      \ refuses to install pinned versions that are affected by\n# security advisories published later. Keep the pinned bootstrap\
      \ deterministic.\ncomposer config -g audit.block-insecure false 2>/dev/null || true\n\ncomposer create-project --no-interaction\
      \ --prefer-dist \"shopware/production:${SHOPWARE_VERSION}\" \"$$tmp_dir\"\ncd \"$$tmp_dir\"\ncomposer require --no-interaction\
      \ \"shopware/docker:${SHOPWARE_DOCKER_VERSION}\"\n\nif [ \"${ENABLE_DEMO_DATA}\" = \"1\" ]; then\n  composer require\
      \ --no-interaction --prefer-dist \"swag/demo-data:${DEMO_DATA_VERSION}\"\nfi\n\nshopware-cli project ci \"$$tmp_dir\"\
      \ncp -a \"$$tmp_dir\"/. /var/www/html/\n"
    volumes:
    - shopware-code:/var/www/html
    - shopware-secrets:/run/shopware-secrets
  init-permissions:
    image: alpine:3.21
    restart: 'no'
    command:
    - sh
    - -ec
    - "mkdir -p \\\n  /var/www/html/files \\\n  /var/www/html/public/theme \\\n  /var/www/html/public/media \\\n  /var/www/html/public/thumbnail\
      \ \\\n  /var/www/html/public/sitemap \\\n  /run/shopware-secrets\nchown -R 82:82 /var/www/html /run/shopware-secrets\n"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
    - shopware-code:/var/www/html
    - shopware-secrets:/run/shopware-secrets
    - files:/var/www/html/files
    - theme:/var/www/html/public/theme
    - media:/var/www/html/public/media
    - thumbnail:/var/www/html/public/thumbnail
    - sitemap:/var/www/html/public/sitemap
  init:
    image: ${SHOPWARE_BASE_IMAGE:-shopware/docker-base:8.4.19-nginx}
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    - "export JWT_PRIVATE_KEY=\"$(cat /run/shopware-secrets/jwt-private.pem)\"\nexport JWT_PUBLIC_KEY=\"$(cat /run/shopware-secrets/jwt-public.pem)\"\
      \n\n/setup\n\nif [ \"${ENABLE_DEMO_DATA:-1}\" != \"1\" ]; then\n  exit 0\nfi\n\ncd /var/www/html\n\necho \"Demo data\
      \ enabled. Refreshing plugin list.\"\nphp bin/console -n plugin:refresh\n\nif [ ! -d /var/www/html/custom/plugins/SwagPlatformDemoData\
      \ ]; then\n  echo \"SwagPlatformDemoData is not present in the volume.\"\n  echo \"Continuing without demo data activation.\"\
      \n  exit 0\nfi\n\nif ! plugin_state=\"$$(\n  php bin/console -n plugin:list --json | php -r '\n    $$plugins = json_decode(stream_get_contents(STDIN),\
      \ true);\n    if (!is_array($$plugins)) {\n      fwrite(STDERR, \"Unable to parse plugin list\\n\");\n      exit(2);\n\
      \    }\n\n    foreach ($$plugins as $$plugin) {\n      if (($$plugin[\"name\"] ?? null) !== \"SwagPlatformDemoData\"\
      ) {\n        continue;\n      }\n\n      $$installed = ($$plugin[\"installed\"] ?? false) ? \"1\" : \"0\";\n      $$active\
      \ = ($$plugin[\"active\"] ?? false) ? \"1\" : \"0\";\n\n      echo $$installed . \":\" . $$active;\n      exit(0);\n\
      \    }\n\n    fwrite(STDERR, \"SwagPlatformDemoData not found in plugin list\\n\");\n    exit(1);\n  '\n)\"; then\n\
      \  echo \"Unable to resolve SwagPlatformDemoData state.\"\n  echo \"Continuing without demo data activation.\"\n  exit\
      \ 0\nfi\n\ncase \"$${plugin_state}\" in\n  \"0:0\")\n    echo \"Installing and activating SwagPlatformDemoData.\"\n\
      \    php bin/console -n plugin:install --activate SwagPlatformDemoData\n    ;;\n  \"1:0\")\n    echo \"Activating existing\
      \ SwagPlatformDemoData plugin.\"\n    php bin/console -n plugin:activate SwagPlatformDemoData\n    ;;\n  \"1:1\")\n\
      \    echo \"SwagPlatformDemoData is already active.\"\n    ;;\n  *)\n    echo \"Unexpected SwagPlatformDemoData state:\
      \ $${plugin_state}\"\n    echo \"Continuing without demo data activation.\"\n    exit 0\n    ;;\nesac\n"
