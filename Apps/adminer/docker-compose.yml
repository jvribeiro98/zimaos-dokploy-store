name: adminer
services:
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    expose:
    - 8080
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.adminer
  main: adminer
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/adminer/icon.svg
  title:
    en_US: Adminer
  tagline:
    en_US: Adminer is a lightweight, web-based database management tool
  description:
    en_US: Adminer is a lightweight, web-based database management tool. Self-host it on your own server with Dokploy, which
      deploys Adminer as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Adminer
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "4.8.1"
  update_at: "2026-11-23"
  website: https://www.adminer.org/
  repo: https://github.com/vrana/adminer
  docs: https://www.adminer.org/en/plugins/
