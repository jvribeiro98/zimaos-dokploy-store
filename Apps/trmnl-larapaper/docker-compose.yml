name: trmnl-larapaper
services:
  trmnl-larapaper:
    image: ghcr.io/usetrmnl/larapaper:0.46.0
    environment:
    - APP_URL=localhost
    - PHP_OPCACHE_ENABLE=1
    - DEPLOY_VARIANT="dokploy"
    - DB_DATABASE=database/storage/database.sqlite
    - APP_TIMEZONE=UTC
    - REGISTRATION_ENABLED=1
    - FORCE_HTTPS=0
    restart: always
    volumes:
    - trmnl-database:/var/www/html/database/storage
    - trmnl-storage:/var/www/html/storage/app/public/images/generated
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  trmnl-database: null
  trmnl-storage: null
x-casaos:
  id: com.dokploy.trmnl-larapaper
  main: trmnl-larapaper
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/trmnl-larapaper/icon.svg
  title:
    en_US: TRMNL LaraPaper
  tagline:
    en_US: LaraPaper is a self-hosted application (BYOS) to manage TRMNL e-ink devices
  description:
    en_US: LaraPaper is a self-hosted application (BYOS) to manage TRMNL e-ink devices.
  author: Dokploy Community
  developer: TRMNL LaraPaper
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.46.0"
  update_at: "2026-11-27"
  website: https://docs.usetrmnl.com/go/diy/byos
  repo: https://github.com/usetrmnl/larapaper
  docs: https://github.com/usetrmnl/larapaper/blob/main/README.md
