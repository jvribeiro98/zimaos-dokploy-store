name: reactive-resume
services:
  postgres:
    image: postgres:16-alpine
    volumes:
    - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: HPQF55Bi2290suFCdGPqLTSZoYNr6K11
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: qbBTT6uxWraomy4fSkAgYSv3ltwWGIql
    restart: unless-stopped
  chrome:
    image: ghcr.io/browserless/chromium:v2.18.0
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      TIMEOUT: '10000'
      CONCURRENT: '10'
      TOKEN: fgJcJL9nLT74JO5bsFX6LADHjEOKuqRW
      EXIT_ON_HEALTH_FAILURE: 'true'
      PRE_REQUEST_HEALTH_CHECK: 'true'
    restart: unless-stopped
  app:
    image: amruthpillai/reactive-resume:latest
    depends_on:
    - postgres
    - minio
    - chrome
    environment:
      PORT: '3000'
      NODE_ENV: production
      PUBLIC_URL: https://localhost
      STORAGE_URL: https://localhost/default
      CHROME_TOKEN: fgJcJL9nLT74JO5bsFX6LADHjEOKuqRW
      CHROME_URL: ws://chrome:3000
      DATABASE_URL: postgresql://postgres:HPQF55Bi2290suFCdGPqLTSZoYNr6K11@postgres:5432/postgres
      ACCESS_TOKEN_SECRET: WQ6JB6262oNqvd8vwPCANpAQuQlGBGE1x6ut2MvnnwjrVbrTOl1XR2L6I8e5aLQF
      REFRESH_TOKEN_SECRET: YGTRZLwu249r5Q76rBPi8LWrubkeR2k37YvnHQmFRWnnpBjF7u5GWxZdRdboOKoI
      MAIL_FROM: noreply@localhost
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: '9000'
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: default
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: qbBTT6uxWraomy4fSkAgYSv3ltwWGIql
      STORAGE_USE_SSL: 'false'
      STORAGE_SKIP_BUCKET_CHECK: 'false'
    restart: unless-stopped
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  minio_data: null
  postgres_data: null
x-casaos:
  id: com.dokploy.reactive-resume
  main: app
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/reactive-resume/icon.svg
  title:
    en_US: Reactive Resume
  tagline:
    en_US: A free and open-source resume builder that simplifies the process of creating, updating...
  description:
    en_US: A free and open-source resume builder that simplifies the process of creating, updating, and sharing your resume.
  author: Dokploy Community
  developer: Reactive Resume
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://rxresu.me/
  repo: https://github.com/AmruthPillai/Reactive-Resume
  docs: https://docs.rxresu.me/
