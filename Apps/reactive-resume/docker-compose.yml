name: reactive-resume
services:
  postgres:
    image: postgres:16-alpine
    volumes:
    - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FnjMiMwAGf1ei76vgML52F8tqIQ2TF3q
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: N8gfvgrtkK6W1OX8PF7O55gxTdkOi2O6
    restart: unless-stopped
  chrome:
    image: ghcr.io/browserless/chromium:v2.18.0
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      TIMEOUT: '10000'
      CONCURRENT: '10'
      TOKEN: cwdUdoDdOE8bPP5PiPJB1o0olHpMH3Pg
      EXIT_ON_HEALTH_FAILURE: 'true'
      PRE_REQUEST_HEALTH_CHECK: 'true'
    restart: unless-stopped
  app:
    image: amruthpillai/reactive-resume:latest
    depends_on:
    - postgres
    - minio
    - chrome
    environment:
      PORT: '3000'
      NODE_ENV: production
      PUBLIC_URL: https://localhost
      STORAGE_URL: https://localhost/default
      CHROME_TOKEN: cwdUdoDdOE8bPP5PiPJB1o0olHpMH3Pg
      CHROME_URL: ws://chrome:3000
      DATABASE_URL: postgresql://postgres:FnjMiMwAGf1ei76vgML52F8tqIQ2TF3q@postgres:5432/postgres
      ACCESS_TOKEN_SECRET: N01Kar2pUIcJcy2xxoLt8Lj9qLUkxjchyST2gSSsRvmxfSLo4UOgKzoEtm167Tap
      REFRESH_TOKEN_SECRET: GxE7Bqj96tZlY4ioKM1PiTR6ZQoW3ligILLbYEwIIYpq9gUiSIQdhocUdn2EMwHh
      MAIL_FROM: noreply@localhost
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: '9000'
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: default
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: N8gfvgrtkK6W1OX8PF7O55gxTdkOi2O6
      STORAGE_USE_SSL: 'false'
      STORAGE_SKIP_BUCKET_CHECK: 'false'
    restart: unless-stopped
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  minio_data: null
  postgres_data: null
x-casaos:
  id: com.dokploy.reactive-resume
  main: app
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/reactive-resume/icon.svg
  title:
    en_US: Reactive Resume
  tagline:
    en_US: A free and open-source resume builder that simplifies the process of creating, updating...
  description:
    en_US: A free and open-source resume builder that simplifies the process of creating, updating, and sharing your resume.
  author: Dokploy Community
  developer: Reactive Resume
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://rxresu.me/
  repo: https://github.com/AmruthPillai/Reactive-Resume
  docs: https://docs.rxresu.me/
