name: pastefy
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ar7tc7ZgXPaV99PHTTAHxknh1DsOayEn
      MYSQL_DATABASE: pastefy
      MYSQL_USER: pastefy
      MYSQL_PASSWORD: zGPJd2eRgreG5oSiRM64DSVtov1CG6vj
  pastefy:
    image: interaapps/pastefy:latest
    restart: unless-stopped
    depends_on:
    - db
    expose:
    - '80'
    environment:
      HTTP_SERVER_PORT: '80'
      HTTP_SERVER_CORS: '*'
      DATABASE_DRIVER: mysql
      DATABASE_NAME: pastefy
      DATABASE_USER: pastefy
      DATABASE_PASSWORD: zGPJd2eRgreG5oSiRM64DSVtov1CG6vj
      DATABASE_HOST: db
      DATABASE_PORT: '3306'
      SERVER_NAME: https://localhost
      OAUTH2_INTERAAPPS_CLIENT_ID: 'NONE # Interaapps API Key (optional)'
      OAUTH2_INTERAAPPS_CLIENT_SECRET: ' # Interaapps API Secret (optional)'
      OAUTH2_GITHUB_CLIENT_ID: 'NONE # GitHub API Key (optional)'
      OAUTH2_GITHUB_CLIENT_SECRET: ' # GitHub API Secret (optional)'
      OAUTH2_GOOGLE_CLIENT_ID: 'NONE # Google API Key (optional)'
      OAUTH2_GOOGLE_CLIENT_SECRET: ' # Google API Secret (optional)'
      OAUTH2_DISCORD_CLIENT_ID: 'NONE # Discord API Key (optional)'
      OAUTH2_DISCORD_CLIENT_SECRET: ' # Discord API Secret (optional)'
      OAUTH2_TWITCH_CLIENT_ID: 'NONE # Twitch API Key (optional)'
      OAUTH2_TWITCH_CLIENT_SECRET: ' # Twitch API Secret (optional)'
    ports:
    - target: 80
      published: "80"
      protocol: tcp
x-casaos:
  id: com.dokploy.pastefy
  main: pastefy
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/pastefy/icon.png
  title:
    en_US: Pastefy
  tagline:
    en_US: Pastefy is an open-source pastebin with support for syntax highlighting and OAuth2 auth...
  description:
    en_US: Pastefy is an open-source pastebin with support for syntax highlighting and OAuth2 authentication.
  author: Dokploy Community
  developer: Pastefy
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://pastefy.app
  repo: https://github.com/interaapps/pastefy
  docs: https://github.com/interaapps/pastefy/wiki
