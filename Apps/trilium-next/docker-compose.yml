name: trilium-next
services:
  trilium_next:
    image: triliumnext/trilium:v0.101.3
    restart: unless-stopped
    environment:
    - TRILIUM_DATA_DIR=/home/node/trilium-data
    expose:
    - '8080'
    volumes:
    - /DATA/AppData/trilium-next/data~/trilium-data:/home/node/trilium-data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
x-casaos:
  id: com.dokploy.trilium-next
  main: trilium_next
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/trilium-next/icon.svg
  title:
    en_US: TriliumNext
  tagline:
    en_US: Is a free and open-source, cross-platform hierarchical note taking application with foc...
  description:
    en_US: Is a free and open-source, cross-platform hierarchical note taking application with focus on building large personal
      knowledge bases.
  author: Dokploy Community
  developer: TriliumNext
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.101.3"
  update_at: "2026-11-22"
  website: https://triliumnotes.org/
  repo: https://github.com/TriliumNext/Trilium
  docs: https://docs.triliumnotes.org/
