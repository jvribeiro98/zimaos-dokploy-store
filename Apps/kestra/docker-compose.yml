name: kestra
services:
  postgres:
    image: postgres
    volumes:
    - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    user: root
    command: server standalone
    volumes:
    - kestra-data:/app/storage
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: "datasources:\n  postgres:\n    url: jdbc:postgresql://postgres:5432/kestra\n    driverClassName:\
        \ org.postgresql.Driver\n    username: kestra\n    password: k3str4\nkestra:\n  server:\n    basicAuth:\n      enabled:\
        \ false\n      username: \"admin@localhost.dev\" # it must be a valid email address\n      password: k3str4p@ss\n\
        \  repository:\n    type: postgres\n  storage:\n    type: local\n    local:\n      basePath: \"/app/storage\"\n  queue:\n\
        \    type: postgres\n  tasks:\n    tmpDir:\n      path: /tmp/kestra-wd/tmp\n  url: http://localhost:8080/\n"
    expose:
    - '8080'
    - '8081'
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
x-casaos:
  id: com.dokploy.kestra
  main: kestra
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/kestra/icon.svg
  title:
    en_US: Kestra
  tagline:
    en_US: Unified Orchestration Platform to Simplify Business-Critical Workflows and Govern them...
  description:
    en_US: Unified Orchestration Platform to Simplify Business-Critical Workflows and Govern them as Code and from the UI.
  author: Dokploy Community
  developer: Kestra
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://kestra.io
  repo: https://github.com/kestra-io/kestra
  docs: https://kestra.io/docs
