name: arche
services:
  web:
    image: ${ARCHE_WEB_IMAGE:-ghcr.io/peaberry-studio/arche/web:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      ARCHE_DOMAIN: localhost
      DATABASE_URL: postgresql://postgres:bQ4ZhC6JUExDW6dLuqvGPL6mjSeIcSiw@postgres:5432/arche?schema=public
      ARCHE_SESSION_PEPPER: hwvVGfV4+025+wBPmRz/5j7Ox+DIiwHtl633HprJ5n0=
      ARCHE_ENCRYPTION_KEY: LzTP4XQkcIq8LwRhloeR9PfjM0I/memXVKGfgtVpHuY=
      ARCHE_INTERNAL_TOKEN: 4EF1p4d8SKUoYZwc3yJGVKwwSedy+Djkytt92GmVGk0=
      ARCHE_GATEWAY_TOKEN_SECRET: L5A2cMGRPZVI+w4LXjrCnKirjqwez27HSG2j1J/mS5g=
      ARCHE_CONNECTOR_OAUTH_STATE_SECRET: LgRdzEU615Mj0yc0SiV2Ppaw+ML3QVWL7PSmlGpeXz8=
      ARCHE_GATEWAY_TOKEN_TTL_SECONDS: '86400'
      ARCHE_GATEWAY_BASE_URL: http://web:3000
      ARCHE_PUBLIC_BASE_URL: https://localhost
      ARCHE_SESSION_TTL_DAYS: '7'
      ARCHE_COOKIE_SECURE: 'true'
      ARCHE_SEED_ADMIN_EMAIL: admin@example.com
      ARCHE_SEED_ADMIN_PASSWORD: agHWnVmNJGGzHnLL
      ARCHE_SEED_ADMIN_SLUG: admin
      CONTAINER_PROXY_HOST: docker-socket-proxy
      CONTAINER_PROXY_PORT: '2375'
      OPENCODE_IMAGE: ghcr.io/peaberry-studio/arche/workspace:latest
      OPENCODE_NETWORK: ''
      KB_CONTENT_HOST_PATH: /opt/arche/kb-content
      KB_CONFIG_HOST_PATH: /opt/arche/kb-config
      ARCHE_USERS_PATH: /opt/arche/users
    expose:
    - '3000'
    volumes:
    - /opt/arche/kb-content:/kb-content
    - /opt/arche/kb-config:/kb-config
    - /opt/arche/users:/opt/arche/users
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: arche
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bQ4ZhC6JUExDW6dLuqvGPL6mjSeIcSiw
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:master
    restart: unless-stopped
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      IMAGES: '1'
      INFO: '1'
      POST: '1'
      VOLUMES: '1'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  postgres_data: null
x-casaos:
  id: com.dokploy.arche
  main: web
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/arche/icon.svg
  title:
    en_US: Arche
  tagline:
    en_US: Arche is a self-hosted AI workspace platform that spawns per-user OpenCode coding conta...
  description:
    en_US: Arche is a self-hosted AI workspace platform that spawns per-user OpenCode coding containers backed by a shared
      Knowledge Base. Requires the `arche-internal` external Docker network and `/opt/arche/{kb-content,kb-config,users}`
      directories on the host before deploy. Images are linux/amd64 by default; override `ARCHE_WEB_IMAGE` and `ARCHE_WORKSPACE_IMAGE`
      to the `-arm64` tag variants for ARM64 hosts.
  author: Dokploy Community
  developer: Arche
  category: AI
  architectures:
  - amd64
  - arm64
  version: "latest}"
  update_at: "2026-11-26"
  website: https://github.com/peaberry-studio/arche
  repo: https://github.com/peaberry-studio/arche
  docs: https://github.com/peaberry-studio/arche#readme
