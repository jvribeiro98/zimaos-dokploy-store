name: healthchecks
services:
  healthchecks:
    image: healthchecks/healthchecks:v4.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
    - 8000
    environment:
      DEBUG: 'False'
      DB: postgres
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: healthchecks
      DB_USER: healthchecks
      DB_PASSWORD: TqKHSW1fJB4yMzn697Ehl2a4tKJIFTyd
      SECRET_KEY: sQjfVsiHHntyQEos986v6Eg55z83q9dTbLwt9MyRzrwJ9VMcvM5MuVt5alFdyqSv
      SITE_ROOT: https://localhost
      SITE_NAME: Healthchecks
      ALLOWED_HOSTS: localhost
      PING_ENDPOINT: https://localhost/ping/
      REGISTRATION_OPEN: 'False'
      DEFAULT_FROM_EMAIL: healthchecks@localhost
      EMAIL_HOST: ''
      EMAIL_PORT: '587'
      EMAIL_HOST_USER: ''
      EMAIL_HOST_PASSWORD: ''
      EMAIL_USE_TLS: 'True'
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthchecks
      POSTGRES_USER: healthchecks
      POSTGRES_PASSWORD: TqKHSW1fJB4yMzn697Ehl2a4tKJIFTyd
    volumes:
    - healthchecks-db:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  healthchecks-db: null
x-casaos:
  id: com.dokploy.healthchecks
  main: healthchecks
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/healthchecks/icon.svg
  title:
    en_US: Healthchecks
  tagline:
    en_US: Healthchecks is an open-source cron job and background task monitoring service that ale...
  description:
    en_US: 'Healthchecks is an open-source cron job and background task monitoring service that alerts you when your scheduled
      jobs fail to check in. Registration is closed by default: create the first admin by running ./manage.py createsuperuser
      in the healthchecks container terminal.'
  author: Dokploy Community
  developer: Healthchecks
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "4.4"
  update_at: "2026-11-27"
  website: https://healthchecks.io/
  repo: https://github.com/healthchecks/healthchecks
  docs: https://healthchecks.io/docs/self_hosted_docker/
