name: coralproject
services:
  coral:
    image: coralproject/talk:9.7.0
    expose:
    - '3000'
    environment:
    - MONGODB_URI=mongodb://mongo:4dwO3sF22j4vqhYk@mongo:27017
    - REDIS_URI=redis://default:8K4gV33OmIq6OmoX@redis:6379
    - SIGNING_SECRET=f4wojOMW0pmLpULDYldrnDoxX2MkZCNkxSmzqefBFMfjt
    - NODE_ENV=production
    depends_on:
    - mongo
    - redis
    restart: unless-stopped
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  mongo:
    image: mongo:4
    environment:
    - MONGO_INITDB_ROOT_PASSWORD=4dwO3sF22j4vqhYk
    - MONGO_INITDB_ROOT_USERNAME=mongo
    volumes:
    - mongo-data:/data/db
    restart: unless-stopped
  redis:
    image: redis:6
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - redis-data:/data
    restart: unless-stopped
volumes:
  mongo-data: null
  redis-data: null
x-casaos:
  id: com.dokploy.coralproject
  main: coral
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/coralproject/icon.png
  title:
    en_US: Coral
  tagline:
    en_US: Coral is a revolutionary commenting platform designed to enhance website interactions
  description:
    en_US: Coral is a revolutionary commenting platform designed to enhance website interactions. It features smart technology
      for meaningful discussions, journalist identification, moderation tools with AI support, and complete data control without
      ads or trackers. Used by major news sites worldwide.
  author: Dokploy Community
  developer: Coral
  category: Social
  architectures:
  - amd64
  - arm64
  version: "9.7.0"
  update_at: "2026-11-25"
  website: https://coralproject.net/
  repo: https://github.com/coralproject/talk
  docs: https://docs.coralproject.net/
