name: karakeep
services:
  web:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    restart: unless-stopped
    volumes:
    - data:/data
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data
      NEXTAUTH_SECRET: your_secure_key
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
    - --no-sandbox
    - --disable-gpu
    - --disable-dev-shm-usage
    - --remote-debugging-address=0.0.0.0
    - --remote-debugging-port=9222
    - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: 'true'
    volumes:
    - meilisearch:/meili_data
volumes:
  meilisearch: null
  data: null
x-casaos:
  id: com.dokploy.karakeep
  main: web
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/karakeep/icon.svg
  title:
    en_US: KaraKeep
  tagline:
    en_US: A self-hostable bookmark-everything app (links, notes and images) with AI-based automat...
  description:
    en_US: A self-hostable bookmark-everything app (links, notes and images) with AI-based automatic tagging and full text
      search. Previously known as Hoarder.
  author: Dokploy Community
  developer: KaraKeep
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.25.0"
  update_at: "2026-11-28"
  website: https://karakeep.app/
  repo: https://github.com/karakeep-app/karakeep
  docs: https://github.com/karakeep-app/karakeep/tree/main/docs
