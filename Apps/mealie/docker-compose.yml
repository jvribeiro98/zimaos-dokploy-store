name: mealie
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
    - mealie-data:/app/data/
    environment:
      PUID: '1000'
      PGID: '1000'
      BASE_URL: https://localhost
      API_DOCS: 'False'
      ALLOW_SIGNUP: 'false'
      DEFAULT_GROUP: Home
      DEFAULT_HOUSEHOLD: Family
      TZ: Europe/London
      SECURITY_MAX_LOGIN_ATTEMPTS: '10'
      SECURITY_USER_LOCKOUT_TIME: '24'
      DAILY_SCHEDULE_TIME: 01:00
      SMTP_HOST: ''
      SMTP_PORT: '587'
      SMTP_AUTH_STRATEGY: TLS
      SMTP_FROM_NAME: Mealie
      SMTP_FROM_EMAIL: ''
      SMTP_USER: ''
      SMTP_PASSWORD: ''
    restart: unless-stopped
    ports:
    - target: 9000
      published: "9000"
      protocol: tcp
volumes:
  mealie-data: {}
x-casaos:
  id: com.dokploy.mealie
  main: mealie
  index: /
  port_map: "9000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mealie/icon.png
  title:
    en_US: Mealie (sqlite version)
  tagline:
    en_US: Mealie is an intuitive and easy to use recipe management app
  description:
    en_US: Mealie is an intuitive and easy to use recipe management app. It's designed to make your life easier by being the
      best recipes management experience on the web and providing you with an easy to use interface to manage your growing
      collection of recipes.
  author: Dokploy Community
  developer: Mealie (sqlite version)
  category: Home
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-27"
  website: https://mealie.io/
  repo: https://github.com/mealie-recipes/mealie
  docs: https://docs.mealie.io/
