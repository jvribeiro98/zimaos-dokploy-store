name: taiga
services:
  taiga-db:
    image: postgres:12.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: IY9hLO2HPQVDRwLo12a0wP3N4wnvhipH
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 2s
      timeout: 15s
      retries: 5
      start_period: 3s
    volumes:
    - taiga-db-data:/var/lib/postgresql/data
  taiga-back:
    image: taigaio/taiga-back:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: IY9hLO2HPQVDRwLo12a0wP3N4wnvhipH
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: xNlU0T6L5NpBxMuF5bVyAm1HnJ7pFiYohl3Ukb0COqxJ3o2MqenM4bliG3qiEu6U
      TAIGA_SITES_SCHEME: https
      TAIGA_SITES_DOMAIN: localhost
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: changeme@example.com
      EMAIL_USE_TLS: 'False'
      EMAIL_USE_SSL: 'False'
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: '587'
      EMAIL_HOST_USER: user
      EMAIL_HOST_PASSWORD: password
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: MojtW7VpYXWO6xve6UIFWYl2DxPvlxFv
      RABBITMQ_VHOST: taiga
      ENABLE_TELEMETRY: 'False'
      PUBLIC_REGISTER_ENABLED: 'False'
    volumes:
    - taiga-static-data:/taiga-back/static
    - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
  taiga-async:
    image: taigaio/taiga-back:latest
    restart: unless-stopped
    entrypoint:
    - /taiga-back/docker/async_entrypoint.sh
    environment:
      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: IY9hLO2HPQVDRwLo12a0wP3N4wnvhipH
      POSTGRES_HOST: taiga-db
      TAIGA_SECRET_KEY: xNlU0T6L5NpBxMuF5bVyAm1HnJ7pFiYohl3Ukb0COqxJ3o2MqenM4bliG3qiEu6U
      TAIGA_SITES_SCHEME: https
      TAIGA_SITES_DOMAIN: localhost
      TAIGA_SUBPATH: ''
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: changeme@example.com
      EMAIL_USE_TLS: 'False'
      EMAIL_USE_SSL: 'False'
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: '587'
      EMAIL_HOST_USER: user
      EMAIL_HOST_PASSWORD: password
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: MojtW7VpYXWO6xve6UIFWYl2DxPvlxFv
      RABBITMQ_VHOST: taiga
      ENABLE_TELEMETRY: 'False'
      PUBLIC_REGISTER_ENABLED: 'False'
    volumes:
    - taiga-static-data:/taiga-back/static
    - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started
  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    restart: unless-stopped
    hostname: taiga-async-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: HU43KJggJJxTUuEqXR99UrE9mIYyjDi8
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: MojtW7VpYXWO6xve6UIFWYl2DxPvlxFv
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
    - taiga-async-rabbitmq-data:/var/lib/rabbitmq
  taiga-front:
    image: taigaio/taiga-front:latest
    restart: unless-stopped
    environment:
      TAIGA_URL: https://localhost
      TAIGA_WEBSOCKETS_URL: wss://localhost
      TAIGA_SUBPATH: ''
      PUBLIC_REGISTER_ENABLED: 'false'
  taiga-events:
    image: taigaio/taiga-events:latest
    restart: unless-stopped
    environment:
      RABBITMQ_USER: taiga
      RABBITMQ_PASS: MojtW7VpYXWO6xve6UIFWYl2DxPvlxFv
      RABBITMQ_VHOST: taiga
      TAIGA_SECRET_KEY: xNlU0T6L5NpBxMuF5bVyAm1HnJ7pFiYohl3Ukb0COqxJ3o2MqenM4bliG3qiEu6U
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started
  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    restart: unless-stopped
    hostname: taiga-events-rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: HU43KJggJJxTUuEqXR99UrE9mIYyjDi8
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: MojtW7VpYXWO6xve6UIFWYl2DxPvlxFv
      RABBITMQ_DEFAULT_VHOST: taiga
    volumes:
    - taiga-events-rabbitmq-data:/var/lib/rabbitmq
  taiga-protected:
    image: taigaio/taiga-protected:latest
    restart: unless-stopped
    environment:
      MAX_AGE: '360'
      SECRET_KEY: xNlU0T6L5NpBxMuF5bVyAm1HnJ7pFiYohl3Ukb0COqxJ3o2MqenM4bliG3qiEu6U
  taiga-gateway:
    image: nginx:1.19-alpine
    restart: unless-stopped
    expose:
    - 80
    volumes:
    - /DATA/AppData/$AppID/volumes/nginx/taiga.conf:/etc/nginx/conf.d/default.conf:ro
    - taiga-static-data:/taiga/static:ro
    - taiga-media-data:/taiga/media:ro
    depends_on:
    - taiga-front
    - taiga-back
    - taiga-events
    ports:
    - target: 80
      published: "80"
      protocol: tcp
x-environment:
  POSTGRES_DB: taiga
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: taiga-db
  TAIGA_SECRET_KEY: ${SECRET_KEY}
  TAIGA_SITES_SCHEME: ${TAIGA_SCHEME}
  TAIGA_SITES_DOMAIN: ${TAIGA_DOMAIN}
  TAIGA_SUBPATH: ${SUBPATH}
  EMAIL_BACKEND: django.core.mail.backends.${EMAIL_BACKEND}.EmailBackend
  DEFAULT_FROM_EMAIL: ${EMAIL_DEFAULT_FROM}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}
  ENABLE_TELEMETRY: ${ENABLE_TELEMETRY}
  PUBLIC_REGISTER_ENABLED: ${PUBLIC_REGISTER_ENABLED}
x-back-volumes:
- taiga-static-data:/taiga-back/static
- taiga-media-data:/taiga-back/media
volumes:
  taiga-static-data: null
  taiga-media-data: null
  taiga-db-data: null
  taiga-async-rabbitmq-data: null
  taiga-events-rabbitmq-data: null
