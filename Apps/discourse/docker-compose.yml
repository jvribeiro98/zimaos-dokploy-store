name: discourse
services:
  discourse-db:
    image: pgvector/pgvector:pg16
    volumes:
    - discourse-postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: i6ykK7YDMidt8LdNQK6jhAyPpr2lc3Hh
      POSTGRES_DB: discourse
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U discourse -d discourse
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-redis:
    image: redis:7-alpine
    volumes:
    - discourse-redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  discourse-app:
    image: discourse/discourse:2026.1.4
    volumes:
    - discourse-data:/shared
    depends_on:
      discourse-db:
        condition: service_healthy
      discourse-redis:
        condition: service_healthy
    environment:
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DB_HOST: discourse-db
      DISCOURSE_DB_PORT: '5432'
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: i6ykK7YDMidt8LdNQK6jhAyPpr2lc3Hh
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_REDIS_HOST: discourse-redis
      DISCOURSE_REDIS_PORT: '6379'
      DISCOURSE_REDIS_PASSWORD: hGqguKbt6Sh4Z80xsTgZjF5XUw71kfF2
      DISCOURSE_DEVELOPER_EMAILS: admin@example.com
    expose:
    - 80
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  discourse-postgresql-data: null
  discourse-redis-data: null
  discourse-data: null
x-casaos:
  id: com.dokploy.discourse
  main: discourse-app
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/discourse/icon.svg
  title:
    en_US: Discourse
  tagline:
    en_US: Discourse is forum software for running online communities
  description:
    en_US: Discourse is forum software for running online communities. Self-host it on your own server with Dokploy, which
      deploys Discourse as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Discourse
  category: Social
  architectures:
  - amd64
  - arm64
  version: "2026.1.4"
  update_at: "2026-11-27"
  website: https://www.discourse.org/
  repo: https://github.com/discourse/discourse
  docs: https://meta.discourse.org/
