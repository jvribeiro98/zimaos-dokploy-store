name: documenso
services:
  postgres:
    image: postgres:16
    volumes:
    - documenso-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_USER=documenso
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=documenso
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U documenso
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  documenso:
    image: documenso/documenso:v1.12.10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - PORT=3000
    - NEXTAUTH_URL=http://localhost
    - NEXTAUTH_SECRET=Oik+IBgCyCrAf0T5b0BYjApmlZjf5CItSOGLCw3ea24=
    - NEXT_PRIVATE_ENCRYPTION_KEY=LpvxyJ7WLcaVoKFxQt8x996kX1LVPOfQ
    - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=op9HMArkdrEniaN9fXsUyN0FUFe3DGnHNCK4v5qANrg8bgjOnhRtonIZEB5tkWuP
    - NEXT_PUBLIC_WEBAPP_URL=http://localhost
    - NEXT_PRIVATE_DATABASE_URL=postgres://documenso:password@postgres:5432/documenso
    - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgres://documenso:password@postgres:5432/documenso
    - NEXT_PUBLIC_UPLOAD_TRANSPORT=database
    - NEXT_PRIVATE_SMTP_TRANSPORT=smtp-auth
    - NEXT_PRIVATE_SIGNING_TRANSPORT=local
    - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=/app/certs/cert.p12
    - NEXT_PRIVATE_SIGNING_LOCAL_FILE_PASSPHRASE=${NEXT_PRIVATE_SIGNING_LOCAL_FILE_PASSPHRASE}
    - CERT_VALID_DAYS=${CERT_VALID_DAYS:-365}
    - CERT_INFO_COUNTRY_NAME=${CERT_INFO_COUNTRY_NAME:-US}
    - CERT_INFO_STATE_OR_PROVIDENCE=${CERT_INFO_STATE_OR_PROVIDENCE:-State}
    - CERT_INFO_LOCALITY_NAME=${CERT_INFO_LOCALITY_NAME:-City}
    - CERT_INFO_ORGANIZATION_NAME=${CERT_INFO_ORGANIZATION_NAME:-Organization}
    - CERT_INFO_ORGANIZATIONAL_UNIT=${CERT_INFO_ORGANIZATIONAL_UNIT:-IT Department}
    - CERT_INFO_EMAIL=${CERT_INFO_EMAIL:-admin@example.com}
    - DOCUMENSO_HOST=localhost
    expose:
    - ${DOCUMENSO_PORT}
    entrypoint:
    - /bin/sh
    - -c
    - "CERT_PASSPHRASE=\"$${NEXT_PRIVATE_SIGNING_LOCAL_FILE_PASSPHRASE}\"\n\n# Save original working directory\nORIGINAL_DIR=\"\
      $$(pwd)\"\n\n# Find openssl binary (should be available in v1.12.10+)\nOPENSSL_CMD=\"$$(which openssl 2>/dev/null ||\
      \ command -v openssl 2>/dev/null || echo '/usr/bin/openssl')\"\n\n# Verify openssl is available\nif ! $$OPENSSL_CMD\
      \ version >/dev/null 2>&1; then\n  echo \"Error: OpenSSL not found. Please use Documenso image v1.12.10 or later.\"\n\
      \  exit 1\nfi\n\n# Create certificate directory - use /app/certs (writable by user 1001)\nCERT_DIR=\"/app/certs\"\n\
      mkdir -p \"$$CERT_DIR\" || {\n  # Fallback to tmp if app directory not writable\n  CERT_DIR=\"/tmp/certs\"\n  mkdir\
      \ -p \"$$CERT_DIR\"\n  echo \"Warning: Using fallback directory: $$CERT_DIR\"\n}\n\ntouch /tmp/cert_info_path\ncat <<EOF\
      \ > /tmp/cert_info_path\n[ req ]\ndistinguished_name = req_distinguished_name\nprompt = no\n[ req_distinguished_name\
      \ ]\nC            = $${CERT_INFO_COUNTRY_NAME}\nST           = $${CERT_INFO_STATE_OR_PROVIDENCE}\nL            = $${CERT_INFO_LOCALITY_NAME}\n\
      O            = $${CERT_INFO_ORGANIZATION_NAME}\nOU           = $${CERT_INFO_ORGANIZATIONAL_UNIT}\nCN           = $${DOCUMENSO_HOST}\n\
      emailAddress = $${CERT_INFO_EMAIL}\nEOF\n\ncd \"$$CERT_DIR\"\n\n$$OPENSSL_CMD genrsa -out private.key 2048\n\n$$OPENSSL_CMD\
      \ req \\\n  -new \\\n  -x509 \\\n  -key private.key \\\n  -out certificate.crt \\\n  -days $${CERT_VALID_DAYS} \\\n\
      \  -config /tmp/cert_info_path\n\n$$OPENSSL_CMD pkcs12 \\\n  -export \\\n  -out cert.p12 \\\n  -inkey private.key \\\
      \n  -in certificate.crt \\\n  -legacy \\\n  -passout pass:\"$$CERT_PASSPHRASE\"\n\n# Set permissions (may fail if not\
      \ root, but will work in Coolify)\nchown 1001:1001 cert.p12 private.key certificate.crt 2>/dev/null || true\nchmod 400\
      \ cert.p12 private.key certificate.crt\n\n# Update environment variable if directory changed\nif [ \"$$CERT_DIR\" !=\
      \ \"/app/certs\" ]; then\n  export NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH=\"$$CERT_DIR/cert.p12\"\nfi\n\n# Return to original\
      \ directory before starting application\ncd \"$$ORIGINAL_DIR\"\n\n./start.sh\n"
    restart: unless-stopped
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  documenso-data: null
x-casaos:
  id: com.dokploy.documenso
  main: documenso
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/documenso/icon.png
  title:
    en_US: Documenso
  tagline:
    en_US: Documenso is the open source alternative to DocuSign for signing documents digitally
  description:
    en_US: Documenso is the open source alternative to DocuSign for signing documents digitally
  author: Dokploy Community
  developer: Documenso
  category: Others
  architectures:
  - amd64
  - arm64
  version: "1.5.6"
  update_at: "2026-11-27"
  website: https://documenso.com/
  repo: https://github.com/documenso/documenso
  docs: https://docs.documenso.com/
