name: openwa
services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:0.25.0
    restart: unless-stopped
    stop_grace_period: 75s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - KILL
    - SETGID
    - SETUID
    read_only: true
    tmpfs:
    - /tmp
    pids_limit: 2048
    environment:
    - NODE_ENV=production
    - PORT=2785
    - HOME=/tmp
    - XDG_CONFIG_HOME=/tmp/.config
    - XDG_CACHE_HOME=/tmp/.cache
    - ENGINE_TYPE=whatsapp-web.js
    - AUTO_START_SESSIONS=true
    - TZ=UTC
    - CSP_UPGRADE_INSECURE_REQUESTS=false
    - MCP_ENABLED=true
    - MCP_READONLY=true
    - ENABLE_SWAGGER=true
    expose:
    - '2785'
    volumes:
    - openwa-data:/app/data
    ports:
    - target: 2785
      published: "2785"
      protocol: tcp
volumes:
  openwa-data: null
x-casaos:
  id: com.dokploy.openwa
  main: openwa
  index: /
  port_map: "2785"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/openwa/icon.svg
  title:
    en_US: OpenWA
  tagline:
    en_US: OpenWA is a free, self-hosted WhatsApp API gateway with a REST API, webhooks, multi-ses...
  description:
    en_US: OpenWA is a free, self-hosted WhatsApp API gateway with a REST API, webhooks, multi-session support, and a bundled
      web dashboard.
  author: Dokploy Community
  developer: OpenWA
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "0.25.0"
  update_at: "2026-11-26"
  website: https://www.open-wa.org
  repo: https://github.com/rmyndharis/OpenWA
  docs: https://github.com/rmyndharis/OpenWA/tree/main/docs
