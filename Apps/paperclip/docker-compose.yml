name: paperclip
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: qDV3LVsrcsvdxoKQhS0X6gHVVrGj88Po
      POSTGRES_DB: paperclip
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U paperclip -d paperclip
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - postgres-data:/var/lib/postgresql/data
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: '3100'
      SERVE_UI: 'true'
      DATABASE_URL: postgres://paperclip:qDV3LVsrcsvdxoKQhS0X6gHVVrGj88Po@postgres:5432/paperclip
      BETTER_AUTH_SECRET: 9wTkZD8SsafgenUus3Zj3bOVGCb6AUW53FfzmIPcj4WMwfxoDjXR9LKfIqJcTCOR
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_INSTANCE_ID: default
      PAPERCLIP_CONFIG: /paperclip/instances/default/config.json
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: https://localhost
    expose:
    - '3100'
    volumes:
    - paperclip-data:/paperclip
    ports:
    - target: 3100
      published: "3100"
      protocol: tcp
volumes:
  postgres-data: {}
  paperclip-data: {}
x-casaos:
  id: com.dokploy.paperclip
  main: paperclip
  index: /
  port_map: "3100"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/paperclip/icon.svg
  title:
    en_US: Paperclip
  tagline:
    en_US: Paperclip is an open-source control plane for managing teams of AI agents, goals, budge...
  description:
    en_US: Paperclip is an open-source control plane for managing teams of AI agents, goals, budgets, tickets, and recurring
      work.
  author: Dokploy Community
  developer: Paperclip
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://paperclip.ing/
  repo: https://github.com/paperclipai/paperclip
  docs: https://docs.paperclip.ing/
