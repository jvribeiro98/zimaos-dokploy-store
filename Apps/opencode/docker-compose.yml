name: opencode
services:
  opencode:
    image: ghcr.io/anomalyco/opencode:1.18.32
    restart: unless-stopped
    entrypoint: []
    command:
    - sh
    - -c
    - "set -e\napk add --no-cache $${TOOLCHAIN_PACKAGES} >/dev/null 2>&1 || true\nif [ -n \"$${GIT_TOKEN}\" ] && [ -n \"$${GIT_REPO_URL}\"\
      \ ]; then\n  host=$$(printf '%s' \"$${GIT_REPO_URL}\" | sed -E 's#^https?://([^/]+)/.*#\\1#')\n  git config --global\
      \ credential.helper store\n  printf 'https://x-access-token:%s@%s\\n' \"$${GIT_TOKEN}\" \"$$host\" > /root/.git-credentials\n\
      fi\nif [ -n \"$${GIT_REPO_URL}\" ]; then\n  dir=\"/workspace/$$(basename \"$${GIT_REPO_URL}\" .git)\"\n  [ -d \"$$dir/.git\"\
      \ ] || git clone \"$${GIT_REPO_URL}\" \"$$dir\" || true\nfi\nexec opencode serve --hostname 0.0.0.0 --port 4096\n"
    working_dir: /workspace
    expose:
    - 4096
    environment:
    - OPENCODE_SERVER_USERNAME=opencode
    - OPENCODE_SERVER_PASSWORD=G7ghhhnhuJQH8Y9TkuY4BJny3uhU2gma
    - TOOLCHAIN_PACKAGES=git nodejs npm python3
    - GIT_REPO_URL=
    - GIT_TOKEN=
    volumes:
    - opencode-data:/root/.local/share/opencode
    - opencode-config:/root/.config/opencode
    - opencode-workspace:/workspace
    ports:
    - target: 4096
      published: "4096"
      protocol: tcp
volumes:
  opencode-data: null
  opencode-config: null
  opencode-workspace: null
x-casaos:
  id: com.dokploy.opencode
  main: opencode
  index: /
  port_map: "4096"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/opencode/icon.svg
  title:
    en_US: OpenCode
  tagline:
    en_US: OpenCode is an open source AI coding agent
  description:
    en_US: OpenCode is an open source AI coding agent. This template runs its password-protected web UI; optionally set a
      repository URL to clone on start-up, then chat with, edit and run your code from the browser.
  author: Dokploy Community
  developer: OpenCode
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.18.32"
  update_at: "2026-11-28"
  website: https://opencode.ai
  repo: https://github.com/anomalyco/opencode
  docs: https://opencode.ai/v2/docs
