name: quant-ux
services:
  mongo:
    restart: always
    image: mongo
    volumes:
    - mongo_data:/data/db
  qux-fe:
    restart: always
    image: klausenschaefersinho/quant-ux
    environment:
    - QUX_PROXY_URL=http://quant-ux-backend:8080
    - QUX_AUTH=qux
    - QUX_KEYCLOAK_REALM=
    - QUX_KEYCLOAK_CLIENT=
    - QUX_KEYCLOAK_URL=
    - QUX_WS_URL=wss://localhost
    links:
    - mongo
    - qux-be
    expose:
    - 8082
    depends_on:
    - qux-be
    ports:
    - target: 8082
      published: "8082"
      protocol: tcp
  qux-be:
    restart: always
    image: klausenschaefersinho/quant-ux-backend
    volumes:
    - quant_ux_data:/app-data
    environment:
    - QUX_HTTP_HOST=https://localhost
    - QUX_HTTP_PORT=8080
    - QUX_MONGO_DB_NAME=quantux
    - QUX_MONGO_TABLE_PREFIX=quantux
    - QUX_MONGO_CONNECTION_STRING=mongodb://quant-ux-mongo:27017
    - QUX_MAIL_USER=admin@example.com
    - QUX_MAIL_PASSWORD=FKRf1QlTeI1WIh4pXFrYRq9JaBlPIjSs
    - QUX_MAIL_HOST=mail.example.com
    - QUX_JWT_PASSWORD=26AIpv6iKpOsz8p0FEsATQCm7XSn4lu2hMpZghWWreonUAbqEcpmDRxTtwpy2WFX
    - QUX_IMAGE_FOLDER_USER=/app-data/qux-images
    - QUX_IMAGE_FOLDER_APPS=/app-data/qux-image-apps
    - TZ=America/Chicago
    - QUX_AUTH_SERVICE=qux
    - QUX_KEYCLOAK_SERVER=
    - QUX_KEYCLOAK_REALM=
    - QUX_USER_ALLOW_SIGNUP=true
    - QUX_USER_ALLOWED_DOMAINS=*
    depends_on:
    - mongo
  qux-ws:
    restart: always
    image: klausenschaefersinho/quant-ux-websocket
    environment:
    - QUX_SERVER=http://quant-ux-backend:8080/
    - QUX_SERVER_PORT=8086
    expose:
    - 8086
    links:
    - qux-be
    depends_on:
    - qux-be
volumes:
  mongo_data: null
  quant_ux_data: null
x-casaos:
  id: com.dokploy.quant-ux
  main: qux-fe
  index: /
  port_map: "8082"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/quant-ux/icon.svg
  title:
    en_US: Quant-UX
  tagline:
    en_US: Quant-UX is an open-source UX design and prototyping tool that allows you to create int...
  description:
    en_US: Quant-UX is an open-source UX design and prototyping tool that allows you to create interactive prototypes, conduct
      user research, and analyze user behavior.
  author: Dokploy Community
  developer: Quant-UX
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-23"
  website: https://www.quant-ux.com/
  repo: https://github.com/KlausSchaefers/quant-ux
  docs: https://www.quant-ux.com/
