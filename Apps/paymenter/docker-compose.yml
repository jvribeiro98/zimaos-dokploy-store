name: paymenter
services:
  database:
    image: mariadb:lts
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
    - paymenter-database:/var/lib/mysql
    environment:
    - MYSQL_ROOT_PASSWORD=kMQhTr01EIXrEXGnJGkd
    - MYSQL_DATABASE=paymenter
    - MYSQL_USER=paymenter
    - MYSQL_PASSWORD=H8YwX1Sznx5alxxs
  cache:
    image: redis:alpine
    restart: unless-stopped
    volumes:
    - paymenter-redis:/data
  paymenter:
    image: ghcr.io/paymenter/paymenter:latest
    restart: unless-stopped
    expose:
    - 80
    depends_on:
    - database
    - cache
    volumes:
    - paymenter-storage:/app/var
    - paymenter-logs:/app/storage/logs
    - paymenter-public:/app/storage/app/public
    environment:
    - APP_ENV=${APP_ENV:-production}
    - APP_DEBUG=false
    - APP_KEY=base64:0urIe5fk4Re8q5ZktxQzbXvzCAEU3ZpmDj6BKOVx7ck=
    - APP_URL=https://localhost
    - DB_CONNECTION=mysql
    - DB_HOST=database
    - DB_PORT=3306
    - DB_DATABASE=paymenter
    - DB_USERNAME=paymenter
    - DB_PASSWORD=H8YwX1Sznx5alxxs
    - CACHE_STORE=redis
    - REDIS_HOST=cache
    - REDIS_PORT=6379
    - TRUSTED_PROXIES=*
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  paymenter-database: {}
  paymenter-storage: {}
  paymenter-logs: {}
  paymenter-public: {}
  paymenter-redis: {}
x-casaos:
  id: com.dokploy.paymenter
  main: paymenter
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/paymenter/icon.png
  title:
    en_US: Paymenter
  tagline:
    en_US: Paymenter is a modern billing and payment management system for hosting providers, with...
  description:
    en_US: Paymenter is a modern billing and payment management system for hosting providers, with automation, invoicing,
      and client management features.
  author: Dokploy Community
  developer: Paymenter
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://paymenter.org/
  repo: https://github.com/Paymenter/Paymenter
  docs: https://paymenter.org/docs/getting-started/introduction
