name: memos
services:
  memos:
    image: neosmemo/memos:stable
    restart: unless-stopped
    volumes:
    - memos_data:/var/opt/memos
    environment:
    - MEMOS_MODE=prod
    - MEMOS_PORT=5230
    expose:
    - '5230'
    ports:
    - target: 5230
      published: "5230"
      protocol: tcp
volumes:
  memos_data: null
x-casaos:
  id: com.dokploy.memos
  main: memos
  index: /
  port_map: "5230"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/memos/icon.png
  title:
    en_US: Memos
  tagline:
    en_US: Memos is a self-hosted, open-source note-taking application that allows you to create,...
  description:
    en_US: Memos is a self-hosted, open-source note-taking application that allows you to create, organize, and share notes
      with ease. It provides a simple and effective solution for managing your notes from anywhere.
  author: Dokploy Community
  developer: Memos
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://www.usememos.com/
  repo: https://github.com/usememos/memos
  docs: https://www.usememos.com/docs
