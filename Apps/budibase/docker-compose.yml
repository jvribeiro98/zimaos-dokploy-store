name: budibase
services:
  apps:
    image: budibase/apps:3.23.47
    restart: unless-stopped
    environment:
      SELF_HOSTED: '1'
      LOG_LEVEL: info
      PORT: '4002'
      INTERNAL_API_KEY: 0qo5Z36BLBm5AXCXZmTZGD9pRcAzQ4nG
      API_ENCRYPTION_KEY: 4CTNQySIaRqIqGFElRP8pLnwUUK1UaR4
      JWT_SECRET: loByfG8onN5Unljwa9skqF4I8cqkBSQ6
      MINIO_ACCESS_KEY: 1pMe7jUy11KetBC89qovmFgjvo3gYoTq
      MINIO_SECRET_KEY: 2Ipyk4N15LTRPytg9bME8HVB0zVKu28l
      MINIO_URL: http://minio:9000
      REDIS_URL: redis:6379
      REDIS_PASSWORD: 1iNwI5z7hiRhMha4mrQNDkkyRqwz1ROS
      WORKER_URL: http://worker:4003
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: Mxv8EVgiZxoypCcXBRDyI3meiP5084w2
      COUCH_DB_URL: http://budibase:Mxv8EVgiZxoypCcXBRDyI3meiP5084w2@couchdb:5984
      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
      BB_ADMIN_USER_EMAIL: ''
      BB_ADMIN_USER_PASSWORD: ''
    depends_on:
      worker:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -qO-
      - http://localhost:4002/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  worker:
    image: budibase/worker:3.23.47
    restart: unless-stopped
    environment:
      SELF_HOSTED: '1'
      LOG_LEVEL: info
      PORT: '4003'
      CLUSTER_PORT: '10000'
      INTERNAL_API_KEY: 0qo5Z36BLBm5AXCXZmTZGD9pRcAzQ4nG
      API_ENCRYPTION_KEY: 4CTNQySIaRqIqGFElRP8pLnwUUK1UaR4
      JWT_SECRET: loByfG8onN5Unljwa9skqF4I8cqkBSQ6
      MINIO_ACCESS_KEY: 1pMe7jUy11KetBC89qovmFgjvo3gYoTq
      MINIO_SECRET_KEY: 2Ipyk4N15LTRPytg9bME8HVB0zVKu28l
      APPS_URL: http://apps:4002
      MINIO_URL: http://minio:9000
      REDIS_URL: redis:6379
      REDIS_PASSWORD: 1iNwI5z7hiRhMha4mrQNDkkyRqwz1ROS
      COUCH_DB_USERNAME: budibase
      COUCH_DB_PASSWORD: Mxv8EVgiZxoypCcXBRDyI3meiP5084w2
      COUCH_DB_URL: http://budibase:Mxv8EVgiZxoypCcXBRDyI3meiP5084w2@couchdb:5984
      BUDIBASE_ENVIRONMENT: ${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -qO-
      - http://localhost:4003/health
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    volumes:
    - minio_data:/data
    environment:
      MINIO_ROOT_USER: 1pMe7jUy11KetBC89qovmFgjvo3gYoTq
      MINIO_ROOT_PASSWORD: 2Ipyk4N15LTRPytg9bME8HVB0zVKu28l
      MINIO_BROWSER: 'False'
    command: server /data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
  proxy:
    image: budibase/proxy:3.23.47
    restart: unless-stopped
    environment:
      PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND: '10'
      PROXY_RATE_LIMIT_API_PER_SECOND: '20'
      APPS_UPSTREAM_URL: http://apps:4002
      WORKER_UPSTREAM_URL: http://worker:4003
      MINIO_UPSTREAM_URL: http://minio:9000
      COUCHDB_UPSTREAM_URL: http://couchdb:5984
      WATCHTOWER_UPSTREAM_URL: http://watchtower:8080
      RESOLVER: 127.0.0.11
    depends_on:
      minio:
        condition: service_healthy
      worker:
        condition: service_healthy
      apps:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:10000/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    ports:
    - target: 10000
      published: "10000"
      protocol: tcp
  couchdb:
    image: budibase/couchdb:v3.3.3
    restart: unless-stopped
    environment:
      COUCHDB_USER: budibase
      COUCHDB_PASSWORD: Mxv8EVgiZxoypCcXBRDyI3meiP5084w2
      TARGETBUILD: docker-compose
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5984/
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
    - couchdb3_data:/opt/couchdb/data
  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    command: redis-server --requirepass "${BB_REDIS_PASSWORD}"
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${BB_REDIS_PASSWORD}
      - ping
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
volumes:
  minio_data: null
  couchdb3_data: null
  redis_data: null
x-casaos:
  id: com.dokploy.budibase
  main: proxy
  index: /
  port_map: "10000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/budibase/icon.svg
  title:
    en_US: Budibase
  tagline:
    en_US: Budibase is an open-source low-code platform that saves engineers 100s of hours buildin...
  description:
    en_US: Budibase is an open-source low-code platform that saves engineers 100s of hours building forms, portals, and approval
      apps, securely.
  author: Dokploy Community
  developer: Budibase
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "3.23.47"
  update_at: "2026-11-28"
  website: https://budibase.com/
  repo: https://github.com/Budibase/budibase
  docs: https://docs.budibase.com/docs/
