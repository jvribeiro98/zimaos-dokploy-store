name: plausible
services:
  plausible_db:
    image: postgres:16-alpine
    restart: always
    volumes:
    - db-data:/var/lib/postgresql/data
    environment:
    - POSTGRES_PASSWORD=postgres
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
    - event-data:/var/lib/clickhouse
    - event-logs:/var/log/clickhouse-server
    - /DATA/AppData/$AppID/clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    - /DATA/AppData/$AppID/clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: always
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
    - plausible_db
    - plausible_events_db
    volumes:
    - plausible-data:/var/lib/plausible
    environment:
    - TMPDIR=/var/lib/plausible/tmp
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
volumes:
  db-data:
    driver: local
  plausible-data:
    driver: local
  event-data:
    driver: local
  event-logs:
    driver: local
x-casaos:
  id: com.dokploy.plausible
  main: plausible
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/plausible/icon.svg
  title:
    en_US: Plausible
  tagline:
    en_US: Plausible is an open-source, lightweight, and privacy-friendly web analytics tool
  description:
    en_US: Plausible is an open-source, lightweight, and privacy-friendly web analytics tool. Self-host it on your own server
      with Dokploy, which deploys Plausible as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Plausible
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "3.2.1"
  update_at: "2026-11-23"
  website: https://plausible.io/
  repo: https://github.com/plausible/plausible
  docs: https://plausible.io/docs
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (clickhouse/clickhouse-config.xml,
        clickhouse/clickhouse-user-config.xml). Review environment variables before starting.
