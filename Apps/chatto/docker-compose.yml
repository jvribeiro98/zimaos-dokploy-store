name: chatto
services:
  chatto:
    image: ghcr.io/chattocorp/chatto:0.4
    restart: unless-stopped
    expose:
    - '4000'
    environment:
      CHATTO_WEBSERVER_URL: https://localhost
      CHATTO_WEBSERVER_PORT: '4000'
      CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET: 7600d6f8a77d1fa24960cf9680059c4f7a05adef1413246d0d69226ba95c1addaa209dc4e8eaab322f3e3f4692b0b5c1979dab1d190927c7ce200b3144635816
      CHATTO_CORE_SECRET_KEY: 2d87dfa59cbb935d4dadb10ac8e82b9e933132bb2508d991f6ef136b1626098b0296bb250a79de96d1e2405bb058f90b240752f8f7a8eaf86d5f3c45004a2b25
      CHATTO_CORE_ASSETS_SIGNING_SECRET: f98955a53309e2d3806b24300244ca0a6b8f671315afb8420de1b10de3d5eb053324df722cb27051790699c839bb9fd769793f909d50fb6c49feea140a736643
      CHATTO_NATS_EMBEDDED_ENABLED: 'True'
      CHATTO_NATS_EMBEDDED_DATA_DIR: /data
      CHATTO_OWNERS_EMAILS: admin@example.com
      CHATTO_SMTP_ENABLED: ${CHATTO_SMTP_ENABLED:-false}
      CHATTO_SMTP_HOST: ${CHATTO_SMTP_HOST:-}
      CHATTO_SMTP_PORT: ${CHATTO_SMTP_PORT:-587}
      CHATTO_SMTP_TLS: ${CHATTO_SMTP_TLS:-mandatory}
      CHATTO_SMTP_USERNAME: ${CHATTO_SMTP_USERNAME:-}
      CHATTO_SMTP_PASSWORD: ${CHATTO_SMTP_PASSWORD:-}
      CHATTO_SMTP_FROM: ${CHATTO_SMTP_FROM:-}
    volumes:
    - chatto-data:/data
    ports:
    - target: 4000
      published: "4000"
      protocol: tcp
volumes:
  chatto-data: null
x-casaos:
  id: com.dokploy.chatto
  main: chatto
  index: /
  port_map: "4000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/chatto/icon.png
  title:
    en_US: Chatto (single binary)
  tagline:
    en_US: A fully-featured real-time chat application for teams and communities
  description:
    en_US: 'A fully-featured real-time chat application for teams and communities. This template deploys the single Chatto
      binary with embedded NATS. Note: email/password registration requires SMTP to be configured after deployment; voice/video
      calls are not included in the single-binary setup.'
  author: Dokploy Community
  developer: Chatto (single binary)
  category: Social
  architectures:
  - amd64
  - arm64
  version: "0.4.x"
  update_at: "2026-11-25"
  website: https://chatto.run
  repo: https://github.com/chattocorp/chatto
  docs: https://docs.chatto.run
