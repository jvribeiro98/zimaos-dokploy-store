      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ
      POSTGRES_DB: plane
      POSTGRES_PORT: '5432'
      PGDATA: /var/lib/postgresql/data
      WEB_URL: https://localhost
      DEBUG: '0'
      CORS_ALLOWED_ORIGINS: https://localhost
      GUNICORN_WORKERS: '1'
      USE_MINIO: '1'
      DATABASE_URL: postgresql://plane:LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ@plane-db:5432/plane
      SECRET_KEY: ifSjUHHJ+TUJK3UO6AE9FseXz90i0sjDfb/ffiJszhLLXHbjOetLer3kcSJkLoiW
      AMQP_URL: amqp://plane:0WVBOVuTXkG0cpieIEaLhI4MyF1J6cW8@plane-mq:5672/plane
      API_KEY_RATE_LIMIT: 60/minute
      MINIO_ENDPOINT_SSL: '0'
      LIVE_SERVER_SECRET_KEY: KjLMSdVF7zixcuS0jQH5LD/mvQRdBY13OsikldM0a9CNs3UKUR5gctQuSPXrh3B5
      WEBHOOK_ALLOWED_IPS: ''
      WEBHOOK_ALLOWED_HOSTS: ''
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
  plane-migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    restart: on-failure
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
    - logs_migrator:/code/plane/logs
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: '5242880'
      BUCKET_NAME: uploads
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: private_ranges
      AWS_REGION: ''
      AWS_ACCESS_KEY_ID: access-key
      AWS_SECRET_ACCESS_KEY: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      REDIS_HOST: plane-redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://plane-redis:6379/
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ
      POSTGRES_DB: plane
      POSTGRES_PORT: '5432'
      PGDATA: /var/lib/postgresql/data
      WEB_URL: https://localhost
      DEBUG: '0'
      CORS_ALLOWED_ORIGINS: https://localhost
      GUNICORN_WORKERS: '1'
      USE_MINIO: '1'
      DATABASE_URL: postgresql://plane:LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ@plane-db:5432/plane
      SECRET_KEY: ifSjUHHJ+TUJK3UO6AE9FseXz90i0sjDfb/ffiJszhLLXHbjOetLer3kcSJkLoiW
      AMQP_URL: amqp://plane:0WVBOVuTXkG0cpieIEaLhI4MyF1J6cW8@plane-mq:5672/plane
      API_KEY_RATE_LIMIT: 60/minute
      MINIO_ENDPOINT_SSL: '0'
      LIVE_SERVER_SECRET_KEY: KjLMSdVF7zixcuS0jQH5LD/mvQRdBY13OsikldM0a9CNs3UKUR5gctQuSPXrh3B5
      WEBHOOK_ALLOWED_IPS: ''
      WEBHOOK_ALLOWED_HOSTS: ''
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
  plane-db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ
      POSTGRES_DB: plane
      POSTGRES_PORT: '5432'
      PGDATA: /var/lib/postgresql/data
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD-SHELL
      - valkey-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: '5672'
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: 0WVBOVuTXkG0cpieIEaLhI4MyF1J6cW8
      RABBITMQ_DEFAULT_VHOST: plane
      RABBITMQ_VHOST: plane
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
  plane-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
    volumes:
    - uploads:/export
  proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    expose:
    - '80'
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: '5242880'
      BUCKET_NAME: uploads
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: private_ranges
    volumes:
    - proxy_config:/config
    - proxy_data:/data
    links:
    - plane-web:web
    - plane-api:api
    - plane-space:space
    - plane-admin:admin
    - plane-live:live
    depends_on:
      plane-web:
        condition: service_started
      plane-api:
        condition: service_started
      plane-space:
        condition: service_started
      plane-admin:
        condition: service_started
      plane-live:
        condition: service_started
    ports:
    - target: 80
      published: "80"
      protocol: tcp
x-db-env:
