name: plane
services:
  plane-web:
    image: makeplane/plane-frontend:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-worker:
        condition: service_started
  plane-space:
    image: makeplane/plane-space:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-worker:
        condition: service_started
      plane-web:
        condition: service_started
  plane-admin:
    image: makeplane/plane-admin:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started
  plane-live:
    image: makeplane/plane-live:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    environment:
      REDIS_HOST: plane-redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://plane-redis:6379/
      API_BASE_URL: http://plane-api:8000
      LIVE_SERVER_SECRET_KEY: KjLMSdVF7zixcuS0jQH5LD/mvQRdBY13OsikldM0a9CNs3UKUR5gctQuSPXrh3B5
    depends_on:
      plane-api:
        condition: service_started
      plane-web:
        condition: service_started
  plane-api:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
    - logs_api:/code/plane/logs
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: '5242880'
      BUCKET_NAME: uploads
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: private_ranges
      AWS_REGION: ''
      AWS_ACCESS_KEY_ID: access-key
      AWS_SECRET_ACCESS_KEY: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      REDIS_HOST: plane-redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://plane-redis:6379/
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ
      POSTGRES_DB: plane
      POSTGRES_PORT: '5432'
      PGDATA: /var/lib/postgresql/data
      WEB_URL: https://localhost
      DEBUG: '0'
      CORS_ALLOWED_ORIGINS: https://localhost
      GUNICORN_WORKERS: '1'
      USE_MINIO: '1'
      DATABASE_URL: postgresql://plane:LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ@plane-db:5432/plane
      SECRET_KEY: ifSjUHHJ+TUJK3UO6AE9FseXz90i0sjDfb/ffiJszhLLXHbjOetLer3kcSJkLoiW
      AMQP_URL: amqp://plane:0WVBOVuTXkG0cpieIEaLhI4MyF1J6cW8@plane-mq:5672/plane
      API_KEY_RATE_LIMIT: 60/minute
      MINIO_ENDPOINT_SSL: '0'
      LIVE_SERVER_SECRET_KEY: KjLMSdVF7zixcuS0jQH5LD/mvQRdBY13OsikldM0a9CNs3UKUR5gctQuSPXrh3B5
      WEBHOOK_ALLOWED_IPS: ''
      WEBHOOK_ALLOWED_HOSTS: ''
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
  plane-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
    - logs_worker:/code/plane/logs
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: '5242880'
      BUCKET_NAME: uploads
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: private_ranges
      AWS_REGION: ''
      AWS_ACCESS_KEY_ID: access-key
      AWS_SECRET_ACCESS_KEY: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      REDIS_HOST: plane-redis
      REDIS_PORT: '6379'
      REDIS_URL: redis://plane-redis:6379/
      PGHOST: plane-db
      PGDATABASE: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ
      POSTGRES_DB: plane
      POSTGRES_PORT: '5432'
      PGDATA: /var/lib/postgresql/data
      WEB_URL: https://localhost
      DEBUG: '0'
      CORS_ALLOWED_ORIGINS: https://localhost
      GUNICORN_WORKERS: '1'
      USE_MINIO: '1'
      DATABASE_URL: postgresql://plane:LPG5vkMLJFspnoEEgOUglTn9dWmI1pQJ@plane-db:5432/plane
      SECRET_KEY: ifSjUHHJ+TUJK3UO6AE9FseXz90i0sjDfb/ffiJszhLLXHbjOetLer3kcSJkLoiW
      AMQP_URL: amqp://plane:0WVBOVuTXkG0cpieIEaLhI4MyF1J6cW8@plane-mq:5672/plane
      API_KEY_RATE_LIMIT: 60/minute
      MINIO_ENDPOINT_SSL: '0'
      LIVE_SERVER_SECRET_KEY: KjLMSdVF7zixcuS0jQH5LD/mvQRdBY13OsikldM0a9CNs3UKUR5gctQuSPXrh3B5
      WEBHOOK_ALLOWED_IPS: ''
      WEBHOOK_ALLOWED_HOSTS: ''
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
  plane-beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
    - logs_beat-worker:/code/plane/logs
    environment:
      APP_DOMAIN: localhost
      FILE_SIZE_LIMIT: '5242880'
      BUCKET_NAME: uploads
      SITE_ADDRESS: :80
      TRUSTED_PROXIES: private_ranges
      AWS_REGION: ''
      AWS_ACCESS_KEY_ID: access-key
      AWS_SECRET_ACCESS_KEY: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: 4nHQZtPZB5uQ91gaFPT0iC41Wgak7IS9
