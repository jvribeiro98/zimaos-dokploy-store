name: soft-serve
services:
  soft-serve:
    image: charmcli/soft-serve:v0.11.6
    restart: unless-stopped
    expose:
    - '23231'
    - '23232'
    - '23233'
    - '9418'
    environment:
      SOFT_SERVE_NAME: Soft Serve
      SOFT_SERVE_DATA_PATH: /soft-serve
      SOFT_SERVE_INITIAL_ADMIN_KEYS: ''
      SOFT_SERVE_SSH_LISTEN_ADDR: :23231
      SOFT_SERVE_SSH_PUBLIC_URL: ssh://localhost:23231
      SOFT_SERVE_HTTP_LISTEN_ADDR: :23232
      SOFT_SERVE_HTTP_PUBLIC_URL: http://localhost
      SOFT_SERVE_GIT_LISTEN_ADDR: :9418
      SOFT_SERVE_STATS_LISTEN_ADDR: :23233
      SOFT_SERVE_LOG_LEVEL: info
    volumes:
    - soft-serve-data:/soft-serve
    ports:
    - target: 23232
      published: "23232"
      protocol: tcp
volumes:
  soft-serve-data: null
x-casaos:
  id: com.dokploy.soft-serve
  main: soft-serve
  index: /
  port_map: "23232"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/soft-serve/icon.svg
  title:
    en_US: Soft Serve
  tagline:
    en_US: Soft Serve is a self-hosted Git server with an SSH TUI, HTTP Git access, Git LFS suppor...
  description:
    en_US: Soft Serve is a self-hosted Git server with an SSH TUI, HTTP Git access, Git LFS support, and simple repository
      management.
  author: Dokploy Community
  developer: Soft Serve
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "0.11.6"
  update_at: "2026-11-22"
  website: https://charm.sh/
  repo: https://github.com/charmbracelet/soft-serve
  docs: https://github.com/charmbracelet/soft-serve/blob/main/README.md
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (README.md). Review environment
        variables before starting.
