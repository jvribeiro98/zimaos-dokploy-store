name: dossier
services:
  dossier:
    image: ghcr.io/aientech/dossier:v1.9.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:?Keep the generated database password}@dossier-postgres:5432/dossier
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:-}
      DOSSIER_ADMIN_PASSWORD: NAJxcSMDzMLob3VyfwJ2DtDV
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Keep the generated DOSSIER_SECRET}
      DOSSIER_DATA_DIR: /data
      DOSSIER_TELEMETRY: 'off'
      DOSSIER_JOBS_ARBEITSAGENTUR: ${DOSSIER_JOBS_ARBEITSAGENTUR:-off}
      DOSSIER_BACKUP_RETENTION_DAYS: '14'
      TZ: UTC
    command:
    - sh
    - -c
    - "if [ -z \"$$DOSSIER_PASSWORD\" ]; then\n  [ -n \"$$DOSSIER_ADMIN_PASSWORD\" ] || { echo \"Set DOSSIER_ADMIN_PASSWORD\
      \ or DOSSIER_PASSWORD\" >&2; exit 1; }\n  DOSSIER_PASSWORD=\"$$(printf '%s\\n' \"$$DOSSIER_ADMIN_PASSWORD\" | hash-password)\"\
      \n  export DOSSIER_PASSWORD\nfi\nunset DOSSIER_ADMIN_PASSWORD\nexec ./start.sh\n"
    expose:
    - '3000'
    volumes:
    - dossier-data:/data
    depends_on:
      dossier-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 1g
    stop_grace_period: 30s
    extra_hosts:
    - host.docker.internal:host-gateway
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  dossier-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_DB: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Keep the generated database password}
    volumes:
    - dossier-postgres:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dossier -d dossier
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *id001
volumes:
  dossier-data: null
  dossier-postgres: null
x-casaos:
  id: com.dokploy.dossier
  main: dossier
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/dossier/icon.svg
  title:
    en_US: Dossier
  tagline:
    en_US: Dossier is a personal job search app with a career profile, resume and cover letter dra...
  description:
    en_US: Dossier is a personal job search app with a career profile, resume and cover letter drafting, PDF export, and an
      application tracking board. It supports local and hosted AI providers.
  author: Dokploy Community
  developer: Dossier
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.9.0"
  update_at: "2026-11-27"
  website: https://github.com/AienTech/dossier
  repo: https://github.com/AienTech/dossier
  docs: https://github.com/AienTech/dossier#self-hosting
