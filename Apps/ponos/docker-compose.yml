name: ponos
services:
  ponos:
    image: ghcr.io/hermez-agency/ponos:0.2.0
    restart: unless-stopped
    user: ponos
    expose:
    - '8787'
    environment:
      PONOS_WEB_EMAIL: admin@localhost
      PONOS_WEB_PASSWORD: Fo6N7cPSrx1LTow3IgpNt9SiAVOXqyad
      PONOS_WEB_TOKEN: EPWXvRRlSwaH9dY5gwstiLpZ9pc9TTLcQmTEQQEaoBsvQmNo
      PONOS_LANGUAGE: en
      TZ: UTC
      CLAUDE_CODE_OAUTH_TOKEN: ''
      ANTHROPIC_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GH_TOKEN: ''
      PONOS_NOTION_TOKEN: ''
      PONOS_TELEGRAM_TOKEN: ''
      PONOS_SLACK_TOKEN: ''
    volumes:
    - ponos-data:/data
    - ponos-workspace:/workspace
    - ponos-claude:/home/ponos/.claude
    - ponos-gh:/home/ponos/.config/gh
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8787/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g
    ports:
    - target: 8787
      published: "8787"
      protocol: tcp
volumes:
  ponos-data: null
  ponos-workspace: null
  ponos-claude: null
  ponos-gh: null
x-casaos:
  id: com.dokploy.ponos
  main: ponos
  index: /
  port_map: "8787"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/ponos/icon.svg
  title:
    en_US: Ponos
  tagline:
    en_US: A harness around Claude Code that runs your tasks — code or not — from Notion or its ow...
  description:
    en_US: 'A harness around Claude Code that runs your tasks — code or not — from Notion or its own board: a ticket comes
      back as a pull request on GitHub, a text, an action carried out or a post, and nothing ships until you say yes. Web
      console, Telegram and Slack.'
  author: Dokploy Community
  developer: Ponos
  category: AI
  architectures:
  - amd64
  - arm64
  version: "0.2.0"
  update_at: "2026-11-24"
  website: https://the-ponos.app/
  repo: https://github.com/hermez-agency/ponos
  docs: https://github.com/hermez-agency/ponos/blob/main/guide/server.md#install-with-dokploy
