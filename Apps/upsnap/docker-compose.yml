name: upsnap
services:
  upsnap:
    image: ghcr.io/seriousm4x/upsnap:5
    restart: unless-stopped
    expose:
    - 8090
    volumes:
    - upsnap-data:/app/pb_data
    environment:
    - TZ=Europe/Berlin
    - UPSNAP_INTERVAL=*/10 * * * * *
    - UPSNAP_SCAN_RANGE=192.168.1.0/24
    - UPSNAP_SCAN_TIMEOUT=500ms
    - UPSNAP_PING_PRIVILEGED=true
    - UPSNAP_WEBSITE_TITLE=Upsnap Network Monitor
    healthcheck:
      test:
      - CMD
      - curl
      - -fs
      - http://localhost:8090/api/health
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
    - target: 8090
      published: "8090"
      protocol: tcp
volumes:
  upsnap-data:
    driver: local
x-casaos:
  id: com.dokploy.upsnap
  main: upsnap
  index: /
  port_map: "8090"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/upsnap/icon.svg
  title:
    en_US: Upsnap
  tagline:
    en_US: Upsnap is a simple network device monitor and dashboard built on PocketBase
  description:
    en_US: Upsnap is a simple network device monitor and dashboard built on PocketBase.
  author: Dokploy Community
  developer: Upsnap
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "5"
  update_at: "2026-11-28"
  website: https://github.com/seriousm4x/upsnap
  repo: https://github.com/seriousm4x/upsnap
  docs: https://github.com/seriousm4x/upsnap#readme
