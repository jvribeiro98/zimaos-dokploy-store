name: snipe-it
services:
  snipe-it:
    image: snipe/snipe-it:v8.5.0
    restart: unless-stopped
    expose:
    - 80
    volumes:
    - snipe-it-storage:/var/lib/snipeit
    environment:
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_KEY=base64:aggjNbpY9E/f7EQ3B7tbuSbuAKClnwqUX25TMyB2qv4=
    - APP_URL=https://localhost
    - APP_TIMEZONE=UTC
    - APP_LOCALE=en-US
    - APP_TRUSTED_PROXIES=172.0.0.0/8
    - APP_FORCE_TLS=true
    - SECURE_COOKIES=true
    - PRIVATE_FILESYSTEM_DISK=local
    - PUBLIC_FILESYSTEM_DISK=local_public
    - DB_CONNECTION=mysql
    - DB_HOST=snipe-it-db
    - DB_PORT=3306
    - DB_DATABASE=snipeit
    - DB_USERNAME=snipeit
    - DB_PASSWORD=b46fLHXvm0VhRzIJo5hKSiNY
    - DB_PREFIX=null
    - DB_DUMP_PATH=/usr/bin
    - DB_DUMP_SKIP_SSL=true
    - DB_CHARSET=utf8mb4
    - DB_COLLATION=utf8mb4_unicode_ci
    - MAIL_MAILER=log
    - MAIL_FROM_ADDR=snipe-it@localhost
    - MAIL_FROM_NAME=Snipe-IT
    - MAIL_REPLYTO_ADDR=snipe-it@localhost
    - MAIL_REPLYTO_NAME=Snipe-IT
    - ALLOW_BACKUP_DELETE=false
    - ALLOW_DATA_PURGE=false
    - IMAGE_LIB=gd
    - LOG_CHANNEL=stderr
    - CACHE_DRIVER=file
    - SESSION_DRIVER=file
    - QUEUE_DRIVER=sync
    depends_on:
      snipe-it-db:
        condition: service_healthy
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  snipe-it-db:
    image: mariadb:11.4.7
    restart: unless-stopped
    volumes:
    - snipe-it-db-data:/var/lib/mysql
    environment:
    - MYSQL_DATABASE=snipeit
    - MYSQL_USER=snipeit
    - MYSQL_PASSWORD=b46fLHXvm0VhRzIJo5hKSiNY
    - MYSQL_ROOT_PASSWORD=CjqV2Q9hLNZ39L9K1TrBnzvw
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 2s
      retries: 10
volumes:
  snipe-it-storage: null
  snipe-it-db-data: null
x-casaos:
  id: com.dokploy.snipe-it
  main: snipe-it
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/snipe-it/icon.png
  title:
    en_US: Snipe-IT
  tagline:
    en_US: Snipe-IT is an open-source IT asset management system for tracking hardware, software l...
  description:
    en_US: Snipe-IT is an open-source IT asset management system for tracking hardware, software licenses, and more. Self-host
      it on your own server with Dokploy, which deploys Snipe-IT as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Snipe-IT
  category: Others
  architectures:
  - amd64
  - arm64
  version: "8.5.0"
  update_at: "2026-11-22"
  website: https://snipeitapp.com/
  repo: https://github.com/grokability/snipe-it
  docs: https://snipe-it.readme.io/docs
