name: netbird
services:
  config-init:
    image: alpine:3.20
    environment:
    - NETBIRD_DOMAIN=localhost
    - NB_AUTH_SECRET=DeirHPIzBpouHQPd8UEuENRuQ9Rb8sKL/GE/gAZ8Noc=
    - NB_SESSION_KEY=3qWi7g7PZygRRNIzSucnJcQXd/thlXpXyh4y2xCLBjc=
    - NB_STORE_KEY=tvcGzW4wLjqacTSSJFI3s2J+0s38d5tvr4rtbvCQITc=
    command:
    - sh
    - -c
    - "cat > /cfg/config.yaml <<'EOF'\nserver:\n  listenAddress: \":80\"\n  exposedAddress: \"https://${NETBIRD_DOMAIN}:443\"\
      \n  stunPorts:\n    - 3478\n  metricsPort: 9090\n  healthcheckAddress: \":9000\"\n  logLevel: \"info\"\n  logFile: \"\
      console\"\n  authSecret: \"${NB_AUTH_SECRET}\"\n  dataDir: \"/var/lib/netbird\"\n  auth:\n    issuer: \"https://${NETBIRD_DOMAIN}/oauth2\"\
      \n    signKeyRefreshEnabled: true\n    sessionCookieEncryptionKey: \"${NB_SESSION_KEY}\"\n    dashboardRedirectURIs:\n\
      \      - \"https://${NETBIRD_DOMAIN}/nb-auth\"\n      - \"https://${NETBIRD_DOMAIN}/nb-silent-auth\"\n    cliRedirectURIs:\n\
      \      - \"http://localhost:53000/\"\n  reverseProxy:\n    trustedHTTPProxies:\n      - \"0.0.0.0/0\"\n  store:\n  \
      \  engine: \"sqlite\"\n    encryptionKey: \"${NB_STORE_KEY}\"\nEOF\ncat /cfg/config.yaml\n"
    volumes:
    - cfg:/cfg
    restart: unless-stopped
  netbird-server:
    image: netbirdio/netbird-server:0.83.2
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully
    ports:
    - 3478/udp
    volumes:
    - netbird_data:/var/lib/netbird
    - cfg:/etc/netbird
    environment:
    - CONFIG_REV=1
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.nb-grpc-mgmt.rule=Host(`${NETBIRD_DOMAIN}`) && PathPrefix(`/management.ManagementService`)
    - traefik.http.routers.nb-grpc-mgmt.entrypoints=websecure
    - traefik.http.routers.nb-grpc-mgmt.tls.certresolver=letsencrypt
    - traefik.http.routers.nb-grpc-mgmt.priority=100
    - traefik.http.routers.nb-grpc-mgmt.service=nb-grpc
    - traefik.http.routers.nb-grpc-signal.rule=Host(`${NETBIRD_DOMAIN}`) && PathPrefix(`/signalexchange.SignalExchange`)
    - traefik.http.routers.nb-grpc-signal.entrypoints=websecure
    - traefik.http.routers.nb-grpc-signal.tls.certresolver=letsencrypt
    - traefik.http.routers.nb-grpc-signal.priority=100
    - traefik.http.routers.nb-grpc-signal.service=nb-grpc
    - traefik.http.routers.nb-grpc-proxy.rule=Host(`${NETBIRD_DOMAIN}`) && PathPrefix(`/management.ProxyService`)
    - traefik.http.routers.nb-grpc-proxy.entrypoints=websecure
    - traefik.http.routers.nb-grpc-proxy.tls.certresolver=letsencrypt
    - traefik.http.routers.nb-grpc-proxy.priority=100
    - traefik.http.routers.nb-grpc-proxy.service=nb-grpc
    - traefik.http.services.nb-grpc.loadbalancer.server.scheme=h2c
    - traefik.http.services.nb-grpc.loadbalancer.server.port=80
    command:
    - --config
    - /etc/netbird/config.yaml
  dashboard:
    image: netbirdio/dashboard:v2.98.0
    restart: unless-stopped
    environment:
    - NETBIRD_MGMT_API_ENDPOINT=https://localhost
    - NETBIRD_MGMT_GRPC_API_ENDPOINT=https://localhost
    - AUTH_AUDIENCE=netbird-dashboard
    - AUTH_CLIENT_ID=netbird-dashboard
    - AUTH_CLIENT_SECRET=
    - AUTH_AUTHORITY=https://localhost/oauth2
    - USE_AUTH0=false
    - AUTH_SUPPORTED_SCOPES=openid profile email groups
    - AUTH_REDIRECT_URI=/nb-auth
    - AUTH_SILENT_REDIRECT_URI=/nb-silent-auth
    - NGINX_SSL_PORT=443
    - LETSENCRYPT_DOMAIN=none
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  netbird_data: null
  cfg: null
x-casaos:
  id: com.dokploy.netbird
  main: dashboard
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/netbird/icon.png
  title:
    en_US: NetBird
  tagline:
    en_US: NetBird is an open-source, WireGuard-based overlay network that connects devices, serve...
  description:
    en_US: NetBird is an open-source, WireGuard-based overlay network that connects devices, servers and containers into one
      private mesh — this template runs the self-hosted management server (with its embedded Dex identity provider) and the
      web dashboard on a single domain.
  author: Dokploy Community
  developer: NetBird
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "0.83.2"
  update_at: "2026-11-28"
  website: https://netbird.io
  repo: https://github.com/netbirdio/netbird
  docs: https://docs.netbird.io
