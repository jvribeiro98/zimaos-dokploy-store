name: portainer
services:
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer-data:/data
    expose:
    - 9000
    ports:
    - target: 9000
      published: "9000"
      protocol: tcp
volumes:
  portainer-data: {}
x-casaos:
  id: com.dokploy.portainer
  main: portainer
  index: /
  port_map: "9000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/portainer/icon.png
  title:
    en_US: Portainer
  tagline:
    en_US: Portainer is a container management tool for deploying, troubleshooting, and securing a...
  description:
    en_US: Portainer is a container management tool for deploying, troubleshooting, and securing applications across cloud,
      data centers, and IoT. Self-host it on your own server with Dokploy, which deploys Portainer as a Docker Compose service
      in a few clicks.
  author: Dokploy Community
  developer: Portainer
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://www.portainer.io/
  repo: https://github.com/portainer/portainer
  docs: https://docs.portainer.io/
