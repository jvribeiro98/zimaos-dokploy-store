name: databasus
services:
  databasus:
    image: databasus/databasus:latest
    expose:
    - '4005'
    volumes:
    - databasus-data:/databasus-data
    restart: unless-stopped
    environment:
    - TZ=UTC
    healthcheck:
      test:
      - CMD
      - databasus
      - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
    - target: 4005
      published: "4005"
      protocol: tcp
volumes:
  databasus-data:
    driver: local
x-casaos:
  id: com.dokploy.databasus
  main: databasus
  index: /
  port_map: "4005"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/databasus/icon.svg
  title:
    en_US: Databasus
  tagline:
    en_US: Free, open source and self-hosted tool to backup PostgreSQL, MySQL, MariaDB and MongoDB
  description:
    en_US: Free, open source and self-hosted tool to backup PostgreSQL, MySQL, MariaDB and MongoDB. Multiple storages (S3,
      Google Drive, FTP, etc.), notifications and Point-in-Time Recovery. Successor of Postgresus
  author: Dokploy Community
  developer: Databasus
  category: Others
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://databasus.com
  repo: https://github.com/databasus/databasus
  docs: https://databasus.com/installation
