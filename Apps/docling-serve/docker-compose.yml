name: docling-serve
services:
  docling-serve:
    image: quay.io/docling-project/docling-serve:latest
    restart: unless-stopped
    expose:
    - 5001
    environment:
    - DOCLING_SERVE_ENABLE_UI=1
    - DOCLING_SERVE_HOST=0.0.0.0
    - DOCLING_SERVE_PORT=5001
    volumes:
    - docling-data:/app/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
    - target: 5001
      published: "5001"
      protocol: tcp
volumes:
  docling-data: {}
x-casaos:
  id: com.dokploy.docling-serve
  main: docling-serve
  index: /
  port_map: "5001"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/docling-serve/icon.png
  title:
    en_US: Docling Serve
  tagline:
    en_US: Running Docling as an API service for document processing and conversion with AI-powere...
  description:
    en_US: Running Docling as an API service for document processing and conversion with AI-powered capabilities.
  author: Dokploy Community
  developer: Docling Serve
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  repo: https://github.com/docling-project/docling-serve
  docs: https://github.com/docling-project/docling-serve/blob/main/docs/README.md
