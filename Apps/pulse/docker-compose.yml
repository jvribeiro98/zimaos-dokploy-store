name: pulse
services:
  pulse:
    image: rcourtman/pulse:5.1
    restart: always
    expose:
    - 7655
    volumes:
    - pulse_data:/data
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - PULSE_AUTH_USER=admin
    - PULSE_AUTH_PASS=MNlJfWR3dAB4uGNNcpKW4MYON0iL0RKe
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:7655/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
    - target: 7655
      published: "7655"
      protocol: tcp
volumes:
  pulse_data: null
x-casaos:
  id: com.dokploy.pulse
  main: pulse
  index: /
  port_map: "7655"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/pulse/icon.svg
  title:
    en_US: Pulse
  tagline:
    en_US: A responsive monitoring platform for Proxmox VE, PBS, and Docker with real-time metrics...
  description:
    en_US: A responsive monitoring platform for Proxmox VE, PBS, and Docker with real-time metrics across nodes and containers.
  author: Dokploy Community
  developer: Pulse
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "5.1"
  update_at: "2026-11-22"
  website: https://pulserelay.pro/
  repo: https://github.com/rcourtman/Pulse
  docs: https://github.com/rcourtman/Pulse/blob/main/docs/README.md
