name: movary
services:
  movary:
    image: leepeuker/movary:${MOVARY_VERSION:-latest}
    restart: unless-stopped
    expose:
    - '8080'
    environment:
      TMDB_API_KEY: ''
      DATABASE_MODE: mysql
      DATABASE_MYSQL_HOST: mysql
      DATABASE_MYSQL_NAME: movary
      DATABASE_MYSQL_USER: movary_user
      DATABASE_MYSQL_PASSWORD: MhGsnnzecsUMXd2YjfGWevkRMIklDUjh
      APP_URL: http://localhost
      APP_ENV: production
    volumes:
    - movary_storage:/app/storage
    depends_on:
    - mysql
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  mysql:
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: movary
      MYSQL_USER: movary_user
      MYSQL_PASSWORD: MhGsnnzecsUMXd2YjfGWevkRMIklDUjh
      MYSQL_ROOT_PASSWORD: zexlYVMLPLygXg86ssbJPtXqnIHoAhJA
      MYSQL_INNODB_BUFFER_POOL_SIZE: 128M
      MYSQL_INNODB_LOG_FILE_SIZE: 64M
    volumes:
    - movary_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
volumes:
  movary_db: null
  movary_storage: null
x-casaos:
  id: com.dokploy.movary
  main: movary
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/movary/icon.png
  title:
    en_US: Movary
  tagline:
    en_US: Movary is a self-hosted platform for tracking and managing your watched movies using TMDB
  description:
    en_US: Movary is a self-hosted platform for tracking and managing your watched movies using TMDB.
  author: Dokploy Community
  developer: Movary
  category: Media
  architectures:
  - amd64
  - arm64
  version: "-latest}"
  update_at: "2026-11-22"
  website: https://movary.org/
  repo: https://github.com/leepeuker/movary
  docs: https://docs.movary.org/
