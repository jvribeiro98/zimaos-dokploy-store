name: letterfeed
services:
  backend:
    image: ghcr.io/leonmuscoden/letterfeed-backend:latest
    restart: unless-stopped
    environment:
      LETTERFEED_APP_BASE_URL: https://localhost
      LETTERFEED_BACKEND_URL: http://backend:8000
      LETTERFEED_DATABASE_URL: sqlite:////data/letterfeed.db
      LETTERFEED_IMAP_SERVER: ''
      LETTERFEED_IMAP_USERNAME: ''
      LETTERFEED_IMAP_PASSWORD: ''
      LETTERFEED_SEARCH_FOLDER: INBOX
      LETTERFEED_MOVE_TO_FOLDER: ''
      LETTERFEED_MARK_AS_READ: 'true'
      LETTERFEED_EMAIL_CHECK_INTERVAL: '15'
      LETTERFEED_AUTO_ADD_NEW_SENDERS: 'false'
      LETTERFEED_SECRET_KEY: 6WBbytw4VELewZeLNepPlf8X7IoXEWBOsf7lzLg4LmyZaA22xBBsLZXOOK8Dz0kW
      LETTERFEED_AUTH_USERNAME: admin
      LETTERFEED_AUTH_PASSWORD: yK9pH5itYbIlZ1QWSCKjpZNNOgb9Rfp7
    volumes:
    - letterfeed_data:/data
  frontend:
    image: ghcr.io/leonmuscoden/letterfeed-frontend:latest
    restart: unless-stopped
    environment:
      LETTERFEED_APP_BASE_URL: https://localhost
      LETTERFEED_BACKEND_URL: http://backend:8000
    expose:
    - 3000
    depends_on:
    - backend
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
volumes:
  letterfeed_data: null
x-casaos:
  id: com.dokploy.letterfeed
  main: frontend
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/letterfeed/icon.png
  title:
    en_US: Letterfeed
  tagline:
    en_US: Convert email newsletters into RSS feeds
  description:
    en_US: Convert email newsletters into RSS feeds
  author: Dokploy Community
  developer: Letterfeed
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-28"
  website: https://github.com/leonmuscoden/letterfeed
  repo: https://github.com/leonmuscoden/letterfeed
  docs: https://github.com/leonmuscoden/letterfeed
