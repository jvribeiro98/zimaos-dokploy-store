name: montara-pass
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: montara
      POSTGRES_PASSWORD: wOlFHoPHYtgzHubTbdzB4djPM6mnJfzy
      POSTGRES_DB: montara_pass
    volumes:
    - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    image: ghcr.io/montara-project/montara-pass/community/api:v2.17.0
    restart: unless-stopped
    expose:
    - 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      PORT: '8080'
      APP_NAME: montara-pass
      APP_SECRET: SAWx8JgGAOKmsyoBpLCYodWGUku1dqZ1KmoGfDIxT8Q=
      DB_DSN: postgres://montara:wOlFHoPHYtgzHubTbdzB4djPM6mnJfzy@postgres:5432/montara_pass?sslmode=disable
      MIGRATE_ON_BOOT: 'true'
      SEED_ON_BOOT: 'true'
      SUPER_USER: admin@example.com:myXAzakMi6Vshs4eX6LbYjXd
      API_PUBLIC_URL: https://api.localhost
      AUTH_BASE_URL: https://api.localhost
      CORS_ALLOWED_ORIGINS: https://localhost
      PASSKEY_RP_ID: localhost
      EXTENSION_IDS: jmhaaghfipclnhibhdnmlgllblfhiepe,bkfhhdojledenfpmeklheilnablahfio,montara-pass@montarapass.com,montara-pass-ce@montarapass.com
      FROM_ADDRESS: ''
      RESEND_API_KEY: ''
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      DISABLE_PASSWORD_LOGIN: ''
      TRUSTED_PROXIES: 10.0.1.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      TURNSTILE_ENABLED: ''
      TURNSTILE_SECRET: ''
      TURNSTILE_HOSTNAMES: localhost
      REDIS_URL: redis://redis:6379/0
      SENTRY_DSN: ''
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  web:
    image: ghcr.io/montara-project/montara-pass/community/web:v2.17.0
    restart: unless-stopped
    expose:
    - 3000
    environment:
      API_PUBLIC_URL: https://api.localhost
    depends_on:
    - api
volumes:
  postgres-data: null
x-casaos:
  id: com.dokploy.montara-pass
  main: api
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/montara-pass/icon.png
  title:
    en_US: Montara Pass
  tagline:
    en_US: Self-hosted password manager with an end-to-end encrypted vault — the server stores cip...
  description:
    en_US: Self-hosted password manager with an end-to-end encrypted vault — the server stores ciphertext and wrapped keys
      only — featuring passkeys, item sharing, folders, a web app and a browser extension.
  author: Dokploy Community
  developer: Montara Pass
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2.17.0"
  update_at: "2026-11-24"
  website: https://montarapass.com
  repo: https://github.com/montara-project/montara-pass
  docs: https://docs.montarapass.com
