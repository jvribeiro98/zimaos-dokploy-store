name: montara-pass
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: montara
      POSTGRES_PASSWORD: 2lkFWbDNgNqQM8FxMpRJ7JxFoI5uBtwC
      POSTGRES_DB: montara_pass
    volumes:
    - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  montara-pass:
    image: ghcr.io/montara-project/montara-pass/community:v2.12.2
    restart: unless-stopped
    expose:
    - 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      PORT: '8080'
      APP_NAME: montara-pass
      APP_SECRET: Q5BHQZHZhaNDMHF0f6vXbkNad3Rb9T4D5Jfsyyv7g6I=
      REDIS_URL: redis://redis:6379/0
      DB_DSN: postgres://montara:2lkFWbDNgNqQM8FxMpRJ7JxFoI5uBtwC@postgres:5432/montara_pass?sslmode=disable
      MIGRATE_ON_BOOT: 'true'
      SEED_ON_BOOT: 'true'
      SUPER_USER: admin@example.com:Q2EleO9JB2ZZyEBH76oG1rau
      AUTH_BASE_URL: https://localhost
      FROM_ADDRESS: ''
      RESEND_API_KEY: ''
      TRUSTED_PROXIES: 10.0.1.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:8080/api/health || exit 1
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  postgres-data: null
x-casaos:
  id: com.dokploy.montara-pass
  main: montara-pass
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/montara-pass/icon.png
  title:
    en_US: Montara Pass
  tagline:
    en_US: Self-hosted password manager with an end-to-end encrypted vault — the server stores cip...
  description:
    en_US: Self-hosted password manager with an end-to-end encrypted vault — the server stores ciphertext and wrapped keys
      only — featuring passkeys, item sharing, folders, and a built-in web app.
  author: Dokploy Community
  developer: Montara Pass
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "2.12.2"
  update_at: "2026-11-22"
  website: https://montarapass.com
  repo: https://github.com/montara-project/montara-pass
  docs: https://docs.montarapass.com
