name: versitygw
services:
  versitygw:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    environment:
    - ROOT_ACCESS_KEY=b11f2ad49262894db450d7e3d64666f5
    - ROOT_SECRET_KEY=g9GhIGMB7Dl2GoSfptwhILt33ZlG4qyC
    - VGW_BACKEND=posix
    - VGW_PORT=:7070
    - VGW_BACKEND_ARGS=/data/s3
    - VGW_IAM_DIR=/data/iam
    - VGW_VERSIONING_DIR=/data/versioning
    - VGW_ADMIN_PORT=:7071
    - VGW_WEBUI_PORT=:8080
    - VGW_WEBUI_NO_TLS=true
    - VGW_WEBUI_GATEWAYS=http://localhost:7070
    - VGW_WEBUI_ADMIN_GATEWAYS=http://localhost:7071
    expose:
    - '7070'
    - '7071'
    - '8080'
    volumes:
    - versitygw_s3:/data/s3
    - versitygw_versioning:/data/versioning
    - versitygw_iam:/data/iam
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  versitygw_s3: null
  versitygw_versioning: null
  versitygw_iam: null
