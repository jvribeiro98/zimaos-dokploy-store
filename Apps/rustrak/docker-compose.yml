name: rustrak
services:
  rustrak:
    image: rustrak/rustrak-server:latest
    restart: unless-stopped
    environment:
    - HOST=0.0.0.0
    - PORT=8080
    - RUST_LOG=info
    - SSL_PROXY=true
    - SESSION_SECRET_KEY=ne9dMHzbEUPTtzQ9s922JqOdHEsuzJbKkF0ZsluFuDz9S02AHcoNRoXyPavmhmNO
    - CREATE_SUPERUSER=admin@example.com:8gBA1FGhd79kBMPl
    volumes:
    - rustrak_data:/data
    expose:
    - 8080
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  rustrak_data: null
x-casaos:
  id: com.dokploy.rustrak
  main: rustrak
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/rustrak/icon.svg
  title:
    en_US: Rustrak
  tagline:
    en_US: Self-hosted error tracking compatible with Sentry SDKs
  description:
    en_US: 'Self-hosted error tracking compatible with Sentry SDKs. Server only, written in Rust: 32 MB of memory at idle,
      with SQLite storage. No external database required.'
  author: Dokploy Community
  developer: Rustrak
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://rustrak.github.io/rustrak/
  repo: https://github.com/rustrak/rustrak
  docs: https://rustrak.github.io/rustrak/getting-started/overview
