name: nebulynk
services:
  frontend:
    build:
      context: https://github.com/sapientorius/Nebulynk.git#${NEBULYNK_SOURCE_REF:-v0.7.1}
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NEBULYNK_NODE_IMAGE:-node:22.23.1-alpine3.24}
        NGINX_IMAGE: ${NEBULYNK_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.31-alpine3.23@sha256:6320020c7da8714feab524e02c08c5a1958675c4e68700e93a2fd8970b065786}
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
        VITE_LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL must be set}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        VITE_AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-nebulynk_csrf_token}
    depends_on:
    - backend
    expose:
    - '8080'
    restart: unless-stopped
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  postgres:
    image: ${NEBULYNK_POSTGRES_IMAGE:-postgres:17-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193}
    environment:
      POSTGRES_DB: nebulynk
      POSTGRES_USER: nebulynk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
    - nebulynk_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: ${NEBULYNK_REDIS_IMAGE:-redis:7.4.7-alpine3.21}
    volumes:
    - nebulynk_redis_data:/data
    restart: unless-stopped
  garage-volume-init:
    image: alpine:3.21.5
    user: 0:0
    command:
    - sh
    - -ec
    - chown -R 65532:65532 /var/lib/garage/meta /var/lib/garage/data
    volumes:
    - nebulynk_garage_meta:/var/lib/garage/meta
    - nebulynk_garage_data:/var/lib/garage/data
    restart: 'no'
  garage:
    image: ${NEBULYNK_GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    user: 65532:65532
    depends_on:
      garage-volume-init:
        condition: service_completed_successfully
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      GARAGE_DEFAULT_BUCKET: nebulynk-files
    volumes:
    - nebulynk_garage_meta:/var/lib/garage/meta
    - nebulynk_garage_data:/var/lib/garage/data
    configs:
    - source: garage_config
      target: /etc/garage.toml
    expose:
    - '3900'
    restart: unless-stopped
  livekit:
    image: ${NEBULYNK_LIVEKIT_SERVER_IMAGE:-livekit/livekit-server:v1.13.4}
    user: 65532:65532
    command: --config /livekit.yaml
    depends_on:
    - redis
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}'
    configs:
    - source: livekit_config
      target: /livekit.yaml
    expose:
    - '7880'
    ports:
    - 7881:7881
    - 7882:7882/udp
    restart: unless-stopped
  livekit-egress:
    image: ${NEBULYNK_LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.13.0}
    user: egress
    command: --config /livekit-egress.yaml
    environment:
      EGRESS_CONFIG_FILE: /livekit-egress.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      LIVEKIT_WS_URL: ws://livekit:7880
      AWS_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      AWS_DEFAULT_REGION: us-east-1}
    configs:
    - source: livekit_egress_config
      target: /livekit-egress.yaml
    depends_on:
    - livekit
    - redis
    - garage
    restart: unless-stopped
  backend:
    stop_grace_period: 75s
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:'+(process.env.BACKEND_PORT||3030)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    build:
      context: https://github.com/sapientorius/Nebulynk.git#${NEBULYNK_SOURCE_REF:-v0.7.1}
      dockerfile: backend/Dockerfile
      args:
        NODE_IMAGE: ${NEBULYNK_NODE_IMAGE:-node:22.23.1-alpine3.24}
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AI_SECRET_KEY: ${AI_SECRET_KEY:?AI_SECRET_KEY must be set}
      AUTH_2FA_SECRET_KEY: bLEVG7nvhsPLjALnN1seFz2Fcqjw2D5Nkt6Gv0BXGvc4ahqZkwo4FwyRbcV5LYDM
      BACKEND_PORT: ${BACKEND_PORT:-3030}
      LOG_LEVEL: info
      MAX_FILE_SIZE: '26214400'
      AUTHENTICATION_RATE_LIMIT_IP_LIMIT: ''
      AUTH_BROWSER_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 1d
      AUTH_REMEMBER_REFRESH_TOKEN_TTL: 30d
      AUTH_REFRESH_COOKIE_NAME: nebulynk_refresh_session
      AUTH_CSRF_COOKIE_NAME: nebulynk_csrf_token
      AUTH_COOKIE_DOMAIN: ''
      RATE_LIMIT_DRIVER: redis
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:?PASSKEY_RP_ID must be set}
      AI_PROVIDER_BASE_URL_ALLOWLIST: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: nebulynk
      POSTGRES_USER: nebulynk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      STORAGE_S3_ENDPOINT: http://garage:3900
      STORAGE_S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT:?STORAGE_S3_PUBLIC_ENDPOINT must be set}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      STORAGE_S3_BUCKET: nebulynk-files
      STORAGE_S3_REGION: us-east-1}
      MEETING_RECORDINGS_PREFIX: meeting-recordings
      MEETING_RECORDINGS_BUCKET: nebulynk-files
      MEETING_RECORDINGS_S3_ENDPOINT: http://garage:3900
      MEETING_RECORDINGS_EGRESS_S3_ENDPOINT: http://garage:3900
      MEETING_RECORDINGS_S3_REGION: ${MEETING_RECORDINGS_S3_REGION:-${STORAGE_S3_REGION:-us-east-1}}
      MEETING_TRANSCRIPT_WAIT_TIMEOUT_MS: '1800000'
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL must be set}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      KLIPY_API_KEY: ''
      VAPID_PUBLIC_KEY: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_SUBJECT: ''
      SMTP_HOST: ''
      SMTP_PORT: '587'
      SMTP_SECURE: 'false'
      SMTP_IGNORE_TLS: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: ''
      SMTP_FROM_NAME: Nebulynk
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      TRUST_PROXY: 'true'
      NEBULYNK_BUILD_SHA: ''
    depends_on:
    - postgres
    - redis
    - garage
    - livekit
    - livekit-egress
    expose:
    - '3030'
    restart: unless-stopped
  transcription-worker:
    build:
      context: https://github.com/sapientorius/Nebulynk.git#${NEBULYNK_SOURCE_REF:-v0.7.1}
      dockerfile: backend/Dockerfile
      args:
        NODE_IMAGE: ${NEBULYNK_NODE_IMAGE:-node:22.23.1-alpine3.24}
    command:
    - node
    - src/transcription-worker.js
    stop_grace_period: 75s
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test:
      - CMD
      - node
      - src/transcription-worker-health.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      AI_SECRET_KEY: ${AI_SECRET_KEY:?AI_SECRET_KEY must be set}
      LOG_LEVEL: info
      AI_PROVIDER_BASE_URL_ALLOWLIST: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: nebulynk
      POSTGRES_USER: nebulynk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      STORAGE_S3_ENDPOINT: http://garage:3900
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:?STORAGE_S3_ACCESS_KEY must be set}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:?STORAGE_S3_SECRET_KEY must be set}
      STORAGE_S3_BUCKET: nebulynk-files
      STORAGE_S3_REGION: us-east-1}
      MEETING_RECORDINGS_BUCKET: nebulynk-files
      MEETING_RECORDINGS_S3_ENDPOINT: http://garage:3900
      MEETING_RECORDINGS_S3_REGION: ${MEETING_RECORDINGS_S3_REGION:-${STORAGE_S3_REGION:-us-east-1}}
      MEETING_TRANSCRIPT_WAIT_TIMEOUT_MS: '1800000'
      TRANSCRIPTION_MAX_TEMP_BYTES: ${TRANSCRIPTION_MAX_TEMP_BYTES:-2147483648}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  nebulynk_postgres_data: null
  nebulynk_redis_data: null
  nebulynk_garage_meta: null
  nebulynk_garage_data: null
configs:
  garage_config:
    content: 'metadata_dir = "/var/lib/garage/meta"

      data_dir = "/var/lib/garage/data"

      db_engine = "sqlite"


      replication_factor = 1

      rpc_bind_addr = "[::]:3901"

      rpc_public_addr = "garage:3901"


      [s3_api]

      s3_region = "us-east-1"

      api_bind_addr = "[::]:3900"

      root_domain = ".s3.garage.localhost"

      '
  livekit_config:
    content: "port: 7880\nrtc:\n  udp_port: 7882\n  tcp_port: 7881\n  use_external_ip: true\nredis:\n  address: redis:6379\n\
      keys:\n"
  livekit_egress_config:
    content: "insecure: true\nlog_level: debug\nhealth_port: 8080\n\nredis:\n  address: redis:6379\n\ns3:\n  bucket: nebulynk-files\n\
      \  endpoint: http://garage:3900\n"
x-casaos:
  id: com.dokploy.nebulynk
  main: frontend
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/nebulynk/icon.png
  title:
    en_US: Nebulynk
  tagline:
    en_US: Nebulynk is a self-hosted collaboration platform for teams with real-time messaging, fi...
  description:
    en_US: Nebulynk is a self-hosted collaboration platform for teams with real-time messaging, file sharing, video meetings,
      and AI-powered transcription and summaries.
  author: Dokploy Community
  developer: Nebulynk
  category: Social
  architectures:
  - amd64
  - arm64
  version: "0.7.1"
  update_at: "2026-11-25"
  website: https://nebulynk.net
  repo: https://github.com/sapientorius/Nebulynk
  docs: https://github.com/sapientorius/Nebulynk
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (garage.toml, livekit.yaml,
        livekit-egress.yaml). Review environment variables before starting.
