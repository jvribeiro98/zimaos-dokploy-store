name: mage-ai
services:
  mage-ai:
    image: mageai/mageai:0.9.78
    command: mage start ${PROJECT_NAME}
    environment:
      USER_CODE_PATH: /home/src/mage-ai
      ENV: production
    expose:
    - 6789
    volumes:
    - mageai_data:/home/src/
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -s
      - -f
      - -o
      - /dev/null
      - http://localhost:6789
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
    - target: 6789
      published: "6789"
      protocol: tcp
volumes:
  mageai_data: null
x-casaos:
  id: com.dokploy.mage-ai
  main: mage-ai
  index: /
  port_map: "6789"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mage-ai/icon.svg
  title:
    en_US: Mage AI
  tagline:
    en_US: Build, run, and manage data pipelines for integrating and transforming data
  description:
    en_US: Build, run, and manage data pipelines for integrating and transforming data.
  author: Dokploy Community
  developer: Mage AI
  category: Others
  architectures:
  - amd64
  - arm64
  version: "0.9.78"
  update_at: "2026-11-26"
  website: https://mage.ai
  repo: https://github.com/mage-ai/mage-ai
  docs: https://docs.mage.ai
