name: novu
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
    - novu-redis:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:8.0.17
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: BaxKaLoWFWrz7c4v1uOEQGQoE3pypnEr
    volumes:
    - novu-mongodb:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --username
      - ${MONGO_INITDB_ROOT_USERNAME}
      - --password
      - ${MONGO_INITDB_ROOT_PASSWORD}
      - --eval
      - db.adminCommand('ping').ok
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  api:
    image: ghcr.io/novuhq/novu/api:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_ROOT_URL: https://localhost
      PORT: '3000'
      FRONT_BASE_URL: https://localhost
      MONGO_URL: mongodb://root:BaxKaLoWFWrz7c4v1uOEQGQoE3pypnEr@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: '5'
      MONGO_MAX_POOL_SIZE: '10'
      MONGO_AUTO_CREATE_INDEXES: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      REDIS_DB_INDEX: '2'
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: '6379'
      S3_LOCAL_STACK: ''
      S3_BUCKET_NAME: novu-local
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      JWT_SECRET: 3pV8hbeF6g7JrhgrqrgMlDuHYvz84oyiVkjR0mIKYz6AAMX71YP4KvchE04ItLpn
      STORE_ENCRYPTION_KEY: 9PJ34aMO7Ef0sEt7SkpnaJLO23ZitCwo
      NOVU_SECRET_KEY: BCAiTnsbAo0z8Q0TjvtgeAeybzxV9jSOFqrtKxvQXJZdul8lj5meRZ0Ah7p2w1ya
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      SENTRY_DSN: ''
      NEW_RELIC_ENABLED: 'false'
      NEW_RELIC_APP_NAME: ''
      NEW_RELIC_LICENSE_KEY: ''
      API_CONTEXT_PATH: ''
      IS_API_IDEMPOTENCY_ENABLED: 'false'
      IS_API_RATE_LIMITING_ENABLED: 'false'
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: 'true'
      IS_V2_ENABLED: 'true'
      IS_SELF_HOSTED: 'true'
    expose:
    - '3000'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
  worker:
    image: ghcr.io/novuhq/novu/worker:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3004'
      MONGO_URL: mongodb://root:BaxKaLoWFWrz7c4v1uOEQGQoE3pypnEr@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: '5'
      MONGO_MAX_POOL_SIZE: '10'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      REDIS_DB_INDEX: '2'
      REDIS_CACHE_SERVICE_HOST: redis
      REDIS_CACHE_SERVICE_PORT: '6379'
      S3_LOCAL_STACK: ''
      S3_BUCKET_NAME: novu-local
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      STORE_ENCRYPTION_KEY: 9PJ34aMO7Ef0sEt7SkpnaJLO23ZitCwo
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      SENTRY_DSN: ''
      NEW_RELIC_ENABLED: 'false'
      NEW_RELIC_APP_NAME: ''
      NEW_RELIC_LICENSE_KEY: ''
      BROADCAST_QUEUE_CHUNK_SIZE: '100'
      MULTICAST_QUEUE_CHUNK_SIZE: '100'
      API_ROOT_URL: http://api:3000
      IS_EMAIL_INLINE_CSS_DISABLED: 'false'
      IS_USE_MERGED_DIGEST_ID_ENABLED: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-3004}/v1/health-check || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
  ws:
    image: ghcr.io/novuhq/novu/ws:3.18.0
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: '3002'
      NODE_ENV: production
      MONGO_URL: mongodb://root:BaxKaLoWFWrz7c4v1uOEQGQoE3pypnEr@mongodb:27017/novu-db?authSource=admin
      MONGO_MIN_POOL_SIZE: '5'
      MONGO_MAX_POOL_SIZE: '10'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      JWT_SECRET: 3pV8hbeF6g7JrhgrqrgMlDuHYvz84oyiVkjR0mIKYz6AAMX71YP4KvchE04ItLpn
      WS_CONTEXT_PATH: ''
      NEW_RELIC_ENABLED: 'false'
      NEW_RELIC_APP_NAME: ''
      NEW_RELIC_LICENSE_KEY: ''
    expose:
    - '3002'
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:$${PORT}/v1/health-check || exit 1
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s
  novu:
    image: ghcr.io/novuhq/novu/dashboard:3.18.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      VITE_API_HOSTNAME: https://localhost
      VITE_WEBSOCKET_HOSTNAME: https://localhost
    expose:
    - '4000'
    healthcheck:
      test:
      - CMD-SHELL
      - 'node -e "const http = require(''http''); const req = http.get({hostname: ''localhost'', port: 4000, path: ''/'',
        timeout: 5000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1));
        req.on(''timeout'', () => { req.destroy(); process.exit(1); });"'
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
    - target: 4000
      published: "4000"
      protocol: tcp
volumes:
  novu-mongodb: null
  novu-redis: null
x-casaos:
  id: com.dokploy.novu
  main: novu
  index: /
  port_map: "4000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/novu/icon.png
  title:
    en_US: Novu
  tagline:
    en_US: Open-source notification infrastructure for multi-channel workflows — in-app Inbox, ema...
  description:
    en_US: Open-source notification infrastructure for multi-channel workflows — in-app Inbox, email, SMS, push, and chat
      — with a unified API and dashboard.
  author: Dokploy Community
  developer: Novu
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "3.18.0"
  update_at: "2026-11-28"
  website: https://novu.co/
  repo: https://github.com/novuhq/novu
  docs: https://docs.novu.co/community/self-hosting-novu/deploy-with-docker
