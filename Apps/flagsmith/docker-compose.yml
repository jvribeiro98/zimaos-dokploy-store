name: flagsmith
services:
  postgres:
    image: postgres:15.5-alpine
    environment:
      POSTGRES_PASSWORD: mLxLv40pIRbXRM5x
      POSTGRES_DB: flagsmith
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d flagsmith -U postgres
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  flagsmith:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.177.1
    environment:
      DATABASE_URL: postgresql://postgres:mLxLv40pIRbXRM5x@postgres:5432/flagsmith
      USE_POSTGRES_FOR_ANALYTICS: 'true'
      ENVIRONMENT: production
      DJANGO_ALLOWED_HOSTS: '*'
      FLAGSMITH_DOMAIN: localhost
      DJANGO_SECRET_KEY: YayrphdQ
      TASK_RUN_METHOD: TASK_PROCESSOR
      PROMETHEUS_ENABLED: 'true'
    expose:
    - 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
    - target: 8000
      published: "8000"
      protocol: tcp
  flagsmith-task-processor:
    image: docker.flagsmith.com/flagsmith/flagsmith:2.177.1
    environment:
      DATABASE_URL: postgresql://postgres:mLxLv40pIRbXRM5x@postgres:5432/flagsmith
      USE_POSTGRES_FOR_ANALYTICS: 'true'
      DJANGO_ALLOWED_HOSTS: '*'
      PROMETHEUS_ENABLED: 'true'
    expose:
    - 8000
    depends_on:
    - flagsmith
    command: run-task-processor
    restart: unless-stopped
volumes:
  pgdata: null
x-casaos:
  id: com.dokploy.flagsmith
  main: flagsmith
  index: /
  port_map: "8000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/flagsmith/icon.png
  title:
    en_US: Flagsmith
  tagline:
    en_US: Flagsmith is an open-source feature flagging and remote config service
  description:
    en_US: Flagsmith is an open-source feature flagging and remote config service.
  author: Dokploy Community
  developer: Flagsmith
  category: Others
  architectures:
  - amd64
  - arm64
  version: "2.177.1"
  update_at: "2026-11-28"
  website: https://www.flagsmith.com/
  repo: https://github.com/Flagsmith/flagsmith
  docs: https://docs.flagsmith.com/
