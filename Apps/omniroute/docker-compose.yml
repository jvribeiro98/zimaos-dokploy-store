name: omniroute
services:
  omniroute:
    image: diegosouzapw/omniroute:3.8.17
    restart: unless-stopped
    expose:
    - '20128'
    - '20129'
    volumes:
    - omniroute-prod-data:/app/data
    environment:
    - NODE_ENV=production
    - PORT=20128
    - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
    - API_PORT=20129
    - API_HOST=${API_HOST:-0.0.0.0}
    - HOSTNAME=0.0.0.0
    - DATA_DIR=/app/data
    - PATH=/home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
    - target: 20128
      published: "20128"
      protocol: tcp
  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    volumes:
    - redis-prod-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  omniroute-prod-data: null
  redis-prod-data: null
x-casaos:
  id: com.dokploy.omniroute
  main: omniroute
  index: /
  port_map: "20128"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/omniroute/icon.png
  title:
    en_US: OmniRoute
  tagline:
    en_US: The Free AI Gateway - Never stop coding
  description:
    en_US: The Free AI Gateway - Never stop coding. Connect every AI tool to 177 providers — 50+ free — through one endpoint.  Auto-fallback.
      RTK + Caveman compression saves 15–95% tokens. Never hit limits. ~1.9B+ documented free tokens/month — up to ~2.5B in
      your first month with signup credits.
  author: Dokploy Community
  developer: OmniRoute
  category: AI
  architectures:
  - amd64
  - arm64
  version: "3.8.17"
  update_at: "2026-11-23"
  website: https://github.com/diegosouzapw/OmniRoute
  repo: https://github.com/diegosouzapw/OmniRoute
  docs: https://github.com/diegosouzapw/OmniRoute/wiki
