name: umami
services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - curl http://localhost:3000/api/heartbeat
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:Zs20xkaQDcQ59mRXlB7U2QMKCR1OPJUv@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: 5tWTYx86dgnmM2Wx6jYm0sK0G8/jHtkxqYIQQ6qddWvx3a42P4QQf5nHjnUMTLIolPyCqC2v36eGvpLJ7Im+tA==
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  db:
    image: postgres:15-alpine
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: Zs20xkaQDcQ59mRXlB7U2QMKCR1OPJUv
volumes:
  db-data: null
x-casaos:
  id: com.dokploy.umami
  main: umami
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/umami/icon.png
  title:
    en_US: Umami
  tagline:
    en_US: Umami is a simple website analytics tool and an alternative to Google Analytics
  description:
    en_US: Umami is a simple website analytics tool and an alternative to Google Analytics. Self-host it on your own server
      with Dokploy, which deploys Umami as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Umami
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "3.4.1"
  update_at: "2026-11-24"
  website: https://umami.is
  repo: https://github.com/umami-software/umami
  docs: https://umami.is/docs
