name: automatisch
services:
  automatisch:
    image: automatischio/automatisch:0.15.0
    restart: unless-stopped
    environment:
    - HOST=localhost
    - PROTOCOL=http
    - PORT=3000
    - API_URL=http://localhost
    - WEB_APP_URL=http://localhost
    - APP_ENV=production
    - REDIS_HOST=automatisch-redis
    - REDIS_PASSWORD=v4900ztl2Bw22qFk
    - POSTGRES_HOST=automatisch-postgres
    - POSTGRES_DATABASE=automatisch
    - POSTGRES_USERNAME=postgres
    - POSTGRES_PASSWORD=THXaWMFGADovqA1n
    - ENCRYPTION_KEY=LSSz1uYY7NVOpeM1UCzTTYCgs769Vzyd
    - WEBHOOK_SECRET_KEY=m17fwSk6tFQT5TKG1GUNrVQNxaPh9gjQ
    - APP_SECRET_KEY=WUhSQiRPeF2aiKQPGn0P3UOT2i7NJ3NF
    volumes:
    - storage:/automatisch/storage
    depends_on:
      automatisch-postgres:
        condition: service_healthy
      automatisch-redis:
        condition: service_started
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  automatisch-worker:
    image: automatischio/automatisch:0.15.0
    restart: unless-stopped
    environment:
    - APP_ENV=production
    - REDIS_HOST=automatisch-redis
    - REDIS_PASSWORD=v4900ztl2Bw22qFk
    - POSTGRES_HOST=automatisch-postgres
    - POSTGRES_DATABASE=automatisch
    - POSTGRES_USERNAME=postgres
    - POSTGRES_PASSWORD=THXaWMFGADovqA1n
    - ENCRYPTION_KEY=LSSz1uYY7NVOpeM1UCzTTYCgs769Vzyd
    - WEBHOOK_SECRET_KEY=m17fwSk6tFQT5TKG1GUNrVQNxaPh9gjQ
    - APP_SECRET_KEY=WUhSQiRPeF2aiKQPGn0P3UOT2i7NJ3NF
    - WORKER=true
    volumes:
    - storage:/automatisch/storage
    depends_on:
    - automatisch
  automatisch-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=THXaWMFGADovqA1n
    - POSTGRES_DB=automatisch
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d automatisch
      interval: 10s
      timeout: 5s
      retries: 5
  automatisch-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - redis_data:/data
volumes:
  storage: {}
  postgres_data: {}
  redis_data: {}
x-casaos:
  id: com.dokploy.automatisch
  main: automatisch
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/automatisch/icon.png
  title:
    en_US: Automatisch
  tagline:
    en_US: Automatisch is a powerful, self-hosted workflow automation tool designed for connecting...
  description:
    en_US: Automatisch is a powerful, self-hosted workflow automation tool designed for connecting your apps and automating
      repetitive tasks. With Automatisch, you can create workflows to sync data, send notifications, and perform various actions
      seamlessly across different services.
  author: Dokploy Community
  developer: Automatisch
  category: Productivity
  architectures:
  - amd64
  - arm64
  version: "0.15.0"
  update_at: "2026-11-25"
  website: https://automatisch.io/docs
  repo: https://github.com/automatisch/automatisch
  docs: https://automatisch.io/docs
