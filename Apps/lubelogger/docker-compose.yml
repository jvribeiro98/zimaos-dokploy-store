name: lubelogger
services:
  lubelogger:
    image: ghcr.io/hargata/lubelogger:v1.6.5
    restart: unless-stopped
    environment:
    - LC_ALL=en_US.UTF-8
    - LANG=en_US.UTF-8
    - LUBELOGGER_DOMAIN=https://localhost
    - EnableAuth=false
    volumes:
    - lubelogger-data:/App/data
    - lubelogger-keys:/root/.aspnet/DataProtection-Keys
    expose:
    - 8080
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
volumes:
  lubelogger-data: {}
  lubelogger-keys: {}
x-casaos:
  id: com.dokploy.lubelogger
  main: lubelogger
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/lubelogger/icon.png
  title:
    en_US: LubeLogger
  tagline:
    en_US: LubeLogger is a self-hosted vehicle maintenance and fuel mileage tracker for managing s...
  description:
    en_US: LubeLogger is a self-hosted vehicle maintenance and fuel mileage tracker for managing service records, reminders,
      fuel logs, and vehicle expenses.
  author: Dokploy Community
  developer: LubeLogger
  category: AI
  architectures:
  - amd64
  - arm64
  version: "1.6.5"
  update_at: "2026-11-28"
  website: https://lubelogger.com/
  repo: https://github.com/hargata/lubelog
  docs: https://docs.lubelogger.com/
