name: autobase
services:
  autobase-console:
    image: autobase/console:2.11.0
    restart: unless-stopped
    expose:
    - '80'
    - '8080'
    environment:
    - PG_CONSOLE_API_URL=http://localhost/api/v1
    - PG_CONSOLE_AUTHORIZATION_TOKEN=3MCaoObL3n5JYRtf/atFGOF2oepHTwa+87xBWdxgaEg=
    volumes:
    - console_postgres:/var/lib/postgresql
    - dbdesk_studio_data:/opt/dbdesk-studio
    - /var/run/docker.sock:/var/run/docker.sock
    - /tmp/ansible:/tmp/ansible
    ports:
    - target: 80
      published: "80"
      protocol: tcp
volumes:
  console_postgres: null
  dbdesk_studio_data: null
x-casaos:
  id: com.dokploy.autobase
  main: autobase-console
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/autobase/icon.svg
  title:
    en_US: Autobase
  tagline:
    en_US: Autobase for PostgreSQL® is an open-source alternative to cloud-managed databases (self...
  description:
    en_US: Autobase for PostgreSQL® is an open-source alternative to cloud-managed databases (self-hosted DBaaS).
  author: Dokploy Community
  developer: Autobase
  category: Developer
  architectures:
  - amd64
  - arm64
  version: "2.11.0"
  update_at: "2026-11-28"
  website: https://autobase.tech/
  repo: https://github.com/vitabaks/autobase
  docs: https://autobase.tech/docs
