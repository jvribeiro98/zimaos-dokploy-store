name: authelia
services:
  authelia:
    image: authelia/authelia:latest
    restart: unless-stopped
    volumes:
    - authelia_config:/config
    - /DATA/AppData/$AppID/configuration.yml:/config/configuration.yml:ro
    - /DATA/AppData/$AppID/users_database.yml:/config/users_database.yml
    environment:
      AUTHELIA_JWT_SECRET: $JWT_SECRET
      AUTHELIA_SESSION_SECRET: $SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY: $STORAGE_ENCRYPTION_KEY
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    expose:
    - 9091
    ports:
    - target: 9091
      published: "9091"
      protocol: tcp
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass $REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: $REDIS_PASSWORD
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authelia
      POSTGRES_USER: authelia
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U authelia -d authelia
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  authelia_config: null
  redis_data: null
  postgres_data: null
x-casaos:
  id: com.dokploy.authelia
  main: authelia
  index: /
  port_map: "9091"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/authelia/icon.png
  title:
    en_US: Authelia
  tagline:
    en_US: Authelia is an open-source authentication portal for single sign-on (SSO) and two-facto...
  description:
    en_US: Authelia is an open-source authentication portal for single sign-on (SSO) and two-factor authentication. Self-host
      it on your own server with Dokploy, which deploys Authelia as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Authelia
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-25"
  website: https://www.authelia.com/
  repo: https://github.com/authelia/authelia
  docs: https://www.authelia.com/overview/prologue/introduction/
  tips:
    before_install:
      en_US: Imported from Dokploy. Default config files were extracted to the app's files/ folder (configuration.yml, users_database.yml).
        Review environment variables before starting.
