name: ackee
services:
  ackee:
    image: electerious/ackee:3.4.2
    expose:
    - '3000'
    environment:
    - ACKEE_USERNAME=default
    - ACKEE_PASSWORD=L99lzOJ7KIc8vwjZ
    - ACKEE_MONGODB=mongodb://mongo:7LUjXVsk6GkZSmY5@mongo:27017
    restart: unless-stopped
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  mongo:
    image: mongo:4
    environment:
    - MONGO_INITDB_ROOT_PASSWORD=7LUjXVsk6GkZSmY5
    - MONGO_INITDB_ROOT_USERNAME=mongo
    volumes:
    - mongo-data:/data/db
    restart: unless-stopped
volumes:
  mongo-data: null
x-casaos:
  id: com.dokploy.ackee
  main: ackee
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/ackee/icon.png
  title:
    en_US: Ackee
  tagline:
    en_US: Ackee is a self-hosted analytics tool for your website
  description:
    en_US: Ackee is a self-hosted analytics tool for your website.
  author: Dokploy Community
  developer: Ackee
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "3.4.2"
  update_at: "2026-11-25"
  website: https://ackee.electerious.com/
  repo: https://github.com/electerious/Ackee
  docs: https://docs.ackee.electerious.com/
