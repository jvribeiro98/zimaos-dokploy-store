name: spliit
services:
  spliit:
    image: ghcr.io/spliit-app/spliit:1.19.0
    restart: unless-stopped
    depends_on:
      spliit-db:
        condition: service_healthy
    ports:
    - target: 3000
      published: "3000"
      protocol: tcp
  spliit-db:
    image: pgvector/pgvector:pg16
    volumes:
    - /DATA/AppData/spliit/data:/var/lib/DBql/data
    environment:
      POSTGRES_USER: spliit-admin
      POSTGRES_PASSWORD: vIbAWWx7EQv4d2UF08tlO43eTqEBVGcu
      POSTGRES_DB: spliit
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - ${DB_USERNAME}
      - -d
      - ${DB_DATABASE:-spliit}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
x-casaos:
  id: com.dokploy.spliit
  main: spliit
  index: /
  port_map: "3000"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/spliit/icon.png
  title:
    en_US: Spliit
  tagline:
    en_US: Spliit is a lightweight, self-hosted alternative to Auth0 and Clerk
  description:
    en_US: Spliit is a lightweight, self-hosted alternative to Auth0 and Clerk. Open-source, cost-effective, and developer-friendly,
      it provides secure authentication (OAuth, email/password, social logins) with full control over your data. No per-user
      fees, easy to integrate, and perfect for startups or privacy-focused projects.
  author: Dokploy Community
  developer: Spliit
  category: Finance
  architectures:
  - amd64
  - arm64
  version: "1.19.0"
  update_at: "2026-11-25"
  website: https://spliit.app/
  repo: https://github.com/spliit-app/spliit
  docs: https://github.com/spliit-app
