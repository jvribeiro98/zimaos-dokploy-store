name: mediacms
services:
  migrations:
    image: mediacms/mediacms:latest
    volumes:
    - mediacms_data:/home/mediacms.io/mediacms/media
    - mediacms_static:/home/mediacms.io/mediacms/staticfiles
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'yes'
      ADMIN_USER: admin
      ADMIN_EMAIL: admin@localhost
      ADMIN_PASSWORD: bSlMpkI00xoBBdAWVwKKqcB3RiRMsekN
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: mediacms
      DATABASE_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      DATABASE_NAME: mediacms
      POSTGRES_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    command: ./deploy/docker/prestart.sh
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  web:
    image: mediacms/mediacms:latest
    deploy:
      replicas: 1
    expose:
    - 80
    volumes:
    - mediacms_data:/home/mediacms.io/mediacms/media
    - mediacms_static:/home/mediacms.io/mediacms/staticfiles
    environment:
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: mediacms
      DATABASE_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      DATABASE_NAME: mediacms
      POSTGRES_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
    - migrations
    restart: unless-stopped
    ports:
    - target: 80
      published: "80"
      protocol: tcp
  celery_beat:
    image: mediacms/mediacms:latest
    volumes:
    - mediacms_data:/home/mediacms.io/mediacms/media
    - mediacms_static:/home/mediacms.io/mediacms/staticfiles
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_SHORT: 'no'
      ENABLE_CELERY_LONG: 'no'
      ENABLE_MIGRATIONS: 'no'
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: mediacms
      DATABASE_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      DATABASE_NAME: mediacms
      POSTGRES_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
    - redis
    restart: unless-stopped
  celery_worker:
    image: mediacms/mediacms:latest
    deploy:
      replicas: 1
    volumes:
    - mediacms_data:/home/mediacms.io/mediacms/media
    - mediacms_static:/home/mediacms.io/mediacms/staticfiles
    environment:
      ENABLE_UWSGI: 'no'
      ENABLE_NGINX: 'no'
      ENABLE_CELERY_BEAT: 'no'
      ENABLE_MIGRATIONS: 'no'
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_USER: mediacms
      DATABASE_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      DATABASE_NAME: mediacms
      POSTGRES_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
    - migrations
    restart: unless-stopped
  db:
    image: postgres:17.2-alpine
    volumes:
    - postgres_data:/var/lib/postgresql/data/
    restart: always
    environment:
      POSTGRES_USER: mediacms
      POSTGRES_PASSWORD: lpdLKxzTfTk81bx9wuKjZpck7wjznu8W
      POSTGRES_DB: mediacms
      TZ: Europe/London
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  postgres_data: null
  mediacms_data: null
  mediacms_static: null
x-casaos:
  id: com.dokploy.mediacms
  main: web
  index: /
  port_map: "80"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/mediacms/icon.svg
  title:
    en_US: MediaCMS
  tagline:
    en_US: MediaCMS is an open-source video and media CMS
  description:
    en_US: MediaCMS is an open-source video and media CMS. It is a modern, full-featured solution for managing and streaming
      media content.
  author: Dokploy Community
  developer: MediaCMS
  category: Media
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-24"
  website: https://mediacms.io/
  repo: https://github.com/mediacms/mediacms
  docs: https://docs.mediacms.io/
