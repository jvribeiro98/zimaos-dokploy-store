name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
    - homarr_appdata:/appdata
    environment:
    - SECRET_ENCRYPTION_KEY=22abb9cf811a5b43e7ba49f5bab5616e8e1845f0fc33cf50c8b52bd4f3f22c7f7885a420b11972781d579e091234da6b921e39e2d7969bd1bb1896d6bc3ce430
    expose:
    - 7575
    ports:
    - target: 7575
      published: "7575"
      protocol: tcp
volumes:
  homarr_appdata: null
x-casaos:
  id: com.dokploy.homarr
  main: homarr
  index: /
  port_map: "7575"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/homarr/icon.png
  title:
    en_US: Homarr
  tagline:
    en_US: Homarr is a dashboard for organizing and accessing all your apps from one place
  description:
    en_US: Homarr is a dashboard for organizing and accessing all your apps from one place. Self-host it on your own server
      with Dokploy, which deploys Homarr as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Homarr
  category: Networking
  architectures:
  - amd64
  - arm64
