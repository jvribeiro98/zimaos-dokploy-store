name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
    - homarr_appdata:/appdata
    environment:
    - SECRET_ENCRYPTION_KEY=3e3416864ab800703054c26f94465757eec6677883fb1f71edcabdf87bfcd530afd72ff91629f406fe4665104d728fb20674c0fb6fcaef7526dce4e3a30bedc2
    expose:
    - 7575
    ports:
    - target: 7575
      published: "7575"
      protocol: tcp
volumes:
  homarr_appdata: null
x-casaos:
  id: com.dokploy.homarr
  main: homarr
  index: /
  port_map: "7575"
  scheme: http
  icon: https://raw.githubusercontent.com/jvribeiro98/zimaos-dokploy-store/main/Apps/homarr/icon.png
  title:
    en_US: Homarr
  tagline:
    en_US: Homarr is a dashboard for organizing and accessing all your apps from one place
  description:
    en_US: Homarr is a dashboard for organizing and accessing all your apps from one place. Self-host it on your own server
      with Dokploy, which deploys Homarr as a Docker Compose service in a few clicks.
  author: Dokploy Community
  developer: Homarr
  category: Networking
  architectures:
  - amd64
  - arm64
  version: "1.0.0"
  update_at: "2026-11-26"
  website: https://homarr.dev/
  repo: https://github.com/homarr-labs/homarr
  docs: https://homarr.dev/docs/getting-started/installation/docker
