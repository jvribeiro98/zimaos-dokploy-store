name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
    - homarr_appdata:/appdata
    environment:
    - SECRET_ENCRYPTION_KEY=4b024407091cb3b6727a2657bf24f410d83855a3f41cccbdd4454e248f73afd44e0f308aab2005778745933b84d07ca0c1612f00d1b22121c51559e9aaaf68ba
    expose:
    - 7575
    ports:
    - target: 7575
      published: "7575"
      protocol: tcp
volumes:
  homarr_appdata: null
x-casaos:
  id: com.dokploy.homarr
  main: homarr
  index: /
  port_map: "7575"
  scheme: http
