name: chirpstack
services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/chirpstack:/etc/chirpstack
    expose:
    - 8080
    environment:
    - MQTT_BROKER_HOST=mosquitto
    - REDIS_HOST=redis
    - POSTGRESQL_HOST=postgres
    depends_on:
    - postgres
    - mosquitto
    - redis
    ports:
    - target: 8080
      published: "8080"
      protocol: tcp
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    expose:
    - 1700/udp
    environment:
    - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
    - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
    - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
    - mosquitto
  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-eu868.toml
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    expose:
    - 3001
    depends_on:
    - mosquitto
  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    expose:
    - 8090
    depends_on:
    - chirpstack
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
    - postgresqldata:/var/lib/postgresql/data
    - /DATA/AppData/$AppID/postgresql/initdb:/docker-entrypoint-initdb.d
    environment:
    - POSTGRES_USER=chirpstack
    - POSTGRES_PASSWORD=JaSwhPGpVVJmPxNpPGVtXVdBvHlmCnFQ
    - POSTGRES_DB=chirpstack
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
    - redisdata:/data
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/mosquitto/config/:/mosquitto/config/
    expose:
    - 1883
volumes:
  postgresqldata: null
  redisdata: null
